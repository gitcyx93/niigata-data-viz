<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(232,238,248,.9)';       // 左上角讲故事的小字

const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(N, N), d = img.data;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;
    d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = Math.round(255 * Math.pow(Math.max(0, 1 - r), falloff));
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function verticalSprite(key, stops) {                 // 竖直方向的渐变条：stops = [[位置0~1, [r,g,b,a]], ...]
  if (sprites[key]) return sprites[key];
  const N = 512, c = document.createElement('canvas'); c.width = 1; c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(1, N), d = img.data;
  for (let j = 0; j < N; j++) {
    const u = (j + .5) / N; let k = 0; while (k < stops.length - 2 && u > stops[k + 1][0]) k++;
    const [u0, a] = stops[k], [u1, b] = stops[k + 1], f = clamp((u - u0) / (u1 - u0));
    for (let n = 0; n < 4; n++) d[j * 4 + n] = Math.round(a[n] + (b[n] - a[n]) * f);
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function glowAt(rgb, alpha, x, y, rx, ry = rx, falloff) {
  if (alpha <= .002) return;
  g.globalAlpha = Math.min(1, alpha); g.drawImage(radialSprite(rgb, falloff), x - rx, y - ry, rx * 2, ry * 2); g.globalAlpha = 1;
}
const hsl2rgb = (h, s, l) => {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => 255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
};

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========
// 繁体版（<html lang="zh-TW">）自动换成思源黑体繁体
const TC = document.documentElement.lang === 'zh-TW';
const FONTS = TC ? {
  cjk:   '"Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',
  latin: '"Sora","Source Han Sans TC",sans-serif',
} : {
  cjk:   '"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',
  latin: '"Sora","Source Han Sans SC",sans-serif',
};
// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {
  g.font = `${weight} ${size}px ${FONTS[fam]}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function resetSpacing(c = g) { if ('letterSpacing' in c) c.letterSpacing = '0px'; }
function measure(s, size, weight = 400, spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  setFont(size, weight, spacing, fam); const w = g.measureText(s).width - spacing; resetSpacing(); return w;
}
function text(s, x, y, size, color, weight = 400, align = 'left', spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  const w = measure(s, size, weight, spacing, fam);
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  setFont(size, weight, spacing, fam); g.textAlign = 'left'; g.fillStyle = color; g.fillText(s, left, y); resetSpacing();
  return w;
}
// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {
  const ws = parts.map(([s, size, , wt = 400, sp = 0, slot]) => measure(slot || s, size, wt, sp));
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, wt = 400, sp = 0, slot], i) => {
    text(s, slot ? x + ws[i] : x, y, size, color, wt, slot ? 'right' : 'left', sp); x += ws[i];
  });
  return ws.reduce((a, b) => a + b, 0);
}
function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;
  return {p: from > to && t < to ? 1 : easeOut(age / .55), out: clamp((dur - age) / .35), age};
}

}

// ======== 左上角：讲故事的小字 ========

// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
const STORY_SHADOW = 'rgba(4,6,16,.85)';
function drawStory(t, story, color = NARRATION, bar = TYPE.accent, shadow = STORY_SHADOW) {
  story.forEach(([from, to, s]) => {
    if (t < from || t > to) return;
    const out = clamp((to - t) / .5), y = 480;
    let size = 38; while (size > 30 && measure(s, size, 500, 1.5) > 900) size--;
    g.globalAlpha = out * clamp((t - from) / .3);
    g.fillStyle = bar; g.fillRect(80, y - 33, 3, 44);          // 竖细线：提示「这是旁白」
    setFont(size, 500, 1.5); g.textAlign = 'left';
    g.shadowColor = shadow || STORY_SHADOW; g.shadowBlur = 9; g.shadowOffsetY = 1;
    let x = 102;
    [...s].forEach((c, i) => {
      const p = clamp((t - from - i * .05) / .45);           // 每个字晚 0.05 秒出现
      if (p > 0) { g.globalAlpha = ease(p) * out; g.fillStyle = color; g.fillText(c, x, y + 8 * (1 - ease(p))); g.fillText(c, x, y + 8 * (1 - ease(p))); }   // 叠两次，字影更实
      x += g.measureText(c).width;
    });
    g.globalAlpha = 1; g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; resetSpacing();
  });
}

// ======== 标题：镜面金属字（全系列统一）========
//  - 底色是接近白色的哑光银，从上到下平滑地由亮变暗（不要中间一道暗色「地平线」，在大字上会看成一条横线）
//  - 字面映出此刻的场景：截一块画面、上下翻转、缩到很小（相当于金属表面的模糊），以「柔光」叠上去，是一层光泽而不是清晰的倒影

// 不变的几层只画一次；每帧只在一张小画布上贴几次图
const TX = 30, TB = 190;                 // 标题在缓存画布里的位置
const titleLayers = {};
let titleText = '';
function titleLayer(key, paint) {

const titleWork = document.createElement('canvas'); titleWork.width = 860; titleWork.height = 300;
const mask = () => titleLayer('mask', x => { x.fillStyle = '#fff'; x.fillText(titleText, TX, TB); });
const titleShadow = () => titleLayer('shadow', x => {

});
const silver = () => titleLayer('silver', x => {

});
// 外浮雕：把字形模糊一下当成高度，按「光从左上方照下来」算字外一圈的明暗：

// 标题区：NIIGATA + 地名 / 金属大标题 / 讲故事的小字

function drawHeader(t, L, header) {

  const narr = pick(header.storyColor) || NARRATION, accent = pick(header.accent) || TYPE.accent;

// 文字层底下的压暗：上面托住标题，下面托住大字（y0 ~ y0+h 的中间最暗）

// ======== 播放和导出 ========
// render(t) 必须是确定性的：同一个 t 永远画出同一帧（逐帧录制靠这个）。?record 时不自动播放，等录制脚本调用。
async function loadFonts() {

// 视频从第几秒开始（循环是无缝的，从哪一秒开始都是完整的一圈）。页面里可以写 const START = 11.9;
// 把高潮放到视频的第一帧，不需要加速或压缩任何画面。网页播放和 record.js 导出都从这里开始。

<script>// 高田夜樱（春）：上越市高田城址公园。三个场景，段落之间直切（构图按观光协会的照片选）：
//   0–5      全景：隔着护城河看绿色灯光下的三重橹、一整片樱花墙和倒影（第 0 秒当封面）
//   5–9      极乐桥：朱红的长桥横过护城河，桥灯在水里拉出金光，天上一轮满月
//   9–13     站在樱花底下抬头看：发光的粉色花铺满头顶，下面是人群和纸灯笼
//   13–20    回到全景：花吹雪落进护城河，铺成花筏（高潮，不放字），接回第 0 秒
// 樱花不用团块：每棵树按染井吉野的树形长出枝干，在枝梢上开出一朵朵五瓣的花。
const T = 20;
const WH = 2900;
const SS = 2;
const WATER = 1500, NEAR = 2280;                  // 护城河：对岸水边 → 这边岸边
const CASTLE = {x: 650, base: 1165};              // 三重橹（草坡顶上）
const FAR_Y0 = 640, FAR_Y1 = 1520;                // 远景层（对岸）的范围
const NEAR_Y0 = 1420;                             // 近景层（这边岸上）从这里往下
const PATH = 2600;                                // 这边岸上的小路

function hiCanvas(w, h, ss = SS) { const c = document.createElement('canvas'); c.width = Math.round(w * ss); c.height = Math.round(h * ss); c.w = w; c.h = h; c.ss = ss; return c; }

// ======== 樱花的花：五瓣，花瓣尖上有一个小缺口，中间深一点的粉、花蕊 ========
// 预先画几种（被灯照亮的暖白、背光的粉、更深的粉），用的时候缩放、旋转贴上去
const FLOWERS = [[255, 244, 246, 238, 160, 184], [252, 228, 236, 226, 130, 162], [244, 206, 222, 206, 104, 142], [255, 236, 228, 240, 150, 150]].map(([r1, g1, b1, r0, g0, b0], v) => {
  const N = 72, c = document.createElement('canvas'); c.width = c.height = N; const b = c.getContext('2d'); b.translate(N / 2, N / 2);
  for (let k = 0; k < 5; k++) {

    b.fillStyle = gr; b.beginPath(); b.moveTo(0, -3);
    b.bezierCurveTo(-13, -10, -14, -26, -4, -31); b.lineTo(0, -27); b.lineTo(4, -31); b.bezierCurveTo(14, -26, 13, -10, 0, -3); b.fill();

});
const PETAL = (() => { const c = document.createElement('canvas'); c.width = 24; c.height = 32; const b = c.getContext('2d');
  const gr = b.createLinearGradient(0, 30, 0, 0); gr.addColorStop(0, '#f2b6c8'); gr.addColorStop(1, '#fff3f6');
  b.fillStyle = gr; b.beginPath(); b.moveTo(12, 30); b.bezierCurveTo(1, 22, 1, 6, 9, 2); b.lineTo(12, 6); b.lineTo(15, 2); b.bezierCurveTo(23, 6, 23, 22, 12, 30); b.fill(); return c; })();
function petal(x, y, s, a, alpha, ctx = g) {                     // 一片飘落的花瓣（翻转得慢、宽窄变化小，不闪）
  ctx.globalAlpha = alpha; ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(1, .7 + .3 * Math.cos(a * .6)); ctx.drawImage(PETAL, -s, -s * 1.3, s * 2, s * 2.6); ctx.restore();

// ======== 一棵樱花树（染井吉野）：树干短、几根粗枝往两边伸开，枝梢下垂，花开在细枝上 ========
// opt: {x, y（树根）, h（树干长）, lean（整体倾向，弧度）, depth, spread, droop（枝梢下垂的程度）, w（树干粗）,
//       fs（花的大小）, fn（每个花簇的花数）, cr（花簇半径）, seed, lamps（照亮它的灯）, sky（上沿被天光勾边）}
function lightAt(x, y, lamps) { let s = 0; (lamps || []).forEach(([lx, ly, r]) => { const d = Math.hypot(x - lx, (y - ly) * 1.2); s += Math.exp(-d * d / (2 * r * r)); }); return clamp(s); }

  segs.forEach(([x, y, mx, my, ex, ey, w]) => {
    b.strokeStyle = '#21151c'; b.lineCap = 'round'; b.lineWidth = Math.max(.8, w);
    b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(mx, my, ex, ey); b.stroke();

    const cnt = Math.round(o.fn * (d === 0 ? 1 : d === 1 ? .7 : .45));

      const a = R(i * 31 + k, o.seed + 5) * TAU, r = Math.pow(R(i * 31 + k, o.seed + 6), .7) * cr;

      b.globalAlpha = .55 + .45 * Math.max(lit, top, .35);
      b.save(); b.translate(fx, fy); b.rotate(R(i * 31 + k, o.seed + 8) * TAU); b.drawImage(FLOWERS[top > .25 ? 3 : v], -s / 2, -s / 2, s, s); b.restore();
    }
  });

}

// ======== 天空：日落后的蓝色时刻，远处的山 ========
const SKY_H = 1520;

(() => {

// ======== 三重橹：白墙、深灰瓦，每层屋檐两头翘起；一层有千鸟破风，二层有唐破风，顶上入母屋和鯱 ========
// 夜里投光灯从下往上打：白墙下面最亮，檐底被照亮，瓦面朝上、偏暗；绿光只打在草坡上
function drawCastle(b) {
  const {x, base} = CASTLE;
  const roof = '#283040', roofLit = '#4c566a', edge = '#aab2c2';
  const wallFill = (y, h) => { const gr = b.createLinearGradient(0, y - h, 0, y); gr.addColorStop(0, '#c9ccd6'); gr.addColorStop(.5, '#ece8e2'); gr.addColorStop(1, '#fff9ec'); return gr; };

    b.fillStyle = wallFill(y, h); b.fillRect(x - w / 2, y - h, w, h);
    b.strokeStyle = 'rgba(150,150,160,.35)'; b.lineWidth = 1.5;

function fubukiPos(p, age) { return [p.x0 + age * p.vx + Math.sin(age * p.f + p.ph) * p.sw, p.y0 - p.up * age + p.gr * age * age]; }

  b.bezierCurveTo(x - 70 * s, y + 70 * s, x - 52 * s, y + 46 * s, x - 16 * s, y + 38 * s);
  b.lineTo(x + 16 * s, y + 38 * s); b.bezierCurveTo(x + 52 * s, y + 46 * s, x + 70 * s, y + 70 * s, x + 70 * s, y + 200 * s); b.closePath(); b.fill();
  b.fillRect(x - 11 * s, y + 10 * s, 22 * s, 32 * s);
  const tilt = (face || 0) * .12;
  b.beginPath(); b.ellipse(x, y, 23 * s, 27 * s, tilt, 0, TAU); b.fill();
  if (k < .18) { b.beginPath(); b.arc(x + 4 * s, y - 28 * s, 11 * s, 0, TAU); b.fill(); }                      // 丸子头
  else if (k < .32) { b.beginPath(); b.ellipse(x, y - 14 * s, 27 * s, 14 * s, 0, Math.PI, TAU); b.fill(); b.beginPath(); b.ellipse(x + 18 * s * (face || 1), y - 4 * s, 22 * s, 5 * s, 0, 0, TAU); b.fill(); }   // 鸭舌帽
  else if (k < .44) { b.beginPath(); b.ellipse(x, y + 4 * s, 30 * s, 33 * s, 0, 0, TAU); b.fill(); }        // 兜帽
  else if (k < .6) { b.beginPath(); b.moveTo(x - 22 * s, y); b.quadraticCurveTo(x - 30 * s, y + 40 * s, x - 18 * s, y + 52 * s); b.lineTo(x + 18 * s, y + 52 * s); b.quadraticCurveTo(x + 30 * s, y + 40 * s, x + 22 * s, y); b.fill(); }   // 长发
  b.strokeStyle = 'rgba(255,200,215,.5)'; b.lineWidth = 2.2 * Math.max(.7, s);                                // 头顶和肩膀被上面的灯和花照出一道粉色轮廓
  b.beginPath(); b.arc(x, y, 24 * s, Math.PI * 1.15, Math.PI * 1.85); b.stroke();
  b.beginPath(); b.moveTo(x - 60 * s, y + 66 * s); b.quadraticCurveTo(x - 48 * s, y + 46 * s, x - 18 * s, y + 40 * s); b.stroke();
  b.beginPath(); b.moveTo(x + 60 * s, y + 66 * s); b.quadraticCurveTo(x + 48 * s, y + 46 * s, x + 18 * s, y + 40 * s); b.stroke();
}
function phoneUp(b, x, y, s) {                                     // 举起来拍花的手和手机：屏幕里是粉色的花
  b.strokeStyle = '#0c070c'; b.lineCap = 'round'; b.lineWidth = 16 * s;
  b.beginPath(); b.moveTo(x + 40 * s, y + 60 * s); b.quadraticCurveTo(x + 60 * s, y - 10 * s, x + 46 * s, y - 80 * s); b.stroke();
  b.strokeStyle = 'rgba(255,200,215,.45)'; b.lineWidth = 2; b.beginPath(); b.moveTo(x + 50 * s, y + 40 * s); b.quadraticCurveTo(x + 68 * s, y - 10 * s, x + 54 * s, y - 72 * s); b.stroke();   // 手臂被屏幕和灯照出的轮廓
  b.fillStyle = '#16121a'; b.fillRect(x + 26 * s, y - 136 * s, 40 * s, 66 * s);
  const gr = b.createLinearGradient(0, y - 132 * s, 0, y - 74 * s); gr.addColorStop(0, '#3a2a5a'); gr.addColorStop(.5, '#d898b8'); gr.addColorStop(1, '#f8d0dc');
  b.fillStyle = gr; b.fillRect(x + 29 * s, y - 132 * s, 34 * s, 58 * s);
  b.globalCompositeOperation = 'lighter'; glowB(b, [200, 190, 255], .3, x + 46 * s, y - 100 * s, 70 * s); b.globalCompositeOperation = 'source-over';
}
function chochin(b, x, y, r) {                                    // 纸灯笼：白纸、竹骨的横纹、上下黑色的盖、红色的带子
  glowB(b, [255, 200, 150], .55, x, y, r * 4.2);
  const gr = b.createRadialGradient(x - r * .2, y - r * .2, r * .1, x, y, r * 1.2); gr.addColorStop(0, '#fffaf0'); gr.addColorStop(.7, '#ffe2c0'); gr.addColorStop(1, '#f2b890');
  b.fillStyle = gr; b.beginPath(); b.ellipse(x, y, r, r * 1.25, 0, 0, TAU); b.fill();
  b.strokeStyle = 'rgba(190,120,90,.45)'; b.lineWidth = 1; for (let k = -3; k <= 3; k++) { const yy = y + k * r * .3, ww = r * Math.sqrt(1 - Math.pow(k * .3 / 1.25, 2)); b.beginPath(); b.moveTo(x - ww, yy); b.lineTo(x + ww, yy); b.stroke(); }
  b.fillStyle = '#d23a2e'; b.fillRect(x - r * .8, y + r * .62, r * 1.6, r * .22);
  b.fillStyle = '#1a1214'; b.fillRect(x - r * .5, y - r * 1.38, r, r * .24); b.fillRect(x - r * .5, y + r * 1.16, r, r * .24);
}
const CANOPY = (() => {
  const T0 = 9, T1 = 13, CW = 1300, CH = 2300;
  const STR = [[1330, 40, 1280, 260], [1180, 26, 1110, 175]];          // 两串灯笼：[中间高度, 灯笼大小, 两端高度, 间距]，前面一串大、低，后面一串小、高
  const c = hiCanvas(CW, CH, 1);
  (() => { const b = hiCtx(c);
    b.drawImage(verticalSprite('csky3', [[0, [10, 10, 44, 255]], [.55, [18, 16, 54, 255]], [.8, [26, 16, 46, 255]], [1, [14, 8, 22, 255]]]), 0, 0, CW, CH);
    const L = []; STR.forEach(([ym, r, ye, dx]) => { for (let x = 60; x < CW; x += dx) L.push([x, ye + (ym - ye) * Math.sin(Math.PI * x / CW), r * 11]); });
    // 远处：一排小一点的树，树干立在中间那段深色里，树冠在后面（暗一些，夜空从缝里透出来）
    [[220, 1560, .12, 150, 81], [520, 1600, -.05, 160, 82], [820, 1590, .08, 150, 83], [1110, 1560, -.15, 150, 84]].forEach(([x, y, lean, h, seed]) =>
      sakura(b, {x, y, h, lean, depth: 7, spread: .55, droop: .12, w: 16, fs: 13, fn: 8, cr: 24, seed, lamps: L, sky: false}));
    b.drawImage(verticalSprite('canshade3', [[0, [10, 8, 34, 170]], [.45, [10, 8, 34, 90]], [.6, [10, 8, 34, 20]], [1, [10, 8, 34, 0]]]), 0, 0, CW, CH);
    // 近处：两棵大樱花从左右下角长上来，树干往中间斜，树冠在头顶连成一片
    sakura(b, {x: -60, y: CH + 40, h: 520, lean: .32, depth: 8, spread: .5, droop: .1, w: 70, fs: 22, fn: 7, cr: 34, seed: 70, lamps: L, sky: false});
    sakura(b, {x: CW + 60, y: CH + 40, h: 500, lean: -.34, depth: 8, spread: .5, droop: .1, w: 66, fs: 22, fn: 7, cr: 34, seed: 73, lamps: L, sky: false});
    // 最近：从画面上沿垂下来的花枝（花最大、最清楚）
    sakura(b, {x: 180, y: -260, h: 200, lean: Math.PI - .5, depth: 6, spread: .5, droop: -.2, w: 30, fs: 38, fn: 5, cr: 50, seed: 76, lamps: [[300, 400, 800]], sky: false});
    sakura(b, {x: CW - 160, y: -240, h: 190, lean: -(Math.PI - .55), depth: 6, spread: .5, droop: -.2, w: 28, fs: 38, fn: 5, cr: 48, seed: 77, lamps: [[1000, 420, 800]], sky: false});
    b.globalCompositeOperation = 'lighter'; L.forEach(([x, y, r]) => glowB(b, [255, 150, 190], .08, x, y - 160, r * 1.2, r * .9, 1.3)); b.globalCompositeOperation = 'source-over';   // 灯笼上方的花被照成发光的粉色
    // 两串灯笼（先画后面的小串）
    [...STR].reverse().forEach(([ym, r, ye, dx]) => {
      const yAt = x => ye + (ym - ye) * Math.sin(Math.PI * x / CW);
      b.strokeStyle = '#140c10'; b.lineWidth = r * .08; b.beginPath(); for (let x = 0; x <= CW; x += 20) b[x ? 'lineTo' : 'moveTo'](x, yAt(x) - r * 1.6); b.stroke();
      for (let x = 60; x < CW; x += dx) { b.beginPath(); b.moveTo(x, yAt(x) - r * 1.6); b.lineTo(x, yAt(x) - r * 1.3); b.stroke(); chochin(b, x, yAt(x), r); }
    });
    // 人：三排后脑勺和肩膀，越靠前越大；有人举着手机拍头顶的花
    for (let row = 0; row < 3; row++) {
      const y0 = 1960 + row * 110, s0 = .8 + row * .32;
      for (let x = -30 + row * 47, n = 0; x < CW + 80; n++) {
        const s = s0 * (.86 + R(n, 424 + row) * .28), hx = x + R(n, 421 + row) * 26, hy = y0 + R(n, 422 + row) * 36 - (R(n, 425 + row) < .15 ? 26 : 0);
        x += (110 + R(n, 420 + row) * 90) * s0;
        bust(b, hx, hy, s, R(n, 426 + row), R(n, 427 + row) < .5 ? -1 : 1);
        if (R(n, 423 + row) < .16) phoneUp(b, hx, hy, s * .75);
      }
    }
  })();
  function render(t) {
    const k = clamp((t - T0) / (T1 - T0)), y = lerp(CH - H, CH - H - 330, k), z = lerp(1, 1.04, k);   // 从人群慢慢抬头看花
    g.setTransform(z, 0, 0, z, W / 2 * (1 - z), H / 2 * (1 - z));
    g.drawImage(c, (CW - W) / 2, y, W, H, 0, 0, W, H);
    for (let i = 0; i < 30; i++) {                                                // 离眼睛很近的花瓣
      const u = fract(R(i, 430) + (t - T0) * (.1 + R(i, 431) * .08)), px = R(i, 432) * W + Math.sin(u * 7 + i) * 50, py = u * H;
      petal(px, py, 7 + R(i, 433) * 5, u * 4 + i, .85);
    }
    g.globalAlpha = 1; g.setTransform(1, 0, 0, 1, 0, 0);
  }
  return {t0: T0, t1: T1, render};
})();

// ======== 全景的镜头 ========
// [时间, 中心 y, 放大倍数]；5–13 是两个直切进来的近景（极乐桥、樱花底下），这时全景不显示
const KEYS = [
  [0, 1240, 1.0], [5, 1205, 1.1],          // ① 三重橹、樱花墙、倒影：一直慢慢往前推
  [13, 1200, 1.25],                         // ④ 直切回来：比封面近，三重橹和樱花墙
  [20, 1240, 1.0],                          // 风吹过，镜头一路往后拉，露出整条铺满花瓣的护城河
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t >= KEYS[i + 1][0]) i++;
  if (t >= 5 && t < 13) i = 1;
  const [t0, y0, z0] = KEYS[i], [t1, y1, z1] = KEYS[i + 1];
  const u = clamp((t - t0) / (t1 - t0)), k = i === 0 ? u : .2 * u + .8 * ease(u);   // 封面匀速推；高潮一切进来就在动，风起后加快往后拉，最后缓缓停住
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hh = H / 2 / z;
  return {x: W / 2, y: clamp(lerp(y0, y1, k), hh, WH - hh), z};
}

// ======== 文字 ========
const P = {head: '#fff6f8', key: '#ffb3c9', sub: 'rgba(255,232,240,.9)', narr: 'rgba(255,232,240,.92)', accent: '#f2a6bf'};
const STORY = [
  [0.2, 4.6, '每年 4 月，高田城址公园办观樱会。'],
  [5.4, 8.8, '天黑以后，护城河上的灯和三重橹一起亮起来。'],
  [9.4, 12.8, '在日本人里很有名的赏樱地，外国游客还不多。'],
  [17.0, 19.7, '观樱会从 1926 年办到现在，已经一百多届。'],
];
const HEADER = {title: '高田夜樱', place: '新潟县上越市', story: STORY, sheen: [60, 160, W - 120, 420], storyColor: P.narr, accent: P.accent};
const LINE1 = 1458, LINE2 = 1518;
const HL = {size: 68, weight: 300, sp: 8}, SUBT = {size: 30, weight: 300, sp: 2};
function rich(segs, y, C = P) {
  const ws = segs.map(([s]) => measure(s, HL.size, HL.weight, HL.sp) + HL.sp);
  let x = (W - ws.reduce((p, q) => p + q, 0) + HL.sp) / 2;
  segs.forEach(([s, key], i) => { text(s, x, y, HL.size, key ? C.key : C.head, HL.weight, 'left', HL.sp); x += ws[i]; });
}
let onBright = false;                                             // 樱花底下那个镜头背后忽明忽暗（发亮的花和暗的夜空）：字色不变，字影换成一圈更浓的深色光晕
function headline(s, segs, sub) {                                 // 中下方的大字：和长冈、汤泽一样的极简写法
  rise(s, () => {
    const D = P;
    g.shadowColor = onBright ? 'rgba(30,6,30,.95)' : 'rgba(6,4,16,.6)'; g.shadowBlur = onBright ? 22 : 12;
    rich(segs, LINE1, D); if (onBright) rich(segs, LINE1, D);
    if (sub) for (let k = 0; k < (onBright ? 2 : 1); k++) text(sub, W / 2, LINE2 + 6, SUBT.size, D.sub, onBright ? 400 : SUBT.weight, 'center', SUBT.sp);
    g.shadowColor = 'transparent'; g.shadowBlur = 0;
  });
}
const TEXT_WINDOWS = [[19.9, 4.6], [5.4, 8.8], [9.4, 12.8], [17.0, 19.6]];
const HEADLINES = [
  [[['日本三大', 0], ['夜樱', 1]], '高田城址公园 三重橹'],             // 第 0 秒就在画面上（封面）
  [[['灯一亮 樱花在', 0], ['水里', 1], ['再开一遍', 0]], ''],
  [[['约 ', 0], ['4,000', 1], [' 棵樱花', 0]], '沿着护城河 走在花底下'],
  [[['风一吹 护城河铺满', 0], ['花瓣', 1]], ''],
];

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const C = camAt(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#080c24'; g.fillRect(0, 0, W, H);
  if (t >= BRIDGE_SHOT.t0 && t < BRIDGE_SHOT.t1) BRIDGE_SHOT.render(t);
  else if (t >= CANOPY.t0 && t < CANOPY.t1) CANOPY.render(t);
  else {
    g.setTransform(C.z, 0, 0, C.z, W / 2 - C.x * C.z, H / 2 - C.y * C.z);
    g.drawImage(sky, 0, 0, W, SKY_H);
    drawWater(t);
    drawRaft(t);
    g.drawImage(far, 0, FAR_Y0, W, FAR_Y1 - FAR_Y0);
    drawDrift(t);
    drawWalkers(t);
    g.drawImage(nearC, 0, NEAR_Y0, W, WH - NEAR_Y0);
    drawFubuki(t);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (!(t >= BRIDGE_SHOT.t0 && t < CANOPY.t1)) drawBokeh(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(verticalSprite('topscrim120', [[0, [4, 6, 20, 120]], [1, [4, 6, 20, 0]]]), 0, 0, W, 560);
  drawHeader(t, {light: .35, lc: [255, 214, 225], x: W * .6}, HEADER);
  onBright = (t >= CANOPY.t0 && t < CANOPY.t1) || t >= 16.5;   // 樱花底下、花筏铺开以后，字背后都是亮粉色
  TEXT_WINDOWS.forEach(([a, b], i) => headline(scene(t, a, b), ...HEADLINES[i]));
}
boot(render);
