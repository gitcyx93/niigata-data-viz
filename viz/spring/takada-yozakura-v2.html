<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(232,238,248,.9)';       // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];

const PETAL = (() => { const c = document.createElement('canvas'); c.width = 24; c.height = 32; const b = c.getContext('2d');
  const gr = b.createLinearGradient(0, 30, 0, 0); gr.addColorStop(0, '#f2b6c8'); gr.addColorStop(1, '#fff3f6');
  b.fillStyle = gr; b.beginPath(); b.moveTo(12, 30); b.bezierCurveTo(1, 22, 1, 6, 9, 2); b.lineTo(12, 6); b.lineTo(15, 2); b.bezierCurveTo(23, 6, 23, 22, 12, 30); b.fill(); return c; })();
function petal(x, y, s, a, alpha, ctx = g) {                     // 一片飘落的花瓣（翻转得慢、宽窄变化小，不闪）
  ctx.globalAlpha = alpha; ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(1, .7 + .3 * Math.cos(a * .6)); ctx.drawImage(PETAL, -s, -s * 1.3, s * 2, s * 2.6); ctx.restore();
}

// ======== 一棵樱花树（染井吉野）：树干短、几根粗枝往两边伸开，枝梢下垂，花开在细枝上 ========
// opt: {x, y（树根）, h（树干长）, lean（整体倾向，弧度）, depth, spread, droop（枝梢下垂的程度）, w（树干粗）,
//       fs（花的大小）, fn（每个花簇的花数）, cr（花簇半径）, seed, lamps（照亮它的灯）, sky（上沿被天光勾边）}
function lightAt(x, y, lamps) { let s = 0; (lamps || []).forEach(([lx, ly, r]) => { const d = Math.hypot(x - lx, (y - ly) * 1.2); s += Math.exp(-d * d / (2 * r * r)); }); return clamp(s); }
function sakura(b, o) {
  const segs = [], tips = [];
  let n = 0;
  const grow = (x, y, len, ang, w, d) => {
    n++;
    const bend = (R(n, o.seed + 1) - .5) * .5, ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
    const mx = (x + ex) / 2 + Math.cos(ang + Math.PI / 2) * len * bend * .25, my = (y + ey) / 2 + Math.sin(ang + Math.PI / 2) * len * bend * .25;
    segs.push([x, y, mx, my, ex, ey, w]);
    if (d <= 3 && d >= 1) tips.push([mx, my, d]);                 // 花不只开在最外面：里面的细枝上也有，整棵树是满的
    if (d === 0) { tips.push([ex, ey, 0]); return; }
    const kids = d >= o.depth - 1 ? 3 : (R(n, o.seed + 2) < .3 ? 3 : R(n, o.seed + 9) < .12 ? 1 : 2);
    for (let k = 0; k < kids; k++) {
      const sp = (k - (kids - 1) / 2) * o.spread * (d >= o.depth - 1 ? 1.5 : 1) * (.6 + R(n * 3 + k, o.seed + 3) * .8) + (R(n * 3 + k, o.seed + 10) - .5) * .5;
      const down = o.droop * (1 - d / o.depth) * (Math.cos(ang) >= 0 ? 1 : -1);   // 越往外的细枝越往下垂
      grow(ex, ey, len * (.62 + R(n * 3 + k, o.seed + 4) * .28), ang + sp + down, w * (.58 + R(n * 3 + k, o.seed + 11) * .16), d - 1);
    }
  };
  grow(o.x, o.y, o.h, -Math.PI / 2 + o.lean, o.w, o.depth);
  // 先画枝干（深色，靠灯的一面带一点暖光），再开花
  segs.forEach(([x, y, mx, my, ex, ey, w]) => {
    b.strokeStyle = '#21151c'; b.lineCap = 'round'; b.lineWidth = Math.max(.8, w);
    b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(mx, my, ex, ey); b.stroke();
  });
  tips.forEach(([tx, ty, d], i) => {
    const cr = o.cr * (d === 0 ? 1 : d === 1 ? .85 : .7);
    glowB(b, [240, 170, 200], .22, tx, ty, cr * 1.4, cr * 1.1);          // 花簇底下一层淡淡的粉，让整团花有体积
    const cnt = Math.round(o.fn * (d === 0 ? 1 : d === 1 ? .7 : .45));
    for (let k = 0; k < cnt; k++) {
      const a = R(i * 31 + k, o.seed + 5) * TAU, r = Math.pow(R(i * 31 + k, o.seed + 6), .7) * cr;
      const fx = tx + Math.cos(a) * r, fy = ty + Math.sin(a) * r * .8;
      const lit = lightAt(fx, fy, o.lamps), top = o.sky ? clamp((ty - fy) / cr) * .5 : 0;
      const v = lit > .5 ? 0 : lit > .2 ? (R(k, i) < .5 ? 0 : 1) : (R(k, i) < .5 ? 1 : 2);
      const s = o.fs * (.75 + R(i * 31 + k, o.seed + 7) * .5);
      b.globalAlpha = .55 + .45 * Math.max(lit, top, .35);
      b.save(); b.translate(fx, fy); b.rotate(R(i * 31 + k, o.seed + 8) * TAU); b.drawImage(FLOWERS[top > .25 ? 3 : v], -s / 2, -s / 2, s, s); b.restore();
    }
  });
  b.globalAlpha = 1;
}

// ======== 三重橹：白墙、深灰瓦，每层屋檐两头翘起；一层有千鸟破风，二层有唐破风，顶上入母屋和鯱 ========
// 夜里投光灯从下往上打：白墙下面最亮，檐底被照亮，瓦面朝上、偏暗；绿光只打在草坡上
function drawCastle(b) {
  const {x, base} = CASTLE;
  const roof = '#283040', roofLit = '#4c566a', edge = '#aab2c2';
  const wallFill = (y, h) => { const gr = b.createLinearGradient(0, y - h, 0, y); gr.addColorStop(0, '#c9ccd6'); gr.addColorStop(.5, '#ece8e2'); gr.addColorStop(1, '#fff9ec'); return gr; };
  const wall = (y, h, w) => {                                    // 一层墙：灰泥白墙，柱子的竖线，下沿腰板，被灯照亮的下半截
    b.fillStyle = wallFill(y, h); b.fillRect(x - w / 2, y - h, w, h);
    b.strokeStyle = 'rgba(150,150,160,.35)'; b.lineWidth = 1.5;
    for (let k = 0; k <= 8; k++) { const px = x - w / 2 + k * w / 8; b.beginPath(); b.moveTo(px, y - h); b.lineTo(px, y); b.stroke(); }
    b.fillStyle = 'rgba(70,74,86,.85)'; b.fillRect(x - w / 2, y - h * .14, w, h * .14);
    b.fillStyle = 'rgba(40,46,60,.28)'; b.fillRect(x - w / 2, y - h, w, h * .12);                  // 檐下的阴影
    b.strokeStyle = 'rgba(80,84,96,.6)'; b.lineWidth = 2; b.strokeRect(x - w / 2, y - h, w, h);
  };
  const windows = (y, h, w, n) => {                              // 格子窗：深色窗洞、浅色窗框、竖格子，窗里透一点暖光
    for (let k = 0; k < n; k++) {
      const wx = x - w / 2 + (k + .5) * w / n - 13, wy = y - h * .68;
      b.fillStyle = '#23242e'; b.fillRect(wx, wy, 26, h * .34);
      b.fillStyle = 'rgba(255,200,140,.22)'; b.fillRect(wx + 2, wy + h * .2, 22, h * .12);
      b.strokeStyle = '#efe8d8'; b.lineWidth = 2.4; b.strokeRect(wx, wy, 26, h * .34);
      b.strokeStyle = 'rgba(230,224,210,.85)'; b.lineWidth = 1.4; for (let m = 1; m < 4; m++) { b.beginPath(); b.moveTo(wx + m * 6.5, wy); b.lineTo(wx + m * 6.5, wy + h * .34); b.stroke(); }
    }
  };
  const eaves = (y, w, rw, rh) => {                              // 一圈屋檐：亮的檐底（椽子的细线）、上面灰瓦，两头翘起，瓦的竖纹
    const sg = b.createLinearGradient(0, y - 4, 0, y + 14); sg.addColorStop(0, '#d8d2c4'); sg.addColorStop(1, '#fff6e2');
    b.fillStyle = sg; b.beginPath(); b.moveTo(x - rw / 2 - 12, y - 2); b.quadraticCurveTo(x, y + 10, x + rw / 2 + 12, y - 2); b.lineTo(x + w / 2, y + 14); b.lineTo(x - w / 2, y + 14); b.closePath(); b.fill();
    b.save(); b.clip(); b.strokeStyle = 'rgba(150,140,120,.45)'; b.lineWidth = 1; for (let k = -rw / 2; k < rw / 2; k += 9) { b.beginPath(); b.moveTo(x + k, y - 2); b.lineTo(x + k * .86, y + 14); b.stroke(); } b.restore();
    const gr = b.createLinearGradient(0, y - rh, 0, y); gr.addColorStop(0, roof); gr.addColorStop(.7, roof); gr.addColorStop(1, roofLit);
    b.fillStyle = gr; b.beginPath();
    b.moveTo(x - rw / 2 - 16, y - 10); b.quadraticCurveTo(x - rw / 2 + 24, y - 4, x - w / 2 + 8, y - rh);
    b.lineTo(x + w / 2 - 8, y - rh); b.quadraticCurveTo(x + rw / 2 - 24, y - 4, x + rw / 2 + 16, y - 10);
    b.quadraticCurveTo(x, y + 4, x - rw / 2 - 16, y - 10); b.closePath(); b.fill();
    b.save(); b.clip(); b.strokeStyle = 'rgba(10,14,24,.4)'; b.lineWidth = 1.2; for (let k = -rw / 2; k < rw / 2; k += 6) { b.beginPath(); b.moveTo(x + k, y + 4); b.lineTo(x + k * .8, y - rh); b.stroke(); } b.restore();
    b.strokeStyle = edge; b.lineWidth = 2.2; b.beginPath(); b.moveTo(x - rw / 2 - 16, y - 10); b.quadraticCurveTo(x, y + 4, x + rw / 2 + 16, y - 10); b.stroke();   // 瓦的下沿（被灯照到的一条亮线）
    b.strokeStyle = '#1c2230'; b.lineWidth = 3; b.beginPath(); b.moveTo(x - w / 2 + 8, y - rh); b.lineTo(x + w / 2 - 8, y - rh); b.stroke();
  };
  const gable = (y, w, h, kara) => {                             // 屋顶正面的破风：三角（千鸟）或弧形（唐），白色的破风板、金色悬鱼
    b.fillStyle = roof; b.beginPath();
    if (kara) { b.moveTo(x - w / 2, y); b.bezierCurveTo(x - w / 3, y, x - w / 5, y - h, x, y - h); b.bezierCurveTo(x + w / 5, y - h, x + w / 3, y, x + w / 2, y); }
    else { b.moveTo(x - w / 2, y); b.lineTo(x, y - h); b.lineTo(x + w / 2, y); }
    b.closePath(); b.fill();
    const fg = b.createLinearGradient(0, y - h, 0, y); fg.addColorStop(0, '#cfd0d6'); fg.addColorStop(1, '#f6efe0');
    b.fillStyle = fg; b.beginPath();
    if (kara) { b.moveTo(x - w / 2 + 12, y); b.bezierCurveTo(x - w / 3, y, x - w / 5, y - h + 10, x, y - h + 10); b.bezierCurveTo(x + w / 5, y - h + 10, x + w / 3, y, x + w / 2 - 12, y); }
    else { b.moveTo(x - w / 2 + 14, y); b.lineTo(x, y - h + 12); b.lineTo(x + w / 2 - 14, y); }
    b.closePath(); b.fill();
    b.strokeStyle = '#3a4252'; b.lineWidth = 2; b.stroke();
    b.fillStyle = '#d8b462'; b.beginPath(); b.arc(x, y - h + (kara ? 18 : 22), 3.5, 0, TAU); b.fill();
  };
  b.save(); b.translate(x, base); b.scale(.9, .9); b.translate(-x, -base);
  wall(base, 96, 260); windows(base - 10, 86, 260, 5);            // 一层
  eaves(base - 96, 260, 340, 30); gable(base - 104, 120, 46);
  wall(base - 128, 74, 200); windows(base - 128, 74, 200, 4);    // 二层
  eaves(base - 202, 200, 270, 26); gable(base - 208, 104, 40, true);
  wall(base - 228, 64, 148); windows(base - 228, 64, 148, 3);    // 三层（顶）
  eaves(base - 292, 148, 214, 22);
  b.fillStyle = roof; b.beginPath(); b.moveTo(x - 80, base - 312); b.lineTo(x - 46, base - 352); b.lineTo(x + 46, base - 352); b.lineTo(x + 80, base - 312); b.closePath(); b.fill();   // 入母屋
  gable(base - 312, 86, 40);
  b.fillStyle = '#1c2230'; b.fillRect(x - 52, base - 360, 104, 9);                  // 屋脊
  [-1, 1].forEach(d => { b.fillStyle = '#d4b46a'; b.beginPath(); b.moveTo(x + d * 50, base - 358); b.quadraticCurveTo(x + d * 62, base - 374, x + d * 54, base - 386); b.quadraticCurveTo(x + d * 46, base - 372, x + d * 42, base - 358); b.fill(); });   // 鯱
  b.restore();
  // 投光：橹的四周一圈冷白的光晕，墙脚泛一点草坡反上来的绿
  b.globalCompositeOperation = 'lighter';
  glowB(b, [200, 220, 255], .16, x, base - 170, 260, 300, 1.4);
  glowB(b, [120, 230, 120], .12, x, base - 20, 200, 60, 1.4);
  b.globalCompositeOperation = 'source-over';
}

// 草坡后面几棵深色的大树：树冠边缘不规则（几团叠起来），只在顶上被天光勾一点边，让三重橹不是孤零零地贴在天上
function darkTree(b, x, y, h, w, seed, col = '#0d1332') {
  b.fillStyle = col; b.fillRect(x - w * .05, y - h * .45, w * .1, h * .45);
  const blobs = 5 + Math.floor(R(seed, 1) * 3);
  for (let k = 0; k < blobs; k++) {
    const u = k / (blobs - 1), cx = x + (R(k, seed + 2) - .5) * w * .9, cy = y - h * (.42 + u * .5) + (R(k, seed + 3) - .5) * h * .1, r = w * (.42 - u * .18) * (.8 + R(k, seed + 4) * .4);
    b.beginPath();
    for (let a = 0; a <= 36; a++) { const th = a / 36 * TAU, rr = r * (1 + .14 * Math.sin(th * 5 + seed + k) + .08 * Math.sin(th * 11 + k * 3)); b.lineTo(cx + Math.cos(th) * rr, cy + Math.sin(th) * rr * .8); }
    b.closePath(); b.fill();
    b.save(); b.clip(); b.strokeStyle = 'rgba(80,96,160,.25)'; b.lineWidth = 3; b.beginPath(); b.arc(cx, cy + r * .1, r, Math.PI * 1.15, Math.PI * 1.85); b.stroke(); b.restore();
  }
}

  else if (k < .32) { b.beginPath(); b.ellipse(x, y - 14 * s, 27 * s, 14 * s, 0, Math.PI, TAU); b.fill(); b.beginPath(); b.ellipse(x + 18 * s * (face || 1), y - 4 * s, 22 * s, 5 * s, 0, 0, TAU); b.fill(); }   // 鸭舌帽
  else if (k < .44) { b.beginPath(); b.ellipse(x, y + 4 * s, 30 * s, 33 * s, 0, 0, TAU); b.fill(); }        // 兜帽

// 保留首段原曲线；末段不再拉回三重橹封面，不为循环重复构图。
const KEYS = [[0, 1240, 1.0], [5, 1205, 1.1], [13, 1200, 1.25]];
function camAt(t) {
  if (t >= 13) {
    const u = clamp((t - 13) / 7), k = .2 * u + .8 * ease(u);
    // Stay on the left-hand water: exclude both the tower and its reflected
    // silhouette, rather than merely enlarging the same landmark again.
    return {x: lerp(225, 240, k), y: lerp(1840, 1870, k), z: lerp(2.65, 2.85, k)};
  }
  let i = 0; while (i < KEYS.length - 2 && t >= KEYS[i + 1][0]) i++;
  if (t >= 5 && t < 13) i = 1;
  const [t0, y0, z0] = KEYS[i], [t1, y1, z1] = KEYS[i + 1];
  const u = clamp((t - t0) / (t1 - t0)), k = i === 0 ? u : .2 * u + .8 * ease(u);   // 封面匀速推，保留原样
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hh = H / 2 / z;
  return {x: W / 2, y: clamp(lerp(y0, y1, k), hh, WH - hh), z};
}

  else if (t >= CANOPY.t0 && t < CANOPY.t1) CANOPY.render(t);
  else {
    g.setTransform(C.z, 0, 0, C.z, W / 2 - C.x * C.z, H / 2 - C.y * C.z);
    g.drawImage(sky, 0, 0, W, SKY_H);
    drawWater(t);
    drawRaft(t);
    g.drawImage(far, 0, FAR_Y0, W, FAR_Y1 - FAR_Y0);
    drawDrift(t);
    drawWalkers(t);
    g.drawImage(nearC, 0, NEAR_Y0, W, WH - NEAR_Y0);
    drawFubuki(t);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (!(t >= BRIDGE_SHOT.t0 && t < CANOPY.t1)) drawBokeh(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(verticalSprite('topscrim120', [[0, [4, 6, 20, 120]], [1, [4, 6, 20, 0]]]), 0, 0, W, 560);
  drawHeader(t, {light: .35, lc: [255, 214, 225], x: W * .6}, HEADER);
  onBright = (t >= CANOPY.t0 && t < CANOPY.t1) || t >= 16.5;   // 樱花底下、花筏铺开以后，字背后都是亮粉色
  TEXT_WINDOWS.forEach(([a, b], i) => {
    // Keep the cover text visible immediately at 0s, but do not pre-roll it
    // over the final water shot at 19.9s merely to prepare a seamless loop.
    if (i === 0 && t >= 4.6) return;
    headline(scene(t, a, b), ...HEADLINES[i]);
  });
}
boot(render);
</script>
