<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。

// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(232,238,248,.9)';       // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;

const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========

// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {

function line(parts, y) {

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);

// [字号, 字重, 字距]
const TS = () => ({num: [140, 200, -4], name: [68, 300, 8], word: [112, 200, 30], unit: [40, 300, 2], sub: [30, 300, 2]});

// ======== 左上角：讲故事的小字 ========
// 小字是「背景知识」：比大字小，前面一根竖细线；一个字一个字慢慢浮现，说完淡出。
// 字号偏大、中等字重，一律带柔和的深色字影，叠在任何背景上都看得清、也有一点立体感。一句太长时自动缩小字号。
// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
const STORY_SHADOW = 'rgba(4,6,16,.85)';
function drawStory(t, story, color = NARRATION, bar = TYPE.accent, shadow = STORY_SHADOW) {
  story.forEach(([from, to, s]) => {

    setFont(size, 500, 1.5); g.textAlign = 'left';

      if (p > 0) { g.globalAlpha = ease(p) * out; g.fillStyle = color; g.fillText(c, x, y + 8 * (1 - ease(p))); g.fillText(c, x, y + 8 * (1 - ease(p))); }   // 叠两次，字影更实

// ======== 标题：镜面金属字（全系列统一）========
//  - 底色是接近白色的哑光银，从上到下平滑地由亮变暗（不要中间一道暗色「地平线」，在大字上会看成一条横线）

//  - 倒角：上沿一道亮边、下沿一道暗边，让字有厚度；字外一圈外浮雕；下面一层很轻的投影
//  - 被场景里的光照出一块柔和的高光，位置、颜色跟着光源走，亮度有上限
// 不变的几层只画一次；每帧只在一张小画布上贴几次图
const TX = 30, TB = 190;                 // 标题在缓存画布里的位置
const titleLayers = {};
let titleText = '';
function titleLayer(key, paint) {
  if (!titleLayers[key]) {
    const c = document.createElement('canvas'); c.width = 860; c.height = 300;
    const x = c.getContext('2d');
    x.font = `800 132px ${FONTS.cjk}`; if ('letterSpacing' in x) x.letterSpacing = '6px';
    paint(x); titleLayers[key] = c;

}
const titleWork = document.createElement('canvas'); titleWork.width = 860; titleWork.height = 300;
const mask = () => titleLayer('mask', x => { x.fillStyle = '#fff'; x.fillText(titleText, TX, TB); });
const titleShadow = () => titleLayer('shadow', x => {
  x.shadowColor = 'rgba(0,0,0,.42)'; x.shadowBlur = 26; x.shadowOffsetY = 6; x.shadowOffsetX = 5000; x.fillStyle = '#000'; x.fillText(titleText, TX - 5000, TB);
});
const silver = () => titleLayer('silver', x => {
  const top = TB - 112, m = x.createLinearGradient(0, top, 0, TB + 12);
  m.addColorStop(0, '#f8fafd'); m.addColorStop(.55, '#dce2eb'); m.addColorStop(1, '#b2bdcd');
  x.fillStyle = m; x.fillText(titleText, TX, TB);
});
const bevel = () => titleLayer('bevel', x => {
  x.fillStyle = 'rgba(255,255,255,.85)'; x.fillText(titleText, TX, TB - 2);          // 上沿亮边
  x.globalCompositeOperation = 'destination-out'; x.fillText(titleText, TX, TB);
  x.globalCompositeOperation = 'source-over'; x.fillStyle = 'rgba(18,26,44,.45)'; x.fillText(titleText, TX, TB + 2.5);   // 下沿暗边

// 外浮雕：把字形模糊一下当成高度，按「光从左上方照下来」算字外一圈的明暗：
// 左上方贴着字边一道细亮边，右下方一道柔和的暗边，字像从背景里微微凸出来。字面本身不变。
// 只在第一次用到时算一次，之后每帧贴图
function blurF(a, w, h, r) {                   // 三次盒式模糊 ≈ 高斯模糊

      for (let y = 0; y < h; y++) { a[y * w + x] = acc / n; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }

const relief = () => titleLayer('relief', x => {
  const w = 860, h = 300, m = mask().getContext('2d').getImageData(0, 0, w, h).data;

  const img = x.createImageData(w, h), d = img.data;
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {

    if (Math.abs(sh) < .004) continue;

    else { d[j] = 6; d[j + 1] = 8; d[j + 2] = 14; d[j + 3] = v * RELIEF.lo * out * 255; }
  }

const sheen = document.createElement('canvas'); sheen.width = 96; sheen.height = 24;
// 标题区：NIIGATA + 地名 / 金属大标题 / 讲故事的小字
// header = {title, place, story, sheen: [x, y, w, h]（字面映出的那块画面，只取天空，不要深色的山）,
//           可选 storyColor / accent：小字和 NIIGATA、竖线的颜色（固定值或 t => 颜色）；
//           storyShadow: 旁白小字的字影颜色（背景亮时用）；

// L = {light: 光的强度, lc: [r,g,b] 光的颜色, x: 光的水平位置}
function drawHeader(t, L, header) {
  titleText = header.title;
  const pick = v => typeof v === 'function' ? v(t) : v;      // 颜色可以是固定值，也可以随时间变（如跟着故事由冷变暖）
  const narr = pick(header.storyColor) || NARRATION, accent = pick(header.accent) || TYPE.accent;
  const ew = text('NIIGATA', 80, 262, 26, accent, 500, 'left', 8);

    w.globalAlpha = 1;
  }

    w.globalCompositeOperation = 'source-over'; w.globalAlpha = Math.min(.5, L.light * .38);
    w.drawImage(radialSprite(L.lc, 1.3), hx - 280, TB - 190, 560, 240);
    w.globalAlpha = 1;

  w.globalCompositeOperation = 'source-over';
  w.drawImage(bevel(), 0, 0);
  g.drawImage(titleWork, X, Y);

}
// 文字层底下的压暗：上面托住标题，下面托住大字（y0 ~ y0+h 的中间最暗）
function scrims(bandY = 1300, bandH = 320, top = 204, band = 158) {
  g.drawImage(verticalSprite('topscrim' + top, [[0, [1, 3, 12, top]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.drawImage(verticalSprite('band' + band, [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, band]], [1, [1, 3, 12, 0]]]), 0, bandY, W, bandH);
}

// ======== 播放和导出 ========
// render(t) 必须是确定性的：同一个 t 永远画出同一帧（逐帧录制靠这个）。?record 时不自动播放，等录制脚本调用。
async function loadFonts() {
  if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {
    const f = new FontFace(family, `url(data:font/woff2;base64,${b64})`, {weight, unicodeRange: range});
    document.fonts.add(f); return f.load();
  }));
}
// 视频从第几秒开始（循环是无缝的，从哪一秒开始都是完整的一圈）。页面里可以写 const START = 11.9;
// 把高潮放到视频的第一帧，不需要加速或压缩任何画面。网页播放和 record.js 导出都从这里开始。
function boot(render) {
  const start0 = typeof START === 'number' ? START : 0;
  window.render = render;
  window.LOOP_SECONDS = T;
  window.START_SECONDS = start0;
  const ready = loadFonts().catch(() => {});
  if (!params.has('record')) {
    ready.then(() => {
      const start = performance.now();
      const tick = () => { render(start0 + (performance.now() - start) / 1000); requestAnimationFrame(tick); };
      tick();
    });
  } else ready.then(() => { render(start0); window.READY = true; });
}
/*SERIES-END*/
</script>
<script>// 高田夜樱（春）：上越市高田城址公园。一张竖长的夜景，从上到下是蓝色的夜空、草坡上亮着灯的三重橹和对岸的樱花、
// 护城河和倒影、这边岸上的樱花隧道和灯笼小路（实际位置也是这样：隔着护城河看三重橹）。
// 镜头在这张场景里上下平移、推拉：
//   0–3.5    三重橹、樱花、护城河倒影（第 0 秒当封面）
//   3.5–7.5  往下移到这边岸上：樱花隧道下的小路、灯笼、散步的人
//   7.5–11.5 推到水面：对岸的灯笼和樱花在水里的倒影，花瓣一片片落进水里
//   11.5–15  一阵风，满树的花瓣卷起来飘过护城河，落在水面上（高潮，不放字）；镜头慢慢往上拉
//   15–20    回到三重橹和满河的花瓣，接回第 0 秒
const T = 20;
const WH = 2900;
const SS = 2;
const WATER = 1500, NEAR = 2120;                  // 护城河：对岸水边 → 这边岸边
const CASTLE = {x: 650, base: 1165};              // 三重橹（草坡顶上）
const FAR_Y0 = 700, FAR_Y1 = 1520;                // 远景层（对岸）的范围
const NEAR_Y0 = 1900;                             // 近景层（这边岸上）从这里往下
const PATH = 2560;                                // 樱花隧道下的小路

function hiCanvas(w, h, ss = SS) { const c = document.createElement('canvas'); c.width = Math.round(w * ss); c.height = Math.round(h * ss); c.w = w; c.h = h; c.ss = ss; return c; }
function hiCtx(c) { const x = c.getContext('2d'); x.setTransform(c.ss, 0, 0, c.ss, 0, 0); return x; }

function glowB(b, rgb, a, x, y, rx, ry = rx, f = 1.6) { b.globalAlpha = a; b.drawImage(radialSprite(rgb, f), x - rx, y - ry, rx * 2, ry * 2); b.globalAlpha = 1; }

// ======== 天空：日落后的蓝色时刻 ========
const SKY_H = 1520;
const sky = hiCanvas(W, SKY_H, 1.5);
(() => {
  const b = hiCtx(sky);
  b.drawImage(verticalSprite('tsky', [[0, [8, 14, 48, 255]], [.45, [22, 40, 104, 255]], [.8, [52, 70, 140, 255]], [1, [88, 84, 150, 255]]]), 0, 0, W, SKY_H);

  b.fillStyle = '#26306a'; b.beginPath(); b.moveTo(0, SKY_H);
  for (let x = 0; x <= W; x += 6) b.lineTo(x, 1030 - Math.sin(x / 170) * 26 - Math.sin(x / 61) * 9 - Math.max(0, 80 - Math.abs(x - 860) * .35));
  b.lineTo(W, SKY_H); b.closePath(); b.fill();
})();

// ======== 樱花 ========
const BLOSSOM = ['#fde9f0', '#f9d3e0', '#f4bcd0', '#efa7c1', '#ffffff', '#fbdde6'];
function lightAt(x, y, lamps) { let s = 0; lamps.forEach(([lx, ly, r]) => { const d = Math.hypot(x - lx, (y - ly) * 1.3); s += Math.exp(-d * d / (2 * r * r)); }); return clamp(s); }
function crown(b, cx, cy, rx, ry, n, seed, lamps, dim = 1) {    // 一棵樱花的树冠：几团花簇，先铺深一点的粉打底，再撒花点；靠灯的一面亮
  const lumps = Array.from({length: 7}, (_, k) => {
    const a = R(k, seed + 7) * TAU, r = Math.sqrt(R(k, seed + 8)) * .55;
    return [cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r * .8, rx * (.4 + R(k, seed + 9) * .22), ry * (.36 + R(k, seed + 10) * .2)];
  });
  lumps.forEach(([x, y, a, c]) => { b.globalAlpha = .75 * dim; b.fillStyle = '#7a4a6e'; b.beginPath(); b.ellipse(x, y, a * .85, c * .85, 0, 0, TAU); b.fill(); });
  for (let i = 0; i < n; i++) {
    const L = lumps[i % lumps.length], a = R(i, seed) * TAU, r = Math.sqrt(R(i, seed + 1)) * 1.08;
    const x = L[0] + Math.cos(a) * r * L[2], y = L[1] + Math.sin(a) * r * L[3];
    const lit = lightAt(x, y, lamps), k = clamp(lit * .7 + R(i, seed + 2) * .45);
    b.globalAlpha = (.45 + lit * .55) * dim;
    b.fillStyle = BLOSSOM[Math.min(BLOSSOM.length - 1, Math.floor((1 - k) * BLOSSOM.length))];
    b.beginPath(); b.arc(x, y, 2.4 + R(i, seed + 3) * 3.2, 0, TAU); b.fill();
  }
  b.globalAlpha = 1;
}
function branch(b, x0, y0, x1, y1, w) {                         // 黑色的枝干，弯弯地伸出去
  b.strokeStyle = '#1e1420'; b.lineCap = 'round'; b.lineWidth = w;
  b.beginPath(); b.moveTo(x0, y0); b.quadraticCurveTo((x0 + x1) / 2 + (y1 - y0) * .15, (y0 + y1) / 2 - Math.abs(x1 - x0) * .12, x1, y1); b.stroke();
}

// ======== 三重橹 ========
function drawCastle(b) {
  const {x, base} = CASTLE;
  const wall = '#ece0c4', roof = '#343a48', edge = '#7f889a';
  const tier = (y, w, h, rw, rh, top) => {                       // 一层：白墙 + 下沿的屋檐（两头微微翘起）
    b.fillStyle = wall; b.fillRect(x - w / 2, y - h, w, h);
    b.fillStyle = '#2a2f3a'; for (let k = 0; k < Math.floor(w / 46); k++) b.fillRect(x - w / 2 + 18 + k * 46, y - h * .62, 14, h * .3);   // 窗
    b.fillStyle = roof; b.beginPath();
    b.moveTo(x - rw / 2 - 10, y - h + 4); b.quadraticCurveTo(x - rw / 2 + 20, y - h + 2, x - w / 2 + 6, y - h - rh);
    b.lineTo(x + w / 2 - 6, y - h - rh); b.quadraticCurveTo(x + rw / 2 - 20, y - h + 2, x + rw / 2 + 10, y - h + 4);
    b.lineTo(x + rw / 2 - 4, y - h + 12); b.lineTo(x - rw / 2 + 4, y - h + 12); b.closePath(); b.fill();
    b.strokeStyle = edge; b.lineWidth = 2; b.beginPath(); b.moveTo(x - rw / 2 - 10, y - h + 4); b.quadraticCurveTo(x - rw / 2 + 20, y - h + 2, x - w / 2 + 6, y - h - rh); b.stroke();
    b.beginPath(); b.moveTo(x + rw / 2 + 10, y - h + 4); b.quadraticCurveTo(x + rw / 2 - 20, y - h + 2, x + w / 2 - 6, y - h - rh); b.stroke();
    if (top) {                                                    // 最上面：入母屋的三角山墙和屋脊上的鯱
      const ty = y - h - rh;
      b.fillStyle = roof; b.beginPath(); b.moveTo(x - w / 2 + 6, ty); b.lineTo(x - w * .28, ty - 42); b.lineTo(x + w * .28, ty - 42); b.lineTo(x + w / 2 - 6, ty); b.closePath(); b.fill();
      b.fillStyle = wall; b.beginPath(); b.moveTo(x - 30, ty - 2); b.lineTo(x, ty - 34); b.lineTo(x + 30, ty - 2); b.closePath(); b.fill();
      b.fillStyle = '#2a2f3a'; b.fillRect(x - w * .3, ty - 48, w * .6, 7);
      [-1, 1].forEach(d => { b.fillStyle = '#c9b06a'; b.beginPath(); b.ellipse(x + d * w * .29, ty - 54, 4, 9, d * .4, 0, TAU); b.fill(); });
    } else {                                                      // 中间层正面的小三角破风
      b.fillStyle = roof; b.beginPath(); b.moveTo(x - 34, y - h - rh + 2); b.lineTo(x, y - h - rh - 26); b.lineTo(x + 34, y - h - rh + 2); b.closePath(); b.fill();
      b.fillStyle = wall; b.beginPath(); b.moveTo(x - 18, y - h - rh); b.lineTo(x, y - h - rh - 16); b.lineTo(x + 18, y - h - rh); b.closePath(); b.fill();
    }
  };
  b.save(); b.translate(x, base); b.scale(.78, .78); b.translate(-x, -base);
  tier(base, 250, 92, 320, 26);
  tier(base - 118, 196, 72, 256, 22);
  tier(base - 212, 146, 62, 200, 18, true);
  b.restore();
  b.globalCompositeOperation = 'lighter';                         // 被下面的投光灯照亮：白墙偏暖
  glowB(b, [255, 214, 150], .22, x, base - 100, 180, 190, 1.4);
  b.globalCompositeOperation = 'source-over';
}

// ======== 远景层：对岸的草坡、三重橹、樱花、灯笼 ========
const FAR_LAMPS = [[CASTLE.x, CASTLE.base + 40, 260], [160, 1420, 200], [420, 1440, 200], [860, 1440, 200], [80, 1200, 220]];
const FAR_BONBORI = Array.from({length: 11}, (_, i) => [24 + i * 100, WATER - 18]);
const far = hiCanvas(W, FAR_Y1 - FAR_Y0);
(() => {
  const b = hiCtx(far); b.translate(0, -FAR_Y0);
  // 草坡：从三重橹脚下往两边、往水边斜下来，被灯照得发绿
  b.beginPath(); b.moveTo(0, WATER);
  b.lineTo(0, 1360); b.quadraticCurveTo(240, 1230, 420, CASTLE.base + 6); b.lineTo(900, CASTLE.base + 6); b.quadraticCurveTo(1000, 1190, W, 1260); b.lineTo(W, WATER); b.closePath();
  const gr = b.createLinearGradient(0, CASTLE.base, 0, WATER); gr.addColorStop(0, '#2f5a34'); gr.addColorStop(.5, '#1e4028'); gr.addColorStop(1, '#0e2016');
  b.fillStyle = gr; b.fill();
  b.save(); b.clip(); b.globalCompositeOperation = 'lighter'; glowB(b, [150, 220, 110], .18, CASTLE.x, CASTLE.base + 40, 360, 120); b.restore();
  // 三重橹后面、右边的几棵樱花（远、小）
  branch(b, 950, 1250, 960, 1130, 9); branch(b, 330, 1230, 320, 1120, 8);
  crown(b, 960, 1110, 130, 90, 900, 10, FAR_LAMPS, .8);
  crown(b, 330, 1110, 120, 80, 800, 20, FAR_LAMPS, .75);
  drawCastle(b);
  // 坡前沿着水边的樱花：大片垂到水面上（左边最大，像官方照片那样框住三重橹）
  branch(b, 40, 1500, 120, 1250, 16); branch(b, 120, 1300, 330, 1290, 8); branch(b, 260, 1490, 300, 1330, 12);
  crown(b, 150, 1300, 240, 170, 4200, 30, FAR_LAMPS);
  crown(b, 380, 1390, 170, 110, 2200, 40, FAR_LAMPS);
  crown(b, 980, 1360, 170, 130, 2600, 50, FAR_LAMPS);
  crown(b, 760, 1430, 140, 70, 1400, 60, FAR_LAMPS, .95);
  // 水边一排灯笼（ぼんぼり）：白纸、上下两道红边
  FAR_BONBORI.forEach(([lx, ly]) => {
    b.fillStyle = '#2a1e1a'; b.fillRect(lx - 1.5, ly, 3, 18);
    b.fillStyle = '#fff2dc'; b.fillRect(lx - 7, ly - 18, 14, 18); b.fillStyle = '#d23a2e'; b.fillRect(lx - 7, ly - 18, 14, 3); b.fillRect(lx - 7, ly - 3, 14, 3);
    glowB(b, [255, 214, 160], .55, lx, ly - 9, 40);
  });
})();

// ======== 水里的倒影：天空 + 对岸，上下翻转（预先合成一张，播放时分条晃动）========
const RH = NEAR - WATER;
const refl = hiCanvas(W, RH);
(() => {
  const b = hiCtx(refl);
  b.save(); b.translate(0, WATER - 4); b.scale(1, -1);              // 以水边为轴翻转：水面以上 d 的地方，倒影在水面以下 d
  b.drawImage(sky, 0, 0, W, SKY_H); b.drawImage(far, 0, FAR_Y0, W, FAR_Y1 - FAR_Y0);
  b.restore();
  b.drawImage(verticalSprite('rdark2', [[0, [8, 10, 34, 120]], [1, [4, 6, 18, 215]]]), 0, 0, W, RH);
})();

// ======== 近景层：这边岸上的樱花隧道、灯笼小路 ========
const NEAR_LAMPS = Array.from({length: 7}, (_, i) => [60 + i * 160, PATH - 70, 210]);
const nearC = hiCanvas(W, WH - NEAR_Y0);
(() => {
  const b = hiCtx(nearC); b.translate(0, -NEAR_Y0);
  // 岸边（石头）和草地、小路
  b.fillStyle = '#16141c'; b.fillRect(0, NEAR, W, WH - NEAR);
  b.fillStyle = '#2a2a32'; for (let i = 0; i < 28; i++) { b.beginPath(); b.ellipse(i * 40 + R(i, 70) * 10, NEAR + 6, 26, 9, 0, 0, TAU); b.fill(); }
  b.drawImage(verticalSprite('path', [[0, [70, 62, 60, 255]], [1, [40, 34, 36, 255]]]), 0, PATH, W, 120);
  for (let i = 0; i < 900; i++) { b.fillStyle = `rgba(200,180,170,${.15 + R(i, 71) * .2})`; b.fillRect(R(i, 72) * W, PATH + R(i, 73) * 120, 2, 1.5); }
  // 樱花隧道：两排树，树干在小路两边，树冠在头顶连成一片
  [[30, 18], [250, 14], [520, 16], [790, 15], [1040, 17]].forEach(([x, w], i) => {
    branch(b, x, PATH + 40, x + 40, 2260, w); branch(b, x + 20, 2330, x + 150, 2200, w * .5); branch(b, x + 20, 2360, x - 120, 2230, w * .5);
  });
  for (let i = 0; i < 6; i++) crown(b, 60 + i * 200, 2150 + R(i, 74) * 50, 200, 150, 3600, 100 + i * 9, NEAR_LAMPS);
  for (let i = 0; i < 5; i++) crown(b, 160 + i * 210, 2330 + R(i, 75) * 30, 170, 90, 2000, 200 + i * 9, NEAR_LAMPS);
  // 小路边的灯笼
  NEAR_LAMPS.forEach(([lx, ly]) => {
    b.fillStyle = '#2a1e1a'; b.fillRect(lx - 2.5, ly, 5, 70);
    b.fillStyle = '#fff2dc'; b.fillRect(lx - 13, ly - 34, 26, 34); b.fillStyle = '#d23a2e'; b.fillRect(lx - 13, ly - 34, 26, 5); b.fillRect(lx - 13, ly - 5, 26, 5);
    b.fillStyle = '#e88aa8'; b.beginPath(); b.arc(lx, ly - 17, 5, 0, TAU); b.fill();
    glowB(b, [255, 214, 160], .6, lx, ly - 17, 70);
  });
  b.globalCompositeOperation = 'lighter'; NEAR_LAMPS.forEach(([lx]) => glowB(b, [255, 190, 150], .18, lx, PATH + 30, 160, 60)); b.globalCompositeOperation = 'source-over';
})();

// ======== 动的东西 ========
const WALKERS = Array.from({length: 7}, (_, i) => ({ph: R(i, 80), dir: i % 2 ? 1 : -1, k: 1, s: .9 + R(i, 81) * .25, pair: i % 3 === 0}));
function drawWalkers(t) {                                         // 小路上散步的人（剪影），一个循环走过一个画面宽，首尾接得上
  WALKERS.forEach((w, i) => {
    const u = fract(w.ph + w.dir * t / T), x = -60 + u * (W + 120), y = PATH + 70 + (i % 3) * 14, s = w.s;
    const step = Math.sin(TAU * 18 * t / T + i) * 4;
    [0, w.pair ? 22 : null].forEach(dx => {
      if (dx === null) return;
      g.fillStyle = '#120c14';
      g.beginPath(); g.ellipse(x + dx, y - 74 * s, 9 * s, 10 * s, 0, 0, TAU); g.fill();
      g.beginPath(); g.moveTo(x + dx - 13 * s, y - 62 * s); g.lineTo(x + dx + 13 * s, y - 62 * s); g.lineTo(x + dx + 11 * s, y - 22 * s); g.lineTo(x + dx - 11 * s, y - 22 * s); g.closePath(); g.fill();
      g.fillRect(x + dx - 7 * s + step * .5, y - 24 * s, 5 * s, 24 * s); g.fillRect(x + dx + 2 * s - step * .5, y - 24 * s, 5 * s, 24 * s);
    });
  });
}
function drawWater(t) {                                           // 护城河：倒影分成很多横条，轻轻晃
  g.fillStyle = '#0a1028'; g.fillRect(0, WATER, W, RH);
  for (let y = 0; y < RH; y += 6) {
    const off = Math.sin(TAU * 2 * t / T + y * .05) * (1.2 + y * .006) + Math.sin(TAU * 3 * t / T - y * .021) * 1.1;
    g.drawImage(refl, 0, y * SS, W * SS, 6 * SS, off, WATER + y, W, 6);
  }
  g.globalCompositeOperation = 'lighter';                         // 对岸灯笼在水里拉出的光
  FAR_BONBORI.forEach(([lx], i) => { for (let k = 0; k < 8; k++) { const y = WATER + 14 + k * 16, w = 10 + Math.sin(TAU * 3 * t / T + k + i) * 4; g.fillStyle = `rgba(255,214,160,${.32 * (1 - k / 9)})`; g.fillRect(lx - w / 2 + Math.sin(TAU * 2 * t / T + k * .7) * 3, y, w, 2); } });
  g.globalCompositeOperation = 'source-over';
}
// 花瓣：平时从两岸的树上慢慢飘落；风来时一大片卷起来飘过护城河，落在水面上
function petal(x, y, s, a, alpha) {
  g.globalAlpha = alpha; g.fillStyle = '#fbe1ea';
  g.save(); g.translate(x, y); g.rotate(a); g.beginPath(); g.ellipse(0, 0, s, s * .55, 0, 0, TAU); g.fill(); g.restore();
}
const DRIFT = Array.from({length: 90}, (_, i) => ({x: R(i, 90) * W, y0: i % 2 ? 1150 : 2050, span: 500 + R(i, 91) * 300, ph: R(i, 92), k: 1 + (i % 2), sw: 20 + R(i, 93) * 30, s: 3 + R(i, 94) * 3}));
function drawDrift(t) {
  DRIFT.forEach((p, i) => {
    const u = fract(p.ph + p.k * t / T), y = p.y0 + u * p.span, x = p.x + Math.sin(TAU * (u * 2 + p.ph)) * p.sw;
    petal(x, y, p.s, TAU * (u * 3 + p.ph), Math.min(1, u * 6, (1 - u) * 6) * .85);
  });
  g.globalAlpha = 1;
}
const GUST = {t0: 11.6, t1: 15.4};
const GP = Array.from({length: 420}, (_, i) => ({d: R(i, 100) * 1.4, x0: -80 - R(i, 101) * 300, y0: 1150 + R(i, 102) * 1200, v: 420 + R(i, 103) * 420, lift: 80 + R(i, 104) * 260, s: 3 + R(i, 105) * 4, sp: (R(i, 106) - .5) * 9, land: WATER + 30 + R(i, 107) * (RH - 60)}));
function drawGust(t) {
  if (t < GUST.t0 || t > GUST.t1 + 4.6) return;
  const a = t - GUST.t0;
  GP.forEach(p => {
    const age = a - p.d; if (age < 0) return;
    let x = p.x0 + age * p.v, y = p.y0 - Math.sin(clamp(age / 2) * Math.PI * .8) * p.lift + age * age * 24;
    if (y > p.land && p.y0 < WATER + 200) {                       // 落到水面上的花瓣：停在水上，跟着水慢慢漂走、变淡
      const tl = age - Math.sqrt(Math.max(0, (p.land - p.y0 + p.lift) / 24));
      y = p.land; x = p.x0 + age * p.v * .25;
      if (x > W + 20 || t > GUST.t1 + 4.4) return;
      petal(x % (W + 40), y, p.s, 0, .8 * clamp((GUST.t1 + 4.4 - t) / 1.5)); return;
    }
    if (x > W + 40) return;
    petal(x, y, p.s, age * p.sp, Math.min(1, age * 3) * .95);
  });
  g.globalAlpha = 1;
}

// ======== 镜头 ========
// [时间, 中心 y, 放大倍数]
const COVER = [1240, 1.0];
const KEYS = [
  [0, ...COVER], [3.5, 1300, 1.04],        // ① 三重橹、樱花、倒影
  [7.5, 2270, 1.5],                         // ② 往下到这边岸上的樱花隧道和小路
  [11.5, 1520, 1.45],                       // ③ 往上推到水面：倒影、灯笼的光（大字落在水面上，不压在樱花上）
  [15.0, 1380, 1.04],                       // ④ 风来了，镜头慢慢往上拉（高潮）
  [20, ...COVER],                           // ⑤ 回到第 0 秒
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const [t0, y0, z0] = KEYS[i], [t1, y1, z1] = KEYS[i + 1], k = ease(clamp((t - t0) / (t1 - t0)));
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hh = H / 2 / z;
  return {x: W / 2, y: clamp(lerp(y0, y1, k), hh, WH - hh), z};
}

// ======== 文字 ========
const P = {head: '#fff6f8', key: '#ffb3c9', sub: 'rgba(255,232,240,.9)', narr: 'rgba(255,232,240,.92)', accent: '#f2a6bf'};
const STORY = [
  [0.2, 3.2, '每年 4 月，高田城址公园办观樱会。'],
  [3.9, 7.3, '高田城是德川家康六子松平忠辉的居城。'],
  [8.0, 11.2, '天黑以后，岸边的灯笼和三重橹一起亮起来。'],
  [15.6, 18.6, '观樱会从 1926 年办到现在，已经一百多届。'],
];
const HEADER = {title: '高田夜樱', place: '新潟县上越市', story: STORY, sheen: [60, 160, W - 120, 420], storyColor: P.narr, accent: P.accent};
const LINE1 = 1458, LINE2 = 1518;
const HL = {size: 68, weight: 300, sp: 8}, SUBT = {size: 30, weight: 300, sp: 2};
function rich(segs, y) {
  const ws = segs.map(([s]) => measure(s, HL.size, HL.weight, HL.sp) + HL.sp);
  let x = (W - ws.reduce((p, q) => p + q, 0) + HL.sp) / 2;
  segs.forEach(([s, key], i) => { text(s, x, y, HL.size, key ? P.key : P.head, HL.weight, 'left', HL.sp); x += ws[i]; });
}
function headline(s, segs, sub) {                                 // 中下方的大字：和长冈、汤泽一样的极简写法
  rise(s, () => {
    g.shadowColor = 'rgba(6,4,16,.6)'; g.shadowBlur = 12;
    rich(segs, LINE1);
    if (sub) text(sub, W / 2, LINE2 + 6, SUBT.size, P.sub, SUBT.weight, 'center', SUBT.sp);
    g.shadowColor = 'transparent'; g.shadowBlur = 0;
  });
}
const TEXT_WINDOWS = [[18.9, 3.2], [3.9, 7.4], [8.0, 11.3], [15.6, 18.6]];
const HEADLINES = [
  [[['日本三大', 0], ['夜樱', 1]], '高田城址公园 三重橹'],             // 第 0 秒就在画面上（封面）
  [[['约 ', 0], ['4,000', 1], [' 棵樱花', 0]], '沿着护城河 走在花底下'],
  [[['灯一亮 樱花在', 0], ['水里', 1], ['再开一遍', 0]], ''],
  [[['风一吹 护城河铺满', 0], ['花瓣', 1]], ''],
];

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const C = camAt(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#080c24'; g.fillRect(0, 0, W, H);
  g.setTransform(C.z, 0, 0, C.z, W / 2 - C.x * C.z, H / 2 - C.y * C.z);
  g.drawImage(sky, 0, 0, W, SKY_H);
  drawWater(t);
  g.drawImage(far, 0, FAR_Y0, W, FAR_Y1 - FAR_Y0);
  drawDrift(t);
  g.drawImage(nearC, 0, NEAR_Y0, W, WH - NEAR_Y0);
  drawWalkers(t);
  drawGust(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(verticalSprite('topscrim120', [[0, [4, 6, 20, 120]], [1, [4, 6, 20, 0]]]), 0, 0, W, 560);
  drawHeader(t, {light: .35, lc: [255, 214, 225], x: W * .6}, HEADER);
  TEXT_WINDOWS.forEach(([a, b], i) => headline(scene(t, a, b), ...HEADLINES[i]));
}
boot(render);
</script>
