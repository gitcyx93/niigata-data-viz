// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。

// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒

const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;

  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;

function verticalSprite(key, stops) {                 // 竖直方向的渐变条：stops = [[位置0~1, [r,g,b,a]], ...]

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========

// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {

// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动

function line(parts, y) {

}

  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;

}

// ---- 字号和字重：极简风格，靠大小和粗细拉开层次 ----
// [字号, 字重, 字距]
const TS = () => ({num: [140, 200, -4], name: [68, 300, 8], word: [112, 200, 30], unit: [40, 300, 2], sub: [30, 300, 2]});

// ======== 左上角：讲故事的小字 ========
// 小字是「背景知识」：比大字小，前面一根竖细线；一个字一个字慢慢浮现，说完淡出。
// 字号偏大、中等字重，一律带柔和的深色字影，叠在任何背景上都看得清、也有一点立体感。一句太长时自动缩小字号。
// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
const STORY_SHADOW = 'rgba(4,6,16,.85)';
function drawStory(t, story, color = NARRATION, bar = TYPE.accent, shadow = STORY_SHADOW) {
  story.forEach(([from, to, s]) => {

}

// ======== 标题：镜面金属字（全系列统一）========

//  - 被场景里的光照出一块柔和的高光，位置、颜色跟着光源走，亮度有上限

const TX = 30, TB = 190;                 // 标题在缓存画布里的位置

function titleLayer(key, paint) {

    const x = c.getContext('2d');

}
const titleWork = document.createElement('canvas'); titleWork.width = 860; titleWork.height = 300;
const mask = () => titleLayer('mask', x => { x.fillStyle = '#fff'; x.fillText(titleText, TX, TB); });
const titleShadow = () => titleLayer('shadow', x => {
  x.shadowColor = 'rgba(0,0,0,.42)'; x.shadowBlur = 26; x.shadowOffsetY = 6; x.shadowOffsetX = 5000; x.fillStyle = '#000'; x.fillText(titleText, TX - 5000, TB);
});
const silver = () => titleLayer('silver', x => {
  const top = TB - 112, m = x.createLinearGradient(0, top, 0, TB + 12);
  m.addColorStop(0, '#f8fafd'); m.addColorStop(.55, '#dce2eb'); m.addColorStop(1, '#b2bdcd');
  x.fillStyle = m; x.fillText(titleText, TX, TB);
});
const bevel = () => titleLayer('bevel', x => {
  x.fillStyle = 'rgba(255,255,255,.85)'; x.fillText(titleText, TX, TB - 2);          // 上沿亮边
  x.globalCompositeOperation = 'destination-out'; x.fillText(titleText, TX, TB);

});
// 外浮雕：把字形模糊一下当成高度，按「光从左上方照下来」算字外一圈的明暗：
// 左上方贴着字边一道细亮边，右下方一道柔和的暗边，字像从背景里微微凸出来。字面本身不变。
// 只在第一次用到时算一次，之后每帧贴图
function blurF(a, w, h, r) {                   // 三次盒式模糊 ≈ 高斯模糊

const relief = () => titleLayer('relief', x => {
  const w = 860, h = 300, m = mask().getContext('2d').getImageData(0, 0, w, h).data;

const sheen = document.createElement('canvas'); sheen.width = 96; sheen.height = 24;
// 标题区：NIIGATA + 地名 / 金属大标题 / 讲故事的小字

function drawHeader(t, L, header) {

  const narr = pick(header.storyColor) || NARRATION, accent = pick(header.accent) || TYPE.accent;

  w.globalCompositeOperation = 'source-over';

// 文字层底下的压暗：上面托住标题，下面托住大字（y0 ~ y0+h 的中间最暗）
function scrims(bandY = 1300, bandH = 320, top = 204, band = 158) {
  g.drawImage(verticalSprite('topscrim' + top, [[0, [1, 3, 12, top]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);

// ======== 播放和导出 ========
// render(t) 必须是确定性的：同一个 t 永远画出同一帧（逐帧录制靠这个）。?record 时不自动播放，等录制脚本调用。
async function loadFonts() {
  if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {
    const f = new FontFace(family, `url(data:font/woff2;base64,${b64})`, {weight, unicodeRange: range});
    document.fonts.add(f); return f.load();
  }));
}
// 视频从第几秒开始（循环是无缝的，从哪一秒开始都是完整的一圈）。页面里可以写 const START = 11.9;
// 把高潮放到视频的第一帧，不需要加速或压缩任何画面。网页播放和 record.js 导出都从这里开始。
function boot(render) {
  const start0 = typeof START === 'number' ? START : 0;
  window.render = render;
  window.LOOP_SECONDS = T;
  window.START_SECONDS = start0;
  const ready = loadFonts().catch(() => {});
  if (!params.has('record')) {
    ready.then(() => {
      const start = performance.now();
      const tick = () => { render(start0 + (performance.now() - start) / 1000); requestAnimationFrame(tick); };
      tick();
    });
  } else ready.then(() => { render(start0); window.READY = true; });
}

<script>// 高田夜樱（春）：上越市高田城址公园。三个场景，段落之间直切：

//   3.5–7.5  樱花隧道：站在护城河边的小路上往前走，头顶樱花连成拱，两边一排灯笼，人在散步
//   7.5–11.5 水面特写：一根花枝垂到水面，花瓣落下去荡开水纹，远处灯笼化成光斑

//   15–20    回到三重橹，河面上漂着花瓣，接回第 0 秒

// ======== 一棵樱花树（染井吉野）：树干短、几根粗枝往两边伸开，枝梢下垂，花开在细枝上 ========
// opt: {x, y（树根）, h（树干长）, lean（整体倾向，弧度）, depth, spread, droop（枝梢下垂的程度）, w（树干粗）,
//       fs（花的大小）, fn（每个花簇的花数）, cr（花簇半径）, seed, lamps（照亮它的灯）, sky（上沿被天光勾边）}

// 风：一大片花瓣从左边卷起来，斜着飘过护城河；落到水面的停在水上，慢慢漂走、变淡
const GUST = {t0: 11.6, t1: 15.4};
const GP = Array.from({length: 460}, (_, i) => ({d: R(i, 100) * 1.4, x0: -80 - R(i, 101) * 300, y0: 1150 + R(i, 102) * 1100, v: 420 + R(i, 103) * 420, lift: 80 + R(i, 104) * 260, s: 3 + R(i, 105) * 4, sp: (R(i, 106) - .5) * 9, land: WATER + 30 + R(i, 107) * (RH - 60)}));
function drawGust(t) {
  if (t < GUST.t0 || t > GUST.t1 + 4.6) return;
  const a = t - GUST.t0;
  GP.forEach(p => {
    const age = a - p.d; if (age < 0) return;
    let x = p.x0 + age * p.v, y = p.y0 - Math.sin(clamp(age / 2) * Math.PI * .8) * p.lift + age * age * 24;
    if (y > p.land && p.y0 < WATER + 200) {
      x = p.x0 + age * p.v * .25;
      if (t > GUST.t1 + 4.4) return;
      petal(((x % (W + 40)) + W + 40) % (W + 40), p.land, p.s, .4, .85 * clamp((GUST.t1 + 4.4 - t) / 1.5)); return;
    }
    if (x > W + 40) return;
    petal(x, y, p.s, age * p.sp, Math.min(1, age * 3) * .95);
  });
  g.globalAlpha = 1;
}

// ======== 镜头二：樱花隧道（站在护城河边的小路上往前走，有透视）========
const TUNNEL = (() => {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const x = c.getContext('2d');
  // 两种树（预先画好，按远近缩放贴上去）：左边一排往右上方伸，右边一排是镜像；树冠在头顶交叠成拱
  const TS = 1900, RX = 650, RY = 1500, trees = [0, 1].map(v => {
    const t = document.createElement('canvas'); t.width = t.height = TS; const b = t.getContext('2d');
    sakura(b, {x: RX, y: RY, h: 330, lean: .38 + v * .1, depth: 8, spread: .4, droop: .32, w: 46, fs: 26, fn: 10, cr: 40, seed: 70 + v, lamps: [[RX + 40, RY - 280, 420]], sky: true});
    return t;
  });
  const VP = [540, 900], K = 340, SP = 2.4;
  const P3 = (X, Y, Z) => [VP[0] + X * K / Z, VP[1] + Y * K / Z, K / Z];
  const T0 = 3.5, T1 = 7.5;
  const GROUND = Array.from({length: 320}, (_, i) => [(R(i, 350) - .5) * 4.2, R(i, 351) * 30, R(i, 352)]);
  const PEOPLE = [[-.6, 4, 1, -1], [.55, 5.5, .95, -1], [-.2, 8.5, 1.05, -1], [.9, 11, 1, -1], [.3, 14, .95, 1], [-.9, 7, 1, 1], [.1, 17, 1, -1]];
  function person(px, py, h, facing, step) {                   // 剪影：背对或面对镜头，靠灯的一侧有一道暖色轮廓
    x.fillStyle = '#100a12';
    x.beginPath(); x.ellipse(px, py - h * .92, h * .075, h * .085, 0, 0, TAU); x.fill();
    x.beginPath(); x.moveTo(px - h * .12, py - h * .8); x.quadraticCurveTo(px, py - h * .86, px + h * .12, py - h * .8); x.lineTo(px + h * .1, py - h * .36); x.lineTo(px - h * .1, py - h * .36); x.closePath(); x.fill();
    x.fillRect(px - h * .075 + step, py - h * .38, h * .06, h * .38); x.fillRect(px + h * .015 - step, py - h * .38, h * .06, h * .38);
    x.fillStyle = 'rgba(255,200,170,.35)'; x.fillRect(px + h * .1, py - h * .78, Math.max(1, h * .012), h * .4);
  }
  function render(t) {
    const d = (t - T0) * .85;
    x.setTransform(1, 0, 0, 1, 0, 0);
    x.drawImage(verticalSprite('tunsky', [[0, [10, 16, 50, 255]], [1, [56, 40, 84, 255]]]), 0, 0, W, VP[1]);
    x.drawImage(verticalSprite('tunground', [[0, [44, 30, 40, 255]], [1, [26, 20, 26, 255]]]), 0, VP[1], W, H - VP[1]);
    x.fillStyle = '#5a4848'; x.beginPath(); x.moveTo(VP[0] - 3, VP[1]); x.lineTo(VP[0] + 3, VP[1]); x.lineTo(VP[0] + 1.7 * K / .45, VP[1] + 2.2 * K / .45); x.lineTo(VP[0] - 1.7 * K / .45, VP[1] + 2.2 * K / .45); x.closePath(); x.fill();   // 小路
    x.globalCompositeOperation = 'lighter'; x.globalAlpha = .5; x.drawImage(radialSprite([255, 170, 200], 1.4), VP[0] - 420, VP[1] - 300, 840, 600); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';   // 远处的花和灯连成一片粉色的光
    GROUND.forEach(([X, Z0, r], i) => {                         // 路上落的花瓣
      const Z = ((Z0 - d) % 30 + 30) % 30 + .5, [px, py, sc] = P3(X, 2.2, Z); if (Z < .8 || py > H + 10) return;
      x.save(); x.translate(px, py); x.rotate(r * TAU); x.globalAlpha = .75 * clamp((26 - Z) / 8); x.drawImage(PETAL, -.04 * sc, -.05 * sc, .08 * sc, .1 * sc); x.restore();
    });
    x.globalAlpha = 1;
    const items = [];
    for (let n = 0; n < 13; n++) { const Z = (n + 1) * SP - (d % SP) + .3; if (Z > .6) items.push(Z); }
    items.sort((a, b) => b - a).forEach(Z => {
      const fog = clamp((Z - 4) / 26), near = clamp((Z - .7) / .9);
      [-1, 1].forEach(s => {
        const [lx, ly, ls] = P3(s * 1.85, .55, Z);              // 灯笼
        x.globalAlpha = 1 - fog * .6;
        x.fillStyle = '#2a1e1a'; x.fillRect(lx - .03 * ls, ly, .06 * ls, 1.65 * ls);
        x.fillStyle = '#fff2dc'; x.fillRect(lx - .17 * ls, ly - .44 * ls, .34 * ls, .44 * ls);
        x.fillStyle = '#d23a2e'; x.fillRect(lx - .17 * ls, ly - .44 * ls, .34 * ls, .06 * ls); x.fillRect(lx - .17 * ls, ly - .06 * ls, .34 * ls, .06 * ls);
        x.fillStyle = '#e88aa8'; x.beginPath(); x.arc(lx, ly - .22 * ls, .06 * ls, 0, TAU); x.fill();
        x.globalCompositeOperation = 'lighter'; x.globalAlpha = .45 * (1 - fog); x.drawImage(radialSprite([255, 210, 160], 1.6), lx - ls * .9, ly - .22 * ls - ls * .7, ls * 1.8, ls * 1.4); x.globalCompositeOperation = 'source-over';
        const [tx, ty, ts] = P3(s * 2.7, 2.25, Z), size = 7.8 * ts;   // 树：根在路边，树冠伸到路中间上方
        x.globalAlpha = (1 - fog * .75) * near;
        x.save(); x.translate(tx, ty); x.scale(s, 1); x.drawImage(trees[(Math.round(Z * 7) + (s > 0 ? 1 : 0)) % 2], -RX / TS * size, -RY / TS * size, size, size); x.restore();
      });
    });
    x.globalAlpha = 1;
    PEOPLE.forEach(([X, Z0, sz, dir], i) => {                   // 散步的人：有的往前走（背对镜头），有的迎面走来
      const Z = Z0 - d * (dir < 0 ? .55 : 1.5); if (Z < 1.3 || Z > 26) return;
      const [px, py, sc] = P3(X, 2.2, Z);
      person(px, py, 1.65 * sz * sc, dir, Math.sin((t - T0) * 7 + i) * .03 * sc);
    });
    for (let i = 0; i < 46; i++) {                              // 离镜头很近的花瓣
      const u = fract(R(i, 360) + (t - T0) * (.12 + R(i, 361) * .1)), px = R(i, 362) * W + Math.sin(u * 9 + i) * 40, py = u * H;
      petal(px, py, 4 + R(i, 363) * 4, u * 12 + i, .85, x);
    }
    x.globalAlpha = 1;
    return c;
  }
  return {t0: T0, t1: T1, render};
})();

// ======== 镜头三：水面特写（一根樱花枝垂到水面，花瓣落下去荡开水纹，远处的灯笼化成光斑）========
const CLOSE = (() => {
  const T0 = 7.5, T1 = 11.5, WL = 1100;
  const top = hiCanvas(W, WL, 1.5);
  (() => { const b = hiCtx(top);
    b.drawImage(verticalSprite('csky', [[0, [10, 12, 36, 255]], [1, [30, 28, 62, 255]]]), 0, 0, W, WL);
    b.drawImage(verticalSprite('cbank', [[0, [18, 22, 40, 0]], [1, [18, 22, 40, 255]]]), 0, WL - 260, W, 260);   // 对岸（虚的，往上渐渐融进夜色）
    for (let i = 0; i < 16; i++) { const lx = R(i, 380) * W, ly = WL - 60 - R(i, 381) * 260, r = 24 + R(i, 382) * 46; glowB(b, i % 3 ? [255, 210, 160] : [255, 170, 200], .28 + R(i, 383) * .2, lx, ly, r, r, 6); }   // 远处的灯笼和樱花，失焦成光斑
    sakura(b, {x: -60, y: 260, h: 260, lean: 1.38, depth: 6, spread: .5, droop: .55, w: 30, fs: 44, fn: 7, cr: 52, seed: 90, lamps: [[700, 1000, 520]], sky: true});
  })();
  const ripples = Array.from({length: 7}, (_, i) => ({t: T0 + .3 + i * .55 + R(i, 330) * .2, x: 180 + R(i, 331) * 760, y: WL + 140 + R(i, 332) * 560}));
  function render(t) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(top, 0, 0, W, WL);
    g.fillStyle = '#080a20'; g.fillRect(0, WL, W, H - WL);
    for (let y = 0; y < H - WL; y += 6) {
      const off = Math.sin(t * 2.4 + y * .045) * (1.5 + y * .01), sy = WL - y - 6; if (sy < 0) break;
      g.save(); g.translate(off, WL + y + 6); g.scale(1, -1); g.drawImage(top, 0, sy * 1.5, W * 1.5, 6 * 1.5, 0, 0, W, 6); g.restore();
    }
    g.drawImage(verticalSprite('cwater', [[0, [8, 10, 32, 90]], [1, [4, 6, 18, 210]]]), 0, WL, W, H - WL);
    ripples.forEach(r => {
      const a = t - r.t; if (a < -.6 || a > 2.2) return;
      if (a < 0) { petal(r.x + a * 30, r.y + a * 260, 8, a * 6, .95); g.globalAlpha = 1; return; }
      petal(r.x + Math.sin(a) * 6, r.y, 8, .3, .95); g.globalAlpha = 1;
      for (let k = 0; k < 3; k++) { const q = a - k * .25; if (q < 0) continue; const rr = 10 + q * 90; g.strokeStyle = `rgba(255,226,236,${.5 * clamp(1 - q / 2)})`; g.lineWidth = 2; g.beginPath(); g.ellipse(r.x, r.y, rr, rr * .3, 0, 0, TAU); g.stroke(); }
    });
    for (let i = 0; i < 26; i++) {
      const u = fract(R(i, 340) + (t - T0) * (.1 + R(i, 341) * .08)), px = R(i, 342) * W + Math.sin(u * 8 + i) * 50, py = u * (WL + 300);
      petal(px, py, 6 + R(i, 343) * 4, u * 10 + i, .9);
    }
    g.globalAlpha = 1;
  }
  return {t0: T0, t1: T1, render};
})();

// ======== 全景的镜头 ========
// [时间, 中心 y, 放大倍数]；3.5–11.5 是两个直切进来的近景，这时全景不显示
const COVER = [1240, 1.0];
const KEYS = [
  [0, ...COVER], [3.5, 1300, 1.04],        // ① 三重橹、樱花、倒影
  [11.5, 1560, 1.45],                       // ③ 直切回全景，从水面开始
  [15.0, 1380, 1.04],                       // ④ 风来了，镜头慢慢往上拉（高潮）
  [20, ...COVER],                           // ⑤ 回到第 0 秒
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t >= KEYS[i + 1][0]) i++;
  if (t >= 3.5 && t < 11.5) i = 1;
  const [t0, y0, z0] = KEYS[i], [t1, y1, z1] = KEYS[i + 1], k = ease(clamp((t - t0) / (t1 - t0)));
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hh = H / 2 / z;
  return {x: W / 2, y: clamp(lerp(y0, y1, k), hh, WH - hh), z};
}

// ======== 文字 ========
const P = {head: '#fff6f8', key: '#ffb3c9', sub: 'rgba(255,232,240,.9)', narr: 'rgba(255,232,240,.92)', accent: '#f2a6bf'};
const STORY = [
  [0.2, 3.2, '每年 4 月，高田城址公园办观樱会。'],
  [3.9, 7.3, '在日本人里很有名的赏樱地，外国游客还不多。'],
  [8.0, 11.2, '天黑以后，岸边的灯笼和三重橹一起亮起来。'],
  [15.6, 18.6, '观樱会从 1926 年办到现在，已经一百多届。'],
];
const HEADER = {title: '高田夜樱', place: '新潟县上越市', story: STORY, sheen: [60, 160, W - 120, 420], storyColor: P.narr, accent: P.accent};
const LINE1 = 1458, LINE2 = 1518;
const HL = {size: 68, weight: 300, sp: 8}, SUBT = {size: 30, weight: 300, sp: 2};
function rich(segs, y) {
  const ws = segs.map(([s]) => measure(s, HL.size, HL.weight, HL.sp) + HL.sp);
  let x = (W - ws.reduce((p, q) => p + q, 0) + HL.sp) / 2;
  segs.forEach(([s, key], i) => { text(s, x, y, HL.size, key ? P.key : P.head, HL.weight, 'left', HL.sp); x += ws[i]; });
}
function headline(s, segs, sub) {                                 // 中下方的大字：和长冈、汤泽一样的极简写法
  rise(s, () => {
    g.shadowColor = 'rgba(6,4,16,.6)'; g.shadowBlur = 12;
    rich(segs, LINE1);
    if (sub) text(sub, W / 2, LINE2 + 6, SUBT.size, P.sub, SUBT.weight, 'center', SUBT.sp);
    g.shadowColor = 'transparent'; g.shadowBlur = 0;
  });
}
const TEXT_WINDOWS = [[18.9, 3.2], [3.9, 7.4], [8.0, 11.3], [15.6, 18.6]];
const HEADLINES = [
  [[['日本三大', 0], ['夜樱', 1]], '高田城址公园 三重橹'],             // 第 0 秒就在画面上（封面）
  [[['约 ', 0], ['4,000', 1], [' 棵樱花', 0]], '沿着护城河 走在花底下'],
  [[['灯一亮 樱花在', 0], ['水里', 1], ['再开一遍', 0]], ''],
  [[['风一吹 护城河铺满', 0], ['花瓣', 1]], ''],
];

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const C = camAt(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#080c24'; g.fillRect(0, 0, W, H);
  if (t >= TUNNEL.t0 && t < TUNNEL.t1) g.drawImage(TUNNEL.render(t), 0, 0);
  else if (t >= CLOSE.t0 && t < CLOSE.t1) CLOSE.render(t);
  else {
    g.setTransform(C.z, 0, 0, C.z, W / 2 - C.x * C.z, H / 2 - C.y * C.z);
    g.drawImage(sky, 0, 0, W, SKY_H);
    drawWater(t);
    g.drawImage(far, 0, FAR_Y0, W, FAR_Y1 - FAR_Y0);
    drawDrift(t);
    g.drawImage(nearC, 0, NEAR_Y0, W, WH - NEAR_Y0);
    drawWalkers(t);
    drawGust(t);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(verticalSprite('topscrim120', [[0, [4, 6, 20, 120]], [1, [4, 6, 20, 0]]]), 0, 0, W, 560);
  drawHeader(t, {light: .35, lc: [255, 214, 225], x: W * .6}, HEADER);
  TEXT_WINDOWS.forEach(([a, b], i) => headline(scene(t, a, b), ...HEADLINES[i]));
}
boot(render);
</script>
