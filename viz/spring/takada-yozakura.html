// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;

function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(N, N), d = img.data;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;
    d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = Math.round(255 * Math.pow(Math.max(0, 1 - r), falloff));
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function verticalSprite(key, stops) {                 // 竖直方向的渐变条：stops = [[位置0~1, [r,g,b,a]], ...]
  if (sprites[key]) return sprites[key];
  const N = 512, c = document.createElement('canvas'); c.width = 1; c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(1, N), d = img.data;
  for (let j = 0; j < N; j++) {
    const u = (j + .5) / N; let k = 0; while (k < stops.length - 2 && u > stops[k + 1][0]) k++;
    const [u0, a] = stops[k], [u1, b] = stops[k + 1], f = clamp((u - u0) / (u1 - u0));
    for (let n = 0; n < 4; n++) d[j * 4 + n] = Math.round(a[n] + (b[n] - a[n]) * f);
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function glowAt(rgb, alpha, x, y, rx, ry = rx, falloff) {
  if (alpha <= .002) return;
  g.globalAlpha = Math.min(1, alpha); g.drawImage(radialSprite(rgb, falloff), x - rx, y - ry, rx * 2, ry * 2); g.globalAlpha = 1;
}
const hsl2rgb = (h, s, l) => {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => 255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========
// 繁体版（<html lang="zh-TW">）自动换成思源黑体繁体
const TC = document.documentElement.lang === 'zh-TW';
const FONTS = TC ? {
  cjk:   '"Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',
  latin: '"Sora","Source Han Sans TC",sans-serif',
} : {
  cjk:   '"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',
  latin: '"Sora","Source Han Sans SC",sans-serif',

// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {
  g.font = `${weight} ${size}px ${FONTS[fam]}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function resetSpacing(c = g) { if ('letterSpacing' in c) c.letterSpacing = '0px'; }
function measure(s, size, weight = 400, spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  setFont(size, weight, spacing, fam); const w = g.measureText(s).width - spacing; resetSpacing(); return w;
}
function text(s, x, y, size, color, weight = 400, align = 'left', spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  const w = measure(s, size, weight, spacing, fam);
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  setFont(size, weight, spacing, fam); g.textAlign = 'left'; g.fillStyle = color; g.fillText(s, left, y); resetSpacing();
  return w;
}
// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {
  const ws = parts.map(([s, size, , wt = 400, sp = 0, slot]) => measure(slot || s, size, wt, sp));
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, wt = 400, sp = 0, slot], i) => {
    text(s, slot ? x + ws[i] : x, y, size, color, wt, slot ? 'right' : 'left', sp); x += ws[i];
  });
  return ws.reduce((a, b) => a + b, 0);
}
function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;
  return {p: from > to && t < to ? 1 : easeOut(age / .55), out: clamp((dur - age) / .35), age};
}
function rise(s, draw) {
  if (!s) return;
  g.save(); g.globalAlpha = s.out * s.p; g.translate(0, (1 - s.p) * 40); draw(); g.restore();
}

// ---- 字号和字重：极简风格，靠大小和粗细拉开层次 ----
// [字号, 字重, 字距]
const TS = () => ({num: [140, 200, -4], name: [68, 300, 8], word: [112, 200, 30], unit: [40, 300, 2], sub: [30, 300, 2]});

// ======== 左上角：讲故事的小字 ========
// 小字是「背景知识」：比大字小，前面一根竖细线；一个字一个字慢慢浮现，说完淡出。
// 字号偏大、中等字重，一律带柔和的深色字影，叠在任何背景上都看得清、也有一点立体感。一句太长时自动缩小字号。
// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
const STORY_SHADOW = 'rgba(4,6,16,.85)';
function drawStory(t, story, color = NARRATION, bar = TYPE.accent, shadow = STORY_SHADOW) {
  story.forEach(([from, to, s]) => {
    if (t < from || t > to) return;
    const out = clamp((to - t) / .5), y = 480;
    let size = 38; while (size > 30 && measure(s, size, 500, 1.5) > 900) size--;
    g.globalAlpha = out * clamp((t - from) / .3);
    g.fillStyle = bar; g.fillRect(80, y - 33, 3, 44);          // 竖细线：提示「这是旁白」
    setFont(size, 500, 1.5); g.textAlign = 'left';
    g.shadowColor = shadow || STORY_SHADOW; g.shadowBlur = 9; g.shadowOffsetY = 1;
    let x = 102;
    [...s].forEach((c, i) => {
      const p = clamp((t - from - i * .05) / .45);           // 每个字晚 0.05 秒出现
      if (p > 0) { g.globalAlpha = ease(p) * out; g.fillStyle = color; g.fillText(c, x, y + 8 * (1 - ease(p))); g.fillText(c, x, y + 8 * (1 - ease(p))); }   // 叠两次，字影更实
      x += g.measureText(c).width;
    });
    g.globalAlpha = 1; g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; resetSpacing();
  });
}

// ======== 标题：镜面金属字（全系列统一）========
//  - 底色是接近白色的哑光银，从上到下平滑地由亮变暗（不要中间一道暗色「地平线」，在大字上会看成一条横线）
//  - 字面映出此刻的场景：截一块画面、上下翻转、缩到很小（相当于金属表面的模糊），以「柔光」叠上去，是一层光泽而不是清晰的倒影
//  - 倒角：上沿一道亮边、下沿一道暗边，让字有厚度；字外一圈外浮雕；下面一层很轻的投影
//  - 被场景里的光照出一块柔和的高光，位置、颜色跟着光源走，亮度有上限
// 不变的几层只画一次；每帧只在一张小画布上贴几次图
const TX = 30, TB = 190;                 // 标题在缓存画布里的位置
const titleLayers = {};
let titleText = '';
function titleLayer(key, paint) {
  if (!titleLayers[key]) {
    const c = document.createElement('canvas'); c.width = 860; c.height = 300;
    const x = c.getContext('2d');
    x.font = `800 132px ${FONTS.cjk}`; if ('letterSpacing' in x) x.letterSpacing = '6px';
    paint(x); titleLayers[key] = c;
  }
  return titleLayers[key];
}
const titleWork = document.createElement('canvas'); titleWork.width = 860; titleWork.height = 300;
const mask = () => titleLayer('mask', x => { x.fillStyle = '#fff'; x.fillText(titleText, TX, TB); });
const titleShadow = () => titleLayer('shadow', x => {
  x.shadowColor = 'rgba(0,0,0,.42)'; x.shadowBlur = 26; x.shadowOffsetY = 6; x.shadowOffsetX = 5000; x.fillStyle = '#000'; x.fillText(titleText, TX - 5000, TB);
});
const silver = () => titleLayer('silver', x => {
  const top = TB - 112, m = x.createLinearGradient(0, top, 0, TB + 12);
  m.addColorStop(0, '#f8fafd'); m.addColorStop(.55, '#dce2eb'); m.addColorStop(1, '#b2bdcd');
  x.fillStyle = m; x.fillText(titleText, TX, TB);
});
const bevel = () => titleLayer('bevel', x => {
  x.fillStyle = 'rgba(255,255,255,.85)'; x.fillText(titleText, TX, TB - 2);          // 上沿亮边
  x.globalCompositeOperation = 'destination-out'; x.fillText(titleText, TX, TB);
  x.globalCompositeOperation = 'source-over'; x.fillStyle = 'rgba(18,26,44,.45)'; x.fillText(titleText, TX, TB + 2.5);   // 下沿暗边
  x.globalCompositeOperation = 'destination-in'; x.fillText(titleText, TX, TB);
});
// 外浮雕：把字形模糊一下当成高度，按「光从左上方照下来」算字外一圈的明暗：
// 左上方贴着字边一道细亮边，右下方一道柔和的暗边，字像从背景里微微凸出来。字面本身不变。
// 只在第一次用到时算一次，之后每帧贴图
function blurF(a, w, h, r) {                   // 三次盒式模糊 ≈ 高斯模糊
  const tmp = new Float32Array(w * h), n = 2 * r + 1;
  for (let k = 0; k < 3; k++) {
    for (let y = 0; y < h; y++) {
      let acc = 0; const o = y * w;
      for (let x = -r; x <= r; x++) acc += a[o + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc / n; acc += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) { a[y * w + x] = acc / n; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
  }

}
const RELIEF = {r: 2, k: 7, hi: .55, lo: .85};     // 坡宽、坡度、亮边和暗边的强度
const relief = () => titleLayer('relief', x => {
  const w = 860, h = 300, m = mask().getContext('2d').getImageData(0, 0, w, h).data;
  const Hm = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) Hm[i] = m[i * 4 + 3] / 255;
  blurF(Hm, w, h, RELIEF.r);
  const L = [-.5, -.7, .5], ll = Math.hypot(...L); L[0] /= ll; L[1] /= ll; L[2] /= ll;
  const img = x.createImageData(w, h), d = img.data;
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    const i = y * w + xx, out = 1 - m[i * 4 + 3] / 255;
    if (!out) continue;
    const gx = (Hm[i + 1] - Hm[i - 1]) / 2 * RELIEF.k, gy = (Hm[i + w] - Hm[i - w]) / 2 * RELIEF.k;
    const sh = (-gx * L[0] - gy * L[1] + L[2]) / Math.hypot(gx, gy, 1) - L[2];
    if (Math.abs(sh) < .004) continue;
    const j = i * 4, v = Math.min(1, Math.abs(sh) * 1.6);
    if (sh > 0) { d[j] = d[j + 1] = d[j + 2] = 255; d[j + 3] = v * RELIEF.hi * out * 255; }
    else { d[j] = 6; d[j + 1] = 8; d[j + 2] = 14; d[j + 3] = v * RELIEF.lo * out * 255; }
  }
  x.putImageData(img, 0, 0);
});
const sheen = document.createElement('canvas'); sheen.width = 96; sheen.height = 24;
// 标题区：NIIGATA + 地名 / 金属大标题 / 讲故事的小字
// header = {title, place, story, sheen: [x, y, w, h]（字面映出的那块画面，只取天空，不要深色的山）,
//           可选 storyColor / accent：小字和 NIIGATA、竖线的颜色（固定值或 t => 颜色）；
//           storyShadow: 旁白小字的字影颜色（背景亮时用）；
//           reflect: false 关掉字面的反射和高光（如冬季标题上已经有落雪，再反光就太花）}
// L = {light: 光的强度, lc: [r,g,b] 光的颜色, x: 光的水平位置}
function drawHeader(t, L, header) {
  titleText = header.title;
  const pick = v => typeof v === 'function' ? v(t) : v;      // 颜色可以是固定值，也可以随时间变（如跟着故事由冷变暖）
  const narr = pick(header.storyColor) || NARRATION, accent = pick(header.accent) || TYPE.accent;
  const ew = text('NIIGATA', 80, 262, 26, accent, 500, 'left', 8);
  text(header.place, 80 + ew + 22, 262, 26, narr, 400, 'left', 4);
  const X = 74 - TX, Y = 404 - TB;
  g.drawImage(titleShadow(), X, Y);
  g.drawImage(relief(), X, Y);
  const w = titleWork.getContext('2d');
  w.setTransform(1, 0, 0, 1, 0, 0); w.globalCompositeOperation = 'source-over'; w.globalAlpha = 1; w.clearRect(0, 0, 860, 300);
  w.drawImage(silver(), 0, 0);
  const reflect = header.reflect !== false;
  if (reflect) {                                             // 字面映出场景的光泽
    const sc = sheen.getContext('2d');
    sc.setTransform(1, 0, 0, -1, 0, 24);
    sc.drawImage(cv, ...header.sheen, 0, 0, 96, 24);
    w.imageSmoothingEnabled = true; w.imageSmoothingQuality = 'high';
    w.globalCompositeOperation = 'soft-light'; w.drawImage(sheen, TX - 20, TB - 130, 660, 160);
    w.globalCompositeOperation = 'lighter'; w.globalAlpha = .35; w.drawImage(sheen, TX - 20, TB - 130, 660, 160);
    w.globalAlpha = 1;
  }
  if (reflect && L.light > .03) {                                       // 高光：跟着光源的位置和颜色
    const hx = TX + clamp(L.x / W) * 600;
    w.globalCompositeOperation = 'source-over'; w.globalAlpha = Math.min(.5, L.light * .38);
    w.drawImage(radialSprite(L.lc, 1.3), hx - 280, TB - 190, 560, 240);
    w.globalAlpha = 1;
  }
  w.globalCompositeOperation = 'destination-in'; w.drawImage(mask(), 0, 0);
  w.globalCompositeOperation = 'source-over';
  w.drawImage(bevel(), 0, 0);
  g.drawImage(titleWork, X, Y);
  drawStory(t, header.story, narr, accent, pick(header.storyShadow));
}
// 文字层底下的压暗：上面托住标题，下面托住大字（y0 ~ y0+h 的中间最暗）
function scrims(bandY = 1300, bandH = 320, top = 204, band = 158) {
  g.drawImage(verticalSprite('topscrim' + top, [[0, [1, 3, 12, top]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.drawImage(verticalSprite('band' + band, [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, band]], [1, [1, 3, 12, 0]]]), 0, bandY, W, bandH);
}

// ======== 播放和导出 ========
// render(t) 必须是确定性的：同一个 t 永远画出同一帧（逐帧录制靠这个）。?record 时不自动播放，等录制脚本调用。
async function loadFonts() {
  if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {
    const f = new FontFace(family, `url(data:font/woff2;base64,${b64})`, {weight, unicodeRange: range});
    document.fonts.add(f); return f.load();
  }));
}
// 视频从第几秒开始（循环是无缝的，从哪一秒开始都是完整的一圈）。页面里可以写 const START = 11.9;
// 把高潮放到视频的第一帧，不需要加速或压缩任何画面。网页播放和 record.js 导出都从这里开始。
function boot(render) {
  const start0 = typeof START === 'number' ? START : 0;
  window.render = render;
  window.LOOP_SECONDS = T;
  window.START_SECONDS = start0;
  const ready = loadFonts().catch(() => {});
  if (!params.has('record')) {
    ready.then(() => {
      const start = performance.now();
      const tick = () => { render(start0 + (performance.now() - start) / 1000); requestAnimationFrame(tick); };
      tick();
    });
  } else ready.then(() => { render(start0); window.READY = true; });
}
/*SERIES-END*/
</script>
<script>// 高田夜樱（春）：上越市高田城址公园。一张竖长的夜景，从上到下是蓝色的夜空、草坡上亮着灯的三重橹和对岸的樱花、
// 护城河和倒影、这边岸上的樱花隧道和灯笼小路（实际位置也是这样：隔着护城河看三重橹）。
// 镜头在这张场景里上下平移、推拉：
//   0–3.5    三重橹、樱花、护城河倒影（第 0 秒当封面）
//   3.5–7.5  往下移到这边岸上：樱花隧道下的小路、灯笼、散步的人
//   7.5–11.5 推到水面：对岸的灯笼和樱花在水里的倒影，花瓣一片片落进水里
//   11.5–15  一阵风，满树的花瓣卷起来飘过护城河，落在水面上（高潮，不放字）；镜头慢慢往上拉
//   15–20    回到三重橹和满河的花瓣，接回第 0 秒
const T = 20;
const WH = 2900;
const SS = 2;
const WATER = 1500, NEAR = 2120;                  // 护城河：对岸水边 → 这边岸边
const CASTLE = {x: 650, base: 1165};              // 三重橹（草坡顶上）
const FAR_Y0 = 700, FAR_Y1 = 1520;                // 远景层（对岸）的范围
const NEAR_Y0 = 1900;                             // 近景层（这边岸上）从这里往下
const PATH = 2560;                                // 樱花隧道下的小路

function hiCanvas(w, h, ss = SS) { const c = document.createElement('canvas'); c.width = Math.round(w * ss); c.height = Math.round(h * ss); c.w = w; c.h = h; c.ss = ss; return c; }
function hiCtx(c) { const x = c.getContext('2d'); x.setTransform(c.ss, 0, 0, c.ss, 0, 0); return x; }
const R = (i, k) => rnd(i * 1.31 + .17, k * 2.71 + .5);
function glowB(b, rgb, a, x, y, rx, ry = rx, f = 1.6) { b.globalAlpha = a; b.drawImage(radialSprite(rgb, f), x - rx, y - ry, rx * 2, ry * 2); b.globalAlpha = 1; }

// ======== 天空：日落后的蓝色时刻 ========
const SKY_H = 1520;
const sky = hiCanvas(W, SKY_H, 1.5);
(() => {
  const b = hiCtx(sky);
  b.drawImage(verticalSprite('tsky', [[0, [8, 14, 48, 255]], [.45, [22, 40, 104, 255]], [.8, [52, 70, 140, 255]], [1, [88, 84, 150, 255]]]), 0, 0, W, SKY_H);
  for (let i = 0; i < 120; i++) { const x = R(i, 1) * W, y = R(i, 2) * 600; b.fillStyle = `rgba(230,236,255,${.12 + R(i, 3) * .35})`; b.fillRect(x, y, 1.4, 1.4); }
  // 远处的山（很淡）
  b.fillStyle = '#26306a'; b.beginPath(); b.moveTo(0, SKY_H);
  for (let x = 0; x <= W; x += 6) b.lineTo(x, 1030 - Math.sin(x / 170) * 26 - Math.sin(x / 61) * 9 - Math.max(0, 80 - Math.abs(x - 860) * .35));
  b.lineTo(W, SKY_H); b.closePath(); b.fill();
})();

// ======== 樱花 ========
const BLOSSOM = ['#fde9f0', '#f9d3e0', '#f4bcd0', '#efa7c1', '#ffffff', '#fbdde6'];
function lightAt(x, y, lamps) { let s = 0; lamps.forEach(([lx, ly, r]) => { const d = Math.hypot(x - lx, (y - ly) * 1.3); s += Math.exp(-d * d / (2 * r * r)); }); return clamp(s); }
function crown(b, cx, cy, rx, ry, n, seed, lamps, dim = 1) {    // 一棵樱花的树冠：几团花簇，先铺深一点的粉打底，再撒花点；靠灯的一面亮
  const lumps = Array.from({length: 7}, (_, k) => {
    const a = R(k, seed + 7) * TAU, r = Math.sqrt(R(k, seed + 8)) * .55;
    return [cx + Math.cos(a) * rx * r, cy + Math.sin(a) * ry * r * .8, rx * (.4 + R(k, seed + 9) * .22), ry * (.36 + R(k, seed + 10) * .2)];
  });
  lumps.forEach(([x, y, a, c]) => { b.globalAlpha = .75 * dim; b.fillStyle = '#7a4a6e'; b.beginPath(); b.ellipse(x, y, a * .85, c * .85, 0, 0, TAU); b.fill(); });
  for (let i = 0; i < n; i++) {
    const L = lumps[i % lumps.length], a = R(i, seed) * TAU, r = Math.sqrt(R(i, seed + 1)) * 1.08;
    const x = L[0] + Math.cos(a) * r * L[2], y = L[1] + Math.sin(a) * r * L[3];
    const lit = lightAt(x, y, lamps), k = clamp(lit * .7 + R(i, seed + 2) * .45);

    b.fillStyle = BLOSSOM[Math.min(BLOSSOM.length - 1, Math.floor((1 - k) * BLOSSOM.length))];
    b.beginPath(); b.arc(x, y, 2.4 + R(i, seed + 3) * 3.2, 0, TAU); b.fill();

}
function branch(b, x0, y0, x1, y1, w) {                         // 黑色的枝干，弯弯地伸出去

// ======== 三重橹 ========
function drawCastle(b) {
  const {x, base} = CASTLE;
  const wall = '#ece0c4', roof = '#343a48', edge = '#7f889a';

    b.fillStyle = wall; b.fillRect(x - w / 2, y - h, w, h);
    b.fillStyle = '#2a2f3a'; for (let k = 0; k < Math.floor(w / 46); k++) b.fillRect(x - w / 2 + 18 + k * 46, y - h * .62, 14, h * .3);   // 窗
    b.fillStyle = roof; b.beginPath();
    b.moveTo(x - rw / 2 - 10, y - h + 4); b.quadraticCurveTo(x - rw / 2 + 20, y - h + 2, x - w / 2 + 6, y - h - rh);
    b.lineTo(x + w / 2 - 6, y - h - rh); b.quadraticCurveTo(x + rw / 2 - 20, y - h + 2, x + rw / 2 + 10, y - h + 4);
    b.lineTo(x + rw / 2 - 4, y - h + 12); b.lineTo(x - rw / 2 + 4, y - h + 12); b.closePath(); b.fill();
    b.strokeStyle = 'rgba(120,130,150,.35)'; b.lineWidth = 1; for (let k = 1; k < 4; k++) { const yy = y - h - rh * k / 4; b.beginPath(); b.moveTo(x - w / 2 - (rw - w) / 2 * (1 - k / 4), yy); b.lineTo(x + w / 2 + (rw - w) / 2 * (1 - k / 4), yy); b.stroke(); }
    b.fillStyle = 'rgba(40,30,60,.18)'; b.fillRect(x + w * .1, y - h, w * .4, h);   // 右半边背光，暗一点
    b.strokeStyle = edge; b.lineWidth = 2; b.beginPath(); b.moveTo(x - rw / 2 - 10, y - h + 4); b.quadraticCurveTo(x - rw / 2 + 20, y - h + 2, x - w / 2 + 6, y - h - rh); b.stroke();
    b.beginPath(); b.moveTo(x + rw / 2 + 10, y - h + 4); b.quadraticCurveTo(x + rw / 2 - 20, y - h + 2, x + w / 2 - 6, y - h - rh); b.stroke();
    if (top) {                                                    // 最上面：入母屋的三角山墙和屋脊上的鯱
      const ty = y - h - rh;
      b.fillStyle = roof; b.beginPath(); b.moveTo(x - w / 2 + 6, ty); b.lineTo(x - w * .28, ty - 42); b.lineTo(x + w * .28, ty - 42); b.lineTo(x + w / 2 - 6, ty); b.closePath(); b.fill();
      b.fillStyle = wall; b.beginPath(); b.moveTo(x - 30, ty - 2); b.lineTo(x, ty - 34); b.lineTo(x + 30, ty - 2); b.closePath(); b.fill();
      b.fillStyle = '#2a2f3a'; b.fillRect(x - w * .3, ty - 48, w * .6, 7);
      [-1, 1].forEach(d => { b.fillStyle = '#c9b06a'; b.beginPath(); b.ellipse(x + d * w * .29, ty - 54, 4, 9, d * .4, 0, TAU); b.fill(); });
    } else {                                                      // 中间层正面的小三角破风
      b.fillStyle = roof; b.beginPath(); b.moveTo(x - 34, y - h - rh + 2); b.lineTo(x, y - h - rh - 26); b.lineTo(x + 34, y - h - rh + 2); b.closePath(); b.fill();
      b.fillStyle = wall; b.beginPath(); b.moveTo(x - 18, y - h - rh); b.lineTo(x, y - h - rh - 16); b.lineTo(x + 18, y - h - rh); b.closePath(); b.fill();
    }

}

// 花瓣：平时从两岸的树上慢慢飘落；风来时一大片卷起来飘过护城河，落在水面上

const DRIFT = Array.from({length: 90}, (_, i) => ({x: R(i, 90) * W, y0: i % 2 ? 1150 : 2050, span: 500 + R(i, 91) * 300, ph: R(i, 92), k: 1 + (i % 2), sw: 20 + R(i, 93) * 30, s: 3 + R(i, 94) * 3}));

}
const GUST = {t0: 11.6, t1: 15.4};
const GP = Array.from({length: 420}, (_, i) => ({d: R(i, 100) * 1.4, x0: -80 - R(i, 101) * 300, y0: 1150 + R(i, 102) * 1200, v: 420 + R(i, 103) * 420, lift: 80 + R(i, 104) * 260, s: 3 + R(i, 105) * 4, sp: (R(i, 106) - .5) * 9, land: WATER + 30 + R(i, 107) * (RH - 60)}));

// ======== 镜头二：樱花隧道（站在小路上往前看，有透视，镜头慢慢往前走）========

const TUNNEL = (() => {

      b.globalAlpha = .55 + .45 * k; b.fillStyle = BLOSSOM[Math.min(5, Math.floor((1 - k) * 6))]; b.beginPath(); b.arc(px, py, 3 + R(i, 303) * 5, 0, TAU); b.fill(); }

  const T0 = 3.5, T1 = 7.5;

    x.setTransform(1, 0, 0, 1, 0, 0);

    x.drawImage(verticalSprite('tsky2', [[0, [10, 16, 52, 255]], [1, [30, 30, 70, 255]]]), 0, 0, W, VP[1]);
    const gpath = x.createLinearGradient(0, VP[1], 0, H); gpath.addColorStop(0, '#2a2028'); gpath.addColorStop(1, '#5a4a48');
    x.fillStyle = '#141018'; x.fillRect(0, VP[1], W, H - VP[1]);
    x.fillStyle = gpath; x.beginPath(); x.moveTo(VP[0] - 4, VP[1]); x.lineTo(VP[0] + 4, VP[1]); x.lineTo(W + 500, H + 200); x.lineTo(-500, H + 200); x.closePath(); x.fill();
    for (let n = 14; n >= 0; n--) {                   // 从远到近画：树干、灯笼、树冠
      const Z = (n + 1) * SP - (d % SP) + .6; if (Z < .7) continue;
      const nearFade = clamp((Z - .9) / .9);            // 太近的树冠放得太大会糊：经过头顶时淡出
      const fog = clamp((Z - 3) / 20);
      [-1, 1].forEach(s => {
        const [tx, ty0, sc] = P3(s * 2.4, 2.2, Z), [, ty1] = P3(s * 2.0, -1.4, Z);
        x.strokeStyle = '#1c1218'; x.lineWidth = Math.max(1, .22 * sc); x.lineCap = 'round';
        x.beginPath(); x.moveTo(tx, ty0); x.quadraticCurveTo(tx + s * .2 * sc, (ty0 + ty1) / 2, tx - s * .5 * sc, ty1); x.stroke();
        const [lx, ly, ls] = P3(s * 1.75, .3, Z);       // 灯笼
        x.fillStyle = '#2a1e1a'; x.fillRect(lx - .03 * ls, ly, .06 * ls, 1.9 * ls);
        x.fillStyle = '#fff2dc'; x.fillRect(lx - .16 * ls, ly - .42 * ls, .32 * ls, .42 * ls);
        x.fillStyle = '#d23a2e'; x.fillRect(lx - .16 * ls, ly - .42 * ls, .32 * ls, .06 * ls); x.fillRect(lx - .16 * ls, ly - .06 * ls, .32 * ls, .06 * ls);
        x.globalCompositeOperation = 'lighter'; x.globalAlpha = .5 * (1 - fog); x.drawImage(radialSprite([255, 210, 160], 1.6), lx - ls, ly - .21 * ls - ls * .8, ls * 2, ls * 1.6); x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
      });
      [[-2.3, -2.6], [2.3, -2.6], [0, -3.4]].forEach(([X, Y], k) => {   // 头顶的花拱：左右两团，中间一团连起来
        const [cx, cy, sc] = P3(X + (R(n, 310 + k) - .5) * .6, Y, Z), r = 2.3 * sc;

      if (fog > 0) { x.fillStyle = `rgba(16,14,40,${fog * .5})`; }
    }
    // 散步的人：背对镜头往前走（比镜头慢，越走越远）
    [[-.7, 4.2, .95], [.5, 5.0, 1], [.8, 7.5, .9], [-.3, 9.5, 1.05]].forEach(([X, Z0, s], i) => {
      const Z = Z0 - d * .55 + (t - T0) * .0; if (Z < 1.2) return;
      const [px, py, sc] = P3(X, 2.2, Z), h = 1.65 * s * sc, step = Math.sin((t - T0) * 7 + i) * .04 * sc;
      x.fillStyle = '#120c14';
      x.beginPath(); x.ellipse(px, py - h * .93, h * .07, h * .08, 0, 0, TAU); x.fill();
      x.beginPath(); x.moveTo(px - h * .11, py - h * .82); x.lineTo(px + h * .11, py - h * .82); x.lineTo(px + h * .09, py - h * .38); x.lineTo(px - h * .09, py - h * .38); x.closePath(); x.fill();
      x.fillRect(px - h * .07 + step, py - h * .4, h * .055, h * .4); x.fillRect(px + h * .015 - step, py - h * .4, h * .055, h * .4);
    });
    // 飘落的花瓣（离镜头近，大一点）
    for (let i = 0; i < 40; i++) {
      const u = fract(R(i, 320) + (t - T0) * (.12 + R(i, 321) * .1)), px = R(i, 322) * W + Math.sin(u * 9 + i) * 40, py = u * H;
      x.globalAlpha = .85; x.fillStyle = '#fbe1ea'; x.save(); x.translate(px, py); x.rotate(u * 12 + i); x.beginPath(); x.ellipse(0, 0, 5 + R(i, 323) * 4, 3, 0, 0, TAU); x.fill(); x.restore();
    }
    x.globalAlpha = 1;
    return c;
  }
  return {t0: T0, t1: T1, render};
})();

// ======== 镜头三：水面特写（一根樱花枝垂到水面，花瓣落下去荡开一圈圈水纹）========
const CLOSE = (() => {
  const T0 = 7.5, T1 = 11.5, WL = 1060;                           // 水面线
  const top = hiCanvas(W, WL, 1.5);
  (() => { const b = hiCtx(top);
    b.drawImage(verticalSprite('csky', [[0, [10, 14, 44, 255]], [1, [24, 30, 70, 255]]]), 0, 0, W, WL);
    glowB(b, [255, 200, 150], .25, 820, WL - 40, 360, 120);       // 对岸灯笼的光
    for (let i = 0; i < 9; i++) { const lx = 60 + i * 130; b.fillStyle = '#fff2dc'; b.fillRect(lx - 6, WL - 46, 12, 16); glowB(b, [255, 214, 160], .5, lx, WL - 38, 30); }
    branch(b, -40, 120, 700, 420, 26); branch(b, 300, 260, 620, 760, 12); branch(b, 520, 380, 900, 560, 10); branch(b, 640, 470, 760, 900, 7);
    const L = [[700, 1100, 520]];
    [[220, 260, 230, 150], [520, 420, 230, 160], [760, 560, 200, 140], [660, 820, 150, 170], [380, 600, 170, 130], [900, 700, 160, 120]].forEach(([cx, cy, rx, ry], i) => crown(b, cx, cy, rx, ry, 3600, 400 + i * 9, L));
  })();
  const ripples = Array.from({length: 7}, (_, i) => ({t: T0 + .3 + i * .55 + R(i, 330) * .2, x: 180 + R(i, 331) * 760, y: WL + 120 + R(i, 332) * 560}));
  function render(t) {
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(top, 0, 0, W, WL);
    g.fillStyle = '#080a20'; g.fillRect(0, WL, W, H - WL);
    for (let y = 0; y < H - WL; y += 6) {                        // 水里的倒影：上下翻转，分条晃动
      const off = Math.sin(t * 2.4 + y * .045) * (1.5 + y * .01);
      const sy = WL - y - 6; if (sy < 0) break;
      g.save(); g.translate(off, WL + y + 6); g.scale(1, -1); g.drawImage(top, 0, sy * 1.5, W * 1.5, 6 * 1.5, 0, 0, W, 6); g.restore();
    }
    g.drawImage(verticalSprite('cwater', [[0, [8, 10, 32, 90]], [1, [4, 6, 18, 210]]]), 0, WL, W, H - WL);
    ripples.forEach(r => {                                       // 花瓣落到水面：一圈圈水纹
      const a = t - r.t; if (a < -.6 || a > 2.2) return;
      if (a < 0) { petal(r.x + a * 30, r.y + a * 260, 6, a * 6, .9); g.globalAlpha = 1; return; }
      petal(r.x + Math.sin(a) * 6, r.y, 6, .3, .9); g.globalAlpha = 1;
      for (let k = 0; k < 3; k++) { const q = a - k * .25; if (q < 0) continue; const rr = 10 + q * 90; g.strokeStyle = `rgba(255,226,236,${.5 * clamp(1 - q / 2)})`; g.lineWidth = 2; g.beginPath(); g.ellipse(r.x, r.y, rr, rr * .3, 0, 0, TAU); g.stroke(); }
    });
    for (let i = 0; i < 26; i++) {                               // 慢慢飘落的花瓣
      const u = fract(R(i, 340) + (t - T0) * (.1 + R(i, 341) * .08)), px = R(i, 342) * W + Math.sin(u * 8 + i) * 50, py = u * (WL + 300);
      petal(px, py, 4 + R(i, 343) * 3, u * 10 + i, .85);
    }
    g.globalAlpha = 1;
  }
  return {t0: T0, t1: T1, render};
})();

// ======== 镜头 ========
// [时间, 中心 y, 放大倍数]
const COVER = [1240, 1.0];
const KEYS = [
  [0, ...COVER], [3.5, 1300, 1.04],        // ① 三重橹、樱花、倒影
  // 3.5–11.5 是两个直切进来的近景（樱花隧道、水面特写），这时全景不显示
  [11.5, 1560, 1.45],                       // ③ 直切回全景，从水面开始
  [15.0, 1380, 1.04],                       // ④ 风来了，镜头慢慢往上拉（高潮）
  [20, ...COVER],                           // ⑤ 回到第 0 秒
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t >= KEYS[i + 1][0]) i++;
  if (t >= 3.5 && t < 11.5) i = 1;
  const [t0, y0, z0] = KEYS[i], [t1, y1, z1] = KEYS[i + 1], k = ease(clamp((t - t0) / (t1 - t0)));
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hh = H / 2 / z;
  return {x: W / 2, y: clamp(lerp(y0, y1, k), hh, WH - hh), z};
}

// ======== 文字 ========
const P = {head: '#fff6f8', key: '#ffb3c9', sub: 'rgba(255,232,240,.9)', narr: 'rgba(255,232,240,.92)', accent: '#f2a6bf'};
const STORY = [
  [0.2, 3.2, '每年 4 月，高田城址公园办观樱会。'],
  [3.9, 7.3, '高田城是德川家康六子松平忠辉的居城。'],
  [8.0, 11.2, '天黑以后，岸边的灯笼和三重橹一起亮起来。'],
  [15.6, 18.6, '观樱会从 1926 年办到现在，已经一百多届。'],
];
const HEADER = {title: '高田夜樱', place: '新潟县上越市', story: STORY, sheen: [60, 160, W - 120, 420], storyColor: P.narr, accent: P.accent};
const LINE1 = 1458, LINE2 = 1518;
const HL = {size: 68, weight: 300, sp: 8}, SUBT = {size: 30, weight: 300, sp: 2};
function rich(segs, y) {
  const ws = segs.map(([s]) => measure(s, HL.size, HL.weight, HL.sp) + HL.sp);
  let x = (W - ws.reduce((p, q) => p + q, 0) + HL.sp) / 2;
  segs.forEach(([s, key], i) => { text(s, x, y, HL.size, key ? P.key : P.head, HL.weight, 'left', HL.sp); x += ws[i]; });
}
function headline(s, segs, sub) {                                 // 中下方的大字：和长冈、汤泽一样的极简写法
  rise(s, () => {
    g.shadowColor = 'rgba(6,4,16,.6)'; g.shadowBlur = 12;
    rich(segs, LINE1);
    if (sub) text(sub, W / 2, LINE2 + 6, SUBT.size, P.sub, SUBT.weight, 'center', SUBT.sp);
    g.shadowColor = 'transparent'; g.shadowBlur = 0;
  });
}
const TEXT_WINDOWS = [[18.9, 3.2], [3.9, 7.4], [8.0, 11.3], [15.6, 18.6]];
const HEADLINES = [
  [[['日本三大', 0], ['夜樱', 1]], '高田城址公园 三重橹'],             // 第 0 秒就在画面上（封面）
  [[['约 ', 0], ['4,000', 1], [' 棵樱花', 0]], '沿着护城河 走在花底下'],
  [[['灯一亮 樱花在', 0], ['水里', 1], ['再开一遍', 0]], ''],
  [[['风一吹 护城河铺满', 0], ['花瓣', 1]], ''],
];

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const C = camAt(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#080c24'; g.fillRect(0, 0, W, H);
  if (t >= TUNNEL.t0 && t < TUNNEL.t1) g.drawImage(TUNNEL.render(t), 0, 0);
  else if (t >= CLOSE.t0 && t < CLOSE.t1) CLOSE.render(t);
  else {
  g.setTransform(C.z, 0, 0, C.z, W / 2 - C.x * C.z, H / 2 - C.y * C.z);
  g.drawImage(sky, 0, 0, W, SKY_H);
  drawWater(t);
  g.drawImage(far, 0, FAR_Y0, W, FAR_Y1 - FAR_Y0);
  drawDrift(t);
  g.drawImage(nearC, 0, NEAR_Y0, W, WH - NEAR_Y0);
  drawWalkers(t);
  drawGust(t);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(verticalSprite('topscrim120', [[0, [4, 6, 20, 120]], [1, [4, 6, 20, 0]]]), 0, 0, W, 560);
  drawHeader(t, {light: .35, lc: [255, 214, 225], x: W * .6}, HEADER);
  TEXT_WINDOWS.forEach(([a, b], i) => headline(scene(t, a, b), ...HEADLINES[i]));
}
boot(render);
</script>
