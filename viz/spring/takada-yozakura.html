<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(232,238,248,.9)';       // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========

// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。

const PETAL = (() => { const c = document.createElement('canvas'); c.width = 24; c.height = 32; const b = c.getContext('2d');
  const gr = b.createLinearGradient(0, 30, 0, 0); gr.addColorStop(0, '#f2b6c8'); gr.addColorStop(1, '#fff3f6');
  b.fillStyle = gr; b.beginPath(); b.moveTo(12, 30); b.bezierCurveTo(1, 22, 1, 6, 9, 2); b.lineTo(12, 6); b.lineTo(15, 2); b.bezierCurveTo(23, 6, 23, 22, 12, 30); b.fill(); return c; })();
function petal(x, y, s, a, alpha, ctx = g) {                     // 一片飘落的花瓣（翻转得慢、宽窄变化小，不闪）
  ctx.globalAlpha = alpha; ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.scale(1, .7 + .3 * Math.cos(a * .6)); ctx.drawImage(PETAL, -s, -s * 1.3, s * 2, s * 2.6); ctx.restore();
}

// ======== 一棵樱花树（染井吉野）：树干短、几根粗枝往两边伸开，枝梢下垂，花开在细枝上 ========
// opt: {x, y（树根）, h（树干长）, lean（整体倾向，弧度）, depth, spread, droop（枝梢下垂的程度）, w（树干粗）,
//       fs（花的大小）, fn（每个花簇的花数）, cr（花簇半径）, seed, lamps（照亮它的灯）, sky（上沿被天光勾边）}
function lightAt(x, y, lamps) { let s = 0; (lamps || []).forEach(([lx, ly, r]) => { const d = Math.hypot(x - lx, (y - ly) * 1.2); s += Math.exp(-d * d / (2 * r * r)); }); return clamp(s); }
function sakura(b, o) {
  const segs = [], tips = [];
  let n = 0;
  const grow = (x, y, len, ang, w, d) => {
    n++;
    const bend = (R(n, o.seed + 1) - .5) * .5, ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
    const mx = (x + ex) / 2 + Math.cos(ang + Math.PI / 2) * len * bend * .25, my = (y + ey) / 2 + Math.sin(ang + Math.PI / 2) * len * bend * .25;
    segs.push([x, y, mx, my, ex, ey, w]);
    if (d <= 3 && d >= 1) tips.push([mx, my, d]);                 // 花不只开在最外面：里面的细枝上也有，整棵树是满的
    if (d === 0) { tips.push([ex, ey, 0]); return; }
    const kids = d >= o.depth - 1 ? 3 : (R(n, o.seed + 2) < .3 ? 3 : R(n, o.seed + 9) < .12 ? 1 : 2);
    for (let k = 0; k < kids; k++) {
      const sp = (k - (kids - 1) / 2) * o.spread * (d >= o.depth - 1 ? 1.5 : 1) * (.6 + R(n * 3 + k, o.seed + 3) * .8) + (R(n * 3 + k, o.seed + 10) - .5) * .5;
      const down = o.droop * (1 - d / o.depth) * (Math.cos(ang) >= 0 ? 1 : -1);   // 越往外的细枝越往下垂
      grow(ex, ey, len * (.62 + R(n * 3 + k, o.seed + 4) * .28), ang + sp + down, w * (.58 + R(n * 3 + k, o.seed + 11) * .16), d - 1);
    }
  };
  grow(o.x, o.y, o.h, -Math.PI / 2 + o.lean, o.w, o.depth);
  // 先画枝干（深色，靠灯的一面带一点暖光），再开花
  segs.forEach(([x, y, mx, my, ex, ey, w]) => {
    b.strokeStyle = '#21151c'; b.lineCap = 'round'; b.lineWidth = Math.max(.8, w);
    b.beginPath(); b.moveTo(x, y); b.quadraticCurveTo(mx, my, ex, ey); b.stroke();
  });
  tips.forEach(([tx, ty, d], i) => {
    const cr = o.cr * (d === 0 ? 1 : d === 1 ? .85 : .7);
    glowB(b, [240, 170, 200], .22, tx, ty, cr * 1.4, cr * 1.1);          // 花簇底下一层淡淡的粉，让整团花有体积
    const cnt = Math.round(o.fn * (d === 0 ? 1 : d === 1 ? .7 : .45));
    for (let k = 0; k < cnt; k++) {
      const a = R(i * 31 + k, o.seed + 5) * TAU, r = Math.pow(R(i * 31 + k, o.seed + 6), .7) * cr;
      const fx = tx + Math.cos(a) * r, fy = ty + Math.sin(a) * r * .8;
      const lit = lightAt(fx, fy, o.lamps), top = o.sky ? clamp((ty - fy) / cr) * .5 : 0;
      const v = lit > .5 ? 0 : lit > .2 ? (R(k, i) < .5 ? 0 : 1) : (R(k, i) < .5 ? 1 : 2);
      const s = o.fs * (.75 + R(i * 31 + k, o.seed + 7) * .5);
      b.globalAlpha = .55 + .45 * Math.max(lit, top, .35);
      b.save(); b.translate(fx, fy); b.rotate(R(i * 31 + k, o.seed + 8) * TAU); b.drawImage(FLOWERS[top > .25 ? 3 : v], -s / 2, -s / 2, s, s); b.restore();
    }
  });
  b.globalAlpha = 1;
}

// ======== 三重橹：白墙、灰瓦，每层屋檐两头翘起；一层有千鸟破风，二层有唐破风，顶上入母屋和鯱 ========
function drawCastle(b) {
  const {x, base} = CASTLE;
  const wallTop = '#e6dcc4', wallLow = '#fbf1da', roof = '#3b4252', roofLit = '#5a6274', edge = '#9aa3b4';
  const wallFill = (y, h) => { const gr = b.createLinearGradient(0, y - h, 0, y); gr.addColorStop(0, wallTop); gr.addColorStop(1, wallLow); return gr; };   // 灯从下往上照：墙下面亮
  const windows = (y, h, w, n) => {                              // 格子窗：深色窗洞、浅色窗框、竖格子
    for (let k = 0; k < n; k++) {
      const wx = x - w / 2 + (k + .5) * w / n - 13, wy = y - h * .66;
      b.fillStyle = '#2a2a34'; b.fillRect(wx, wy, 26, h * .34);
      b.strokeStyle = '#d8d0bc'; b.lineWidth = 2; b.strokeRect(wx, wy, 26, h * .34);
      b.strokeStyle = 'rgba(200,190,170,.7)'; b.lineWidth = 1.2; for (let m = 1; m < 4; m++) { b.beginPath(); b.moveTo(wx + m * 6.5, wy); b.lineTo(wx + m * 6.5, wy + h * .34); b.stroke(); }
    }
  };
  const eaves = (y, w, rw, rh) => {                              // 一圈屋檐：下沿白色的檐底（被灯照亮），上面灰瓦，两头翘起，瓦的竖纹
    b.fillStyle = '#f0e6d0'; b.beginPath(); b.moveTo(x - rw / 2 - 12, y + 2); b.quadraticCurveTo(x, y + 12, x + rw / 2 + 12, y + 2); b.lineTo(x + w / 2, y + 10); b.lineTo(x - w / 2, y + 10); b.closePath(); b.fill();
    const gr = b.createLinearGradient(0, y - rh, 0, y); gr.addColorStop(0, roof); gr.addColorStop(1, roofLit);
    b.fillStyle = gr; b.beginPath();
    b.moveTo(x - rw / 2 - 14, y - 6); b.quadraticCurveTo(x - rw / 2 + 24, y - 2, x - w / 2 + 8, y - rh);
    b.lineTo(x + w / 2 - 8, y - rh); b.quadraticCurveTo(x + rw / 2 - 24, y - 2, x + rw / 2 + 14, y - 6);
    b.quadraticCurveTo(x, y + 6, x - rw / 2 - 14, y - 6); b.closePath(); b.fill();
    b.save(); b.clip(); b.strokeStyle = 'rgba(20,24,34,.35)'; b.lineWidth = 1; for (let k = -rw / 2; k < rw / 2; k += 7) { b.beginPath(); b.moveTo(x + k, y + 4); b.lineTo(x + k * .8, y - rh); b.stroke(); } b.restore();
    b.strokeStyle = edge; b.lineWidth = 2; b.beginPath(); b.moveTo(x - rw / 2 - 14, y - 6); b.quadraticCurveTo(x, y + 6, x + rw / 2 + 14, y - 6); b.stroke();
  };
  const gable = (y, w, h, kara) => {                             // 屋顶正面的破风：三角（千鸟）或弧形（唐）
    b.fillStyle = roof; b.beginPath();
    if (kara) { b.moveTo(x - w / 2, y); b.bezierCurveTo(x - w / 3, y, x - w / 5, y - h, x, y - h); b.bezierCurveTo(x + w / 5, y - h, x + w / 3, y, x + w / 2, y); }
    else { b.moveTo(x - w / 2, y); b.lineTo(x, y - h); b.lineTo(x + w / 2, y); }
    b.closePath(); b.fill();
    b.fillStyle = '#f4ead4'; b.beginPath();
    if (kara) { b.moveTo(x - w / 2 + 12, y); b.bezierCurveTo(x - w / 3, y, x - w / 5, y - h + 10, x, y - h + 10); b.bezierCurveTo(x + w / 5, y - h + 10, x + w / 3, y, x + w / 2 - 12, y); }
    else { b.moveTo(x - w / 2 + 14, y); b.lineTo(x, y - h + 12); b.lineTo(x + w / 2 - 14, y); }
    b.closePath(); b.fill();
    b.strokeStyle = edge; b.lineWidth = 2; b.stroke();
    b.fillStyle = '#c9a85a'; b.beginPath(); b.arc(x, y - h + (kara ? 18 : 22), 3, 0, TAU); b.fill();   // 悬鱼的小金饰
  };
  b.save(); b.translate(x, base); b.scale(.82, .82); b.translate(-x, -base);
  // 一层
  b.fillStyle = wallFill(base, 96); b.fillRect(x - 130, base - 96, 260, 96);
  b.fillStyle = '#4a4a52'; b.fillRect(x - 130, base - 16, 260, 16);                // 下沿的深色腰板
  windows(base - 10, 86, 260, 5);
  eaves(base - 96, 260, 340, 30); gable(base - 104, 120, 46);
  // 二层
  b.fillStyle = wallFill(base - 128, 74); b.fillRect(x - 100, base - 202, 200, 74);
  windows(base - 128, 74, 200, 4);
  eaves(base - 202, 200, 270, 26); gable(base - 208, 104, 40, true);
  // 三层（顶）
  b.fillStyle = wallFill(base - 228, 64); b.fillRect(x - 74, base - 292, 148, 64);
  windows(base - 228, 64, 148, 3);
  eaves(base - 292, 148, 214, 22);
  b.fillStyle = roof; b.beginPath(); b.moveTo(x - 80, base - 312); b.lineTo(x - 46, base - 352); b.lineTo(x + 46, base - 352); b.lineTo(x + 80, base - 312); b.closePath(); b.fill();   // 入母屋
  gable(base - 312, 86, 40);
  b.fillStyle = '#262c38'; b.fillRect(x - 52, base - 360, 104, 9);                  // 屋脊
  [-1, 1].forEach(d => { b.fillStyle = '#d4b46a'; b.beginPath(); b.moveTo(x + d * 50, base - 358); b.quadraticCurveTo(x + d * 60, base - 372, x + d * 54, base - 382); b.quadraticCurveTo(x + d * 46, base - 370, x + d * 44, base - 358); b.fill(); });   // 鯱
  b.restore();
  // 夜里的三重橹打的是绿白色的灯光：整座橹泛着绿光，从草坡上浮出来
  b.globalCompositeOperation = 'source-atop'; b.fillStyle = 'rgba(120,230,140,.28)'; b.fillRect(x - 200, base - 420, 400, 430); b.globalCompositeOperation = 'lighter';
  glowB(b, [140, 255, 160], .32, x, base - 140, 230, 260, 1.4);
  b.globalCompositeOperation = 'source-over';
}

// ======== 全景里动的东西：岸边的人、水面、飘落的花瓣、花吹雪和花筏 ========
// 人：剪影，头、肩、外套下摆，走路时腿从胯部前后摆、手臂反向摆；靠灯的一侧有一道暖色轮廓光
// kind: walk（散步）、phone（停下来举手机拍，屏幕的光照亮脸）、look（停下来抬头看）、pair（两人并肩）、child（大人牵着小孩）
function figure(x, y, h, t, ph, kind, face = 1) {
  const walking = kind === 'walk' || kind === 'pair' || kind === 'child';
  const sw = walking ? Math.sin(TAU * 9 * t / T + ph * TAU) : 0;               // 一个循环 9 步，首尾接得上
  const bob = walking ? Math.abs(sw) * h * .012 : 0;
  const hip = [x, y - h * .47 - bob], sh = [x, y - h * .8 - bob];
  g.fillStyle = '#120c14'; g.strokeStyle = '#120c14'; g.lineCap = 'round';
  [-1, 1].forEach(s => {                                                       // 腿
    const a = s * sw * .38, kx = hip[0] + Math.sin(a) * h * .25, ky = hip[1] + Math.cos(a) * h * .25;
    g.lineWidth = h * .075; g.beginPath(); g.moveTo(hip[0] + s * h * .03, hip[1]); g.lineTo(kx, ky); g.lineTo(kx + Math.sin(a * .4) * h * .23, Math.min(y, ky + h * .23)); g.stroke();
  });
  g.beginPath();                                                               // 外套：肩膀宽、往下略收，下摆盖住胯
  g.moveTo(sh[0] - h * .1, sh[1]); g.quadraticCurveTo(sh[0] - h * .13, sh[1] + h * .02, sh[0] - h * .12, sh[1] + h * .12);

    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(c, (CW - W) / 2, y, W, H, 0, 0, W, H);
    for (let i = 0; i < 30; i++) {                                                // 离眼睛很近的花瓣
      const u = fract(R(i, 430) + (t - T0) * (.1 + R(i, 431) * .08)), px = R(i, 432) * W + Math.sin(u * 7 + i) * 50, py = u * H;
      petal(px, py, 7 + R(i, 433) * 5, u * 4 + i, .85);
    }
    g.globalAlpha = 1;
  }
  return {t0: T0, t1: T1, render};
})();

// ======== 全景的镜头 ========
// [时间, 中心 y, 放大倍数]；5–13 是两个直切进来的近景（极乐桥、樱花底下），这时全景不显示
const COVER = [1240, 1.0];
const KEYS = [
  [0, ...COVER], [5, 1290, 1.05],          // ① 三重橹、樱花墙、倒影
  [13, 1560, 1.45],                         // ④ 直切回全景，从水面开始
  [17, 1380, 1.04],                         // 花吹雪，镜头慢慢往上拉（高潮）
  [20, ...COVER],                           // ⑤ 回到第 0 秒
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t >= KEYS[i + 1][0]) i++;
  if (t >= 5 && t < 13) i = 1;
  const [t0, y0, z0] = KEYS[i], [t1, y1, z1] = KEYS[i + 1], k = ease(clamp((t - t0) / (t1 - t0)));
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hh = H / 2 / z;
  return {x: W / 2, y: clamp(lerp(y0, y1, k), hh, WH - hh), z};
}

// ======== 文字 ========
const P = {head: '#fff6f8', key: '#ffb3c9', sub: 'rgba(255,232,240,.9)', narr: 'rgba(255,232,240,.92)', accent: '#f2a6bf'};
const STORY = [
  [0.2, 4.6, '每年 4 月，高田城址公园办观樱会。'],
  [5.4, 8.8, '天黑以后，护城河上的灯和三重橹一起亮起来。'],
  [9.4, 12.8, '在日本人里很有名的赏樱地，外国游客还不多。'],
  [17.0, 19.7, '观樱会从 1926 年办到现在，已经一百多届。'],
];
const HEADER = {title: '高田夜樱', place: '新潟县上越市', story: STORY, sheen: [60, 160, W - 120, 420], storyColor: P.narr, accent: P.accent};
const LINE1 = 1458, LINE2 = 1518;
const HL = {size: 68, weight: 300, sp: 8}, SUBT = {size: 30, weight: 300, sp: 2};
function rich(segs, y, C = P) {
  const ws = segs.map(([s]) => measure(s, HL.size, HL.weight, HL.sp) + HL.sp);
  let x = (W - ws.reduce((p, q) => p + q, 0) + HL.sp) / 2;
  segs.forEach(([s, key], i) => { text(s, x, y, HL.size, key ? C.key : C.head, HL.weight, 'left', HL.sp); x += ws[i]; });
}
let onBright = false;                                             // 樱花底下那个镜头背后忽明忽暗（发亮的花和暗的夜空）：字色不变，字影换成一圈更浓的深色光晕
function headline(s, segs, sub) {                                 // 中下方的大字：和长冈、汤泽一样的极简写法
  rise(s, () => {
    const D = P;
    g.shadowColor = onBright ? 'rgba(30,6,30,.95)' : 'rgba(6,4,16,.6)'; g.shadowBlur = onBright ? 22 : 12;
    rich(segs, LINE1, D); if (onBright) rich(segs, LINE1, D);
    if (sub) for (let k = 0; k < (onBright ? 2 : 1); k++) text(sub, W / 2, LINE2 + 6, SUBT.size, D.sub, onBright ? 400 : SUBT.weight, 'center', SUBT.sp);
    g.shadowColor = 'transparent'; g.shadowBlur = 0;
  });
}
const TEXT_WINDOWS = [[19.9, 4.6], [5.4, 8.8], [9.4, 12.8], [17.0, 19.6]];
const HEADLINES = [
  [[['日本三大', 0], ['夜樱', 1]], '高田城址公园 三重橹'],             // 第 0 秒就在画面上（封面）
  [[['灯一亮 樱花在', 0], ['水里', 1], ['再开一遍', 0]], ''],
  [[['约 ', 0], ['4,000', 1], [' 棵樱花', 0]], '沿着护城河 走在花底下'],
  [[['风一吹 护城河铺满', 0], ['花瓣', 1]], ''],
];

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const C = camAt(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#080c24'; g.fillRect(0, 0, W, H);
  if (t >= BRIDGE_SHOT.t0 && t < BRIDGE_SHOT.t1) BRIDGE_SHOT.render(t);
  else if (t >= CANOPY.t0 && t < CANOPY.t1) CANOPY.render(t);
  else {
    g.setTransform(C.z, 0, 0, C.z, W / 2 - C.x * C.z, H / 2 - C.y * C.z);
    g.drawImage(sky, 0, 0, W, SKY_H);
    drawWater(t);
    drawRaft(t);
    g.drawImage(far, 0, FAR_Y0, W, FAR_Y1 - FAR_Y0);
    drawDrift(t);
    drawWalkers(t);
    g.drawImage(nearC, 0, NEAR_Y0, W, WH - NEAR_Y0);
    drawFubuki(t);
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (!(t >= BRIDGE_SHOT.t0 && t < CANOPY.t1)) drawBokeh(t);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.drawImage(verticalSprite('topscrim120', [[0, [4, 6, 20, 120]], [1, [4, 6, 20, 0]]]), 0, 0, W, 560);
  drawHeader(t, {light: .35, lc: [255, 214, 225], x: W * .6}, HEADER);
  onBright = t >= CANOPY.t0 && t < CANOPY.t1;
  TEXT_WINDOWS.forEach(([a, b], i) => headline(scene(t, a, b), ...HEADLINES[i]));
}
boot(render);
</script>
