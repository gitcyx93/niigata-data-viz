<script>
// 长冈花火（新潟县长冈市）—— 夏季场景，方案 A「标尺」：数字和标尺直接画在夜景里，跟着烟花一起动。
// 节奏：开场 → 正三尺玉（预热）→ 凤凰从左往右、再从右往左扫场 → 凤凰展翅（全片高潮）→ 金色垂柳 → 提醒。
// 文字分两层：左上角的小字「讲故事」（逐字渐入，娓娓道来）；河面上的大字「给数字」（名字、规模、提醒）。
// 凤凰这一段的顺序：先铺背景（地震）→ 报名字和规模（PHOENIX、2 公里）→ 高潮时不放字 → 余晖里讲意义（为复兴祈愿）。
// render(t) 是确定性的：同一个 t 永远画出同一帧；所有动画在 T 秒内首尾相接。

// ======== 场景（方案 A / B 共用）========
const SCENE = {
  skyTop:'#020309', skyMid:'#070b22', skyLow:'#1a1638', hills:'#05071a', city:'#04060f',
  bridge:'#010205', riverTop:'#0f0d26', river:'#03040d', shore:'#010206', crowd:'#000105',
  lamp:'255,214,150', screen:'190,215,255',
  // 烟花颜色 [色相, 饱和度]：0 金 1 红 2 品红 3 绿 4 青 5 白 6 银蓝
  fw:[[42,95],[355,92],[318,88],[138,75],[188,92],[0,0],[210,45]]
};
// 文字配色：雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };

const W = 1080, H = 1920, T = 20;
const HORIZON = 1290, RIVER_END = 1770;

const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影时会临时换成水面画布）
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）

// ---- 烟花编排 ----
const bursts = [];

const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明

  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;

  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;
    d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = Math.round(255 * Math.pow(Math.max(0, 1 - r), falloff));
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function verticalSprite(key, stops) {                 // 竖直方向的渐变条：stops = [[位置0~1, [r,g,b,a]], ...]
  if (sprites[key]) return sprites[key];
  const N = 512, c = document.createElement('canvas'); c.width = 1; c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(1, N), d = img.data;
  for (let j = 0; j < N; j++) {

    for (let n = 0; n < 4; n++) d[j * 4 + n] = Math.round(a[n] + (b[n] - a[n]) * f);

}

function drawBurst(b, t, mirror) {

    g.beginPath(); seg(b.x + Math.sin(p * 9) * 2, y, b.x, Math.min(HORIZON, y + 46), mirror);
    g.strokeStyle = `hsla(40,70%,82%,${.85 * (1 - p * .3)})`; g.lineWidth = 2.5; g.stroke();

  const K = b.trail > .25 ? 4 : 1;
  for (let grp = 0; grp < (mirror ? 1 : 2); grp++) {
    for (let k = 0; k < K; k++) {
      const ta = a - (a - tail) * k / K, tb = a - (a - tail) * (k + 1) / K;
      g.beginPath();

      g.lineWidth = (b.big ? 3.2 : 2.6) * (1 - k / (K * 1.6)); g.stroke();
    }

  if (!mirror && k < .7) {                         // 亮白的火花头
    g.beginPath();

    g.lineWidth = r * .26;
    g.beginPath(); g.moveTo(x - r * .45, cy + r * .75); g.lineTo(x - r * .95, cy - r * .35); g.moveTo(x + r * .45, cy + r * .75); g.lineTo(x + r * .9, cy - r * .4); g.stroke();
    g.beginPath(); g.ellipse(x, cy + r * 1.05, r * .75, r * .62, 0, Math.PI, 0); g.lineTo(x + r * .75, y); g.lineTo(x - r * .75, y); g.fill();
    g.beginPath(); g.ellipse(x, cy, r * .58, r * .64, 0, 0, TAU); g.fill();
  } else if (pr.kind === 'uchiwa') {              // 团扇：举在脸旁边
    g.lineWidth = r * .14;
    g.beginPath(); g.moveTo(x + r * 1.25, y + r * 1.3); g.lineTo(x + r * 1.55, y - r * .3); g.stroke();
    g.beginPath(); g.ellipse(x + r * 1.7, y - r * .95, r * .78, r * .7, -.25, 0, TAU); g.fill();
  }
}
function drawCrowd(light, lc, t) {
  const lit = Math.min(.12, light * .07);         // 被照亮的程度（跟着烟花的亮度走）
  ROWS.forEach((row, ri) => {
    const fill = mix(row.base, lc, lit * row.lit);
    crowd[ri].forEach(p => {
      const y = p.y + Math.sin(TAU * 2 * t / T + p.ph) * 1.4;     // 呼吸般的微微起伏
      if (p.prop) drawProp(p, p.x, y, p.r, fill, light, lc);
      g.fillStyle = fill; body(p.x, y, p.r, p.tilt);
    });
    // 头顶轮廓光：平时也有一点点（夜空的余光），烟花亮时变强；越靠前越明显
    g.strokeStyle = `rgba(${lc},${Math.min(.55, .06 + light * .5) * (.5 + ri * .25)})`; g.lineWidth = 1 + ri * .5;
    crowd[ri].forEach(p => rimLine(p.x, p.y + Math.sin(TAU * 2 * t / T + p.ph) * 1.4, p.r, p.tilt));
  });
}

// ---- 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ----
const FONTS = {
  cjk:   '"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',
  latin: '"Sora","Source Han Sans SC",sans-serif',
};
// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {
  g.font = `${weight} ${size}px ${FONTS[fam]}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function resetSpacing(c = g) { if ('letterSpacing' in c) c.letterSpacing = '0px'; }
function measure(s, size, weight = 400, spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  setFont(size, weight, spacing, fam); const w = g.measureText(s).width - spacing; resetSpacing(); return w;
}
function text(s, x, y, size, color, weight = 400, align = 'left', spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  const w = measure(s, size, weight, spacing, fam);
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  setFont(size, weight, spacing, fam); g.textAlign = 'left'; g.fillStyle = color; g.fillText(s, left, y); resetSpacing();
  return w;
}
// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {
  const ws = parts.map(([s, size, , wt = 400, sp = 0, slot]) => measure(slot || s, size, wt, sp));
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, wt = 400, sp = 0, slot], i) => {
    text(s, slot ? x + ws[i] : x, y, size, color, wt, slot ? 'right' : 'left', sp); x += ws[i];
  });
  return ws.reduce((a, b) => a + b, 0);
}
function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;
  return {p: from > to && t < to ? 1 : easeOut(age / .55), out: clamp((dur - age) / .35), age};
}
function rise(s, draw) {
  if (!s) return;
  g.save(); g.globalAlpha = s.out * s.p; g.translate(0, (1 - s.p) * 40); draw(); g.restore();
}

// ---- 字号和字重：极简风格，靠大小和粗细拉开层次 ----
const TS = () => ({num: [140, 200, -4], name: [68, 300, 8], word: [112, 200, 30], unit: [40, 300, 2], sub: [30, 300, 2]});

// ---- 左上角：标题和讲故事的小字 ----
// 小字是「背景知识」：比大字小、细、灰，前面一根竖细线；一个字一个字慢慢浮现，说完淡出
const STORY = [
  [0.25, 4.2, '长冈花火大会，是日本三大花火大会之一。'],
  [4.5, 7.4, '三大花火大会分别是：新潟长冈、秋田大曲、茨城土浦。'],
  [7.6, 10.15, '2004 年，中越地震重创了这片土地。'],
  [10.3, 14.8, '第二年起，PHOENIX 在这里升起，为复兴祈愿。'],
  [15.4, 19.4, '每年 8 月 2 日、3 日，在信浓川河畔。'],
];
function drawStory(t) {
  STORY.forEach(([from, to, s]) => {
    if (t < from || t > to) return;
    const out = clamp((to - t) / .5), y = 480;
    g.globalAlpha = out * clamp((t - from) / .3);
    g.fillStyle = TYPE.accent; g.fillRect(80, y - 30, 2, 38);          // 竖细线：提示「这是旁白」
    setFont(32, 400, 1.5); g.textAlign = 'left';
    let x = 100;
    [...s].forEach((c, i) => {
      const p = clamp((t - from - i * .05) / .45);           // 每个字晚 0.05 秒出现
      if (p > 0) { g.globalAlpha = ease(p) * out; g.fillStyle = 'rgba(222,230,244,.68)'; g.fillText(c, x, y + 8 * (1 - ease(p))); }
      x += g.measureText(c).width;
    });
    g.globalAlpha = 1; resetSpacing();
  });
}
// 标题：干净的粗黑体，只有一层很淡的投影；会被当下最亮的那发烟花照亮（上沿染色）
// 几层都只画一次，之后每帧贴图（每帧重画会卡）
const titleLayers = {};
function titleLayer(key, paint) {
  if (!titleLayers[key]) {
    const c = document.createElement('canvas'); c.width = 860; c.height = 300;
    const x = c.getContext('2d');
    x.font = `800 132px ${FONTS.cjk}`; if ('letterSpacing' in x) x.letterSpacing = '6px';
    paint(x); titleLayers[key] = c;
  }
  return titleLayers[key];
}
const TT = '长冈花火', TX = 30, TB = 190;
function drawTitle(t, glow) {
  const ew = text('NIIGATA', 80, 262, 26, TYPE.accent, 500, 'left', 8);
  text('新潟县长冈市', 80 + ew + 22, 262, 26, 'rgba(222,230,244,.68)', 400, 'left', 4);
  const X = 74 - TX, Y = 404 - TB;
  g.drawImage(titleLayer('base', x => {
    x.save(); x.shadowColor = 'rgba(0,0,0,.45)'; x.shadowBlur = 30; x.fillStyle = TYPE.text; x.fillText(TT, TX, TB); x.restore();
    x.fillStyle = TYPE.text; x.fillText(TT, TX, TB);
  }), X, Y);
  if (glow.v > .02) {
    g.globalAlpha = Math.min(1, glow.v);
    g.drawImage(titleLayer(`lit${glow.hue},${glow.sat}`, x => {
      x.fillStyle = '#fff'; x.fillText(TT, TX, TB);
      const lg = x.createLinearGradient(0, TB - 110, 0, TB + 10);
      lg.addColorStop(0, `hsla(${glow.hue},${Math.max(30, glow.sat)}%,66%,.8)`); lg.addColorStop(1, `hsla(${glow.hue},${Math.max(30, glow.sat)}%,66%,0)`);
      x.globalCompositeOperation = 'source-atop'; x.fillStyle = lg; x.fillRect(0, 0, 860, 300);
    }), X, Y);
    g.globalAlpha = 1;
  }
  drawStory(t);
}

// ======== 河面上的大字：名字、数字、提醒 ========
const LINE1 = 1440, LINE2 = 1500;      // 河面上的文字基线
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

function typoBack(t) {}
function typoFront(t) {
  const S = TS();
  // ① 规模
  let s = scene(t, 0.6, 4.3);
  rise(s, () => {
    line([['20,000', ...S.num.slice(0, 1), TYPE.gold, S.num[1], S.num[2]], ['  发 / 两晚', S.unit[0], WHITE, S.unit[1], S.unit[2]]], LINE1);
    text('每年到场观看的人超过 100 万', W / 2, LINE2 + 10, S.sub[0], SOFT, S.sub[1], 'center', S.sub[2]);
  });

  // ② 正三尺玉：直径标尺跟着烟花张开，数字同步数到 650（标在烟花上，不垫卡片）
  const a = t - SK.t, sv = clamp((a - .1) / .3) * clamp((8.4 - t) / .4);
  if (sv > 0) {
    const r = SK.R * .93 * (1 - Math.exp(-3.1 * a));
    g.save(); g.globalAlpha = sv; g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(SK.x - r, SK.y); g.lineTo(SK.x + r, SK.y); g.stroke();
    [-1, 1].forEach(d => { g.beginPath(); g.moveTo(SK.x + d * r, SK.y - 14); g.lineTo(SK.x + d * r, SK.y + 14); g.stroke(); });
    line([[String(Math.round(650 * easeOut(a / 1.6))), S.num[0] * .85, WHITE, 300, S.num[2], '650'], [' m', S.unit[0], TYPE.accent, S.unit[1], 0]], SK.y - 28);
    g.restore();
  }
  s = scene(t, 5.0, 8.4);
  rise(s, () => {
    text('正三尺玉', W / 2, LINE1, S.name[0], WHITE, S.name[1], 'center', S.name[2]);
    text('一发炸开的直径，约 6 个足球场首尾相接', W / 2, LINE2 + 4, S.sub[0], SOFT, S.sub[1], 'center', S.sub[2]);
  });

  // ③ PHOENIX：烟花一开始就报名字（字母从中间往两边展开）；标尺跟着第一波从左往右伸，数字数到 2.0；高潮前收掉
  s = scene(t, 8.6, 11.35);
  if (s) {
    const word = 'PHOENIX', ws = [...word].map(c => measure(c, S.word[0], S.word[1]));
    let x = (W - ws.reduce((p, q) => p + q, 0) - S.word[2] * 6) / 2;
    g.save(); g.translate(0, (1 - s.p) * 40);
    [...word].forEach((c, i) => {
      const p = easeOut((t - 8.6 - Math.abs(i - 3) * .09) / .5);
      g.globalAlpha = p * s.out; text(c, x + (i - 3) * 14 * (1 - p), LINE1, S.word[0], WHITE, S.word[1]); x += ws[i] + S.word[2];
    });
    g.restore();
    const p = easeOut((t - WAVE1) / (15 * .11 + .2)), x0 = 70, x1 = x0 + 940 * p, y = 1230;
    g.save(); g.globalAlpha = s.out * clamp((t - WAVE1 + .2) / .3); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x0, y - 12); g.lineTo(x0, y + 12); g.moveTo(x0, y); g.lineTo(x1, y); g.moveTo(x1, y - 12); g.lineTo(x1, y + 12); g.stroke();
    g.fillStyle = WHITE; g.beginPath(); g.arc(x1, y, 5, 0, TAU); g.fill();
    g.translate(0, (1 - s.p) * 40);
    line([['横跨约 ', S.sub[0] + 4, SOFT, S.sub[1], 0], [(2 * p).toFixed(1), 52, TYPE.gold, 300, 0, '2.0'], [' km', S.sub[0] + 4, SOFT, S.sub[1], 0]], LINE2 + 30);
    g.restore();
  }

  // ④ 提醒：左对齐，放在画面中部的夜空里（这时烟花已经放完，和左上角的标题呼应）
  s = scene(t, 15.2, 19.6);
  rise(s, () => {
    text('观览席很抢手，', 80, 1046, 60, WHITE, 300, 'left', 4);
    text('记得提前预定。', 80, 1126, 60, WHITE, 300, 'left', 4);
  });
  rise(scene(t, 15.6, 19.6), () => {
    g.fillStyle = TYPE.coral; g.beginPath(); g.arc(88, 1194, 7, 0, TAU); g.fill();
    text('也可以联系旅行社哦！', 108, 1206, 36, TYPE.gold, 400, 'left', 2);
  });
}

// ======== 渲染 ========
function hits(t) {           // 正三尺玉的冲击
  const sa = since(t, SK.t);
  return sa < 3 ? [{e: SK, sa, s: 1}] : [];
}
function render(t) {
  now = t = fract(t / T) * T;
  let zoom = 1, ox = 0, oy = 0, cx = 540, cy = 900;
  hits(t).forEach(({e, sa}) => {               // 正三尺玉：猛推一下，重重地震，余震慢慢平息
    zoom += .1 * Math.exp(-sa * 2.6) * clamp(sa / .06);
    const sh = sa < 1.6 ? Math.exp(-sa * 3.2) * 46 : 0;
    ox += Math.sin(sa * 62) * sh; oy += Math.cos(sa * 47) * sh * 1.2; cx = e.x; cy = e.y;
  });
  const ph = t - PHX.t;                        // PHOENIX：扫场时慢慢推近（吸气），绽放后舒展地拉远（呼气），不震
  if (ph > -2.7 && ph < 3.5) {
    zoom += ph < 0 ? .05 * ease(clamp((ph + 2.7) / 2.7)) : .05 * (1 - ease(clamp(ph / 3.5)));
    cx = PHX.x; cy = PHX.y;
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, cx * (1 - zoom) + ox, cy * (1 - zoom) + oy);

  g.globalCompositeOperation = 'source-over';
  g.drawImage(bg, 0, 0);
  typoBack(t);
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const lights = [];
  g.save(); g.beginPath(); g.rect(0, 0, W, HORIZON - 8); g.clip();
  bursts.forEach(b => { const l = drawBurst(b, t, false); if (l) lights.push(l); });
  g.restore();

  let light = 0, glow = {v: 0, col: 'transparent'}, lc = [0, 0, 0];
  lights.forEach(l => {
    light += l.v;
    glowAt(hsl2rgb(l.hue, l.sat, 62).map(Math.round), Math.min(.16, l.v * .16 / Math.sqrt(lights.length)), l.x, l.y, 700, 700, 1);
    if (l.v > glow.v) glow = {v: l.v, hue: l.hue, sat: l.sat, col: `hsla(${l.hue},${Math.max(30, l.sat)}%,62%,${Math.min(.9, l.v)})`};
    const c = hsl2rgb(l.hue, Math.max(30, l.sat), 66); lc = lc.map((v, i) => v + c[i] * l.v);
  });
  // 观众身上的光：所有正在亮的烟花按亮度加权平均出一个颜色（不会因为「最亮的那发」换了而突然变色）
  lc = light > 0 ? lc.map(v => Math.round(v / light)) : [255, 220, 170];
  // 正三尺玉：两圈冲击波 + 一次强闪光
  hits(t).forEach(({e, sa}) => {
    [0, .18].forEach((d, k) => {
      const q = sa - d;
      if (q > 0 && q < 1.1) {
        g.strokeStyle = `rgba(255,226,170,${(.7 - k * .3) * (1 - q / 1.1)})`; g.lineWidth = 14 * (1 - q / 1.1) + 2;
        g.beginPath(); g.arc(e.x, e.y, 80 + easeOut(q / 1.1) * 1050, 0, TAU); g.stroke();
      }
    });
    if (sa < .8) {                                     // 整屏暖色 + 炸点周围更亮
      const k = Math.pow(1 - sa / .8, 2);
      g.fillStyle = `rgba(255,170,90,${.3 * k})`; g.fillRect(-160, -160, W + 320, H + 320);
      glowAt([255, 236, 190], .7 * k, e.x, e.y, 1400, 1400, 1);
    }
  });
  // PHOENIX：一道横贯整个画面的光带（像翅膀展开的那一下），然后整片天空从地平线泛起金色
  if (ph > 0 && ph < 3.2) {
    const k = Math.exp(-ph * 1.4), wv = .35 + .65 * easeOut(ph / .5);
    glowAt([255, 240, 210], .85 * k, PHX.x, PHX.y, 40 * wv * 18, 40, 1.4);     // 横向光带
    glowAt([255, 214, 140], .45 * k, PHX.x, PHX.y, 900 * 1.8, 900 * .55, 1);    // 两翼的大片暖光
    const sk = .32 * Math.sin(Math.PI * clamp(ph / 3.2));                        // 天空从地平线泛起金色
    g.globalAlpha = sk;
    g.drawImage(verticalSprite('skywash', [[0, [255, 180, 90, 0]], [1, [255, 180, 90, 255]]]), -160, 300, W + 320, HORIZON - 300);
    g.globalAlpha = 1;
  }
  g.globalAlpha = Math.min(.42, .08 + light * .22);                 // 硝烟随烟花变亮
  g.drawImage(smoke, -100 + Math.sin(TAU * t / T) * 60, 380);
  g.globalAlpha = 1;
  drawReflection(t, lights, ph);
  g.globalCompositeOperation = 'source-over';
  drawCrowd(light, lc, t);
  g.setTransform(1, 0, 0, 1, 0, 0);

  // 文字层（不跟镜头动，保证清晰）
  g.drawImage(verticalSprite('topscrim', [[0, [1, 3, 12, 204]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.drawImage(verticalSprite('riverband', [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, 158]], [1, [1, 3, 12, 0]]]), 0, 1300, W, 320);   // 河面上压一点暗，托住文字
  drawTitle(t, glow);
  typoFront(t);
  // 结尾淡出成黑（开头不淡入，第一帧就是完整画面）
  const dark = ease(clamp((t - 19.1) / .9));
  if (dark > 0) { g.fillStyle = `rgba(0,0,0,${dark})`; g.fillRect(0, 0, W, H); }
}

window.render = render;
window.LOOP_SECONDS = T;
async function loadFonts() {
  if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {
    const f = new FontFace(family, `url(data:font/woff2;base64,${b64})`, {weight, unicodeRange: range});
    document.fonts.add(f); return f.load();
  }));
}
const ready = loadFonts().catch(() => {});
if (!new URLSearchParams(location.search).has('record')) {
  ready.then(() => {
    const start = performance.now();
    const tick = () => { render((performance.now() - start) / 1000); requestAnimationFrame(tick); };
    tick();
  });
} else ready.then(() => { render(0); window.READY = true; });
</script>
</body>
</html>
