<script>
// 长冈花火（新潟县长冈市）—— 夏季场景，方案 A「标尺」：数字和标尺直接画在夜景里，跟着烟花一起动。
// 节奏：开场 → 正三尺玉（预热）→ 凤凰从左往右、再从右往左扫场 → 凤凰展翅（全片高潮）→ 金色垂柳 → 提醒。
// 文字分两层：左上角的小字「讲故事」（逐字渐入，娓娓道来）；河面上的大字「给数字」（名字、规模、提醒）。
// 凤凰这一段的顺序：先铺背景（地震）→ 报名字和规模（PHOENIX、2 公里）→ 高潮时不放字 → 余晖里讲意义（为复兴祈愿）。
// render(t) 是确定性的：同一个 t 永远画出同一帧；所有动画在 T 秒内首尾相接。

// ======== 场景（方案 A / B 共用）========
const SCENE = {
  skyTop:'#020309', skyMid:'#070b22', skyLow:'#1a1638', hills:'#05071a', city:'#04060f',
  bridge:'#010205', riverTop:'#0f0d26', river:'#03040d', shore:'#010206', crowd:'#000105',
  lamp:'255,214,150', screen:'190,215,255',
  // 烟花颜色 [色相, 饱和度]：0 金 1 红 2 品红 3 绿 4 青 5 白 6 银蓝
  fw:[[42,95],[355,92],[318,88],[138,75],[188,92],[0,0],[210,45]]
};
// 文字配色：雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };

const W = 1080, H = 1920, T = 20;
const HORIZON = 1290, RIVER_END = 1770;

const cv = document.getElementById('c'), g = cv.getContext('2d');
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）

// ---- 烟花编排 ----
const bursts = [];
function shell(t0, x, y, R, c, o = {}) {
  const [hue, sat] = SCENE.fw[c];

// ---- 单发烟花 ----
function particle(b, i, a) {
  const th = i / b.n * TAU + rnd(i, b.t0) * .12;
  const sp = .78 + rnd(i, b.x) * .32;
  const rr = b.R * sp * (1 - Math.exp(-(b.ex || 3.1) * a));
  return [b.x + Math.cos(th) * rr, b.y + Math.sin(th) * rr * .96 + b.G * a * a];
}
function drawBurst(b, t, mirror) {
  const age = since(t, b.t0);
  if (age < b.rise) {                              // 升空的光尾
    const p = ease(age / b.rise), y = HORIZON - (HORIZON - b.y) * p;
    g.beginPath(); seg(b.x + Math.sin(p * 9) * 2, y, b.x, Math.min(HORIZON, y + 46), mirror);
    g.strokeStyle = `hsla(40,70%,82%,${.85 * (1 - p * .3)})`; g.lineWidth = 2.5; g.stroke();
    return null;
  }
  const a = age - b.rise;
  if (a > b.life) return null;
  const k = a / b.life, base = Math.pow(1 - k, 1.3);
  const L = a < .12 ? 96 : 58 + 22 * (1 - k), tail = Math.max(0, a - b.trail - k * .1);
  const on = i => !(b.crackle && k > .5 && rnd(i, Math.floor(a * 22)) <= .45);
  const al = Math.min(1, b.crackle && k > .5 ? base * 1.4 : base);
  // 火花分两组，色相略有差别，各描一次
  for (let grp = 0; grp < (mirror ? 1 : 2); grp++) {
    g.beginPath();
    for (let i = grp; i < b.n; i += 2) if (on(i)) {
      const [x1, y1] = particle(b, i, a), [x0, y0] = particle(b, i, tail);
      seg(x0, y0, x1, y1, mirror);
    }
    g.strokeStyle = `hsla(${b.hue + grp * 12},${b.sat}%,${L}%,${al})`; g.lineWidth = b.big ? 3.2 : 2.6; g.stroke();
  }
  if (!mirror && k < .7) {                         // 亮白的火花头
    g.beginPath();
    for (let i = 0; i < b.n; i++) if (on(i)) { const [x, y] = particle(b, i, a); g.moveTo(x - .5, y); g.lineTo(x + .5, y); }
    g.strokeStyle = `rgba(255,255,255,${al * (1 - k)})`; g.lineWidth = b.big ? 5 : 4; g.stroke();
  }
  return {x: b.x, y: b.y, v: (b.big ? 1.4 : .5) * Math.exp(-a * 2.2), hue: b.hue, sat: b.sat};
}
let now = 0;
function seg(x0, y0, x1, y1, mirror) {
  if (mirror) {                                    // 河面倒影：上下翻转、压扁、轻轻晃动
    const m = y => HORIZON + (HORIZON - y) * .5;
    y0 = m(y0); y1 = m(y1);
    if (y0 > RIVER_END - 40 && y1 > RIVER_END - 40) return;
    const wob = Math.sin(y1 * .09 + now * 4) * 7;
    x0 += wob; x1 += wob;
  }
  g.moveTo(x0, y0); g.lineTo(x1, y1);
}

const FONTS = {

const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {
  g.font = `${weight} ${size}px ${FONTS[fam]}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function resetSpacing(c = g) { if ('letterSpacing' in c) c.letterSpacing = '0px'; }
function measure(s, size, weight = 400, spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {

}
function text(s, x, y, size, color, weight = 400, align = 'left', spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {

  setFont(size, weight, spacing, fam); g.textAlign = 'left'; g.fillStyle = color; g.fillText(s, left, y); resetSpacing();

}
// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {
  const ws = parts.map(([s, size, , wt = 400, sp = 0, slot]) => measure(slot || s, size, wt, sp));
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, wt = 400, sp = 0, slot], i) => {
    text(s, slot ? x + ws[i] : x, y, size, color, wt, slot ? 'right' : 'left', sp); x += ws[i];
  });

}

  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// ---- 毛玻璃：把卡片底下的画面缩小两次再放大（便宜的模糊），再盖一层薄白、一圈细亮边 ----
const blurA = document.createElement('canvas'); blurA.width = 240; blurA.height = 80;
const blurB = document.createElement('canvas'); blurB.width = 80; blurB.height = 30;
function glass(x, y, w, h, r = 30) {

  const a = blurA.getContext('2d'), b = blurB.getContext('2d');

  g.fillStyle = 'rgba(10,16,40,.30)'; g.fillRect(x, y, w, h);              // 压一点暗，亮处也看得清字
  const sheen = g.createLinearGradient(0, y, 0, y + h);
  sheen.addColorStop(0, 'rgba(255,255,255,.16)'); sheen.addColorStop(.45, 'rgba(255,255,255,.04)'); sheen.addColorStop(1, 'rgba(255,255,255,.02)');

// 一块数据：毛玻璃风格垫一张卡片；极简风格在上方画一根短细线
function plate(s, top, h, w) {
  if (!s) return;
  const x = (W - w) / 2, dy = (1 - s.p) * 40;
  g.save(); g.globalAlpha = s.out * s.p;
  if (isGlass()) glass(x, top + dy, w, h);
  else { g.fillStyle = TYPE.accent; g.fillRect(W / 2 - 28, top + dy + 14, 56, 2); }
  g.restore();
}

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;
  return {p: from > to && t < to ? 1 : easeOut(age / .55), out: clamp((dur - age) / .35), age};
}
function rise(s, draw) {
  if (!s) return;
  g.save(); g.globalAlpha = s.out * s.p; g.translate(0, (1 - s.p) * 40); draw(); g.restore();
}

  if (sv > 0) {
    const r = SK.R * .93 * (1 - Math.exp(-3.1 * a));
    g.save(); g.globalAlpha = sv; g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(SK.x - r, SK.y); g.lineTo(SK.x + r, SK.y); g.stroke();
    [-1, 1].forEach(d => { g.beginPath(); g.moveTo(SK.x + d * r, SK.y - 14); g.lineTo(SK.x + d * r, SK.y + 14); g.stroke(); });
    line([[String(Math.round(650 * easeOut(a / 1.6))), S.num[0] * .85, WHITE, S.num[1], S.num[2], '650'], [' m', S.unit[0], TYPE.accent, S.unit[1], 0]], SK.y - 28);
    g.restore();
  }
  s = scene(t, 5.0, 8.4);
  plate(s, LINE1 - 100, 176, 760);
  rise(s, () => {
    text('正三尺玉', W / 2, LINE1, S.name[0], WHITE, S.name[1], 'center', S.name[2]);
    text('一发炸开的直径，约 6 个足球场首尾相接', W / 2, LINE2 + 4, S.sub[0], SOFT, S.sub[1], 'center', S.sub[2]);
  });

  // ③ PHOENIX：烟花一开始就报名字（字母从中间往两边展开）；标尺跟着第一波从左往右伸，数字数到 2.0；高潮前收掉
  s = scene(t, 8.6, 11.35);
  plate(s, LINE1 - 128, 236, 760);
  if (s) {
    const word = 'PHOENIX', ws = [...word].map(c => measure(c, S.word[0], S.word[1]));
    let x = (W - ws.reduce((p, q) => p + q, 0) - S.word[2] * 6) / 2;
    g.save(); g.translate(0, (1 - s.p) * 40);
    [...word].forEach((c, i) => {
      const p = easeOut((t - 8.6 - Math.abs(i - 3) * .09) / .5);
      g.globalAlpha = p * s.out; text(c, x + (i - 3) * 14 * (1 - p), LINE1, S.word[0], WHITE, S.word[1]); x += ws[i] + S.word[2];
    });
    g.restore();
    const p = easeOut((t - WAVE1) / (15 * .11 + .2)), x0 = 70, x1 = x0 + 940 * p, y = 1230;
    g.save(); g.globalAlpha = s.out * clamp((t - WAVE1 + .2) / .3); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x0, y - 12); g.lineTo(x0, y + 12); g.moveTo(x0, y); g.lineTo(x1, y); g.moveTo(x1, y - 12); g.lineTo(x1, y + 12); g.stroke();
    g.fillStyle = WHITE; g.beginPath(); g.arc(x1, y, 5, 0, TAU); g.fill();
    g.translate(0, (1 - s.p) * 40);
    line([['横跨约 ', S.sub[0] + 4, SOFT, S.sub[1], 0], [(2 * p).toFixed(1), 52, TYPE.gold, isGlass() ? 600 : 300, 0, '2.0'], [' km', S.sub[0] + 4, SOFT, S.sub[1], 0]], LINE2 + 30);
    g.restore();
  }

  // ④ 提醒（比其他场景多停一会儿）
  s = scene(t, 15.5, 19.6);
  plate(s, LINE1 - 96, 196, 820);
  rise(s, () => {
    text('观览席很抢手，记得提前预定', W / 2, LINE1, 52, WHITE, isGlass() ? 700 : 400, 'center', 2);
    const w = measure('也可以联系旅行社哦！', 38, isGlass() ? 500 : 300, 2);
    g.fillStyle = TYPE.coral; g.beginPath(); g.arc(W / 2 - w / 2 - 22, LINE2 + 30 - 13, 7, 0, TAU); g.fill();
    text('也可以联系旅行社哦！', W / 2 + 8, LINE2 + 30, 38, TYPE.gold, isGlass() ? 500 : 300, 'center', 2);
  });
}

// ======== 渲染 ========
function hits(t) {           // 正三尺玉的冲击
  const sa = since(t, SK.t);
  return sa < 3 ? [{e: SK, sa, s: 1}] : [];
}
function render(t) {
  now = t = fract(t / T) * T;
  let zoom = 1, ox = 0, oy = 0, cx = 540, cy = 900;
  hits(t).forEach(({e, sa}) => {               // 正三尺玉：猛推一下，重重地震，余震慢慢平息
    zoom += .1 * Math.exp(-sa * 2.6) * clamp(sa / .06);
    const sh = sa < 1.6 ? Math.exp(-sa * 3.2) * 46 : 0;
    ox += Math.sin(sa * 62) * sh; oy += Math.cos(sa * 47) * sh * 1.2; cx = e.x; cy = e.y;
  });
  const ph = t - PHX.t;                        // PHOENIX：扫场时慢慢推近（吸气），绽放后舒展地拉远（呼气），不震
  if (ph > -2.7 && ph < 3.5) {
    zoom += ph < 0 ? .05 * ease(clamp((ph + 2.7) / 2.7)) : .05 * (1 - ease(clamp(ph / 3.5)));
    cx = PHX.x; cy = PHX.y;
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, cx * (1 - zoom) + ox, cy * (1 - zoom) + oy);

  g.globalCompositeOperation = 'source-over';
  g.drawImage(bg, 0, 0);
  typoBack(t);
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const lights = [];
  g.save(); g.beginPath(); g.rect(0, 0, W, HORIZON - 8); g.clip();
  bursts.forEach(b => { const l = drawBurst(b, t, false); if (l) lights.push(l); });
  g.restore();
  g.save(); g.beginPath(); g.rect(0, HORIZON + 2, W, RIVER_END - HORIZON - 30); g.clip();
  g.globalAlpha = .34; bursts.forEach(b => drawBurst(b, t, true)); g.globalAlpha = 1;
  g.restore();

  let light = 0, glow = {v: 0, col: 'transparent'};
  lights.forEach(l => {
    light += l.v;
    const col = `hsla(${l.hue},${l.sat}%,62%,`;
    const gr = g.createRadialGradient(l.x, l.y, 20, l.x, l.y, 700);
    gr.addColorStop(0, col + Math.min(.16, l.v * .16 / Math.sqrt(lights.length)) + ')'); gr.addColorStop(1, col + '0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, RIVER_END);
    if (l.v > glow.v) glow = {v: l.v, hue: l.hue, sat: l.sat, col: `hsla(${l.hue},${Math.max(30, l.sat)}%,62%,${Math.min(.9, l.v)})`};
  });
  g.globalAlpha = Math.min(.42, .08 + light * .22);                 // 硝烟随烟花变亮
  g.drawImage(smoke, -100 + Math.sin(TAU * t / T) * 60, 380);
  g.globalAlpha = 1;
  // 正三尺玉：两圈冲击波 + 一次强闪光
  hits(t).forEach(({e, sa}) => {
    [0, .18].forEach((d, k) => {
      const q = sa - d;
      if (q > 0 && q < 1.1) {
        g.strokeStyle = `rgba(255,226,170,${(.7 - k * .3) * (1 - q / 1.1)})`; g.lineWidth = 14 * (1 - q / 1.1) + 2;
        g.beginPath(); g.arc(e.x, e.y, 80 + easeOut(q / 1.1) * 1050, 0, TAU); g.stroke();
      }
    });
    if (sa < .8) {
      const k = Math.pow(1 - sa / .8, 2), fl = g.createRadialGradient(e.x, e.y, 0, e.x, e.y, 1400);
      fl.addColorStop(0, `rgba(255,236,190,${.95 * k})`); fl.addColorStop(1, `rgba(255,170,90,${.3 * k})`);
      g.fillStyle = fl; g.fillRect(-100, -100, W + 200, H + 200);
    }
  });
  // PHOENIX：一道横贯整个画面的光带（像翅膀展开的那一下），然后整片天空从地平线泛起金色
  if (ph > 0 && ph < 3.2) {
    const k = Math.exp(-ph * 1.4), wv = .35 + .65 * easeOut(ph / .5);
    const band = g.createLinearGradient(0, PHX.y - 40, 0, PHX.y + 40);
    band.addColorStop(0, 'rgba(255,220,160,0)'); band.addColorStop(.5, `rgba(255,240,210,${.8 * k})`); band.addColorStop(1, 'rgba(255,220,160,0)');
    g.fillStyle = band; g.fillRect(W / 2 - W * wv, PHX.y - 40, W * 2 * wv, 80);
    const wide = g.createRadialGradient(PHX.x, PHX.y, 0, PHX.x, PHX.y, 900);
    wide.addColorStop(0, `rgba(255,214,140,${.45 * k})`); wide.addColorStop(1, 'rgba(255,214,140,0)');
    g.save(); g.translate(PHX.x, PHX.y); g.scale(1.8, .55); g.translate(-PHX.x, -PHX.y);
    g.fillStyle = wide; g.fillRect(PHX.x - 900, PHX.y - 900, 1800, 1800); g.restore();
    const sky = g.createLinearGradient(0, HORIZON, 0, 300);
    sky.addColorStop(0, `rgba(255,180,90,${.32 * Math.sin(Math.PI * clamp(ph / 3.2))})`); sky.addColorStop(1, 'rgba(255,180,90,0)');
    g.fillStyle = sky; g.fillRect(-100, 300, W + 200, HORIZON - 300);
  }
  g.globalCompositeOperation = 'source-over';
  drawCrowd(light, a => glow.col.replace(/[\d.]+\)$/, a + ')'));
  g.setTransform(1, 0, 0, 1, 0, 0);

  // 文字层（不跟镜头动，保证清晰）
  const tg = g.createLinearGradient(0, 0, 0, 600);
  tg.addColorStop(0, 'rgba(1,3,12,.8)'); tg.addColorStop(1, 'rgba(1,3,12,0)');
  g.fillStyle = tg; g.fillRect(0, 0, W, 600);
  const bgr = g.createLinearGradient(0, 1300, 0, 1620);        // 河面上压一点暗，托住文字
  bgr.addColorStop(0, 'rgba(1,3,12,0)'); bgr.addColorStop(.5, 'rgba(1,3,12,.62)'); bgr.addColorStop(1, 'rgba(1,3,12,0)');
  g.fillStyle = bgr; g.fillRect(0, 1300, W, 320);
  drawTitle(t, glow);
  typoFront(t);
  // 结尾淡出成黑（开头不淡入，第一帧就是完整画面）
  const dark = ease(clamp((t - 19.1) / .9));
  if (dark > 0) { g.fillStyle = `rgba(0,0,0,${dark})`; g.fillRect(0, 0, W, H); }
}

window.render = render;
window.LOOP_SECONDS = T;
async function loadFonts() {
  if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {
    const f = new FontFace(family, `url(data:font/woff2;base64,${b64})`, {weight, unicodeRange: range});
    document.fonts.add(f); return f.load();
  }));
}
const ready = loadFonts().catch(() => {});
// 风格切换按钮：录制（?record）和干净模式（?clean）不显示
if (!params.has('record') && !params.has('clean')) {
  const bar = document.createElement('div'); bar.className = 'lab';
  const b = document.createElement('button');
  const label = () => b.textContent = `风格：${LOOKS[STYLE.look]}（点击切换）`;
  b.onclick = () => { const ks = Object.keys(LOOKS); STYLE.look = ks[(ks.indexOf(STYLE.look) + 1) % ks.length]; label(); };
  label(); bar.appendChild(b); document.body.appendChild(bar);
}
if (!new URLSearchParams(location.search).has('record')) {
  ready.then(() => {
    const start = performance.now();
    const tick = () => { render((performance.now() - start) / 1000); requestAnimationFrame(tick); };
    tick();
  });
} else ready.then(() => { render(0); window.READY = true; });
</script>
