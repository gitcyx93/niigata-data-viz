<script>
// 长冈花火（新潟县长冈市）—— 夏季场景，方案 A「标尺」：数字和标尺直接画在夜景里，跟着烟花一起动。
// 节奏：开场 → 正三尺玉（预热）→ 凤凰从左往右、再从右往左扫场 → 凤凰展翅（全片高潮）→ 金色垂柳 → 提醒。

  bridge:'#010205', riverTop:'#0f0d26', river:'#03040d', shore:'#010206', crowd:'#000105',

};

// ---- 单发烟花 ----
function particle(b, i, a) {
  const th = i / b.n * TAU + rnd(i, b.t0) * .12;
  const sp = .78 + rnd(i, b.x) * .32;
  const rr = b.R * sp * (1 - Math.exp(-3.1 * a));
  return [b.x + Math.cos(th) * rr, b.y + Math.sin(th) * rr * .96 + b.G * a * a];
}
function drawBurst(b, t, mirror) {
  const age = since(t, b.t0);
  if (age < b.rise) {                              // 升空的光尾
    const p = ease(age / b.rise), y = HORIZON - (HORIZON - b.y) * p;
    g.beginPath(); seg(b.x + Math.sin(p * 9) * 2, y, b.x, Math.min(HORIZON, y + 46), mirror);
    g.strokeStyle = `hsla(40,70%,82%,${.85 * (1 - p * .3)})`; g.lineWidth = 2.5; g.stroke();
    return null;
  }
  const a = age - b.rise;
  if (a > b.life) return null;
  const k = a / b.life, base = Math.pow(1 - k, 1.3);
  const L = a < .12 ? 96 : 58 + 22 * (1 - k), tail = Math.max(0, a - b.trail - k * .1);
  const on = i => !(b.crackle && k > .5 && rnd(i, Math.floor(a * 22)) <= .45);
  const al = Math.min(1, b.crackle && k > .5 ? base * 1.4 : base);
  // 火花分两组，色相略有差别，各描一次
  for (let grp = 0; grp < (mirror ? 1 : 2); grp++) {
    g.beginPath();
    for (let i = grp; i < b.n; i += 2) if (on(i)) {
      const [x1, y1] = particle(b, i, a), [x0, y0] = particle(b, i, tail);
      seg(x0, y0, x1, y1, mirror);
    }
    g.strokeStyle = `hsla(${b.hue + grp * 12},${b.sat}%,${L}%,${al})`; g.lineWidth = b.big ? 3.2 : 2.6; g.stroke();
  }
  if (!mirror && k < .7) {                         // 亮白的火花头
    g.beginPath();
    for (let i = 0; i < b.n; i++) if (on(i)) { const [x, y] = particle(b, i, a); g.moveTo(x - .5, y); g.lineTo(x + .5, y); }
    g.strokeStyle = `rgba(255,255,255,${al * (1 - k)})`; g.lineWidth = b.big ? 5 : 4; g.stroke();
  }
  return {x: b.x, y: b.y, v: (b.big ? 1.4 : .5) * Math.exp(-a * 2.2), hue: b.hue, sat: b.sat};
}
let now = 0;
function seg(x0, y0, x1, y1, mirror) {
  if (mirror) {                                    // 河面倒影：上下翻转、压扁、轻轻晃动
    const m = y => HORIZON + (HORIZON - y) * .5;
    y0 = m(y0); y1 = m(y1);
    if (y0 > RIVER_END - 40 && y1 > RIVER_END - 40) return;
    const wob = Math.sin(y1 * .09 + now * 4) * 7;
    x0 += wob; x1 += wob;
  }
  g.moveTo(x0, y0); g.lineTo(x1, y1);
}

function drawCrowd(light, rim) {

// ---- 文字工具 ----
function setFont(size, weight = 500, spacing = 0) {
  g.font = `${weight} ${size}px ${FONT}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function text(s, x, y, size, color, weight = 500, align = 'left', spacing = 0) {
  setFont(size, weight, spacing); g.fillStyle = color; g.textAlign = align; g.fillText(s, x, y);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  setFont(size, weight, spacing); const w = g.measureText(s).width;
  if ('letterSpacing' in g) g.letterSpacing = '0px';
  return w;
}
const textCache = new Map();
function shadowText(s, x, y, size, color, weight = 500, align = 'left', spacing = 0) {
  const key = [s, size, color, weight, spacing].join('|');
  let c = textCache.get(key);
  if (!c) {
    setFont(size, weight, spacing);
    const w = g.measureText(s).width - spacing;          // 去掉字距带来的尾部空白，居中才准
    if ('letterSpacing' in g) g.letterSpacing = '0px';
    const pad = 40; c = document.createElement('canvas');
    c.width = Math.ceil(w + pad * 2); c.height = Math.ceil(size * 1.6 + pad * 2);
    const x2 = c.getContext('2d');
    x2.font = `${weight} ${size}px ${FONT}`; if ('letterSpacing' in x2) x2.letterSpacing = spacing + 'px';
    x2.shadowColor = 'rgba(0,0,0,.8)'; x2.shadowBlur = 22; x2.shadowOffsetY = 2;
    x2.fillStyle = color; x2.textBaseline = 'alphabetic'; x2.fillText(s, pad, pad + size * 1.15);
    c.w = w; c.pad = pad; c.base = pad + size * 1.15;
    textCache.set(key, c);
  }
  const left = align === 'center' ? x - c.w / 2 : align === 'right' ? x - c.w : x;
  g.drawImage(c, Math.round(left - c.pad), Math.round(y - c.base));
  return c.w;
}
// 一段文字的出场/退场：从下往上「升起」显露，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;
  return {p: from > to && t < to ? 1 : easeOut(age / .55), out: clamp((dur - age) / .35), age};
}
function reveal(s, y, h, draw) {
  if (!s) return;
  g.save(); g.globalAlpha = s.out;
  g.beginPath(); g.rect(0, y - h, W, h * 1.35); g.clip();
  g.translate(0, (1 - s.p) * h * .9);
  draw(); g.restore();
}

// 数字计数时宽度会变，按最终数字的宽度排版、右对齐，避免整行左右抖动
function counterLine(parts, y) {
  const ws = parts.map(([s, size, color, weight = 700, sp = 0, slot]) => {
    setFont(size, weight, sp); const w = g.measureText(slot || s).width - sp;
    if ('letterSpacing' in g) g.letterSpacing = '0px'; return w;
  });
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, weight = 700, sp = 0, slot], i) => {
    if (slot) shadowText(s, x + ws[i], y, size, color, weight, 'right', sp);
    else shadowText(s, x, y, size, color, weight, 'left', sp);
    x += ws[i];
  });
}

const STORY = [

  [15.5, 19.4, '每年 8 月 2 日、3 日，在信浓川河畔。'],
];
function drawStory(t) {
  STORY.forEach(([from, to, s]) => {
    if (t < from || t > to) return;
    const out = clamp((to - t) / .6);
    setFont(38, 500, 2); g.fillStyle = TYPE.soft; g.textAlign = 'left';
    let x = 80;
    [...s].forEach((c, i) => {
      const p = clamp((t - from - i * .06) / .5);           // 每个字晚 0.06 秒出现，用 0.5 秒浮上来
      if (p > 0) {
        g.globalAlpha = ease(p) * out;
        g.fillText(c, x, 474 + 10 * (1 - ease(p)));
      }
      x += g.measureText(c).width;
    });
    g.globalAlpha = 1;
    if ('letterSpacing' in g) g.letterSpacing = '0px';
  });
}
function drawTitle(t) {

  shadowText('NIIGATA / 新潟县长冈市', 102, 262, 30, TYPE.accent, 600, 'left', 6);
  shadowText('长冈花火', 74, 400, 128, TYPE.text, 800, 'left', 10);   // 带阴影：高潮闪光时也看得清

// ======== 方案 A 的文字：河面上的大字，标尺和数字直接画在夜景里 ========
const LINE1 = 1440, LINE2 = 1500;      // 河面上的文字基线

function typoBack(t) {}
function typoFront(t) {
  // ① 规模
  reveal(scene(t, 0.6, 4.3), LINE1, 130, () => counterLine([['20,000', 128, TYPE.gold, 800, -2], [' 发 / 两晚', 46, TYPE.text]], LINE1));
  reveal(scene(t, 0.8, 4.3), LINE2 + 10, 50, () => shadowText('每年到场观看的人超过 100 万', W / 2, LINE2 + 10, 34, TYPE.soft, 500, 'center', 1));

  // ② 正三尺玉：直径标尺跟着烟花张开，数字同步数到 650
  const a = t - SK.t, sv = clamp((a - .1) / .3) * clamp((8.4 - t) / .4);
  if (sv > 0) {
    const r = SK.R * .93 * (1 - Math.exp(-3.1 * a));
    g.save(); g.globalAlpha = sv; g.strokeStyle = TYPE.accent; g.lineWidth = 3;
    g.beginPath(); g.moveTo(SK.x - r, SK.y); g.lineTo(SK.x + r, SK.y); g.stroke();
    [-1, 1].forEach(d => { g.beginPath(); g.moveTo(SK.x + d * r, SK.y - 16); g.lineTo(SK.x + d * r, SK.y + 16); g.stroke(); });
    counterLine([[String(Math.round(650 * easeOut(a / 1.6))), 110, TYPE.text, 800, 0, '650'], [' 米', 44, TYPE.gold]], SK.y - 30);
    g.restore();
  }
  reveal(scene(t, 5.0, 8.4), LINE1, 90, () => shadowText('正三尺玉', W / 2, LINE1, 72, TYPE.text, 800, 'center', 6));
  reveal(scene(t, 5.2, 8.4), LINE2, 50, () => shadowText('一发炸开的直径，约 6 个足球场首尾相接', W / 2, LINE2, 34, TYPE.soft, 500, 'center', 1));

  // ③ PHOENIX：烟花一开始就报名字；标尺跟着第一波从左往右伸，数字同步数到 2.0 公里；高潮前收掉，把画面让给烟花
  const ps = scene(t, 8.6, 11.35);
  reveal(ps, LINE1, 120, () => shadowText('PHOENIX', W / 2, LINE1, 108, TYPE.text, 800, 'center', 18));
  if (ps) {
    const p = easeOut((t - WAVE1) / (15 * .11 + .2)), x0 = 70, x1 = x0 + 940 * p, y = 1230;
    g.save(); g.globalAlpha = ps.out * clamp((t - WAVE1 + .2) / .3); g.strokeStyle = TYPE.accent; g.lineWidth = 3;
    g.beginPath(); g.moveTo(x0, y - 14); g.lineTo(x0, y + 14); g.moveTo(x0, y); g.lineTo(x1, y); g.moveTo(x1, y - 14); g.lineTo(x1, y + 14); g.stroke();
    g.fillStyle = TYPE.text; g.beginPath(); g.arc(x1, y, 6, 0, TAU); g.fill();
    counterLine([['横跨约 ', 36, TYPE.soft, 500], [(2 * p).toFixed(1), 54, TYPE.gold, 800, 0, '2.0'], [' 公里', 36, TYPE.soft, 500]], LINE2 + 16);
    g.restore();
  }

  // ④ 提醒（比其他场景多停一会儿）
  reveal(scene(t, 15.5, 19.6), LINE1, 80, () => shadowText('观览席很抢手，记得提前预定', W / 2, LINE1, 58, TYPE.text, 800, 'center', 2));
  reveal(scene(t, 15.8, 19.6), LINE2 + 22, 54, () => shadowText('也可以联系旅行社哦！', W / 2, LINE2 + 22, 44, TYPE.gold, 700, 'center', 2));
}

// ======== 渲染 ========
function hits(t) {           // 镜头冲击：正三尺玉小一点，凤凰展翅最大
  return [[SK, .45], [PHX, 1]].map(([e, s]) => {
    const sa = since(t, e.t);
    return sa < 3 ? {e, sa, s} : null;
  }).filter(Boolean);
}
function render(t) {
  now = t = fract(t / T) * T;
  let zoom = 1, ox = 0, oy = 0, cx = 540, cy = 900;
  hits(t).forEach(({e, sa, s}) => {
    zoom += .08 * s * Math.exp(-sa * 2.2) * clamp(sa / .08);
    const sh = sa < 1 ? Math.exp(-sa * 5) * 30 * s : 0;
    ox += Math.sin(sa * 70) * sh; oy += Math.cos(sa * 55) * sh; cx = e.x; cy = e.y;
  });
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, cx * (1 - zoom) + ox, cy * (1 - zoom) + oy);

  g.globalCompositeOperation = 'source-over';
  g.drawImage(bg, 0, 0);
  typoBack(t);
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const lights = [];
  g.save(); g.beginPath(); g.rect(0, 0, W, HORIZON - 8); g.clip();
  bursts.forEach(b => { const l = drawBurst(b, t, false); if (l) lights.push(l); });
  g.restore();
  g.save(); g.beginPath(); g.rect(0, HORIZON + 2, W, RIVER_END - HORIZON - 30); g.clip();
  g.globalAlpha = .34; bursts.forEach(b => drawBurst(b, t, true)); g.globalAlpha = 1;
  g.restore();

  let light = 0, glow = {v: 0, col: 'transparent'};
  lights.forEach(l => {
    light += l.v;
    const col = `hsla(${l.hue},${l.sat}%,62%,`;
    const gr = g.createRadialGradient(l.x, l.y, 20, l.x, l.y, 700);
    gr.addColorStop(0, col + Math.min(.16, l.v * .16 / Math.sqrt(lights.length)) + ')'); gr.addColorStop(1, col + '0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, RIVER_END);
    if (l.v > glow.v) glow = {v: l.v, col: `hsla(${l.hue},${Math.max(30, l.sat)}%,62%,${Math.min(.9, l.v)})`};
  });
  g.globalAlpha = Math.min(.42, .08 + light * .22);                 // 硝烟随烟花变亮
  g.drawImage(smoke, -100 + Math.sin(TAU * t / T) * 60, 380);
  g.globalAlpha = 1;
  // 冲击波和闪光
  hits(t).forEach(({e, sa, s}) => {
    if (sa < 1.1) {
      g.strokeStyle = `rgba(255,226,170,${.6 * s * (1 - sa / 1.1)})`; g.lineWidth = 12 * (1 - sa / 1.1) + 2;
      g.beginPath(); g.arc(e.x, e.y, 80 + easeOut(sa / 1.1) * 1000, 0, TAU); g.stroke();
    }
    if (sa < .8) {
      const k = Math.pow(1 - sa / .8, 2), fl = g.createRadialGradient(e.x, e.y, 0, e.x, e.y, 1400);
      fl.addColorStop(0, `rgba(255,236,190,${.9 * s * k})`); fl.addColorStop(1, `rgba(255,170,90,${.28 * s * k})`);
      g.fillStyle = fl; g.fillRect(-100, -100, W + 200, H + 200);
    }
  });
  g.globalCompositeOperation = 'source-over';
  drawCrowd(light, a => glow.col.replace(/[\d.]+\)$/, a + ')'));
  g.setTransform(1, 0, 0, 1, 0, 0);

  // 文字层（不跟镜头动，保证清晰）
  const tg = g.createLinearGradient(0, 0, 0, 600);
  tg.addColorStop(0, 'rgba(1,3,12,.8)'); tg.addColorStop(1, 'rgba(1,3,12,0)');
  g.fillStyle = tg; g.fillRect(0, 0, W, 600);
  const bgr = g.createLinearGradient(0, 1300, 0, 1620);        // 河面上压一点暗，托住文字
  bgr.addColorStop(0, 'rgba(1,3,12,0)'); bgr.addColorStop(.5, 'rgba(1,3,12,.62)'); bgr.addColorStop(1, 'rgba(1,3,12,0)');
  g.fillStyle = bgr; g.fillRect(0, 1300, W, 320);
  drawTitle(t);
  typoFront(t);
  // 结尾淡出成黑（开头不淡入，第一帧就是完整画面）
  const dark = ease(clamp((t - 19.1) / .9));
  if (dark > 0) { g.fillStyle = `rgba(0,0,0,${dark})`; g.fillRect(0, 0, W, H); }
}

window.render = render;
window.LOOP_SECONDS = T;
async function loadFonts() {
  if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
  await Promise.all(FONT_DATA.map(([range, b64]) => {
    const f = new FontFace('Source Han Sans SC', `url(data:font/woff2;base64,${b64})`, {weight: '100 900', unicodeRange: range});
    document.fonts.add(f); return f.load();
  }));
}
const ready = loadFonts().catch(() => {});
if (!new URLSearchParams(location.search).has('record')) {
  ready.then(() => {
    const start = performance.now();
    const tick = () => { render((performance.now() - start) / 1000); requestAnimationFrame(tick); };
    tick();
  });
} else ready.then(() => { render(0); window.READY = true; });
</script>
</body>
