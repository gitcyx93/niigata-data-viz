<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(222,230,244,.68)';      // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明

  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========

// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {
  const ws = parts.map(([s, size, , wt = 400, sp = 0, slot]) => measure(slot || s, size, wt, sp));
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, wt = 400, sp = 0, slot], i) => {
    text(s, slot ? x + ws[i] : x, y, size, color, wt, slot ? 'right' : 'left', sp); x += ws[i];

}
function roundRect(x, y, w, h, r) {

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {

const TS = () => ({num: [140, 200, -4], name: [68, 300, 8], word: [112, 200, 30], unit: [40, 300, 2], sub: [30, 300, 2]});

// 小字是「背景知识」：比大字小、细、灰，前面一根竖细线；一个字一个字慢慢浮现，说完淡出。
// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
function drawStory(t, story) {
  story.forEach(([from, to, s]) => {

    g.globalAlpha = out * clamp((t - from) / .3);

// 外浮雕：把字形模糊一下当成高度，按「光从左上方照下来」算字外一圈的明暗：

  w.globalAlpha = 1;

// 文字层底下的压暗：上面托住标题，下面托住大字（y0 ~ y0+h 的中间最暗）

  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {

      const start = performance.now();

<script>

function particle(b, i, a) {

    g.strokeStyle = `hsla(40,70%,82%,${.85 * (1 - p * .3)})`; g.lineWidth = 2.5; g.stroke();

  const on = i => !(b.crackle && k > .5 && rnd(i, Math.floor(a * 22)) <= .45);
  const al = Math.min(1, b.crackle && k > .5 ? base * 1.4 : base);

  const K = b.trail > .25 ? 4 : 1;
  for (let grp = 0; grp < (mirror ? 1 : 2); grp++) {
    for (let k = 0; k < K; k++) {

      for (let i = grp; i < b.n; i += 2) if (on(i)) {
        const [x1, y1] = particle(b, i, Math.max(0, ta)), [x0, y0] = particle(b, i, Math.max(0, tb));

let now = 0;
const MIRROR = .6;                     // 倒影的透视压扁比例

// ---- 近处的观众（剪影）----
// 两排，人不多：每个人都是独立的一个剪影，彼此之间有空隙，大小、高低、头的歪斜都不一样（参差）。
// 剪影是能看出轮廓的深蓝，烟花亮时被柔和地染上烟花的颜色（所有正在亮的烟花按亮度加权的平均色，

const ROWS = [
  {y: 1800, r: [21, 28], gap: [62, 150], base: [18, 24, 48], lit: 1.3, phone: .3},
  {y: 1868, r: [36, 48], gap: [92, 170], base: [9, 13, 28], lit: 1, phone: .28},

const crowd = ROWS.map((row, ri) => {

  for (let x = 20 + rnd(ri, 70) * 60, i = 0; x < W + 50; i++) {

// 几个固定的道具，放在前排和中排的特定位置
(() => {
  const f = crowd[1], b = crowd[0];

  b.forEach(p => { if (Math.abs(p.x - f[1].x) < 120) delete p.prop; });

function body(x, y, r, tilt) {                    // 一个人：头、脖子、肩膀

  g.lineTo(x + r * 2.05, H); g.lineTo(x - r * 2.05, H); g.closePath(); g.fill();

}

const shot = document.createElement('canvas'); shot.width = 120; shot.height = 160;

    g.restore();
  }

  // ④ 提醒：左对齐，放在画面中部的夜空里（这时烟花已经放完，和左上角的标题呼应）
  s = scene(t, 15.2, 19.6);
  rise(s, () => {
    text('观览席很抢手，', 80, 1046, 60, WHITE, 300, 'left', 4);
    text('记得提前预订。', 80, 1126, 60, WHITE, 300, 'left', 4);
  });
  rise(scene(t, 15.6, 19.6), () => {
    g.fillStyle = TYPE.coral; g.beginPath(); g.arc(88, 1194, 7, 0, TAU); g.fill();
    text('也可以联系旅行社哦！', 108, 1206, 36, TYPE.gold, 400, 'left', 2);
  });
}

// ======== 渲染 ========
function hits(t) {           // 正三尺玉的冲击
  const sa = since(t, SK.t);
  return sa < 3 ? [{e: SK, sa, s: 1}] : [];
}
function render(t) {
  now = t = fract(t / T) * T;
  let zoom = 1, ox = 0, oy = 0, cx = 540, cy = 900;
  hits(t).forEach(({e, sa}) => {               // 正三尺玉：猛推一下，重重地震，余震慢慢平息
    zoom += .1 * Math.exp(-sa * 2.6) * clamp(sa / .06);
    const sh = sa < 1.6 ? Math.exp(-sa * 3.2) * 46 : 0;
    ox += Math.sin(sa * 62) * sh; oy += Math.cos(sa * 47) * sh * 1.2; cx = e.x; cy = e.y;
  });
  const ph = t - PHX.t;                        // PHOENIX：扫场时慢慢推近（吸气），绽放后舒展地拉远（呼气），不震
  if (ph > -2.7 && ph < 3.5) {
    zoom += ph < 0 ? .05 * ease(clamp((ph + 2.7) / 2.7)) : .05 * (1 - ease(clamp(ph / 3.5)));
    cx = PHX.x; cy = PHX.y;
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, cx * (1 - zoom) + ox, cy * (1 - zoom) + oy);

  g.globalCompositeOperation = 'source-over';
  g.drawImage(bg, 0, 0);
  typoBack(t);
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const lights = [];
  g.save(); g.beginPath(); g.rect(0, 0, W, HORIZON - 8); g.clip();
  bursts.forEach(b => { const l = drawBurst(b, t, false); if (l) lights.push(l); });
  g.restore();

  let light = 0, glow = {v: 0, col: 'transparent'}, lc = [0, 0, 0], lx = 0;
  lights.forEach(l => {
    light += l.v;
    glowAt(hsl2rgb(l.hue, l.sat, 62).map(Math.round), Math.min(.16, l.v * .16 / Math.sqrt(lights.length)), l.x, l.y, 700, 700, 1);
    if (l.v > glow.v) glow = {v: l.v, hue: l.hue, sat: l.sat, col: `hsla(${l.hue},${Math.max(30, l.sat)}%,62%,${Math.min(.9, l.v)})`};
    const c = hsl2rgb(l.hue, Math.max(30, l.sat), 66); lc = lc.map((v, i) => v + c[i] * l.v); lx += l.x * l.v;
  });
  // 观众身上的光：所有正在亮的烟花按亮度加权平均出一个颜色（不会因为「最亮的那发」换了而突然变色）
  lc = light > 0 ? lc.map(v => Math.round(v / light)) : [255, 220, 170];
  // 正三尺玉：两圈冲击波 + 一次强闪光
  hits(t).forEach(({e, sa}) => {
    [0, .18].forEach((d, k) => {
      const q = sa - d;
      if (q > 0 && q < 1.1) {
        g.strokeStyle = `rgba(255,226,170,${(.7 - k * .3) * (1 - q / 1.1)})`; g.lineWidth = 14 * (1 - q / 1.1) + 2;
        g.beginPath(); g.arc(e.x, e.y, 80 + easeOut(q / 1.1) * 1050, 0, TAU); g.stroke();
      }
    });
    if (sa < .8) {                                     // 整屏暖色 + 炸点周围更亮
      const k = Math.pow(1 - sa / .8, 2);
      g.fillStyle = `rgba(255,170,90,${.3 * k})`; g.fillRect(-160, -160, W + 320, H + 320);
      glowAt([255, 236, 190], .7 * k, e.x, e.y, 1400, 1400, 1);
    }
  });
  // PHOENIX：一道横贯整个画面的光带（像翅膀展开的那一下），然后整片天空从地平线泛起金色
  if (ph > 0 && ph < 3.2) {
    const k = Math.exp(-ph * 1.4), wv = .35 + .65 * easeOut(ph / .5);
    glowAt([255, 240, 210], .85 * k, PHX.x, PHX.y, 40 * wv * 18, 40, 1.4);     // 横向光带
    glowAt([255, 214, 140], .45 * k, PHX.x, PHX.y, 900 * 1.8, 900 * .55, 1);    // 两翼的大片暖光
    const sk = .32 * Math.sin(Math.PI * clamp(ph / 3.2));                        // 天空从地平线泛起金色
    g.globalAlpha = sk;
    g.drawImage(verticalSprite('skywash', [[0, [255, 180, 90, 0]], [1, [255, 180, 90, 255]]]), -160, 300, W + 320, HORIZON - 300);
    g.globalAlpha = 1;
  }
  g.globalAlpha = Math.min(.42, .08 + light * .22);                 // 硝烟随烟花变亮
  g.drawImage(smoke, -100 + Math.sin(TAU * t / T) * 60, 380);
  g.globalAlpha = 1;
  drawReflection(t, lights, ph);
  g.globalCompositeOperation = 'source-over';
  drawCrowd(light, lc, t);
  g.setTransform(1, 0, 0, 1, 0, 0);

  // 文字层（不跟镜头动，保证清晰）
  g.drawImage(verticalSprite('topscrim', [[0, [1, 3, 12, 204]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.drawImage(verticalSprite('riverband', [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, 158]], [1, [1, 3, 12, 0]]]), 0, 1300, W, 320);   // 河面上压一点暗，托住文字
  drawHeader(t, {light, lc, x: light > 0 ? lx / light : W / 2}, HEADER);
  typoFront(t);
}

boot(render);
</script>
</body>
</html>
