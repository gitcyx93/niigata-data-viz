<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>长冈花火</title>
<style>
  html,body{margin:0;height:100%;background:#03040a}
  body{display:flex;align-items:center;justify-content:center}
  canvas{height:100vh;max-width:100vw;aspect-ratio:9/16;display:block}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// 长冈花火（新潟县长冈市）—— 夏季场景
// 画面：信浓川上的「凤凰」与「正三尺玉」，远处是长生桥。
// render(t) 是确定性的：同一个 t 永远画出同一帧，便于逐帧录制；所有动画在 T 秒内首尾相接。

// ---- 视觉参数 ----
// SCENE：夜景和烟花（高对比、彩色）。TYPE：文字（与 Facebook 统一的蓝白）。
const SCENE = {
  skyTop:'#020309', skyMid:'#070b22', skyLow:'#1a1638', hills:'#05071a', city:'#04060f',
  bridge:'#010205', riverTop:'#0f0d26', river:'#03040d', shore:'#010206', crowd:'#000105',
  lamp:'255,214,150', screen:'190,215,255',
  // 烟花颜色 [色相, 饱和度]：0 金 1 红 2 品红 3 绿 4 青 5 白 6 银蓝
  fw:[[42,95],[355,92],[318,88],[138,75],[188,92],[0,0],[210,45]]
};
const TYPES = {
  facebook: { text:'#ffffff', soft:'rgba(255,255,255,.74)', blue:'#1877f2', accent:'#69b0ff', panel:'rgba(3,10,32,.72)' },
};
const TYPE = TYPES.facebook;   // ← 换文字配色只改这一行
const FONT = '"Noto Sans SC","PingFang SC","Microsoft YaHei","WenQuanYi Zen Hei",sans-serif';

const W = 1080, H = 1920, T = 20;          // 画布尺寸、循环周期（秒）
const HORIZON = 1290, RIVER_END = 1770;    // 河面范围

const cv = document.getElementById('c'), g = cv.getContext('2d');
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const fade = (t, a, b, d = .5) => clamp((t - a) / d) * clamp((b - t) / d);
const bump = (x, w = .35) => x > 0 && x < w ? Math.sin(x / w * Math.PI) : 0;   // 一次短促的弹跳

// ---- 烟花编排 ----
const bursts = [];
function shell(t0, x, y, R, c, o = {}) {
  const [hue, sat] = SCENE.fw[c];
  bursts.push(Object.assign({t0, x, y, R, hue, sat, n: 70, life: 2.4, G: 46, rise: 1.1, trail: .14, crackle: false}, o));
}
// 开场：第 0 秒就有一朵正在盛开的烟花，平台截第一帧当封面时也好看
shell(T - 1.5, 540, 830, 280, 1, {n: 120, life: 3.0, rise: 1.0});
shell(T - 1.2, 540, 830, 150, 0, {n: 60, life: 2.6, rise: 1.0});
shell(0.9, 250, 920, 190, 3);
shell(1.5, 840, 860, 210, 2);
shell(2.5, 560, 760, 220, 0, {n: 70, life: 3.2, G: 120, trail: .45, sat: 80});         // 金色垂柳
// 凤凰：三波，横跨整个画面
for (let i = 0; i < 16; i++) shell(4.0 + i * .13, 70 + i * 63, 960 - Math.sin(i / 15 * Math.PI) * 110, 170, i % 2 ? 0 : 5, {n: 64, life: 2.2, rise: .8});
for (let i = 0; i < 16; i++) shell(6.0 + i * .13, 1010 - i * 63, 920 - Math.sin(i / 15 * Math.PI) * 150, 175, [1, 2, 4, 3][i % 4], {n: 64, life: 2.2, rise: .8});
for (let i = 0; i < 9; i++) shell(8.4, 80 + i * 115, 860 + (i % 2) * 70, 190, 5, {n: 56, life: 2.8, rise: .9, crackle: true});
// 正三尺玉：金色，炸开后慢慢垂落、噼啪闪烁
const SANSHAKU = 12.6 + 1.9, SK = {x: 540, y: 890, R: 350};
shell(12.6, SK.x, SK.y, SK.R, 0, {n: 260, life: 4.8, G: 62, rise: 1.9, trail: .3, crackle: true, big: true, sat: 75});
shell(17.0, 820, 920, 160, 4, {n: 50});

// ---- 静态背景（只画一次）----
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function drawBackground() {
  const b = bg.getContext('2d');
  let gr = b.createLinearGradient(0, 0, 0, HORIZON);
  gr.addColorStop(0, SCENE.skyTop); gr.addColorStop(.6, SCENE.skyMid); gr.addColorStop(1, SCENE.skyLow);
  b.fillStyle = gr; b.fillRect(0, 0, W, HORIZON);
  for (let i = 0; i < 180; i++) {                       // 星星
    b.fillStyle = `rgba(255,255,255,${.1 + rnd(i, 3) * .35})`;
    b.fillRect(rnd(i, 1) * W, rnd(i, 2) * 1000, 1.6, 1.6);
  }
  b.fillStyle = SCENE.hills; b.beginPath(); b.moveTo(0, HORIZON - 40);   // 东山连峰
  for (let x = 0; x <= W; x += 20) b.lineTo(x, HORIZON - 52 - Math.sin(x / 210) * 26 - Math.sin(x / 67) * 8 - (x > 600 ? (x - 600) * .1 : 0));
  b.lineTo(W, HORIZON); b.lineTo(0, HORIZON); b.fill();
  b.fillStyle = SCENE.city;                              // 对岸街区
  for (let x = -10; x < W; ) {
    const w = 18 + rnd(x, 7) * 40, h = 10 + rnd(x, 8) * 38;
    b.fillRect(x, HORIZON - h, w, h);
    for (let k = 0; k < 3; k++) if (rnd(x, k + 20) > .55) {
      b.fillStyle = `rgba(${SCENE.lamp},.5)`; b.fillRect(x + 4 + k * 8, HORIZON - h + 6, 2.4, 2.4); b.fillStyle = SCENE.city;
    }
    x += w + 2;
  }
  gr = b.createLinearGradient(0, HORIZON, 0, RIVER_END);     // 信浓川
  gr.addColorStop(0, SCENE.riverTop); gr.addColorStop(1, SCENE.river);
  b.fillStyle = gr; b.fillRect(0, HORIZON, W, RIVER_END - HORIZON);
  b.fillStyle = SCENE.shore; b.fillRect(0, RIVER_END - 30, W, H - RIVER_END + 30);
  // 长生桥：连续的弓形桁架
  b.strokeStyle = SCENE.bridge; b.fillStyle = SCENE.bridge; b.lineWidth = 3;
  const deck = HORIZON - 6, span = 150;
  b.fillRect(-10, deck, W + 20, 7);
  for (let s = -1; s < 8; s++) {
    const x0 = 20 + s * span, x1 = x0 + span, peak = 44;
    const top = x => deck - 14 - Math.sin((x - x0) / span * Math.PI) * peak;
    b.beginPath(); b.moveTo(x0, deck - 14);
    for (let x = x0; x <= x1; x += 5) b.lineTo(x, top(x));
    b.stroke();
    for (let k = 0; k <= 8; k++) {
      const xa = x0 + k * span / 8, xb = x0 + (k + 1) * span / 8;
      b.beginPath(); b.moveTo(xa, deck); b.lineTo(xa, top(xa)); b.stroke();
      if (k < 8) { b.beginPath(); b.moveTo(xa, top(xa)); b.lineTo(xb, deck); b.stroke(); }
    }
    b.fillRect(x0 - 5, deck, 10, 26);
  }
  for (let x = 30; x < W; x += 75) { b.fillStyle = `rgba(${SCENE.lamp},.85)`; b.fillRect(x, deck - 3, 3, 3); }
})();

// ---- 单发烟花 ----
function particle(b, i, a) {
  const th = i / b.n * TAU + rnd(i, b.t0) * .12;
  const sp = .78 + rnd(i, b.x) * .32;
  const rr = b.R * sp * (1 - Math.exp(-3.1 * a));
  return [b.x + Math.cos(th) * rr, b.y + Math.sin(th) * rr * .96 + b.G * a * a];
}
// 返回这一发此刻的亮度和颜色，用来照亮天空、人群和标题
function drawBurst(b, t, mirror) {
  const age = fract((t - b.t0) / T) * T;          // 取模，让循环首尾相接
  if (age < b.rise) {                              // 升空的光尾
    const p = ease(age / b.rise), y = HORIZON - (HORIZON - b.y) * p;
    line(b.x + Math.sin(p * 9) * 2, y, b.x, Math.min(HORIZON, y + 46), `hsla(40,70%,82%,${.85 * (1 - p * .3)})`, 2.5, mirror);
    return null;
  }
  const a = age - b.rise;
  if (a > b.life) return null;
  const k = a / b.life;
  for (let i = 0; i < b.n; i++) {
    let al = Math.pow(1 - k, 1.3);
    if (b.crackle && k > .5) al *= rnd(i, Math.floor(a * 22)) > .45 ? 1.4 : 0;
    if (al <= .01) continue;
    const [x1, y1] = particle(b, i, a), [x0, y0] = particle(b, i, Math.max(0, a - b.trail - k * .1));
    const L = a < .12 ? 96 : 58 + 22 * (1 - k);
    line(x0, y0, x1, y1, `hsla(${b.hue + rnd(i, 9) * 16},${b.sat}%,${L}%,${al})`, b.big ? 3.2 : 2.6, mirror);
    if (k < .7) line(x1 - .5, y1, x1 + .5, y1, `rgba(255,255,255,${al * (1 - k)})`, b.big ? 5 : 4, mirror);
  }
  return {x: b.x, y: b.y, v: (b.big ? 1.4 : .5) * Math.exp(-a * 2.2), hue: b.hue, sat: b.sat};
}
let now = 0;
function line(x0, y0, x1, y1, col, w, mirror) {
  if (mirror) {                                    // 河面倒影：上下翻转、压扁、轻轻晃动
    const m = y => HORIZON + (HORIZON - y) * .5;
    y0 = m(y0); y1 = m(y1);
    if (y0 > RIVER_END - 40 && y1 > RIVER_END - 40) return;
    const wob = Math.sin(y1 * .09 + now * 4) * 7;
    x0 += wob; x1 += wob;
  }
  g.strokeStyle = col; g.lineWidth = w; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
}

// 近处人群剪影，闪光时按烟花的颜色描亮轮廓
const heads = [];
for (let x = -20, i = 0; x < W + 40; i++) { const r = 34 + rnd(i, 40) * 16; heads.push({x, r, y: 1810 + rnd(i, 41) * 40}); x += r * 1.55; }
function drawCrowd(light, rim) {
  g.fillStyle = SCENE.crowd;
  g.beginPath(); g.moveTo(0, H);
  heads.forEach(h => { g.lineTo(h.x - h.r * 1.6, h.y + h.r * 2.1); g.arc(h.x, h.y, h.r, Math.PI * .9, Math.PI * 2.1); g.lineTo(h.x + h.r * 1.6, h.y + h.r * 2.1); });
  g.lineTo(W, H); g.closePath(); g.fill();
  if (light > .02) {
    g.strokeStyle = rim(Math.min(.7, light)); g.lineWidth = 2.5;
    heads.forEach(h => { g.beginPath(); g.arc(h.x, h.y, h.r, Math.PI * 1.15, Math.PI * 1.85); g.stroke(); });
  }
  [[190, 1745, -.12], [655, 1735, .08], [930, 1760, -.05]].forEach(([x, y, r]) => {   // 举起的手机
    g.save(); g.translate(x, y); g.rotate(r);
    g.strokeStyle = SCENE.crowd; g.lineWidth = 16; g.lineCap = 'round';
    g.beginPath(); g.moveTo(0, 30); g.lineTo(-10, 150); g.stroke();
    g.fillStyle = SCENE.crowd; g.fillRect(-21, -38, 42, 76);
    g.fillStyle = `rgba(${SCENE.screen},${.45 + light * .4})`; g.fillRect(-17, -33, 34, 66);
    g.restore();
  });
}

// ---- 文字 ----
function setFont(size, weight = 500, spacing = 0) {
  g.font = `${weight} ${size}px ${FONT}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function text(s, x, y, size, color, weight = 500, align = 'left', spacing = 0) {
  setFont(size, weight, spacing); g.fillStyle = color; g.textAlign = align; g.fillText(s, x, y);
  if ('letterSpacing' in g) g.letterSpacing = '0px';
}
// 解码效果：未解开的字位显示随机字符
const GLYPHS = 'NIGATA新潟長岡花火信濃川0123456789#/+*';
function scramble(s, p, t) {
  const n = Math.floor(p * s.length);
  return [...s].map((c, i) => i < n || c === ' ' ? c : GLYPHS[Math.floor(rnd(i, Math.floor(t * 24)) * GLYPHS.length)]).join('');
}
function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 标题块（含动效）：解码的眉题、被烟花照亮的大标题、扫光、依次弹起的标签
const titleCv = document.createElement('canvas'); titleCv.width = W; titleCv.height = 180;
function drawTitle(t, glow) {
  // 眉题：每个循环在第 3.6 秒「重新解码」一次
  const dec = clamp((t - 3.6) / .9);
  const eyebrow = t > 3.6 && t < 4.5 ? scramble('NIIGATA / 新潟县长冈市', dec, t) : 'NIIGATA / 新潟县长冈市';
  g.fillStyle = TYPE.blue; g.fillRect(80, 232, 8, 34);
  text(eyebrow, 104, 262, 30, TYPE.accent, 600, 'left', 6);

  // 大标题：先画到单独的画布上，再叠加扫光，最后带着烟花颜色的光晕贴回来
  const tc = titleCv.getContext('2d');
  tc.clearRect(0, 0, W, 180);
  tc.globalCompositeOperation = 'source-over';
  tc.font = `800 128px ${FONT}`; tc.fillStyle = TYPE.text; tc.textAlign = 'left';
  if ('letterSpacing' in tc) tc.letterSpacing = '10px';
  tc.fillText('长冈花火', 0, 140);
  const sweep = fract((t - 1.0) / 10) * 10;        // 每 10 秒扫一次光
  if (sweep < 1.2) {
    const sx = -300 + sweep / 1.2 * 1100;
    const sg = tc.createLinearGradient(sx, 0, sx + 260, 180);
    sg.addColorStop(0, 'rgba(105,176,255,0)'); sg.addColorStop(.5, 'rgba(160,210,255,.95)'); sg.addColorStop(1, 'rgba(105,176,255,0)');
    tc.globalCompositeOperation = 'source-atop'; tc.fillStyle = sg; tc.fillRect(0, 0, W, 180);
  }
  g.save();
  if (glow.v > .03) { g.shadowColor = glow.col; g.shadowBlur = 20 + glow.v * 40; }
  g.drawImage(titleCv, 72, 262);
  g.restore();

  // 标签：每个循环在第 2 秒依次弹一下
  let x = 80;
  ['日本三大花火', '8 月 2–3 日', '信浓川'].forEach((s, i) => {
    setFont(28, 600, 2); const w = g.measureText(s).width + 44;
    const sc = 1 + .12 * bump(t - 2.0 - i * .14);
    g.save(); g.translate(x + w / 2, 470); g.scale(sc, sc);
    roundRect(-w / 2, -26, w, 52, 26);
    g.fillStyle = 'rgba(24,119,242,.22)'; g.fill();
    g.strokeStyle = TYPE.blue; g.lineWidth = 2; g.stroke();
    text(s, 0, 10, 28, TYPE.text, 600, 'center', 2);
    g.restore();
    x += w + 14;
  });
  text('出处：长冈花火财团；观光厅多言语解说数据库', 80, 532, 20, 'rgba(255,255,255,.4)', 400);
}

// 数据标注 1：「凤凰」—— 标尺跟着第一波烟花从左往右长，数字同步从 0 数到 2
function drawPhoenix(t) {
  const vis = fade(t, 4.6, 10.6, .4);
  if (vis <= 0) return;
  const p = clamp((t - 4.8) / (15 * .13));
  const x0 = 70, x1 = x0 + 945 * easeOut(p), y = 1205;
  g.globalAlpha = vis;
  g.strokeStyle = TYPE.accent; g.lineWidth = 3;
  g.beginPath(); g.moveTo(x0, y - 14); g.lineTo(x0, y + 14); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
  g.beginPath(); g.moveTo(x1, y - 14); g.lineTo(x1, y + 14); g.stroke();
  g.fillStyle = TYPE.text; g.beginPath(); g.arc(x1, y, 6, 0, TAU); g.fill();
  const km = (2 * easeOut(p)).toFixed(1);
  roundRect(W / 2 - 200, 1010, 400, 160, 18); g.fillStyle = TYPE.panel; g.fill();
  text(km, W / 2 + 30, 1104, 92, TYPE.text, 800, 'right');
  text('公里', W / 2 + 44, 1102, 40, TYPE.accent, 700, 'left');
  text('「凤凰」横向展开', W / 2, 1150, 30, TYPE.soft, 600, 'center', 2);
  g.globalAlpha = 1;
}

// 数据标注 2：正三尺玉 —— 直径标尺跟着烟花一起张开，数字同步数到 650
function drawSanshaku(t) {
  const a = t - SANSHAKU;
  const vis = clamp(a / .25) * clamp((19.3 - t) / .6);
  if (vis <= 0) return;
  const r = SK.R * .93 * (1 - Math.exp(-3.1 * a)), cx = SK.x, cy = SK.y;
  const m = Math.round(650 * easeOut(a / 1.6));
  g.globalAlpha = vis;
  g.strokeStyle = TYPE.accent; g.lineWidth = 3; g.setLineDash([10, 8]);
  g.beginPath(); g.moveTo(cx - r, cy); g.lineTo(cx + r, cy); g.stroke(); g.setLineDash([]);
  [-1, 1].forEach(d => { g.beginPath(); g.moveTo(cx + d * r, cy - 16); g.lineTo(cx + d * r, cy + 16); g.stroke(); });
  roundRect(cx - 190, cy - 140, 380, 116, 18); g.fillStyle = TYPE.panel; g.fill();
  text(String(m), cx + 40, cy - 52, 92, TYPE.text, 800, 'right');
  text('米', cx + 54, cy - 54, 40, TYPE.accent, 700, 'left');
  roundRect(cx - 190, cy + 24, 380, 60, 14); g.fillStyle = TYPE.panel; g.fill();
  text('正三尺玉 · 一发的直径', cx, cy + 64, 30, TYPE.text, 600, 'center', 2);
  g.globalAlpha = 1;
}

function render(t) {
  now = t = fract(t / T) * T;
  // 镜头：缓慢呼吸式推拉；正三尺玉炸开时震一下
  const zoom = 1 + .035 * (.5 - .5 * Math.cos(TAU * t / T));
  const sa = t - SANSHAKU, shake = sa > 0 && sa < .7 ? Math.exp(-sa * 6) * 14 : 0;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, 540 * (1 - zoom) + Math.sin(sa * 70) * shake, 1000 * (1 - zoom) + Math.cos(sa * 55) * shake);

  g.globalCompositeOperation = 'source-over';
  g.drawImage(bg, 0, 0);
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const lights = [];
  g.save(); g.beginPath(); g.rect(0, 0, W, HORIZON - 8); g.clip();
  bursts.forEach(b => { const l = drawBurst(b, t, false); if (l) lights.push(l); });
  g.restore();
  g.save(); g.beginPath(); g.rect(0, HORIZON + 2, W, RIVER_END - HORIZON - 30); g.clip();
  g.globalAlpha = .34; bursts.forEach(b => drawBurst(b, t, true)); g.globalAlpha = 1;
  g.restore();

  // 每一发烟花用自己的颜色照亮周围的天空
  let light = 0, glow = {v: 0, col: 'transparent'};
  lights.forEach(l => {
    light += l.v;
    const col = `hsla(${l.hue},${l.sat}%,62%,`;
    const gr = g.createRadialGradient(l.x, l.y, 20, l.x, l.y, 700);
    gr.addColorStop(0, col + Math.min(.16, l.v * .16 / Math.sqrt(lights.length)) + ')'); gr.addColorStop(1, col + '0)');
    g.fillStyle = gr; g.fillRect(0, 0, W, RIVER_END);
    if (l.v > glow.v) glow = {v: l.v, col: `hsla(${l.hue},${Math.max(30, l.sat)}%,62%,${Math.min(.9, l.v)})`};
  });
  g.globalCompositeOperation = 'source-over';
  drawCrowd(light, a => glow.col.replace(/[\d.]+\)$/, a + ')'));
  g.setTransform(1, 0, 0, 1, 0, 0);

  // 正三尺玉的白色闪光
  if (sa > 0 && sa < .5) { g.fillStyle = `rgba(255,248,230,${.24 * (1 - sa / .5)})`; g.fillRect(0, 0, W, H); }

  // 文字层（不跟镜头动，保证清晰）
  const tg = g.createLinearGradient(0, 0, 0, 600);
  tg.addColorStop(0, 'rgba(1,3,12,.85)'); tg.addColorStop(1, 'rgba(1,3,12,0)');
  g.fillStyle = tg; g.fillRect(0, 0, W, 600);
  drawTitle(t, glow);
  drawPhoenix(t);
  drawSanshaku(t);
}

// ---- 播放 ----
window.render = render;
window.LOOP_SECONDS = T;
const ready = document.fonts ? document.fonts.ready : Promise.resolve();
if (!new URLSearchParams(location.search).has('record')) {
  ready.then(() => {
    const start = performance.now();
    const tick = () => { render((performance.now() - start) / 1000); requestAnimationFrame(tick); };
    tick();
  });
} else ready.then(() => { render(0); window.READY = true; });
</script>
</body>
</html>
