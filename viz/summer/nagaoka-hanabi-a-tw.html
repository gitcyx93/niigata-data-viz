// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(N, N), d = img.data;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;
    d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = Math.round(255 * Math.pow(Math.max(0, 1 - r), falloff));
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function verticalSprite(key, stops) {                 // 竖直方向的渐变条：stops = [[位置0~1, [r,g,b,a]], ...]
  if (sprites[key]) return sprites[key];
  const N = 512, c = document.createElement('canvas'); c.width = 1; c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(1, N), d = img.data;
  for (let j = 0; j < N; j++) {
    const u = (j + .5) / N; let k = 0; while (k < stops.length - 2 && u > stops[k + 1][0]) k++;
    const [u0, a] = stops[k], [u1, b] = stops[k + 1], f = clamp((u - u0) / (u1 - u0));
    for (let n = 0; n < 4; n++) d[j * 4 + n] = Math.round(a[n] + (b[n] - a[n]) * f);
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function glowAt(rgb, alpha, x, y, rx, ry = rx, falloff) {
  if (alpha <= .002) return;
  g.globalAlpha = Math.min(1, alpha); g.drawImage(radialSprite(rgb, falloff), x - rx, y - ry, rx * 2, ry * 2); g.globalAlpha = 1;
}
const hsl2rgb = (h, s, l) => {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => 255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
};

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========
// 繁体版（<html lang="zh-TW">）自动换成思源黑体繁体
const TC = document.documentElement.lang === 'zh-TW';
const FONTS = TC ? {
  cjk:   '"Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',
  latin: '"Sora","Source Han Sans TC",sans-serif',
} : {
  cjk:   '"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',
  latin: '"Sora","Source Han Sans SC",sans-serif',
};
// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {
  g.font = `${weight} ${size}px ${FONTS[fam]}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function resetSpacing(c = g) { if ('letterSpacing' in c) c.letterSpacing = '0px'; }
function measure(s, size, weight = 400, spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {

}
function text(s, x, y, size, color, weight = 400, align = 'left', spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {

  setFont(size, weight, spacing, fam); g.textAlign = 'left'; g.fillStyle = color; g.fillText(s, left, y); resetSpacing();

}
// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {

}
function roundRect(x, y, w, h, r) {

  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

function scene(t, from, to) {

// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
function drawStory(t, story, color = NARRATION, bar = TYPE.accent, shadow = null) {
  story.forEach(([from, to, s]) => {
    if (t < from || t > to) return;

    let x = 100;
    [...s].forEach((c, i) => {
      const p = clamp((t - from - i * .05) / .45);           // 每个字晚 0.05 秒出现
      if (p > 0) { g.globalAlpha = ease(p) * out; g.fillStyle = color; g.fillText(c, x, y + 8 * (1 - ease(p))); if (shadow) g.fillText(c, x, y + 8 * (1 - ease(p))); }   // 有字影时叠两次，字影更实
      x += g.measureText(c).width;

}

function titleLayer(key, paint) {

    const c = document.createElement('canvas'); c.width = 860; c.height = 300;
    const x = c.getContext('2d');
    x.font = `800 132px ${FONTS.cjk}`; if ('letterSpacing' in x) x.letterSpacing = '6px';
    paint(x); titleLayers[key] = c;

}
const titleWork = document.createElement('canvas'); titleWork.width = 860; titleWork.height = 300;
const mask = () => titleLayer('mask', x => { x.fillStyle = '#fff'; x.fillText(titleText, TX, TB); });
const titleShadow = () => titleLayer('shadow', x => {
  x.shadowColor = 'rgba(0,0,0,.42)'; x.shadowBlur = 26; x.shadowOffsetY = 6; x.shadowOffsetX = 5000; x.fillStyle = '#000'; x.fillText(titleText, TX - 5000, TB);
});
const silver = () => titleLayer('silver', x => {
  const top = TB - 112, m = x.createLinearGradient(0, top, 0, TB + 12);
  m.addColorStop(0, '#f8fafd'); m.addColorStop(.55, '#dce2eb'); m.addColorStop(1, '#b2bdcd');
  x.fillStyle = m; x.fillText(titleText, TX, TB);
});
const bevel = () => titleLayer('bevel', x => {
  x.fillStyle = 'rgba(255,255,255,.85)'; x.fillText(titleText, TX, TB - 2);          // 上沿亮边
  x.globalCompositeOperation = 'destination-out'; x.fillText(titleText, TX, TB);
  x.globalCompositeOperation = 'source-over'; x.fillStyle = 'rgba(18,26,44,.45)'; x.fillText(titleText, TX, TB + 2.5);   // 下沿暗边
  x.globalCompositeOperation = 'destination-in'; x.fillText(titleText, TX, TB);
});
// 外浮雕：把字形模糊一下当成高度，按「光从左上方照下来」算字外一圈的明暗：
// 左上方贴着字边一道细亮边，右下方一道柔和的暗边，字像从背景里微微凸出来。字面本身不变。
// 只在第一次用到时算一次，之后每帧贴图
function blurF(a, w, h, r) {                   // 三次盒式模糊 ≈ 高斯模糊
  const tmp = new Float32Array(w * h), n = 2 * r + 1;
  for (let k = 0; k < 3; k++) {
    for (let y = 0; y < h; y++) {
      let acc = 0; const o = y * w;
      for (let x = -r; x <= r; x++) acc += a[o + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc / n; acc += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) { a[y * w + x] = acc / n; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }
  }
  return a;
}
const RELIEF = {r: 2, k: 7, hi: .55, lo: .85};     // 坡宽、坡度、亮边和暗边的强度
const relief = () => titleLayer('relief', x => {
  const w = 860, h = 300, m = mask().getContext('2d').getImageData(0, 0, w, h).data;
  const Hm = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) Hm[i] = m[i * 4 + 3] / 255;
  blurF(Hm, w, h, RELIEF.r);
  const L = [-.5, -.7, .5], ll = Math.hypot(...L); L[0] /= ll; L[1] /= ll; L[2] /= ll;
  const img = x.createImageData(w, h), d = img.data;
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    const i = y * w + xx, out = 1 - m[i * 4 + 3] / 255;
    if (!out) continue;
    const gx = (Hm[i + 1] - Hm[i - 1]) / 2 * RELIEF.k, gy = (Hm[i + w] - Hm[i - w]) / 2 * RELIEF.k;
    const sh = (-gx * L[0] - gy * L[1] + L[2]) / Math.hypot(gx, gy, 1) - L[2];
    if (Math.abs(sh) < .004) continue;
    const j = i * 4, v = Math.min(1, Math.abs(sh) * 1.6);
    if (sh > 0) { d[j] = d[j + 1] = d[j + 2] = 255; d[j + 3] = v * RELIEF.hi * out * 255; }
    else { d[j] = 6; d[j + 1] = 8; d[j + 2] = 14; d[j + 3] = v * RELIEF.lo * out * 255; }

});

// 标题区：NIIGATA + 地名 / 金属大标题 / 讲故事的小字
// header = {title, place, story, sheen: [x, y, w, h]（字面映出的那块画面，只取天空，不要深色的山）,
//           可选 storyColor / accent：小字和 NIIGATA、竖线的颜色（固定值或 t => 颜色）；
//           storyShadow: 旁白小字的字影颜色（背景亮时用）；

function drawHeader(t, L, header) {
  titleText = header.title;
  const pick = v => typeof v === 'function' ? v(t) : v;      // 颜色可以是固定值，也可以随时间变（如跟着故事由冷变暖）
  const narr = pick(header.storyColor) || NARRATION, accent = pick(header.accent) || TYPE.accent;
  const ew = text('NIIGATA', 80, 262, 26, accent, 500, 'left', 8);
  text(header.place, 80 + ew + 22, 262, 26, narr, 400, 'left', 4);
  const X = 74 - TX, Y = 404 - TB;
  g.drawImage(titleShadow(), X, Y);
  g.drawImage(relief(), X, Y);
  const w = titleWork.getContext('2d');

  w.drawImage(silver(), 0, 0);
  const reflect = header.reflect !== false;

    const sc = sheen.getContext('2d');
    sc.setTransform(1, 0, 0, -1, 0, 24);
    sc.drawImage(cv, ...header.sheen, 0, 0, 96, 24);

    w.globalAlpha = 1;
  }
  if (reflect && L.light > .03) {                                       // 高光：跟着光源的位置和颜色
    const hx = TX + clamp(L.x / W) * 600;
    w.globalCompositeOperation = 'source-over'; w.globalAlpha = Math.min(.5, L.light * .38);
    w.drawImage(radialSprite(L.lc, 1.3), hx - 280, TB - 190, 560, 240);

  w.drawImage(bevel(), 0, 0);

}
// 文字层底下的压暗：上面托住标题，下面托住大字（y0 ~ y0+h 的中间最暗）
function scrims(bandY = 1300, bandH = 320, top = 204, band = 158) {
  g.drawImage(verticalSprite('topscrim' + top, [[0, [1, 3, 12, top]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.drawImage(verticalSprite('band' + band, [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, band]], [1, [1, 3, 12, 0]]]), 0, bandY, W, bandH);
}

// ======== 播放和导出 ========
// render(t) 必须是确定性的：同一个 t 永远画出同一帧（逐帧录制靠这个）。?record 时不自动播放，等录制脚本调用。
async function loadFonts() {
  if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {
    const f = new FontFace(family, `url(data:font/woff2;base64,${b64})`, {weight, unicodeRange: range});

}
function boot(render) {

<script>
// 長岡花火（新潟縣長岡市）—— 夏季場景，方案 A「標尺」：數字和標尺直接畫在夜景裡，跟著煙花一起動。
// 節奏：開場 → 正三尺玉（預熱）→ 鳳凰從左往右、再從右往左掃場 → 鳳凰展翅（全片高潮）→ 金色垂柳 → 提醒。
// 文字分兩層：左上角的小字「講故事」（逐字漸入，娓娓道來）；河面上的大字「給數字」（名字、規模、提醒）。
// 鳳凰這一段的順序：先鋪背景（地震）→ 報名字和規模（PHOENIX、2 公里）→ 高潮時不放字 → 餘暉裡講意義（為復興祈願）。

// ======== 場景（方案 A / B 共用）========
const SCENE = {
  skyTop:'#020309', skyMid:'#070b22', skyLow:'#1a1638', hills:'#05071a', city:'#04060f',
  bridge:'#010205', riverTop:'#0f0d26', river:'#03040d', shore:'#010206', crowd:'#000105',
  lamp:'255,214,150', screen:'190,215,255',
  // 煙花顏色 [色相, 飽和度]：0 金 1 紅 2 品紅 3 綠 4 青 5 白 6 銀藍
  fw:[[42,95],[355,92],[318,88],[138,75],[188,92],[0,0],[210,45]]
};

const T = 20;
const HORIZON = 1290, RIVER_END = 1770;

// ---- 煙花編排 ----
const bursts = [];
function shell(t0, x, y, R, c, o = {}) {
  const [hue, sat] = SCENE.fw[c];
  bursts.push(Object.assign({t0, x, y, R, hue, sat, n: 70, life: 2.4, G: 46, rise: 1.1, trail: .14, crackle: false}, o));
}
// 開場：上一輪最後半秒已經升空，第 0 秒正好盛開——迴圈播放時首尾無縫銜接（第一幀可當封面）
shell(T - .7, 540, 830, 280, 1, {n: 120, life: 3.0, rise: .3});
shell(0.2, 540, 830, 150, 0, {n: 60, life: 2.6, rise: .25});
shell(0.9, 250, 930, 180, 3);
shell(1.6, 840, 880, 200, 2);
// 正三尺玉（預熱）
const SK = {t: 3.2 + 1.6, x: 540, y: 880, R: 330};
shell(3.2, SK.x, SK.y, SK.R, 0, {n: 300, life: 4.4, G: 62, rise: 1.6, trail: .3, crackle: true, big: true, sat: 75});
shell(3.2, SK.x, SK.y, SK.R * .42, 5, {n: 100, life: 2.0, rise: 1.6, trail: .2});
// 鳳凰：先從左往右（金白），右往左那一波提早接上、和第一波有重疊（彩色）
const WAVE1 = 8.2 + .8;
for (let i = 0; i < 16; i++) shell(8.2 + i * .11, 70 + i * 63, 960 - Math.sin(i / 15 * Math.PI) * 110, 165, i % 2 ? 0 : 5, {n: 64, life: 2.2, rise: .8});

for (let i = -7; i <= 7; i++) {
  const u = Math.abs(i) / 7;

shell(15.0, 900, 780, 140, 2, {n: 46});
shell(16.3, 860, 760, 150, 4, {n: 50});   // 在淡出前放完，不要跨進下一輪

// ---- 靜態背景（只畫一次）----
const bg = document.createElement('canvas'); bg.width = W; bg.height = H;
(function drawBackground() {
  const b = bg.getContext('2d');
  b.drawImage(verticalSprite('sky', [[0, hex(SCENE.skyTop)], [.6, hex(SCENE.skyMid)], [1, hex(SCENE.skyLow)]]), 0, 0, W, HORIZON);
  for (let i = 0; i < 180; i++) {
    b.fillStyle = `rgba(255,255,255,${.1 + rnd(i, 3) * .35})`;
    b.fillRect(rnd(i, 1) * W, rnd(i, 2) * 1000, 1.6, 1.6);

  for (let x = 0; x <= W; x += 20) b.lineTo(x, HORIZON - 52 - Math.sin(x / 210) * 26 - Math.sin(x / 67) * 8 - (x > 600 ? (x - 600) * .1 : 0));
  b.lineTo(W, HORIZON); b.lineTo(0, HORIZON); b.fill();
  b.fillStyle = SCENE.city;
  for (let x = -10; x < W; ) {
    const w = 18 + rnd(x, 7) * 40, h = 10 + rnd(x, 8) * 38;
    b.fillRect(x, HORIZON - h, w, h);
    for (let k = 0; k < 3; k++) if (rnd(x, k + 20) > .55) {

  b.fillStyle = SCENE.shore; b.fillRect(0, RIVER_END - 30, W, H - RIVER_END + 30);

  b.strokeStyle = SCENE.bridge; b.fillStyle = SCENE.bridge; b.lineWidth = 3;
  const deck = HORIZON - 6, span = 150;
  b.fillRect(-10, deck, W + 20, 7);
  for (let s = -1; s < 8; s++) {

// ---- 單發煙花 ----
function particle(b, i, a) {
  const th = i / b.n * TAU + rnd(i, b.t0) * .12;
  const sp = .78 + rnd(i, b.x) * .32;

  const K = b.trail > .25 ? 4 : 1;

    for (let k = 0; k < K; k++) {
      const ta = a - (a - tail) * k / K, tb = a - (a - tail) * (k + 1) / K;

let now = 0;
const MIRROR = .6;                     // 倒影的透視壓扁比例

    const m = y => HORIZON + (HORIZON - y) * MIRROR;

// 硝煙：幾團慢慢飄的煙，被煙花照亮（背景不要純色）

(function () {

// ---- 倒影 ----
// 先把倒過來的煙花、光柱、橋燈畫到一張半解析度的「水面」畫布上（半解析度本身就帶一點柔和），

const RH = RIVER_END - HORIZON;
const refl = document.createElement('canvas'); refl.width = W / 2; refl.height = RH / 2;
const rctx = refl.getContext('2d');
const LAMPS = []; for (let x = 30; x < W; x += 75) LAMPS.push(x);

  bursts.forEach(b => drawBurst(b, t, true));
  lights.forEach(l => {                            // 光柱：亮的煙花在水面上拉出一道豎向的光
    glowAt(hsl2rgb(l.hue, Math.max(30, l.sat), 70).map(Math.round), Math.min(.55, l.v * .6), l.x, HORIZON + 120, 50 + l.v * 30, 300, 1.3);
  });
  if (ph > 0 && ph < 3.2) glowAt([255, 235, 200], .7 * Math.exp(-ph * 1.4), PHX.x, HORIZON + (HORIZON - PHX.y) * MIRROR, 700, 26, 1.4);
  LAMPS.forEach(x => glowAt([255, 214, 150], .45, x, HORIZON + 34, 5, 34, 1.2));   // 橋燈
  g = main;
  // 切片貼回河面
  const SL = 4;
  g.save(); g.beginPath(); g.rect(-160, HORIZON + 2, W + 320, RH); g.clip();
  for (let y = 0; y < RH; y += SL) {
    const d = y / RH, amp = 1.5 + d * d * 26;
    const dx = Math.sin(y * .09 - TAU * 8 * t / T) * amp + Math.sin(y * .031 + TAU * 3 * t / T) * amp * .45;
    g.globalAlpha = .62 * (1 - d * .7);
    g.drawImage(refl, 0, y / 2, W / 2, SL / 2, dx, HORIZON + y, W, SL + .5);
  }
  // 碎光：落在光柱裡的水面上，忽明忽暗（跟著煙花的亮度）
  lights.forEach(l => {
    if (l.v < .08) return;
    const col = hsl2rgb(l.hue, Math.max(30, l.sat), 78).map(Math.round).join(',');
    for (let k = 0; k < 7; k++) {
      const seed = rnd(k, l.x + l.y), gy = HORIZON + 14 + seed * seed * 330;
      const flick = .5 + .5 * Math.sin(TAU * (4 + k) * t / T + seed * 40);
      const gx = l.x + (rnd(k + 9, l.y) - .5) * (40 + gy - HORIZON) * .35 + Math.sin(gy * .09 - TAU * 8 * t / T) * 8;
      g.globalAlpha = Math.min(.9, l.v * flick); g.fillStyle = `rgb(${col})`;
      g.fillRect(gx - 8 - seed * 10, gy, 16 + seed * 20, 2);
    }
  });
  g.globalAlpha = 1; g.restore();
}

// ---- 近處的觀眾（剪影）----
// 兩排，人不多：每個人都是獨立的一個剪影，彼此之間有空隙，大小、高低、頭的歪斜都不一樣（參差）。
// 剪影是能看出輪廓的深藍，煙花亮時被柔和地染上煙花的顏色（所有正在亮的煙花按亮度加權的平均色，
// 所以跟著煙花同步、平滑地變，不會亂閃），頭頂多一道輪廓光。
// 有幾個人舉著手機（螢幕一直亮著，有豎有橫），還有一臺相機、團扇、騎在肩上的小孩。
const ROWS = [
  {y: 1800, r: [21, 28], gap: [62, 150], base: [18, 24, 48], lit: 1.3, phone: .3},
  {y: 1868, r: [36, 48], gap: [92, 170], base: [9, 13, 28], lit: 1, phone: .28},
];
const crowd = ROWS.map((row, ri) => {
  const people = [];
  for (let x = 20 + rnd(ri, 70) * 60, i = 0; x < W + 50; i++) {
    const q = n => rnd(i * 7 + n, ri * 13 + 3);
    const r = row.r[0] + q(1) * (row.r[1] - row.r[0]);
    const p = {x, r, y: row.y + (q(2) - .5) * r * .9, tilt: (q(3) - .5) * .34, ph: q(4) * TAU};
    if (q(5) < row.phone) p.prop = {kind: 'phone', side: q(6) < .5 ? -1 : 1, land: q(7) < .3, ang: (q(8) - .5) * .4, reach: 1.5 + q(9) * .9};
    people.push(p);
    x += row.gap[0] + q(10) * (row.gap[1] - row.gap[0]);
  }
  return people;
});
// 幾個固定的道具，放在前排和中排的特定位置
(() => {
  const f = crowd[1], b = crowd[0];
  f[1].prop = {kind: 'camera'}; delete f[0].prop;          // 相機旁邊不再放手機，免得擠在一起
  b.forEach(p => { if (Math.abs(p.x - f[1].x) < 120) delete p.prop; });
  f[Math.floor(f.length / 2) + 1].prop = {kind: 'child'};
  f[Math.floor(f.length / 2) - 1].prop = {kind: 'uchiwa'};
  b[Math.floor(b.length * .7)].prop = {kind: 'uchiwa'};
})();
function body(x, y, r, tilt) {                    // 一個人：頭、脖子、肩膀
  g.beginPath(); g.ellipse(x, y + r * 2.25, r * 2.05, r * 1.35, 0, Math.PI, 0);
  g.lineTo(x + r * 2.05, H); g.lineTo(x - r * 2.05, H); g.closePath(); g.fill();
  g.fillRect(x - r * .32, y + r * .6, r * .64, r * 1.0);
  g.beginPath(); g.ellipse(x, y, r * .88, r, tilt, 0, TAU); g.fill();
}
function rimLine(x, y, r, tilt) {                 // 輪廓光：只描頭頂一段
  g.beginPath(); g.ellipse(x, y, r * .88, r, tilt, Math.PI * 1.22, Math.PI * 1.78); g.stroke();
}
// 螢幕：顯示此刻天上的畫面（每幀從畫面裡截一小塊夜空，所有手機共用），表示大家在拍煙花；
// 每部手機隔一陣會「咔嚓」一下：螢幕白閃一瞬
const shot = document.createElement('canvas'); shot.width = 120; shot.height = 160;
function takeShot() { shot.getContext('2d').drawImage(cv, 180, 520, 720, 960, 0, 0, 120, 160); }
function drawScreen(x, y, w, h, t, seed) {
  g.save(); roundRect(x, y, w, h, 2); g.clip();
  const land = w > h, sw = land ? 120 : 90, sh = land ? 90 : 120;      // 橫拿的手機取景也橫過來
  g.drawImage(shot, (120 - sw) / 2, (160 - sh) / 2, sw, sh, x, y, w, h);
  g.fillStyle = 'rgba(70,95,150,.18)'; g.fillRect(x, y, w, h);            // 螢幕的冷色調
  const k = fract(t * 3 / T + seed);                                       // 一輪裡每部手機拍 3 次
  if (k < .014) { g.fillStyle = `rgba(255,255,255,${.85 * (1 - k / .014)})`; g.fillRect(x, y, w, h); }
  g.restore();
}
const mix = (base, lc, k) => `rgb(${base.map((v, i) => Math.round(v + (lc[i] - v) * k)).join(',')})`;
function drawProp(p, x, y, r, fill, light, lc, t) {
  const pr = p.prop;
  g.fillStyle = fill; g.strokeStyle = fill; g.lineCap = 'round';
  if (pr.kind === 'phone') {                      // 舉著手機：手臂從肩膀伸上去，手機豎著或橫著
    const hx = x + pr.side * r * .9, hy = y - r * pr.reach;
    g.lineWidth = r * .36;
    g.beginPath(); g.moveTo(x + pr.side * r * 1.35, y + r * 1.4); g.lineTo(hx, hy + r * .3); g.stroke();
    const pw = (pr.land ? 1.4 : .78) * r, ph = (pr.land ? .78 : 1.4) * r;
    g.save(); g.translate(hx, hy - ph * .35); g.rotate(pr.ang);
    roundRect(-pw / 2, -ph / 2, pw, ph, r * .15); g.fill();
    drawScreen(-pw / 2 + r * .1, -ph / 2 + r * .1, pw - r * .2, ph - r * .2, t, p.ph / TAU);
    g.restore();
  } else if (pr.kind === 'camera') {              // 雙手舉著相機，從背後看到取景屏
    const cy = y - r * 2.05;
    g.lineWidth = r * .4;
    g.beginPath(); g.moveTo(x - r * 1.3, y + r * 1.4); g.lineTo(x - r * .75, cy + 12); g.moveTo(x + r * 1.3, y + r * 1.4); g.lineTo(x + r * .8, cy + 12); g.stroke();
    roundRect(x - 46, cy - 26, 92, 56, 9); g.fill();
    roundRect(x - 15, cy - 38, 30, 16, 4); g.fill();
    drawScreen(x - 32, cy - 16, 50, 36, t, .37);
  } else if (pr.kind === 'child') {               // 騎在肩上的小孩，雙手舉起
    const cy = y - r * 1.95;
    g.lineWidth = r * .26;
    g.beginPath(); g.moveTo(x - r * .45, cy + r * .75); g.lineTo(x - r * .95, cy - r * .35); g.moveTo(x + r * .45, cy + r * .75); g.lineTo(x + r * .9, cy - r * .4); g.stroke();
    g.beginPath(); g.ellipse(x, cy + r * 1.05, r * .75, r * .62, 0, Math.PI, 0); g.lineTo(x + r * .75, y); g.lineTo(x - r * .75, y); g.fill();
    g.beginPath(); g.ellipse(x, cy, r * .58, r * .64, 0, 0, TAU); g.fill();
  } else if (pr.kind === 'uchiwa') {              // 團扇：舉在臉旁邊
    g.lineWidth = r * .14;
    g.beginPath(); g.moveTo(x + r * 1.25, y + r * 1.3); g.lineTo(x + r * 1.55, y - r * .3); g.stroke();
    g.beginPath(); g.ellipse(x + r * 1.7, y - r * .95, r * .78, r * .7, -.25, 0, TAU); g.fill();
  }
}
function drawCrowd(light, lc, t) {
  takeShot();
  const lit = Math.min(.12, light * .07);         // 被照亮的程度（跟著煙花的亮度走）
  ROWS.forEach((row, ri) => {
    const fill = mix(row.base, lc, lit * row.lit);
    crowd[ri].forEach(p => {
      const y = p.y + Math.sin(TAU * 2 * t / T + p.ph) * 1.4;     // 呼吸般的微微起伏
      if (p.prop) drawProp(p, p.x, y, p.r, fill, light, lc, t);
      g.fillStyle = fill; body(p.x, y, p.r, p.tilt);
    });
    // 頭頂輪廓光：平時也有一點點（夜空的餘光），煙花亮時變強；越靠前越明顯
    g.strokeStyle = `rgba(${lc},${Math.min(.55, .06 + light * .5) * (.6 + ri * .4)})`; g.lineWidth = 1.5 + ri * .5;
    crowd[ri].forEach(p => rimLine(p.x, p.y + Math.sin(TAU * 2 * t / T + p.ph) * 1.4, p.r, p.tilt));
  });
}

// ---- 左上角：標題和講故事的小字（樣式在 series.js，全系列統一）----
const STORY = [
  [0.25, 4.2, '長岡花火大會，是日本三大花火大會之一。'],
  [4.5, 7.4, '三大花火大會分別是：新潟長岡、秋田大曲、茨城土浦。'],
  [7.6, 10.15, '2004 年，中越地震重創了這片土地。'],
  [10.3, 14.8, '第二年起，PHOENIX 在這裡升起，為復興祈願。'],
  [15.4, 19.4, '每年 8 月 2 日、3 日，在信濃川河畔。'],
];
const HEADER = {title: '長岡花火', place: '新潟縣長岡市', story: STORY, sheen: [60, 420, W - 120, 760]};   // 字面只映夜空（不含遠山和橋）

// ======== 河面上的大字：名字、數字、提醒 ========
const LINE1 = 1440, LINE2 = 1500;      // 河面上的文字基線

function typoBack(t) {}
function typoFront(t) {
  const S = TS();
  // ① 規模
  let s = scene(t, 0.6, 4.3);
  rise(s, () => {
    line([['20,000', ...S.num.slice(0, 1), TYPE.gold, S.num[1], S.num[2]], ['  發 / 兩晚', S.unit[0], WHITE, S.unit[1], S.unit[2]]], LINE1);
    text('每年到場觀看的人超過 100 萬', W / 2, LINE2 + 10, S.sub[0], SOFT, S.sub[1], 'center', S.sub[2]);
  });

  // ② 正三尺玉：直徑標尺跟著煙花張開，數字同步數到 650（標在煙花上，不墊卡片）
  const a = t - SK.t, sv = clamp((a - .1) / .3) * clamp((8.4 - t) / .4);
  if (sv > 0) {
    const r = SK.R * .93 * (1 - Math.exp(-3.1 * a));
    g.save(); g.globalAlpha = sv; g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(SK.x - r, SK.y); g.lineTo(SK.x + r, SK.y); g.stroke();
    [-1, 1].forEach(d => { g.beginPath(); g.moveTo(SK.x + d * r, SK.y - 14); g.lineTo(SK.x + d * r, SK.y + 14); g.stroke(); });
    line([[String(Math.round(650 * easeOut(a / 1.6))), S.num[0] * .85, WHITE, 300, S.num[2], '650'], [' m', S.unit[0], TYPE.accent, S.unit[1], 0]], SK.y - 28);
    g.restore();
  }
  s = scene(t, 5.0, 8.4);
  rise(s, () => {
    text('正三尺玉', W / 2, LINE1, S.name[0], WHITE, S.name[1], 'center', S.name[2]);
    text('一發炸開的直徑，約 6 個足球場首尾相接', W / 2, LINE2 + 4, S.sub[0], SOFT, S.sub[1], 'center', S.sub[2]);
  });

  // ③ PHOENIX：煙花一開始就報名字（字母從中間往兩邊展開）；標尺跟著第一波從左往右伸，數字數到 2.0；高潮前收掉
  s = scene(t, 8.6, 11.35);
  if (s) {
    const word = 'PHOENIX', ws = [...word].map(c => measure(c, S.word[0], S.word[1]));
    let x = (W - ws.reduce((p, q) => p + q, 0) - S.word[2] * 6) / 2;
    g.save(); g.translate(0, (1 - s.p) * 40);
    [...word].forEach((c, i) => {
      const p = easeOut((t - 8.6 - Math.abs(i - 3) * .09) / .5);
      g.globalAlpha = p * s.out; text(c, x + (i - 3) * 14 * (1 - p), LINE1, S.word[0], WHITE, S.word[1]); x += ws[i] + S.word[2];
    });
    g.restore();
    const p = easeOut((t - WAVE1) / (15 * .11 + .2)), x0 = 70, x1 = x0 + 940 * p, y = 1230;
    g.save(); g.globalAlpha = s.out * clamp((t - WAVE1 + .2) / .3); g.strokeStyle = 'rgba(255,255,255,.7)'; g.lineWidth = 1.5;
    g.beginPath(); g.moveTo(x0, y - 12); g.lineTo(x0, y + 12); g.moveTo(x0, y); g.lineTo(x1, y); g.moveTo(x1, y - 12); g.lineTo(x1, y + 12); g.stroke();
    g.fillStyle = WHITE; g.beginPath(); g.arc(x1, y, 5, 0, TAU); g.fill();
    g.translate(0, (1 - s.p) * 40);
    line([['橫跨約 ', S.sub[0] + 4, SOFT, S.sub[1], 0], [(2 * p).toFixed(1), 52, TYPE.gold, 300, 0, '2.0'], [' km', S.sub[0] + 4, SOFT, S.sub[1], 0]], LINE2 + 30);
    g.restore();
  }

  // ④ 提醒：左對齊，放在畫面中部的夜空裡（這時煙花已經放完，和左上角的標題呼應）
  s = scene(t, 15.2, 19.6);
  rise(s, () => {
    text('觀覽席很搶手，', 80, 1046, 60, WHITE, 300, 'left', 4);
    text('記得提前預訂。', 80, 1126, 60, WHITE, 300, 'left', 4);
  });
  rise(scene(t, 15.6, 19.6), () => {
    g.fillStyle = TYPE.coral; g.beginPath(); g.arc(88, 1194, 7, 0, TAU); g.fill();
    text('也可以聯絡旅行社哦！', 108, 1206, 36, TYPE.gold, 400, 'left', 2);
  });
}

// ======== 渲染 ========
function hits(t) {           // 正三尺玉的衝擊
  const sa = since(t, SK.t);
  return sa < 3 ? [{e: SK, sa, s: 1}] : [];
}
function render(t) {
  now = t = fract(t / T) * T;
  let zoom = 1, ox = 0, oy = 0, cx = 540, cy = 900;
  hits(t).forEach(({e, sa}) => {               // 正三尺玉：猛推一下，重重地震，餘震慢慢平息
    zoom += .1 * Math.exp(-sa * 2.6) * clamp(sa / .06);
    const sh = sa < 1.6 ? Math.exp(-sa * 3.2) * 46 : 0;
    ox += Math.sin(sa * 62) * sh; oy += Math.cos(sa * 47) * sh * 1.2; cx = e.x; cy = e.y;
  });
  const ph = t - PHX.t;                        // PHOENIX：掃場時慢慢推近（吸氣），綻放後舒展地拉遠（呼氣），不震
  if (ph > -2.7 && ph < 3.5) {
    zoom += ph < 0 ? .05 * ease(clamp((ph + 2.7) / 2.7)) : .05 * (1 - ease(clamp(ph / 3.5)));
    cx = PHX.x; cy = PHX.y;
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, cx * (1 - zoom) + ox, cy * (1 - zoom) + oy);

  g.globalCompositeOperation = 'source-over';
  g.drawImage(bg, 0, 0);
  typoBack(t);
  g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  const lights = [];
  g.save(); g.beginPath(); g.rect(0, 0, W, HORIZON - 8); g.clip();
  bursts.forEach(b => { const l = drawBurst(b, t, false); if (l) lights.push(l); });
  g.restore();

  let light = 0, glow = {v: 0, col: 'transparent'}, lc = [0, 0, 0], lx = 0;
  lights.forEach(l => {
    light += l.v;
    glowAt(hsl2rgb(l.hue, l.sat, 62).map(Math.round), Math.min(.16, l.v * .16 / Math.sqrt(lights.length)), l.x, l.y, 700, 700, 1);
    if (l.v > glow.v) glow = {v: l.v, hue: l.hue, sat: l.sat, col: `hsla(${l.hue},${Math.max(30, l.sat)}%,62%,${Math.min(.9, l.v)})`};
    const c = hsl2rgb(l.hue, Math.max(30, l.sat), 66); lc = lc.map((v, i) => v + c[i] * l.v); lx += l.x * l.v;
  });
  // 觀眾身上的光：所有正在亮的煙花按亮度加權平均出一個顏色（不會因為「最亮的那發」換了而突然變色）
  lc = light > 0 ? lc.map(v => Math.round(v / light)) : [255, 220, 170];
  // 正三尺玉：兩圈衝擊波 + 一次強閃光
  hits(t).forEach(({e, sa}) => {
    [0, .18].forEach((d, k) => {
      const q = sa - d;
      if (q > 0 && q < 1.1) {
        g.strokeStyle = `rgba(255,226,170,${(.7 - k * .3) * (1 - q / 1.1)})`; g.lineWidth = 14 * (1 - q / 1.1) + 2;
        g.beginPath(); g.arc(e.x, e.y, 80 + easeOut(q / 1.1) * 1050, 0, TAU); g.stroke();
      }
    });
    if (sa < .8) {                                     // 整屏暖色 + 炸點周圍更亮
      const k = Math.pow(1 - sa / .8, 2);
      g.fillStyle = `rgba(255,170,90,${.3 * k})`; g.fillRect(-160, -160, W + 320, H + 320);
      glowAt([255, 236, 190], .7 * k, e.x, e.y, 1400, 1400, 1);
    }
  });
  // PHOENIX：一道橫貫整個畫面的光帶（像翅膀展開的那一下），然後整片天空從地平線泛起金色
  if (ph > 0 && ph < 3.2) {
    const k = Math.exp(-ph * 1.4), wv = .35 + .65 * easeOut(ph / .5);
    glowAt([255, 240, 210], .85 * k, PHX.x, PHX.y, 40 * wv * 18, 40, 1.4);     // 橫向光帶
    glowAt([255, 214, 140], .45 * k, PHX.x, PHX.y, 900 * 1.8, 900 * .55, 1);    // 兩翼的大片暖光
    const sk = .32 * Math.sin(Math.PI * clamp(ph / 3.2));                        // 天空從地平線泛起金色
    g.globalAlpha = sk;
    g.drawImage(verticalSprite('skywash', [[0, [255, 180, 90, 0]], [1, [255, 180, 90, 255]]]), -160, 300, W + 320, HORIZON - 300);
    g.globalAlpha = 1;
  }
  g.globalAlpha = Math.min(.42, .08 + light * .22);                 // 硝煙隨煙花變亮
  g.drawImage(smoke, -100 + Math.sin(TAU * t / T) * 60, 380);
  g.globalAlpha = 1;
  drawReflection(t, lights, ph);
  g.globalCompositeOperation = 'source-over';
  drawCrowd(light, lc, t);
  g.setTransform(1, 0, 0, 1, 0, 0);

  // 文字層（不跟鏡頭動，保證清晰）
  g.drawImage(verticalSprite('topscrim', [[0, [1, 3, 12, 204]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.drawImage(verticalSprite('riverband', [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, 158]], [1, [1, 3, 12, 0]]]), 0, 1300, W, 320);   // 河面上壓一點暗，托住文字
  drawHeader(t, {light, lc, x: light > 0 ? lx / light : W / 2}, HEADER);
  typoFront(t);
}

boot(render);
</script>
