function drawGondola(t) {
  for (let i = 0; i < 9; i++) [0, 1].forEach(dir => {

const LINE1 = 1440, LINE2 = 1500;
// 积雪标尺：从地面往上长到平年最深积雪 208 cm，旁边站一个 170 cm 的人作比例
const SNOW = {x: 110, base: FIELD - 14, px: 1.5, t: 4.8};      // 放在左边暗色的山坡上，不和大字重叠
function drawRuler(t) {
  const a = t - SNOW.t, sv = clamp((a - .1) / .3) * clamp((8.9 - t) / .4);
  if (sv <= 0) return;
  const cm = 208 * easeOut(a / 1.8), top = SNOW.base - cm * SNOW.px;
  g.save(); g.globalAlpha = sv; g.strokeStyle = 'rgba(255,255,255,.75)'; g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(SNOW.x, SNOW.base); g.lineTo(SNOW.x, top); g.stroke();
  for (let c = 0; c <= cm; c += 50) { const y = SNOW.base - c * SNOW.px; g.beginPath(); g.moveTo(SNOW.x - (c % 100 ? 6 : 12), y); g.lineTo(SNOW.x, y); g.stroke(); }
  g.beginPath(); g.moveTo(SNOW.x - 14, top); g.lineTo(SNOW.x + 14, top); g.stroke();
  g.fillStyle = 'rgba(200,214,240,.16)'; g.fillRect(SNOW.x, top, 140, SNOW.base - top);   // 雪的高度（淡淡的一块）
  // 170 cm 的人（细线画的小人）
  const px = SNOW.x + 70, ph = 170 * SNOW.px, head = 13;
  g.strokeStyle = 'rgba(255,255,255,.6)'; g.lineWidth = 2; g.lineCap = 'round';
  g.beginPath(); g.arc(px, SNOW.base - ph + head, head, 0, TAU);
  g.moveTo(px, SNOW.base - ph + head * 2); g.lineTo(px, SNOW.base - ph * .45);
  g.moveTo(px - 26, SNOW.base - ph * .72); g.lineTo(px, SNOW.base - ph * .78); g.lineTo(px + 26, SNOW.base - ph * .72);
  g.moveTo(px - 16, SNOW.base); g.lineTo(px, SNOW.base - ph * .45); g.lineTo(px + 16, SNOW.base); g.stroke();
  const nw = measure('208', 46, 300);                     // 按最终值的宽度右对齐，数字跳动时不抖
  text(String(Math.round(cm)), SNOW.x + 4 + nw, top - 18, 46, WHITE, 300, 'right', 0);
  text('cm', SNOW.x + 12 + nw, top - 18, 24, TYPE.accent, 400, 'left', 0);
  g.restore();
}
function typoFront(t) {
  const S = TS();
  // ① 交通
  rise(scene(t, 0.6, 4.4), () => {
    line([['最快 ', S.unit[0], WHITE, S.unit[1], S.unit[2]], ['66', S.num[0], TYPE.gold, S.num[1], S.num[2]], [' 分钟', S.unit[0], WHITE, S.unit[1], S.unit[2]]], LINE1);
    text('从东京坐上越新干线，就到越后汤泽', W / 2, LINE2 + 10, S.sub[0], SOFT, S.sub[1], 'center', S.sub[2]);
  });
  // ② 积雪
  drawRuler(t);
  rise(scene(t, 5.0, 8.9), () => {
    text('积雪最深约 2 米', W / 2, LINE1, S.name[0], WHITE, S.name[1], 'center', S.name[2]);
    text('比一个人还高', W / 2, LINE2 + 4, S.sub[0], SOFT, S.sub[1], 'center', S.sub[2]);
  });
  // ③「雪国」：字从中间往两边展开；列车出隧道前收掉
  const s = scene(t, 9.1, 11.5);
  if (s) {
    const word = [...'雪国'], ws = word.map(c => measure(c, S.word[0], S.word[1]));
    let x = (W - ws.reduce((p, q) => p + q, 0) - S.word[2]) / 2;
    g.save(); g.translate(0, (1 - s.p) * 40);
    word.forEach((c, i) => {
      const p = easeOut((t - 9.1 - i * .12) / .6);
      g.globalAlpha = p * s.out; text(c, x + (i - .5) * 30 * (1 - p), LINE1 + 20, S.word[0], WHITE, S.word[1]); x += ws[i] + S.word[2];
    });
    g.restore();
  }
  // ④ 提醒：左对齐，放在画面中部（和左上角的标题呼应）
  const ts = scene(t, 15.2, 19.6);
  if (ts) { g.globalAlpha = ts.out * ts.p * .75; g.drawImage(radialSprite([2, 4, 12], 1.1), -260, 900, 1260, 440); g.globalAlpha = 1; }   // 托住提醒的文字（背后是亮的雪道）
  rise(scene(t, 15.2, 19.6), () => {
    text('想人少，', 80, 1046, 60, WHITE, 300, 'left', 4);
    text('3 月去。', 80, 1126, 60, WHITE, 300, 'left', 4);
  });
  rise(scene(t, 15.6, 19.6), () => {
    g.fillStyle = TYPE.coral; g.beginPath(); g.arc(88, 1194, 7, 0, TAU); g.fill();
    text('雪还很厚，外国游客只有 1 月的一半', 108, 1206, 36, TYPE.gold, 400, 'left', 2);
  });
}

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const a = t - TRAIN.t;
  // 镜头：列车出来前慢慢推近、画面压暗（屏住呼吸），冲出隧道时一片白，然后舒展地拉远
  let zoom = 1;
  if (a > -2.6 && a < 3.5) zoom += a < 0 ? .045 * ease(clamp((a + 2.6) / 2.6)) : .045 * (1 - ease(clamp(a / 3.5)));
  const cx = PORTAL + 200, cy = DECK - 40;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, cx * (1 - zoom), cy * (1 - zoom));
  g.drawImage(bg, 0, 0);
  drawSnow(t, false);
  drawGondola(t);
  // 隧道口：列车快出来时，洞里先亮起来
  const pre = clamp((a + 1.6) / 1.6) * (a < .3 ? 1 : clamp(1 - (a - .3) / .6));
  g.globalCompositeOperation = 'lighter';
  glowAt([255, 240, 215], .9 * pre * pre, PORTAL + 22, DECK - 36, 70 + pre * 120, 50 + pre * 40, 1.4);
  g.globalCompositeOperation = 'source-over';
  drawTrain(t);
  drawSpray(t);
  // 灯笼的亮度轻轻呼吸（一个循环 2 次）
  const lamp = .85 + .15 * Math.sin(TAU * 2 * t / T);
  drawPool(t, lamp);
  g.drawImage(fg, 0, 0);
  drawSteam(t, lamp);
  drawSnow(t, true);
  // 屏住呼吸：出隧道前画面压暗；冲出来的一瞬一片白（像小说里「眼前一片白」），雪扑面而来
  const dim = a > -2.2 && a < 0 ? .38 * ease(clamp((a + 2.2) / 2)) : a >= 0 && a < .2 ? .38 * (1 - a / .2) : 0;
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (dim > 0) { g.fillStyle = `rgba(2,3,8,${dim})`; g.fillRect(0, 0, W, H); }
  const flash = a >= 0 && a < 2.2 ? Math.pow(1 - a / 2.2, 2.6) * clamp(a / .06) : 0;
  if (flash > 0) {
    g.fillStyle = `rgba(236,243,253,${.86 * flash})`; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 60; i++) {                               // 扑面而来的雪：从隧道口方向往镜头飞
      const k = fract(rnd(i, 121) + a * .9), d = Math.pow(k, 2);
      const ang = rnd(i, 122) * TAU, x = PORTAL + 200 + Math.cos(ang) * d * 1000, y = DECK - 60 + Math.sin(ang) * d * 1200;
      glowAt([240, 246, 255], .5 * flash * k, x, y, 4 + d * 26, 4 + d * 26, 1.1);
    }
    g.globalCompositeOperation = 'source-over';
  }

  // 文字层（不跟镜头动，保证清晰）
  scrims(1310, 330, 204, 150);
  const light = .25 + 2.2 * flash + .6 * pre;
  drawHeader(t, {light, lc: [255, 236, 210], x: a > 0 && a < 2.4 ? clamp(trainNose(t), 0, W) : W * .62}, HEADER);
  typoFront(t);
}
boot(render);
</script>
