<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(222,230,244,.68)';      // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;

<script>

function flakePos(f, t) {
  const y = fract(f.y / (H + 60) + f.k * t / T) * (H + 60) - 30;
  const x = ((f.x + f.m * (W + 200) * t / T + Math.sin(TAU * f.sw * t / T + f.ph) * (8 + f.layer * 10)) % (W + 200) + W + 200) % (W + 200) - 100;
  return [x, y];
}
function drawSnow(t, nearLayer) {
  FLAKES.forEach(f => {
    if ((f.layer === 2) !== nearLayer) return;
    const [x, y] = flakePos(f, t);
    if (f.layer === 2) { glowAt([235, 242, 255], f.a * .5, x, y, f.r, f.r, 1.1); return; }
    g.globalAlpha = f.a; g.fillStyle = '#eef3fb'; g.beginPath(); g.arc(x, y, f.r, 0, TAU); g.fill();
  });
  g.globalAlpha = 1;
}

// ---- 温泉：水面、倒影、雪落进水里的涟漪、泡汤的人、白汽 ----
function drawPool(t, lamp) {
  g.drawImage(verticalSprite('pool', [[0, hex(SCENE.waterTop)], [1, hex(SCENE.water)]]), 0, POOL + 10, W, H - POOL);
  g.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 18; k++) {                                         // 灯笼的倒影：被水波打碎成一段段
    const y = POOL + 26 + k * 14, wob = Math.sin(TAU * 3 * t / T + k * .9) * (4 + k * .8);
    g.fillStyle = `rgba(255,196,120,${.42 * lamp * (1 - k / 18)})`; g.fillRect(LANTERN.x - 16 - k * .8 + wob, y, 32 + k * 1.6, 3);
  }
  for (let i = 0; i < 26; i++) {                                          // 水面的波光
    const y = POOL + 30 + rnd(i, 101) * (H - POOL - 60), x = rnd(i, 102) * W + Math.sin(TAU * 2 * t / T + i) * 14;
    g.fillStyle = 'rgba(140,170,220,.12)'; g.fillRect(x - 20, y, 40 + rnd(i, 103) * 30, 1.5);
  }
  g.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 14; i++) {                                          // 雪落进温泉：一圈圈小涟漪
    const u = fract(rnd(i, 161) + 2 * t / T), x = 60 + rnd(i, 162) * (W - 120), y = POOL + 40 + rnd(i, 163) * 220;
    g.strokeStyle = `rgba(170,195,235,${.35 * (1 - u)})`; g.lineWidth = 1.2;
    g.beginPath(); g.ellipse(x, y, 3 + u * 26, 1 + u * 7, 0, 0, TAU); g.stroke();
  }
  [[285, 0], [372, 1]].forEach(([x, k]) => {                              // 泡汤的两个人：只露出头和肩，头上顶着毛巾
    const y = POOL + 74 + Math.sin(TAU * 2 * t / T + k * 2) * 1.5;
    g.fillStyle = '#05080f';
    g.beginPath(); g.ellipse(x, y + 26, 34, 14, 0, Math.PI, 0); g.fill();
    g.beginPath(); g.ellipse(x, y, 17, 20, (k - .5) * .2, 0, TAU); g.fill();
    g.fillStyle = '#c9d3e4'; g.beginPath(); g.ellipse(x, y - 16, 15, 6, (k - .5) * .2, 0, TAU); g.fill();
    g.strokeStyle = 'rgba(255,190,120,.35)'; g.lineWidth = 2; g.beginPath(); g.ellipse(x, y, 17, 20, 0, -.6, .9); g.stroke();
    g.fillStyle = 'rgba(160,190,230,.18)'; g.fillRect(x - 40, y + 26, 80, 1.5);
  });
}
const STEAM = [];
for (let i = 0; i < 46; i++) STEAM.push({x: rnd(i, 111) * (W + 100) - 50, ph: rnd(i, 112), k: 2, s: .7 + rnd(i, 113) * .6, dx: (rnd(i, 114) - .3) * 140});
function drawSteam(t, lamp) {
  STEAM.forEach(p => {
    const u = fract(p.k * t / T + p.ph);
    const y = POOL + 40 - u * 520 * p.s, x = p.x + p.dx * u + Math.sin(u * 5 + p.ph * 9) * 30, r = (70 + u * 230) * p.s;
    const warm = clamp(1 - Math.abs(x - LANTERN.x) / 400) * lamp;
    glowAt([Math.round(205 + 50 * warm), Math.round(214 + 10 * warm), Math.round(232 - 60 * warm)], Math.sin(Math.PI * u) * .15, x, y, r, r * .8, 1.1);
  });
}

// ---- 文字 ----
const STORY = [
  [0.25, 4.3, '越后汤泽，川端康成小说《雪国》的舞台。'],
  [4.5, 8.4, '这里一个冬天下的雪，加起来约 10 米。'],
  [8.6, 11.4, '小说的开头，火车穿过一条长长的隧道——'],
  [16.2, 19.5, '滑完雪，泡进露天温泉，看雪落下来。'],
];
const HEADER = {title: '越后汤泽', place: '新潟县汤泽町', story: STORY, sheen: [60, 520, W - 120, 560]};
const LINE1 = 1458, LINE2 = 1518;
// 余韵里的那句话：竖排，像小说的一页，一个字一个字浮现（右边一列先出来）
const VERSE = {from: 12.9, to: 16.0, cols: [[176, '穿出长长的隧道'], [112, '眼前就是雪国']], y: 600, step: 54};
function drawVerse(t) {
  if (t < VERSE.from || t > VERSE.to) return;
  const out = clamp((VERSE.to - t) / .6);
  let n = 0;
  VERSE.cols.forEach(([x, s]) => [...s].forEach((c, i) => {
    const p = clamp((t - VERSE.from - n++ * .09) / .6);
    if (p <= 0) return;
    g.globalAlpha = ease(p) * out;
    text(c, x, VERSE.y + i * VERSE.step + 10 * (1 - ease(p)), 44, WHITE, 300, 'center');
  }));
  g.globalAlpha = 1;
}
function typoFront(t) {
  const S = TS();
  // ① 开场（第 0 秒就在画面上，当封面）
  rise(scene(t, 19.25, 4.4), () => {
    text('一小时，到雪国', W / 2, LINE1, S.name[0], WHITE, S.name[1], 'center', S.name[2]);
    text('从东京坐上越新干线，最快 66 分钟', W / 2, LINE2 + 4, S.sub[0], SOFT, S.sub[1], 'center', S.sub[2]);
  });
  // ② 雪墙：画面上雪墙小路里有人撑伞走过
  rise(scene(t, 5.0, 8.9), () => {
    text('雪墙比人还高', W / 2, LINE1, S.name[0], WHITE, S.name[1], 'center', S.name[2]);
    text('最深的时候，积雪约 2 米', W / 2, LINE2 + 4, S.sub[0], SOFT, S.sub[1], 'center', S.sub[2]);
  });
  // ③ 隧道和高潮：不放大字，把画面让给列车
  drawVerse(t);
  // ④ 提醒
  rise(scene(t, 15.5, 19.1), () => {
    text('想人少，3 月去', W / 2, LINE1, S.name[0], WHITE, S.name[1], 'center', S.name[2]);
    text('雪还很厚，人比 1、2 月少', W / 2, LINE2 + 4, S.sub[0], TYPE.gold, S.sub[1], 'center', S.sub[2]);
  });
}

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const a = t - TRAIN.t;
  // 镜头：列车出来前慢慢推近、画面压暗（屏住呼吸），冲出隧道时白光炸开，然后舒展地拉远
  let zoom = 1;
  if (a > -2.6 && a < 3.5) zoom += a < 0 ? .045 * ease(clamp((a + 2.6) / 2.6)) : .045 * (1 - ease(clamp(a / 3.5)));
  const cx = PORTAL + 200, cy = DECK - 40 - LIFT;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, cx * (1 - zoom), cy * (1 - zoom));
  const cam = g.getTransform();
  g.drawImage(sky, 0, 0);
  const ox = -fract(t / T) * W;                                   // 雪云慢慢往左飘，一个循环移过一个画面宽
  g.drawImage(clouds, ox, 0); g.drawImage(clouds, ox + W * 2, 0);
  drawSnow(t, false);
  g.drawImage(land, 0, 0);
  // 远景坐标里画的动态：滑雪的人、缆车、温泉街的白汽、隧道口的光、列车、雪雾
  g.setTransform(cam.translate(0, -LIFT));
  drawSkiers(t);
  drawGondola(t);
  drawTownSteam(t);
  const pre = clamp((a + 1.6) / 1.6) * (a < .3 ? 1 : clamp(1 - (a - .3) / .6));
  g.globalCompositeOperation = 'lighter';
  glowAt([255, 240, 215], .9 * pre * pre, PORTAL + 22, DECK - 36, 70 + pre * 120, 50 + pre * 40, 1.4);
  g.globalCompositeOperation = 'source-over';
  drawTrain(t);
  drawSpray(t);
  g.setTransform(cam);
  // 近处：雪地、雪墙小路和撑伞的人、温泉
  g.drawImage(near, 0, 0);
  drawWalkers(t);
  const lamp = .85 + .15 * Math.sin(TAU * 2 * t / T);            // 灯笼轻轻呼吸
  drawPool(t, lamp);
  g.drawImage(front, 0, 0);
  drawSteam(t, lamp);
  drawSnow(t, true);
  // 屏住呼吸：出隧道前画面压暗；冲出来的一瞬，白光从隧道口炸开，一阵暴风雪横扫过画面
  g.setTransform(1, 0, 0, 1, 0, 0);
  const dim = a > -2.2 && a < 0 ? .38 * ease(clamp((a + 2.2) / 2)) : a >= 0 && a < .2 ? .38 * (1 - a / .2) : 0;
  if (dim > 0) { g.fillStyle = `rgba(2,3,8,${dim})`; g.fillRect(0, 0, W, H); }
  const flash = a >= 0 && a < 2.2 ? Math.pow(1 - a / 2.2, 2.6) * clamp(a / .06) : 0;
  if (flash > 0) {
    const px = PORTAL + 22, py = DECK - 36 - LIFT;
    g.globalCompositeOperation = 'lighter';
    glowAt([255, 252, 245], 1.4 * flash, px, py, 300 + easeOut(a / .5) * 1500, 220 + easeOut(a / .5) * 1300, .9);
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = `rgba(236,243,253,${.6 * flash})`; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 90; i++) {                                 // 暴风雪：雪片从隧道口方向横着扫过来
      const sp = .6 + rnd(i, 171) * .8, x = px - 200 + (a * 2600 * sp + rnd(i, 172) * 1400) % 1600;
      const y = py - 700 + rnd(i, 173) * 1500 + (x - px) * (rnd(i, 174) - .3) * .3, len = 30 + sp * 70;
      g.strokeStyle = `rgba(240,246,255,${.55 * Math.min(1, flash * 2.4) * rnd(i, 175)})`; g.lineWidth = 1.5 + rnd(i, 176) * 3;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - len, y - len * .12); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
  }

  // 文字层（不跟镜头动，保证清晰）
  g.globalAlpha = 1 - .85 * flash; scrims(1340, 320, 204, 150); g.globalAlpha = 1;   // 白光炸开时，文字底下的压暗也跟着褪掉
  const light = .25 + 2.2 * flash + .6 * pre;
  drawHeader(t, {light, lc: [255, 236, 210], x: a > 0 && a < 2.4 ? clamp(trainNose(t), 0, W) : W * .62}, HEADER);
  typoFront(t);
}
boot(render);
</script>
