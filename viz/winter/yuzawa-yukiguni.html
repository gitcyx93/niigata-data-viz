<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(222,230,244,.68)';      // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;

<script>
// 越后汤泽（新潟县汤泽町）—— 冬季：一镜到底，跟着游客的一天走。
// 画面是一个简单的 2.5D 世界（有真实的远近透视），镜头像无人机一样在里面移动，每一段只对准一样东西：
//   0–4 秒   新干线从隧道冲出来，直奔镜头（开场就是高潮，第 0 秒当封面）
//   4–9 秒   镜头升起，越过山头看雪道：一个人从坡上朝镜头滑下来，最后一个急停扬起一片粉雪
//   9–15 秒  镜头落到山脚的露天温泉：雪落进热水里，灯笼和旅馆的暖光
//   15–20 秒 拉远，第一次看到整个雪国山谷；然后一头扎进隧道，飞向隧道尽头的光 —— 接回第 0 秒冲出隧道
// render(t) 是确定性的：同一个 t 永远画出同一帧。
// 世界坐标（米）：x 向右，y 向下（地面 y = 0，越高越负），z 向前（离镜头越远越大）。

const T = 20, F = 1100;                                  // 循环秒数、镜头焦距（像素）
const SCENE = {
  skyTop:'#03050d', skyMid:'#0a1330', skyLow:'#1d2b55',
  snowFar:'#1c2747', snowNear:'#2a3962', run:[92, 110, 158], tree:'#08101f', treeSnow:'#b9c7e0',
  rock:'#0c111c', rockSnow:'#8a9aba', water:'#0b1a2b', waterTop:'#16304a', window:[255, 206, 140],
};
const PORTAL = {x: -6, z: 30, w: 7, h: 7.5};             // 隧道口（在 z = 30 那面山壁上）
const FACE_Z = 30, FACE_TOP = -10;                         // 山壁的位置和高度
const slopeY = z => FACE_TOP - (z - FACE_Z) * .45;         // 山壁后面是往上的雪坡
const runX = z => -2 + 7 * Math.sin((z - FACE_Z) / 45);    // 雪道中线
const RUN_W = 5.5;                                         // 雪道半宽
const POOL = {x: -21, z: 12, rx: 6, rz: 5};                // 露天温泉
const INN = {x0: -33, x1: -17, z: 23, h: 8};              // 温泉旅馆

const KEYS = [
  [0, -2.6, -1.7, 11], [3.9, -2.3, -1.9, 13.5],          // ① 隧道口，慢慢推近
  [5.9, 0, -15, 25], [8.9, .4, -15.3, 26],                // ② 升起，越过山头看雪道
  [10.7, -21, -4, -2], [14.6, -21.3, -3.8, 1.5],          // ③ 落到温泉
  [17.3, -6, -26, -75, 'io'], [19.8, -6, -3.6, 29.5, 'in'], [20, -6, -3.6, 29.75],   // ④ 拉远看全景，然后扎进隧道
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const [t0, x0, y0, z0] = KEYS[i], [t1, x1, y1, z1, e] = KEYS[i + 1];
  const u = clamp((t - t0) / (t1 - t0)), k = e === 'in' ? u * u : ease(u);
  return {x: lerp(x0, x1, k), y: lerp(y0, y1, k), z: lerp(z0, z1, k)};

// 投影：世界坐标 → 画面坐标，s 是这个距离上 1 米等于多少像素
function P(x, y, z) { const s = F / Math.max(.05, z - cam.z); return [W / 2 + (x - cam.x) * s, H / 2 + (y - cam.y) * s, s]; }

function poly(pts, fill) {                               // pts: [[x,y,z], ...] 世界坐标的多边形
  g.beginPath(); pts.forEach(([x, y, z], i) => { const [X, Y] = P(x, y, z); i ? g.lineTo(X, Y) : g.moveTo(X, Y); });

// ======== 预先画好的小图：积雪的杉树 ========
const TREES = [0, 1, 2].map(v => {
  const c = document.createElement('canvas'); c.width = 160; c.height = 400;
  const b = c.getContext('2d');
  b.fillStyle = '#05080f'; b.fillRect(74, 330, 12, 70);
  const tiers = 6 + v;
  for (let k = 0; k < tiers; k++) {
    const u = k / tiers, y0 = 20 + u * 300, y1 = y0 + 300 / tiers + 40, w = 20 + u * 60 + v * 4;
    b.fillStyle = SCENE.tree; b.beginPath(); b.moveTo(80, y0); b.lineTo(80 + w, y1); b.lineTo(80 - w, y1); b.fill();

    let n = 0; for (let dx = -10; dx <= 10; dx++) if (nearE(x + dx, y) >= 0) n++;

  for (let y = 2; y < h - 1; y++) for (let x = 10; x < w - 10; x++) {
    if (!edge[y * w + x]) continue;
    let sum = 0, cnt = 0;
    for (let dx = -5; dx <= 5; dx++) { const yy = nearE(x + dx, y); sum += yy >= 0 ? th[yy * w + x + dx] : 0; cnt++; }

    if (t0 < .5) continue;
    for (let k = -1; k < Math.ceil(t0); k++) {

  const a = t - TRAIN.t0, shake = a < 1 ? Math.exp(-a * 4) * 6 : 0;

  drawSky(t);
  drawSlope(t);
  drawTunnelInside(t);
  g.save(); archPath(PORTAL.x, PORTAL.w, PORTAL.h, FACE_Z); g.clip();
  trainPart(t, -999, 0);                                  // 还在隧道里的那段车身（只从洞口看得到）
  g.restore();
  drawFace();
  drawGround();
  drawTrackside(t);
  const lamp = .85 + .15 * Math.sin(TAU * 2 * t / T);
  drawInn(t);
  drawPool(t, lamp);
  trainPart(t, 0, 999);                                   // 已经冲出来的车身
  trainLights(t);
  drawSpray(t);
  drawSteam(t, lamp);
  drawSnow(t, false);
  drawSnow(t, true);
  g.setTransform(1, 0, 0, 1, 0, 0);
  // 冲出隧道的白光（第 0 秒最亮，很快退掉；封面上还能看清车头）
  const flash = a >= 0 && a < 1.6 ? Math.pow(1 - a / 1.6, 2.4) : 0;
  if (flash > 0) {

    g.fillStyle = `rgba(236,243,253,${.06 * flash})`; g.fillRect(0, 0, W, H);
  }
  // 扎进隧道的最后一刻：先暗下来，然后隧道尽头的光迎面扩成一片白，接上第 0 秒冲出隧道的白光
  const dive = clamp((t - 19.1) / .5), bloom = Math.pow(clamp((t - 19.45) / .55), 2);
  if (dive > 0) { g.fillStyle = `rgba(1,2,6,${.45 * dive * (1 - bloom)})`; g.fillRect(0, 0, W, H); }
  if (bloom > 0) {
    const [ex, ey] = P(PORTAL.x, -3.6, 2000);
    g.globalCompositeOperation = 'lighter'; glowAt([255, 252, 245], 1.3 * bloom, ex, ey, 120 + bloom * 1500, 120 + bloom * 1700, 1); g.globalCompositeOperation = 'source-over';
    g.fillStyle = `rgba(236,243,253,${.35 * bloom})`; g.fillRect(0, 0, W, H);
  }

  g.globalAlpha = 1 - .7 * flash; scrims(1340, 320, 204, 150); g.globalAlpha = 1;

  drawTitleSnow();
  typoFront(t);
}
function mixc(a, b, k) { const A = hex(a), B = hex(b); return `rgb(${A.slice(0, 3).map((v, i) => Math.round(v + (B[i] - v) * k)).join(',')})`; }
boot(render);
