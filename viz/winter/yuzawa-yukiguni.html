// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };

const fract = x => x - Math.floor(x);

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);

const lerp = (a, b, k) => a + (b - a) * k;

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(N, N), d = img.data;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;
    d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = Math.round(255 * Math.pow(Math.max(0, 1 - r), falloff));
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function verticalSprite(key, stops) {                 // 竖直方向的渐变条：stops = [[位置0~1, [r,g,b,a]], ...]
  if (sprites[key]) return sprites[key];
  const N = 512, c = document.createElement('canvas'); c.width = 1; c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(1, N), d = img.data;
  for (let j = 0; j < N; j++) {
    const u = (j + .5) / N; let k = 0; while (k < stops.length - 2 && u > stops[k + 1][0]) k++;
    const [u0, a] = stops[k], [u1, b] = stops[k + 1], f = clamp((u - u0) / (u1 - u0));
    for (let n = 0; n < 4; n++) d[j * 4 + n] = Math.round(a[n] + (b[n] - a[n]) * f);
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function glowAt(rgb, alpha, x, y, rx, ry = rx, falloff) {
  if (alpha <= .002) return;
  g.globalAlpha = Math.min(1, alpha); g.drawImage(radialSprite(rgb, falloff), x - rx, y - ry, rx * 2, ry * 2); g.globalAlpha = 1;
}
const hsl2rgb = (h, s, l) => {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => 255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
};

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========
// 繁体版（<html lang="zh-TW">）自动换成思源黑体繁体
const TC = document.documentElement.lang === 'zh-TW';
const FONTS = TC ? {
  cjk:   '"Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',
  latin: '"Sora","Source Han Sans TC",sans-serif',
} : {
  cjk:   '"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',
  latin: '"Sora","Source Han Sans SC",sans-serif',
};
// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {
  g.font = `${weight} ${size}px ${FONTS[fam]}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function resetSpacing(c = g) { if ('letterSpacing' in c) c.letterSpacing = '0px'; }
function measure(s, size, weight = 400, spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {

}
function text(s, x, y, size, color, weight = 400, align = 'left', spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  const w = measure(s, size, weight, spacing, fam);
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  setFont(size, weight, spacing, fam); g.textAlign = 'left'; g.fillStyle = color; g.fillText(s, left, y); resetSpacing();
  return w;
}
// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {
  const ws = parts.map(([s, size, , wt = 400, sp = 0, slot]) => measure(slot || s, size, wt, sp));
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, wt = 400, sp = 0, slot], i) => {

  });

}
function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;

// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
function drawStory(t, story, color = NARRATION, bar = TYPE.accent, shadow = null) {
  story.forEach(([from, to, s]) => {
    if (t < from || t > to) return;
    const out = clamp((to - t) / .5), y = 480;
    g.globalAlpha = out * clamp((t - from) / .3);

    if (shadow) { g.shadowColor = shadow; g.shadowBlur = 9; g.shadowOffsetY = 1; }   // 背景亮的时候（如雪地）给小字一层深色的柔和字影
    let x = 100;
    [...s].forEach((c, i) => {
      const p = clamp((t - from - i * .05) / .45);           // 每个字晚 0.05 秒出现
      if (p > 0) { g.globalAlpha = ease(p) * out; g.fillStyle = color; g.fillText(c, x, y + 8 * (1 - ease(p))); if (shadow) g.fillText(c, x, y + 8 * (1 - ease(p))); }   // 有字影时叠两次，字影更实
      x += g.measureText(c).width;
    });
    g.globalAlpha = 1; g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0; resetSpacing();
  });
}

    g.fillStyle = '#ffb347'; g.fillRect(-.15, -1.65 * c, .3, .08);
    g.restore();
    // 雪浪：刻滑的每个弯甩出去一些雪粒；横刹的一路上，雪板一直往前方扬起一片雪（越快越多）
    const nTurns = Math.floor((SK.carve - SK.t0) * SK.om / Math.PI);
    for (let i = 0; i < 520; i++) {
      const skidP = i < 340, life = skidP ? 1.3 : .8;
      const te = skidP ? SK.tuck + .1 + Math.pow(rnd(i, 311), 1.6) * (SK.end - SK.tuck - .2) : SK.t0 + ((Math.floor(rnd(i, 312) * nTurns) + 1) * Math.PI) / SK.om + (rnd(i, 313) - .5) * .12, age = t - te;
      if (age < 0 || age > life) continue;
      const r = at(te);
      let vx, vy, vz;
      if (skidP) { const sp = r.v * (.25 + rnd(i, 314) * .3); vx = sp * (.8 + rnd(i, 315) * .4); vz = -sp * .4 * rnd(i, 318); vy = -(1 + rnd(i, 316) * 3) * clamp(r.v / 10); }
      else { const out = Math.sin(r.ph) > 0 ? 1 : -1; vx = out * (1.2 + rnd(i, 315) * 2.4); vy = -(.8 + rnd(i, 317) * 1.6); vz = -.8; }
      const x = r.x + vx * age, y = r.y + vy * age + 4.9 * age * age, z = r.z + vz * age, k = age / life;
      if (y > slopeY(z) + .05 || !vis(z)) continue;
      const [X, Y, sc] = P(x, y, z), rr = Math.max(.8, (.025 + rnd(i, 319) * .05) * sc);
      g.fillStyle = `rgba(236,242,252,${.85 * (1 - k)})`; g.beginPath(); g.arc(X, Y, rr, 0, TAU); g.fill();
    }
    for (let i = 0; i < 12; i++) {                          // 横刹扬起的粉雪雾，慢慢散开
      const te = SK.tuck + .2 + rnd(i, 331) * 1.2, age = t - te; if (age < 0 || age > 2.2) continue;
      const r = at(te), k = age / 2.2;
      glow3([225, 233, 248], .12 * Math.pow(1 - k, 1.5) * clamp(r.v / 8), r.x + 1 + (1 + rnd(i, 332) * 2) * (.5 + k), r.y - .3 - k * .7, r.z - rnd(i, 333) * 1.5, .6 + k * 1.6, .4 + k, 1.2);
    }
  }
  function render(t) {
    // 跟拍（像滑雪比赛转播）：镜头在人前方，跟着人一起往下移动；切进来时离得远一点，很快推近
    const p = at(t), back = 8 + 3 * (1 - ease(clamp((t - 3.3) / 1.4))) - 1 * ease(clamp((t - SK.tuck) / 1.6));   // 切进来时稍远、慢慢推近；横刹时再推近一点
    cam.z = p.z - back; cam.x = p.base; cam.y = slopeY(p.z) - 1.1;                  // 镜头和人的腰差不多高，人在画面中间   // 镜头只跟人的大方向，不跟着 S 弯左右晃
    const main = g; g = cv3.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(verticalSprite('sky3', [[0, hex('#03050d')], [.5, hex('#0a1330')], [1, hex('#1d2b55')]]), 0, 0, W, H);
    [[3200, 900, '#1f2b52', 0], [2200, 650, '#172241', 2]].forEach(([z, a, c, kk]) => {
      g.beginPath(); g.moveTo(-10, H + 10);
      for (let x = -5000; x <= 5000; x += 160) { const [X, Y] = P(x, -a * (.6 + .4 * Math.sin(x / 900 + kk)) - Math.sin(x / 300) * a * .12, z); g.lineTo(X, Y); }
      g.lineTo(W + 10, H + 10); g.fillStyle = c; g.fill();
    });
    const zNear = cam.z + 1.5;                             // 雪坡一直铺到镜头脚下（镜头还在远处时下面不会空）
    for (let z = 520, dz; z > zNear; z -= dz) { dz = Math.max(.6, (z - cam.z) * .06); const z1 = Math.max(zNear, z - dz);   // 近处切得细，颜色过渡平滑
      poly([[-400, slopeY(z), z], [400, slopeY(z), z], [400, slopeY(z1), z1], [-400, slopeY(z1), z1]], mixc('#a9b7d6', '#4a5a86', clamp((z - cam.z) / 300))); }
    const Lp = [], Rp = []; for (let z = 520, dz; z > zNear; z -= dz) { dz = Math.max(.5, (z - cam.z) * .05); Lp.push([runX(z) - RW, slopeY(z), z]); Rp.push([runX(z) + RW, slopeY(z), z]); }
    Lp.push([runX(zNear) - RW, slopeY(zNear), zNear]); Rp.push([runX(zNear) + RW, slopeY(zNear), zNear]);   // 一直铺到镜头脚下
    poly(Lp.concat(Rp.reverse()), 'rgb(200,210,234)');
    // 路灯在雪道上照出一段段暖色的光斑（光斑之间是冷蓝的暗处，远近靠这个出来）
    g.globalCompositeOperation = 'lighter';
    for (let z = 12; z < 500; z += 28) [-1, 1].forEach(sd => glow3([255, 204, 150], .1, runX(z) + sd * RW * .55, slopeY(z), z, 8, 3.2, 1.3));
    g.globalCompositeOperation = 'source-over';
    // 雪面上一个个软软的雪包：朝上的一面亮、背面暗
    for (let i = 0; i < 170; i++) {
      const z = zNear + 2 + Math.pow(rnd(i, 341), 1.6) * 220, x = runX(z) + (rnd(i, 342) - .5) * RW * 1.9, r = .9 + rnd(i, 343) * 1.4;
      glow3([60, 78, 120], .1, x, slopeY(z) + .12, z - .3, r, r * .32, 1.3);
      glow3([232, 238, 252], .18, x, slopeY(z) - .1, z + .3, r * .9, r * .28, 1.3);
    }
    // 雪道两边堆起来的雪堤，厚厚软软的
    for (let z = 300; z >= zNear + .5; z -= Math.max(.8, (z - cam.z) * .08)) [-1, 1].forEach(sd => {
      const x = runX(z) + sd * (RW + .6);
      glow3([24, 34, 66], .3, x + sd * .5, slopeY(z) + .05, z, 1.7, .55, 1.3);
      glow3([240, 245, 255], .55, x, slopeY(z) - .4, z, 1.7, .7, 1.4);
    });
    // 树林里的雪：树下一团团鼓起来的雪
    for (let i = 0; i < 160; i++) {
      const z = zNear + 3 + Math.pow(rnd(i, 361), 1.4) * 200, sd = rnd(i, 362) > .5 ? 1 : -1, x = runX(z) + sd * (RW + 3 + rnd(i, 363) * 30), r = 1.4 + rnd(i, 364) * 2;
      glow3([235, 241, 252], .16, x, slopeY(z) - .2, z, r, r * .4, 1.3);
    }
    // 树投在雪上的影子
    TR.forEach(o => { if (o.lamp || o.z > 260 || Math.abs(o.x - runX(o.z)) > RW + 14) return; glow3([6, 10, 26], .28, o.x + Math.sign(runX(o.z) - o.x) * 1.4, slopeY(o.z) + .1, o.z - .5, 2.6, .7, 1.2); });
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 90; i++) {                         // 雪晶一闪一闪
      const z = zNear + 2 + rnd(i, 321) * 120, x = runX(z) + (rnd(i, 322) - .5) * RW * 1.8, tw = Math.pow(Math.max(0, Math.sin(TAU * (3 + i % 4) * t / T + i * 1.7)), 12);
      if (tw > .05) glow3([255, 250, 235], tw, x, slopeY(z) - .05, z, .12, .12, 1.5);
    }
    g.globalCompositeOperation = 'source-over';
    TR.forEach(o => o.lamp ? lamp(o) : tree(o.x, o.z, o.h, o.v));
    drawSkier(t);
    g.globalAlpha = .55; g.drawImage(GRAIN, 0, 0); g.globalAlpha = 1;   // 很细的颗粒，让雪面有一点质感
    g = main;

  }
  return {render, at, SK, cam};
})();

// ======== 镜头 ========
// [时间, 中心 x, 中心 y, 放大倍数]（世界坐标）；两点之间平滑过渡，放大倍数按比例过渡（推拉的速度感更自然）
const RUN_SPOT = (() => { const [x, y] = pointOnRun(RUNS[0], .42); return [x, y - LIFT]; })();
const heroCam = t => { const p = heroAt(t); return [lerp(p.x, pointOnRun(RUNS[HERO.run], .5)[0], .3), p.y - LIFT + 34]; };   // 镜头对准滑雪的人（人在画面中间偏上；左右只跟一部分，免得镜头跟着 S 形晃）
const KEYS = [
  [0, 380, 1170, 2.1], [3.3, 660, 1150, 2.0],         // ① 跟着列车慢慢往右移，带过温泉街的灯火
  [8.7, 673, 1670, 2.6], [13.0, 673, 1660, 2.85],     // 推近两人和干杯    // ②（这段全景被滑雪镜头盖住）③ 露天温泉：灯笼、泡汤的人、热气、干杯
  [15.7, 540, 960, 1],                               // 慢慢拉远到全景，不停，接着往隧道口推           // ④ 全景
  [20, 380, 1170, 2.1],                               // 推回隧道口（和第 0 秒一样）
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const [t0, x0, y0, z0] = KEYS[i], [t1, x1, y1, z1] = KEYS[i + 1], k = ease(clamp((t - t0) / (t1 - t0)));
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hw = W / 2 / z, hh = H / 2 / z;
  return {x: clamp(lerp(x0, x1, k), hw, W - hw), y: clamp(lerp(y0, y1, k), hh, H + EXT - hh), z};
}

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const a = trainA(t), C = camAt(t);
  // 列车快出来时，地面开始轻轻震动，越来越强，冲出来后很快平息
  const rum = a > -1.4 && a < .8 ? (a < 0 ? ease((a + 1.4) / 1.4) : 1 - easeOut(a / .8)) * 4 : 0;
  const sx = Math.sin(t * 91) * rum, sy = Math.cos(t * 73) * rum * .8;
  const M = new DOMMatrix([C.z, 0, 0, C.z, W / 2 - C.x * C.z + sx, H / 2 - C.y * C.z + sy]);
  const toScreen = (x, y) => [M.a * x + M.e, M.d * y + M.f];
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(M);
  g.drawImage(sky, 0, 0);
  const ox = -fract(t / T) * W;                                   // 雪云慢慢往左飘，一个循环移过一个画面宽
  g.drawImage(clouds, ox, 0); g.drawImage(clouds, ox + W * 2, 0);
  g.drawImage(land, 0, 0, W, land.h);
  // 远景坐标里画的动态：滑雪的人、缆车、温泉街的白汽、隧道口的光、列车、雪雾
  g.setTransform(M.translate(0, -LIFT));
  drawSkiers(t);
  drawGlitter(t);
  drawGondola(t);
  drawTownSteam(t);
  const pre = clamp((a + 1.6) / 1.6) * (a < .3 ? 1 : clamp(1 - (a - .3) / .6));
  g.globalCompositeOperation = 'lighter';
  glowAt([255, 240, 215], .9 * pre * pre, PORTAL + 22, DECK - 36, 70 + pre * 120, 50 + pre * 40, 1.4);
  g.globalCompositeOperation = 'source-over';
  drawTrain(t);
  drawSpray(t);
  g.setTransform(M);
  trainOnWall(t);
  // 近处：雪地、雪墙小路和撑伞的人、温泉
  g.drawImage(near, 0, 0, W, near.h);
  drawWalkers(t);
  const lamp = .85 + .15 * Math.sin(TAU * 2 * t / T);            // 灯笼轻轻呼吸
  drawPool(t, lamp);
  g.drawImage(front, 0, 0, W, front.h);
  drawTray(t);
  drawSteam(t, lamp);
  g.setTransform(1, 0, 0, 1, 0, 0);
  // 温泉那一段整个画面偏暖（灯笼和热水的感觉）
  const hot = (t >= 8.7 ? 1 : 0) * clamp((14.0 - t) / .8);
  if (hot > 0) { g.globalCompositeOperation = 'soft-light'; g.fillStyle = `rgba(255,178,110,${.3 * hot})`; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'source-over'; }
  // 雪道特写：交叉淡入站在雪坡上往上看的镜头
  const ski = t >= 3.3 && t < 8.7 ? 1 : 0;   // 直切进跟拍滑雪的镜头，滑完再直切到温泉
  if (ski > 0) { const c3 = SKI3D.render(t); g.globalAlpha = ski; g.drawImage(c3, 0, 0); g.globalAlpha = 1; }
  drawSnow(t, false, C);
  drawSnow(t, true, C);
  // 屏住呼吸：出隧道前画面压暗；冲出来的一瞬，白光从隧道口炸开，一阵暴风雪横扫过画面
  const dim = a > -2 && a < 0 ? .34 * ease(clamp((a + 2) / 1.8)) : a >= 0 && a < .2 ? .34 * (1 - a / .2) : 0;
  if (dim > 0) { g.fillStyle = `rgba(2,3,8,${dim})`; g.fillRect(0, 0, W, H); }
  const flash = a >= 0 && a < 1.6 ? Math.pow(1 - a / 1.6, 2.6) : 0;
  if (a >= 0 && a < 2.4) {
    const [px, py] = toScreen(PORTAL + 22, DECK - 36 - LIFT);
    g.globalCompositeOperation = 'lighter';
    glowAt([255, 248, 235], .32 * flash, px, py, 150 + easeOut(a / .5) * 320, 110 + easeOut(a / .5) * 240, 1.1);   // 只是洞口一团光，不盖住列车
    g.globalCompositeOperation = 'source-over';
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 50; i++) {                                 // 暴风雪：雪片从隧道口方向横着扫过来
      const sp = .6 + rnd(i, 171) * .8, x = px - 200 + (a * 2600 * sp + rnd(i, 172) * 1400) % 1600;
      const y = py - 700 + rnd(i, 173) * 1500 + (x - px) * (rnd(i, 174) - .3) * .3, len = 30 + sp * 70;
      g.strokeStyle = `rgba(240,246,255,${.3 * Math.min(1, Math.pow(clamp(1 - a / 2.4), 1.5) * 2.4) * rnd(i, 175)})`; g.lineWidth = 1.5 + rnd(i, 176) * 3;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - len, y - len * .12); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
  }

  // 文字层（不跟镜头动，保证清晰）
  // 上面的压暗托住标题，一直在；下面那条只在有大字时出现（跟着文字一起淡入淡出）
  g.drawImage(verticalSprite('topscrim204', [[0, [1, 3, 12, 204]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  if (false) g.drawImage(verticalSprite('skiscrim', [[0, [4, 8, 22, 120]], [.7, [4, 8, 22, 110]], [1, [4, 8, 22, 0]]]), 0, 0, W, 640);   // 滑雪时树林和白雪很亮，标题和旁白下面再压暗一点
  g.globalAlpha = textVis(t) * (1 - .6 * flash) * (1 - ski);   // 白雪上不压深色带子   // 白雪上不压深色的带子（字影够了）
  g.drawImage(verticalSprite('band150', [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, 150]], [1, [1, 3, 12, 0]]]), 0, 1340, W, 320);
  g.globalAlpha = 1;
  drawHeader(t, {light: 0, lc: [255, 236, 210], x: W / 2}, HEADER);
  drawTitleSnow();
  typoFront(t);
}
boot(render);
