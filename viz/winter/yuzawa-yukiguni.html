<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(222,230,244,.68)';      // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;

const trainNose = t => noseAt(trainA(t));
function drawTrain(t) {
  const nose = trainNose(t);
  if (nose < PORTAL || nose - TRAIN.len > W + 40) return;
  g.save(); g.beginPath(); g.rect(PORTAL + 30, 0, W, H + LIFT); g.clip();
  const y = DECK - 4, h = 58, tail = nose - TRAIN.len;
  g.fillStyle = '#e3e9f2'; g.beginPath();                 // 白色车身：车头和车尾都是长长的流线形
  g.moveTo(tail, y - 8); g.bezierCurveTo(tail + 30, y - 30, tail + 120, y - h, tail + 260, y - h);
  g.lineTo(nose - 260, y - h); g.bezierCurveTo(nose - 120, y - h, nose - 30, y - 30, nose, y - 8); g.lineTo(nose, y); g.lineTo(tail, y); g.fill();
  g.fillStyle = '#1f2c48'; g.fillRect(tail + 262, y - h, nose - 262 - tail - 262, 9);    // 车顶
  g.fillStyle = '#3c6fc4'; g.fillRect(tail + 90, y - 17, nose - 90 - tail - 90, 7);    // 蓝色腰线
  g.fillStyle = '#c08a5a'; g.fillRect(tail + 90, y - 10, nose - 90 - tail - 90, 2.5);  // 铜色细线
  g.fillStyle = '#0b1424'; g.beginPath(); g.moveTo(tail + 230, y - h + 3); g.bezierCurveTo(tail + 150, y - h + 4, tail + 100, y - 40, tail + 90, y - 32); g.lineTo(tail + 230, y - 32); g.fill();   // 车尾的驾驶室窗
  g.globalCompositeOperation = 'lighter'; glowAt([255, 60, 50], .8, tail + 8, y - 14, 18, 9, 1.4); g.globalCompositeOperation = 'source-over';   // 尾灯（红）
  for (let x = nose - 330; x > tail + 330; x -= 28) {                       // 车窗：暖色的一串光
    if (fract(x / 560 - .03) < .06) continue;
    g.fillStyle = 'rgba(255,216,152,.95)'; g.fillRect(x, y - 40, 17, 12);
  }
  g.fillStyle = '#0b1424'; g.beginPath(); g.moveTo(nose - 230, y - h + 3); g.bezierCurveTo(nose - 150, y - h + 4, nose - 100, y - 40, nose - 90, y - 32); g.lineTo(nose - 230, y - 32); g.fill();
  g.restore();
  g.globalCompositeOperation = 'lighter';
  glowAt([255, 246, 225], .75, nose - 6, y - 14, 80, 34, 1.5);               // 车灯
  glowAt([220, 232, 255], .18, nose + 380, y - 16, 520, 90, 1.4);          // 车灯照亮前方的雪
  const lit0 = Math.max(PORTAL, tail);
  glowAt([255, 210, 150], .16, (nose + lit0) / 2, y - 34, Math.max(80, (nose - lit0) / 2), 46, 1.2);
  g.globalCompositeOperation = 'source-over';
}
function drawSpray(t) {                 // 列车卷起的雪雾：沿着轨道在车头经过的地方扬起，慢慢飘散
  const a = trainA(t);
  if (a < 0 || a > 5) return;
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 90; i++) {
    const te = rnd(i, 71) * 2.3, age = a - te;
    if (age < 0 || age > 2.6) continue;
    const x0 = noseAt(te) - 60 - rnd(i, 72) * 160;
    if (x0 < PORTAL + 40 || x0 > W + 80) continue;
    const k = age / 2.6, r = 30 + easeOut(k) * 130 * (.6 + rnd(i, 73));
    glowAt([200, 214, 240], .24 * (1 - k) * clamp(age / .15), x0 - age * 90, DECK - 30 - easeOut(k) * 110 * rnd(i, 74), r, r * .7, 1.2);
  }
  g.globalCompositeOperation = 'source-over';
}

// 列车经过时，车窗的暖光和车灯扫过近处的雪墙
function trainOnWall(t) {
  const nose = trainNose(t), tail = nose - TRAIN.len;
  if (nose < PORTAL || tail > W) return;
  g.globalCompositeOperation = 'lighter';
  for (let x = Math.max(PORTAL + 40, tail); x < Math.min(W + 40, nose - 300); x += 70) glowAt([255, 200, 140], .07, x, LANE - 88, 60, 22, 1.2);
  glowAt([225, 236, 255], .3, Math.min(W + 200, nose + 200), LANE - 80, 300, 40, 1.3);
  g.globalCompositeOperation = 'source-over';
}

// ---- 雪道上的主角：一个穿红色雪服的人沿着雪道一路刻滑下来，最后一个急停，扬起一片粉雪 ----
// 刻滑：左右换刃画 S 形；转弯时身体向弯内倾斜，换刃的一瞬间身体立起、膝盖压低，内侧的雪杖点一下雪；
// 每个弯的外侧甩出一道雪浪；雪板在雪面上刻出两道平行的痕。越往下离镜头越近，人也越大。
const HERO = {run: 0, t0: 3.4, t1: 10.3, u0: .06, u1: .72, turns: 6.5, show: [2.6, 15.6]};
function heroAt(t) {
  const k = clamp((t - HERO.t0) / (HERO.t1 - HERO.t0)), u = lerp(HERO.u0, HERO.u1, 1 - Math.pow(1 - k, 1.25));
  const r = RUNS[HERO.run], [x, y] = pointOnRun(r, u), ph = k * HERO.turns * Math.PI;
  const amp = r.w * .28 * (1 - k * .55);
  return {x: x + Math.sin(ph) * amp, y, ph, k, sc: lerp(1.3, 2.5, u), amp};
}
function heroFrame(t) {                                  // 位置、速度方向、倾斜（转弯越急越斜）
  const p = heroAt(t), q = heroAt(t + .05), m = heroAt(t - .05);
  const vx = q.x - m.x, vy = q.y - m.y, ax = q.x - 2 * p.x + m.x;
  return {...p, vx, vy, lean: clamp(-ax * 1.6, -.75, .75), flex: Math.abs(Math.cos(p.ph))};
}
function drawSkier(x, y, sc, dirx, diry, lean, flex, jacket, poleOut) {
  const L = 7.5 * sc, dl = Math.hypot(dirx, diry * .45) || 1, sx = dirx / dl, sy = diry * .45 / dl;
  g.save(); g.translate(x, y);
  g.strokeStyle = '#05080f'; g.lineCap = 'round'; g.lineWidth = 1.3 * sc;     // 两块雪板，顺着前进方向
  [-1, 1].forEach(o => { g.beginPath(); g.moveTo(-sx * L + o * .9 * sc, -sy * L + o * .4 * sc); g.lineTo(sx * L + o * .9 * sc, sy * L + o * .4 * sc); g.stroke(); });
  g.rotate(lean); g.scale(sc, sc);
  const crouch = 1 - flex * .22;                                              // 换刃时压低
  g.strokeStyle = '#1b2236'; g.lineWidth = 2.1;                               // 腿：膝盖弯着
  g.beginPath(); g.moveTo(-1.4, 0); g.lineTo(-2.2, -4 * crouch); g.lineTo(-1, -8 * crouch); g.moveTo(1.4, 0); g.lineTo(1.8, -4 * crouch); g.lineTo(1, -8 * crouch); g.stroke();
  g.fillStyle = jacket; g.beginPath(); g.ellipse(0, -10.6 * crouch, 3.1, 3.8, -lean * .3, 0, TAU); g.fill();   // 雪服
  g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(-3, -10 * crouch, 6, .8);                                 // 雪服上的白色条纹
  g.strokeStyle = jacket; g.lineWidth = 1.6;                                  // 手臂向前，握着雪杖
  g.beginPath(); g.moveTo(-2.6, -11.5 * crouch); g.lineTo(-4.2, -8.6 * crouch); g.moveTo(2.6, -11.5 * crouch); g.lineTo(4.2, -8.6 * crouch); g.stroke();
  g.strokeStyle = '#0b0f1a'; g.lineWidth = .5;
  g.beginPath(); g.moveTo(-4.2, -8.6 * crouch); g.lineTo(-5.5 - poleOut * 2, -.5); g.moveTo(4.2, -8.6 * crouch); g.lineTo(5.5 + poleOut * 2, -.5); g.stroke();
  g.fillStyle = '#f0f3f8'; g.beginPath(); g.arc(0, -15.4 * crouch, 1.9, 0, TAU); g.fill();                      // 白色头盔
  g.fillStyle = '#ffb347'; g.fillRect(-1.5, -15.5 * crouch, 3, .8);                                              // 雪镜的反光
  g.restore();
}
function drawHero(t) {
  if (t < HERO.show[0] || t > HERO.show[1]) return;
  const vis = clamp((t - HERO.show[0]) / .4) * clamp((HERO.show[1] - t) / .4);
  const tt = Math.min(t, HERO.t1), f = heroFrame(tt), stop = clamp((t - HERO.t1 + .45) / .45);
  g.save(); g.globalAlpha = vis;
  // 刻出来的两道雪痕
  [-1, 1].forEach(o => {
    g.beginPath();
    for (let k = 0; k <= 80; k++) { const q = heroAt(lerp(HERO.t0, tt, k / 80)); const xx = q.x + o * .9 * q.sc, yy = q.y + o * .3 * q.sc; k ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }
    g.strokeStyle = 'rgba(12,20,44,.35)'; g.lineWidth = .9; g.stroke();
    g.strokeStyle = 'rgba(230,238,255,.25)'; g.lineWidth = .5; g.stroke();
  });
  const lean = stop > 0 ? lerp(f.lean, -.65, stop) : f.lean;
  const dx = stop > 0 ? lerp(f.vx, 1, stop) : f.vx, dy = stop > 0 ? lerp(f.vy, 0, stop) : f.vy;
  drawSkier(f.x, f.y, f.sc, dx, dy, lean, stop > 0 ? .9 : f.flex, '#e0573f', f.flex > .85 ? 1 : 0);
  g.restore();
  // 雪浪：每个弯的外侧甩出去一片，最后急停时一大片；落下来以后变成一团慢慢散开的粉雪
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 200; i++) {
    const big = i < 90, life = big ? 2.2 : 1.1;
    let te;
    if (big) te = HERO.t1 - .3 + rnd(i, 181) * .25;
    else { const turn = Math.floor(rnd(i, 182) * HERO.turns), kk = (turn + .5) / HERO.turns; te = lerp(HERO.t0, HERO.t1, kk) + (rnd(i, 187) - .5) * .25; }
    const age = t - te;
    if (age < 0 || age > life || t > HERO.show[1]) continue;
    const q = heroFrame(Math.min(te, HERO.t1)), out = big ? 1 : (q.lean > 0 ? -1 : 1);
    const sp = (big ? 22 + rnd(i, 183) * 46 : 12 + rnd(i, 184) * 22) * q.sc, up = (big ? 18 + rnd(i, 185) * 34 : 9 + rnd(i, 186) * 16) * q.sc;
    const k = age / life, x = q.x + out * sp * age * (1 - k * .35), y = q.y - up * age + 46 * q.sc * age * age;
    if (y > q.y + 3) continue;
    const r = ((big ? 1.6 : 1.1) + k * (big ? 7 : 3.5)) * q.sc * .7;
    glowAt([235, 242, 255], (big ? .55 : .45) * Math.pow(1 - k, 1.3), x, y, r, r * .8, 1.2);
  }
  g.globalCompositeOperation = 'source-over';
}
// 雪道上被路灯照着的雪晶，一闪一闪
function drawGlitter(t) {
  const r = RUNS[HERO.run];
  for (let i = 0; i < 60; i++) {
    const [x, y] = pointOnRun(r, rnd(i, 221)), dx = (rnd(i, 222) - .5) * r.w * .8, tw = Math.pow(Math.max(0, Math.sin(TAU * (3 + i % 4) * t / T + i * 1.7)), 12);
    if (tw < .05) continue;
    g.fillStyle = `rgba(255,248,230,${tw * .9})`; g.fillRect(x + dx - .6, y - .6, 1.2, 1.2);
    g.fillRect(x + dx - 1.8 * tw, y - .15, 3.6 * tw, .3); g.fillRect(x + dx - .15, y - 1.8 * tw, .3, 3.6 * tw);
  }
}

// ---- 远景里的小动静：滑雪的人、缆车、温泉街的白汽 ----
const SKIERS = [];
for (let i = 0; i < 11; i++) SKIERS.push({run: i % RUNS.length, ph: rnd(i, 151), k: 1 + (i % 2), side: rnd(i, 152) - .5, sw: 9 + Math.floor(rnd(i, 153) * 6)});
function drawSkiers(t) {
  SKIERS.forEach(s => {
    const r = RUNS[s.run], u = fract(s.ph + s.k * t / T);             // 一个循环滑下来 1~2 趟
    const [x, y] = pointOnRun(r, u), dx = Math.sin(TAU * s.sw * u) * r.w * .28 + s.side * r.w * .3;
    g.globalAlpha = clamp(u / .06) * clamp((1 - u) / .06);
    g.fillStyle = '#070a14'; g.fillRect(x + dx - 1.5, y - 6, 3, 6); g.fillRect(x + dx - 3, y, 6, 1.2);
    g.globalAlpha = 1;
  });
}
function drawGondola(t) {
  for (let i = 0; i < 9; i++) [0, 1].forEach(dir => {
    let u = fract(i / 9 + t / T);
    if (dir) u = 1 - u;
    const ox = dir ? 12 : 0, oy = dir ? 8 : 0;
    const x = GON.x0 + (GON.x1 - GON.x0) * u + ox, y = GON.y0 + (GON.y1 - GON.y0) * u + oy;
    g.fillStyle = '#0b1020'; g.fillRect(x - .5, y, 1, 7); roundRect(x - 6, y + 7, 12, 10, 2); g.fill();
    g.fillStyle = 'rgba(255,214,150,.85)'; g.fillRect(x - 4, y + 9, 8, 4);
  });
}
const TOWN_STEAM = [[262, 0], [420, .3], [610, .6], [770, .15], [960, .45]];     // 温泉旅馆屋顶冒出的白汽
function drawTownSteam(t) {
  TOWN_STEAM.forEach(([x0, ph]) => {
    for (let k = 0; k < 4; k++) {
      const u = fract(ph + k / 4 + t / T * 2);
      glowAt([196, 208, 232], Math.sin(Math.PI * u) * .12, x0 + u * 40 + Math.sin(u * 6 + k) * 8, GROUND - 20 - u * 120, 18 + u * 46, 14 + u * 34, 1.2);
    }
  });
}

// ---- 雪墙小路上撑伞的人（雪墙比人还高）----
const WALKERS = [{dir: 1, ph: .12, umb: SCENE.umbrella}, {dir: -1, ph: .58, umb: '#d9dee8'}];
function drawWalkers(t) {
  WALKERS.forEach((p, i) => {
    const u = fract(p.ph + t / T);                                        // 一个循环正好走过整个画面
    const x = p.dir > 0 ? -60 + u * (W + 120) : W + 60 - u * (W + 120);
    const step = TAU * 22 * t / T + i, y = LANE - 2 - Math.abs(Math.sin(step)) * 1.4;
    g.fillStyle = '#080b16';
    roundRect(x - 9, y - 44, 18, 42, 7); g.fill();                        // 身体（大衣）
    g.beginPath(); g.arc(x, y - 51, 8, 0, TAU); g.fill();                 // 头
    g.strokeStyle = '#080b16'; g.lineWidth = 2; g.beginPath(); g.moveTo(x + p.dir * 4, y - 32); g.lineTo(x + p.dir * 4, y - 64); g.stroke();
    g.fillStyle = p.umb; g.beginPath(); g.ellipse(x + p.dir * 4, y - 64, 32, 17, 0, Math.PI, 0); g.fill();   // 伞
    const lit = Math.max(...LAMPS.map(lx => clamp(1 - Math.abs(x - lx - 13) / 90)));
    if (lit > 0) { g.globalCompositeOperation = 'lighter'; glowAt([255, 190, 110], .45 * lit, x + p.dir * 4, y - 70, 40, 18, 1.4); g.globalCompositeOperation = 'source-over'; }
    g.fillStyle = 'rgba(235,242,255,.8)'; g.beginPath(); g.ellipse(x + p.dir * 4, y - 77, 22, 5, 0, Math.PI, 0); g.fill();   // 伞上的雪
  });
}

// ---- 雪：三层，越近越大、越快、越模糊；每片雪在一个循环里正好落完整数遍，所以首尾无缝 ----
const FLAKES = [];
const wrapv = (v, m) => ((v % m) + m) % m;
[[220, 1.0, 1.9, 1, 0, .55], [130, 2.2, 3.6, 2, 1, .8], [26, 7, 14, 3, 2, .5]].forEach(([n, r0, r1, k, m, a], layer) => {
  for (let i = 0; i < n; i++) FLAKES.push({layer, x: rnd(i, 81 + layer) * (W + 200) - 100, y: rnd(i, 84 + layer) * (H + 60), r: r0 + rnd(i, 87 + layer) * (r1 - r0), k, m, a: a * (.6 + rnd(i, 90 + layer) * .4), ph: rnd(i, 93 + layer) * TAU, sw: 1 + Math.floor(rnd(i, 96 + layer) * 3)});
});
function flakePos(f, t) {
  const y = fract(f.y / (H + 60) + f.k * t / T) * (H + 60) - 30;
  const x = ((f.x + f.m * (W + 200) * t / T + Math.sin(TAU * f.sw * t / T + f.ph) * (8 + f.layer * 10)) % (W + 200) + W + 200) % (W + 200) - 100;
  return [x, y];
}
function drawSnow(t, nearLayer, C) {        // 雪画在画面坐标里（不随推近变大），镜头平移时近的雪移得多一点
  FLAKES.forEach(f => {
    if ((f.layer === 2) !== nearLayer) return;
    let [x, y] = flakePos(f, t);
    const par = [.15, .3, .6][f.layer];
    x = wrapv(x + 100 - (C.x - W / 2) * par, W + 200) - 100; y = wrapv(y + 30 - (C.y - H / 2) * par, H + 60) - 30;
    if (f.layer === 2) { glowAt([235, 242, 255], f.a * .5, x, y, f.r, f.r, 1.1); return; }
    // 雪片随风打旋：在下落之外再加一点小小的绕圈
    x += Math.sin(TAU * (2 + f.sw) * t / T + f.ph * 3) * (2 + f.layer * 3); y += Math.cos(TAU * (2 + f.sw) * t / T + f.ph * 3) * (1.5 + f.layer * 2);
    let lit = 0;                                         // 落进路灯光里的雪片被照成暖色（在世界坐标里判断）
    const wx = C.x + (x - W / 2) / C.z, wy = C.y + (y - H / 2) / C.z;
    if (wy > LAMP_Y && wy < LANE) LAMPS.forEach(lx => { const d = Math.abs(wx - lx - 13) / (12 + (wy - LAMP_Y) * .55); lit = Math.max(lit, clamp(1 - d) * clamp((LANE - wy) / 40)); });
    const tw = .75 + .25 * Math.sin(TAU * 5 * t / T + f.ph * 7);                    // 雪片翻转时亮度微微变化
    const rr = f.r * (1 + lit * .4) * 1.9, col = lit > .05 ? hex(mixc('#eef3fb', '#ffd9a0', lit).replace(/rgb\((\d+),(\d+),(\d+)\)/, (m, r, g2, b2) => '#' + [r, g2, b2].map(v => (+v).toString(16).padStart(2, '0')).join(''))).slice(0, 3) : [238, 243, 251];
    glowAt(col, Math.min(1, (f.a + lit * .5) * tw), x, y, rr, rr, 1.6);           // 边缘柔和的雪片（不是硬边的圆点）
  });
  g.globalAlpha = 1;
}

// ---- 雪见酒：漂在水面上的木托盘，上面放着清酒壶和小酒杯（日本有些旅馆的露天温泉会这样边泡边喝）----
function drawTray(t) {
  const cx = 548 + Math.sin(TAU * t / T) * 14, cy = POOL + 112 + Math.sin(TAU * 3 * t / T) * 1.5, rot = Math.sin(TAU * t / T + 1) * .05;
  g.save(); g.translate(cx, cy); g.rotate(rot);
  g.strokeStyle = 'rgba(190,215,240,.35)'; g.lineWidth = 1.2; g.beginPath(); g.ellipse(0, 9, 62, 9, 0, 0, TAU); g.stroke();   // 托盘四周的水纹
  g.fillStyle = '#b8332a'; g.beginPath(); g.moveTo(-50, 0); g.lineTo(50, 0); g.lineTo(42, -16); g.lineTo(-42, -16); g.closePath(); g.fill();   // 托盘（透视的方形）
  g.fillStyle = '#7e1f1a'; g.fillRect(-50, 0, 100, 6);                                                                    // 托盘的边
  g.fillStyle = '#e9e2d4'; g.beginPath(); g.moveTo(-14, -12); g.quadraticCurveTo(-24, -26, -16, -44); g.lineTo(-10, -50); g.lineTo(-4, -50); g.lineTo(2, -44); g.quadraticCurveTo(10, -26, 0, -12); g.closePath(); g.fill();   // 清酒壶（德利）
  g.fillStyle = '#2d4f7a'; g.fillRect(-18, -34, 22, 3);                                                                   // 壶上的蓝色线
  [[18, 0], [32, 1]].forEach(([x, k]) => { g.fillStyle = '#f2ece0'; g.beginPath(); g.moveTo(x - 7, -16); g.lineTo(x + 7, -16); g.lineTo(x + 5, -8); g.lineTo(x - 5, -8); g.fill(); g.fillStyle = '#2d4f7a'; g.beginPath(); g.ellipse(x, -16, 7, 2, 0, 0, TAU); g.fill(); });   // 两只小酒杯
  g.restore();
  g.globalCompositeOperation = 'lighter'; glowAt([255, 190, 120], .12, cx, cy - 20, 70, 40, 1.3); g.globalCompositeOperation = 'source-over';
}

// ---- 干杯：两个人从水里举起啤酒杯，在头顶碰一下（啤酒被灯笼照得金黄，碰杯时泡沫溅起、闪一下光）----
const CHEERS = {up: 9.9, clink: 10.7, down: 12.6};
function mug(x, y, s, tilt) {
  g.save(); g.translate(x, y); g.rotate(tilt); g.scale(s, s);
  g.fillStyle = 'rgba(255,190,80,.95)'; roundRect(-6, -8, 12, 16, 2); g.fill();          // 啤酒
  g.fillStyle = 'rgba(255,236,190,.55)'; g.fillRect(-4.5, -6, 2, 12);                    // 玻璃的高光
  g.fillStyle = '#fdfaf2'; g.beginPath(); g.ellipse(0, -8.5, 6.6, 3, 0, 0, TAU); g.fill();   // 泡沫
  g.beginPath(); g.arc(-3, -10, 2.4, 0, TAU); g.arc(1.5, -10.6, 2.8, 0, TAU); g.arc(4.5, -9.5, 2, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,220,160,.9)'; g.lineWidth = 1.6; g.beginPath(); g.arc(6.5, 0, 4, -Math.PI / 2, Math.PI / 2); g.stroke();   // 把手

// 从字形的遮罩算一次，之后每帧贴图
function snowCaps(src, maxTh) {
  const w = src.width, h = src.height, a = src.getContext('2d').getImageData(0, 0, w, h).data;
  const on = (x, y) => a[(y * w + x) * 4 + 3] > 127;
  const edge = new Uint8Array(w * h), th = new Float32Array(w * h);
  for (let y = 1; y < h; y++) for (let x = 0; x < w; x++) if (on(x, y) && !on(x, y - 1)) edge[y * w + x] = 1;
  const near = (x, y) => edge[y * w + x] ? y : edge[(y - 1) * w + x] ? y - 1 : edge[(y + 1) * w + x] ? y + 1 : -1;
  // 1) 每个上沿点有多「平」：左右 ±10 像素里有多少点也在同一高度附近
  for (let y = 2; y < h - 1; y++) for (let x = 10; x < w - 10; x++) {
    if (!edge[y * w + x]) continue;
    let n = 0; for (let dx = -10; dx <= 10; dx++) if (near(x + dx, y) >= 0) n++;
    th[y * w + x] = maxTh * clamp((n - 9) / 10);
  }
  // 2) 沿着上沿左右平滑，雪檐两头圆圆地收掉，中间略有起伏
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const o = out.getContext('2d'), img = o.createImageData(w, h), d = img.data;
  for (let y = 2; y < h - 1; y++) for (let x = 10; x < w - 10; x++) {
    if (!edge[y * w + x]) continue;
    let sum = 0, cnt = 0;
    for (let dx = -5; dx <= 5; dx++) { const yy = near(x + dx, y); sum += yy >= 0 ? th[yy * w + x + dx] : 0; cnt++; }
    const t0 = sum / cnt * (.85 + .15 * Math.sin(x * .21) * Math.sin(x * .07));
    if (t0 < .5) continue;
    for (let k = -1; k < Math.ceil(t0); k++) {                  // 往上堆 t0 个像素（多盖住字的上沿一个像素）
      const yy = y - 1 - k; if (yy < 0) break;
      const j = (yy * w + x) * 4, f = clamp(t0 - k), shade = clamp((k + 1) / Math.max(1, t0));
      d[j] = Math.round(196 + 54 * shade); d[j + 1] = Math.round(210 + 42 * shade); d[j + 2] = Math.round(234 + 21 * shade);
      d[j + 3] = Math.max(d[j + 3], Math.round(255 * f));
    }
  }
  o.putImageData(img, 0, 0);
  return out;
}
