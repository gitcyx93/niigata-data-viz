<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(222,230,244,.68)';      // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;
  if (sprites[key]) return sprites[key];
  const N = 256, c = document.createElement('canvas'); c.width = c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(N, N), d = img.data;
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const r = Math.hypot(i + .5 - N / 2, j + .5 - N / 2) / (N / 2), k = (j * N + i) * 4;
    d[k] = rgb[0]; d[k + 1] = rgb[1]; d[k + 2] = rgb[2]; d[k + 3] = Math.round(255 * Math.pow(Math.max(0, 1 - r), falloff));
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function verticalSprite(key, stops) {                 // 竖直方向的渐变条：stops = [[位置0~1, [r,g,b,a]], ...]
  if (sprites[key]) return sprites[key];
  const N = 512, c = document.createElement('canvas'); c.width = 1; c.height = N;
  const x = c.getContext('2d'), img = x.createImageData(1, N), d = img.data;
  for (let j = 0; j < N; j++) {
    const u = (j + .5) / N; let k = 0; while (k < stops.length - 2 && u > stops[k + 1][0]) k++;
    const [u0, a] = stops[k], [u1, b] = stops[k + 1], f = clamp((u - u0) / (u1 - u0));
    for (let n = 0; n < 4; n++) d[j * 4 + n] = Math.round(a[n] + (b[n] - a[n]) * f);
  }
  x.putImageData(img, 0, 0); return sprites[key] = c;
}
function glowAt(rgb, alpha, x, y, rx, ry = rx, falloff) {
  if (alpha <= .002) return;
  g.globalAlpha = Math.min(1, alpha); g.drawImage(radialSprite(rgb, falloff), x - rx, y - ry, rx * 2, ry * 2); g.globalAlpha = 1;
}
const hsl2rgb = (h, s, l) => {
  s /= 100; l /= 100; const k = n => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
  return [0, 8, 4].map(n => 255 * (l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1))));
};

// ======== 字体：中文用思源黑体，数字和英文用 Sora（几何感的现代无衬线），靠字重拉开层次 ========
// 繁体版（<html lang="zh-TW">）自动换成思源黑体繁体
const TC = document.documentElement.lang === 'zh-TW';
const FONTS = TC ? {
  cjk:   '"Source Han Sans TC","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif',
  latin: '"Sora","Source Han Sans TC",sans-serif',
} : {
  cjk:   '"Source Han Sans SC","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif',
  latin: '"Sora","Source Han Sans SC",sans-serif',
};
// ---- 文字工具 ----
const latinOnly = s => /^[\x20-\x7e]+$/.test(s);
function setFont(size, weight = 400, spacing = 0, fam = 'cjk') {
  g.font = `${weight} ${size}px ${FONTS[fam]}`;
  if ('letterSpacing' in g) g.letterSpacing = spacing + 'px';
}
function resetSpacing(c = g) { if ('letterSpacing' in c) c.letterSpacing = '0px'; }
function measure(s, size, weight = 400, spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  setFont(size, weight, spacing, fam); const w = g.measureText(s).width - spacing; resetSpacing(); return w;
}
function text(s, x, y, size, color, weight = 400, align = 'left', spacing = 0, fam = latinOnly(s) ? 'latin' : 'cjk') {
  const w = measure(s, size, weight, spacing, fam);
  const left = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  setFont(size, weight, spacing, fam); g.textAlign = 'left'; g.fillStyle = color; g.fillText(s, left, y); resetSpacing();
  return w;
}
// 一行里几段字，整体居中；计数的数字按最终值的宽度排版、右对齐，避免整行抖动
// parts: [文字, 字号, 颜色, 字重, 字距, 最终值]
function line(parts, y) {
  const ws = parts.map(([s, size, , wt = 400, sp = 0, slot]) => measure(slot || s, size, wt, sp));
  let x = (W - ws.reduce((a, b) => a + b, 0)) / 2;
  parts.forEach(([s, size, color, wt = 400, sp = 0, slot], i) => {
    text(s, slot ? x + ws[i] : x, y, size, color, wt, slot ? 'right' : 'left', sp); x += ws[i];

}
function roundRect(x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}

// 一段文字的出场/退场：从下往上浮起，结束时淡出
function scene(t, from, to) {
  const age = since(t, from), dur = since(to, from);
  if (age > dur) return 0;
  return {p: from > to && t < to ? 1 : easeOut(age / .55), out: clamp((dur - age) / .35), age};
}
function rise(s, draw) {
  if (!s) return;
  g.save(); g.globalAlpha = s.out * s.p; g.translate(0, (1 - s.p) * 40); draw(); g.restore();
}

// ---- 字号和字重：极简风格，靠大小和粗细拉开层次 ----
// [字号, 字重, 字距]
const TS = () => ({num: [140, 200, -4], name: [68, 300, 8], word: [112, 200, 30], unit: [40, 300, 2], sub: [30, 300, 2]});

// ======== 左上角：讲故事的小字 ========
// 小字是「背景知识」：比大字小、细、灰，前面一根竖细线；一个字一个字慢慢浮现，说完淡出。
// story: [[开始秒, 结束秒, 一句话], ...]，一次只放一行
function drawStory(t, story, color = NARRATION, bar = TYPE.accent) {
  story.forEach(([from, to, s]) => {
    if (t < from || t > to) return;
    const out = clamp((to - t) / .5), y = 480;
    g.globalAlpha = out * clamp((t - from) / .3);
    g.fillStyle = bar; g.fillRect(80, y - 30, 2, 38);          // 竖细线：提示「这是旁白」
    setFont(32, 400, 1.5); g.textAlign = 'left';
    let x = 100;
    [...s].forEach((c, i) => {
      const p = clamp((t - from - i * .05) / .45);           // 每个字晚 0.05 秒出现
      if (p > 0) { g.globalAlpha = ease(p) * out; g.fillStyle = color; g.fillText(c, x, y + 8 * (1 - ease(p))); }
      x += g.measureText(c).width;
    });
    g.globalAlpha = 1; resetSpacing();
  });
}

// ======== 标题：镜面金属字（全系列统一）========
//  - 底色是接近白色的哑光银，从上到下平滑地由亮变暗（不要中间一道暗色「地平线」，在大字上会看成一条横线）
//  - 字面映出此刻的场景：截一块画面、上下翻转、缩到很小（相当于金属表面的模糊），以「柔光」叠上去，是一层光泽而不是清晰的倒影
//  - 倒角：上沿一道亮边、下沿一道暗边，让字有厚度；字外一圈外浮雕；下面一层很轻的投影
//  - 被场景里的光照出一块柔和的高光，位置、颜色跟着光源走，亮度有上限
// 不变的几层只画一次；每帧只在一张小画布上贴几次图
const TX = 30, TB = 190;                 // 标题在缓存画布里的位置
const titleLayers = {};
let titleText = '';
function titleLayer(key, paint) {
  if (!titleLayers[key]) {
    const c = document.createElement('canvas'); c.width = 860; c.height = 300;
    const x = c.getContext('2d');
    x.font = `800 132px ${FONTS.cjk}`; if ('letterSpacing' in x) x.letterSpacing = '6px';
    paint(x); titleLayers[key] = c;
  }
  return titleLayers[key];
}
const titleWork = document.createElement('canvas'); titleWork.width = 860; titleWork.height = 300;
const mask = () => titleLayer('mask', x => { x.fillStyle = '#fff'; x.fillText(titleText, TX, TB); });
const titleShadow = () => titleLayer('shadow', x => {
  x.shadowColor = 'rgba(0,0,0,.42)'; x.shadowBlur = 26; x.shadowOffsetY = 6; x.shadowOffsetX = 5000; x.fillStyle = '#000'; x.fillText(titleText, TX - 5000, TB);
});
const silver = () => titleLayer('silver', x => {
  const top = TB - 112, m = x.createLinearGradient(0, top, 0, TB + 12);
  m.addColorStop(0, '#f8fafd'); m.addColorStop(.55, '#dce2eb'); m.addColorStop(1, '#b2bdcd');
  x.fillStyle = m; x.fillText(titleText, TX, TB);
});
const bevel = () => titleLayer('bevel', x => {
  x.fillStyle = 'rgba(255,255,255,.85)'; x.fillText(titleText, TX, TB - 2);          // 上沿亮边
  x.globalCompositeOperation = 'destination-out'; x.fillText(titleText, TX, TB);
  x.globalCompositeOperation = 'source-over'; x.fillStyle = 'rgba(18,26,44,.45)'; x.fillText(titleText, TX, TB + 2.5);   // 下沿暗边
  x.globalCompositeOperation = 'destination-in'; x.fillText(titleText, TX, TB);
});
// 外浮雕：把字形模糊一下当成高度，按「光从左上方照下来」算字外一圈的明暗：
// 左上方贴着字边一道细亮边，右下方一道柔和的暗边，字像从背景里微微凸出来。字面本身不变。
// 只在第一次用到时算一次，之后每帧贴图
function blurF(a, w, h, r) {                   // 三次盒式模糊 ≈ 高斯模糊
  const tmp = new Float32Array(w * h), n = 2 * r + 1;
  for (let k = 0; k < 3; k++) {
    for (let y = 0; y < h; y++) {
      let acc = 0; const o = y * w;
      for (let x = -r; x <= r; x++) acc += a[o + Math.min(w - 1, Math.max(0, x))];
      for (let x = 0; x < w; x++) { tmp[o + x] = acc / n; acc += a[o + Math.min(w - 1, x + r + 1)] - a[o + Math.max(0, x - r)]; }
    }
    for (let x = 0; x < w; x++) {
      let acc = 0;
      for (let y = -r; y <= r; y++) acc += tmp[Math.min(h - 1, Math.max(0, y)) * w + x];
      for (let y = 0; y < h; y++) { a[y * w + x] = acc / n; acc += tmp[Math.min(h - 1, y + r + 1) * w + x] - tmp[Math.max(0, y - r) * w + x]; }
    }

}
const RELIEF = {r: 2, k: 7, hi: .55, lo: .85};     // 坡宽、坡度、亮边和暗边的强度
const relief = () => titleLayer('relief', x => {
  const w = 860, h = 300, m = mask().getContext('2d').getImageData(0, 0, w, h).data;
  const Hm = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) Hm[i] = m[i * 4 + 3] / 255;
  blurF(Hm, w, h, RELIEF.r);
  const L = [-.5, -.7, .5], ll = Math.hypot(...L); L[0] /= ll; L[1] /= ll; L[2] /= ll;
  const img = x.createImageData(w, h), d = img.data;
  for (let y = 1; y < h - 1; y++) for (let xx = 1; xx < w - 1; xx++) {
    const i = y * w + xx, out = 1 - m[i * 4 + 3] / 255;
    if (!out) continue;
    const gx = (Hm[i + 1] - Hm[i - 1]) / 2 * RELIEF.k, gy = (Hm[i + w] - Hm[i - w]) / 2 * RELIEF.k;
    const sh = (-gx * L[0] - gy * L[1] + L[2]) / Math.hypot(gx, gy, 1) - L[2];
    if (Math.abs(sh) < .004) continue;
    const j = i * 4, v = Math.min(1, Math.abs(sh) * 1.6);
    if (sh > 0) { d[j] = d[j + 1] = d[j + 2] = 255; d[j + 3] = v * RELIEF.hi * out * 255; }
    else { d[j] = 6; d[j + 1] = 8; d[j + 2] = 14; d[j + 3] = v * RELIEF.lo * out * 255; }
  }
  x.putImageData(img, 0, 0);
});
const sheen = document.createElement('canvas'); sheen.width = 96; sheen.height = 24;
// 标题区：NIIGATA + 地名 / 金属大标题 / 讲故事的小字
// header = {title, place, story, sheen: [x, y, w, h]（字面映出的那块画面，只取天空，不要深色的山）,
//           可选 storyColor / accent：小字和 NIIGATA、竖线的颜色（固定值或 t => 颜色）}
// L = {light: 光的强度, lc: [r,g,b] 光的颜色, x: 光的水平位置}
function drawHeader(t, L, header) {
  titleText = header.title;
  const pick = v => typeof v === 'function' ? v(t) : v;      // 颜色可以是固定值，也可以随时间变（如跟着故事由冷变暖）
  const narr = pick(header.storyColor) || NARRATION, accent = pick(header.accent) || TYPE.accent;
  const ew = text('NIIGATA', 80, 262, 26, accent, 500, 'left', 8);
  text(header.place, 80 + ew + 22, 262, 26, narr, 400, 'left', 4);
  const X = 74 - TX, Y = 404 - TB;
  g.drawImage(titleShadow(), X, Y);
  g.drawImage(relief(), X, Y);
  const sc = sheen.getContext('2d');
  sc.setTransform(1, 0, 0, -1, 0, 24);
  sc.drawImage(cv, ...header.sheen, 0, 0, 96, 24);
  const w = titleWork.getContext('2d');
  w.setTransform(1, 0, 0, 1, 0, 0); w.globalCompositeOperation = 'source-over'; w.globalAlpha = 1; w.clearRect(0, 0, 860, 300);
  w.drawImage(silver(), 0, 0);
  w.imageSmoothingEnabled = true; w.imageSmoothingQuality = 'high';
  w.globalCompositeOperation = 'soft-light'; w.drawImage(sheen, TX - 20, TB - 130, 660, 160);
  w.globalCompositeOperation = 'lighter'; w.globalAlpha = .35; w.drawImage(sheen, TX - 20, TB - 130, 660, 160);
  w.globalAlpha = 1;
  if (L.light > .03) {                                       // 高光：跟着光源的位置和颜色
    const hx = TX + clamp(L.x / W) * 600;
    w.globalCompositeOperation = 'source-over'; w.globalAlpha = Math.min(.5, L.light * .38);
    w.drawImage(radialSprite(L.lc, 1.3), hx - 280, TB - 190, 560, 240);
    w.globalAlpha = 1;
  }
  w.globalCompositeOperation = 'destination-in'; w.drawImage(mask(), 0, 0);
  w.globalCompositeOperation = 'source-over';
  w.drawImage(bevel(), 0, 0);
  g.drawImage(titleWork, X, Y);
  drawStory(t, header.story, narr, accent);
}
// 文字层底下的压暗：上面托住标题，下面托住大字（y0 ~ y0+h 的中间最暗）
function scrims(bandY = 1300, bandH = 320, top = 204, band = 158) {
  g.drawImage(verticalSprite('topscrim' + top, [[0, [1, 3, 12, top]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.drawImage(verticalSprite('band' + band, [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, band]], [1, [1, 3, 12, 0]]]), 0, bandY, W, bandH);
}

// ======== 播放和导出 ========
// render(t) 必须是确定性的：同一个 t 永远画出同一帧（逐帧录制靠这个）。?record 时不自动播放，等录制脚本调用。
async function loadFonts() {
  if (typeof FONT_DATA === 'undefined' || !window.FontFace) return;
  await Promise.all(FONT_DATA.map(([family, weight, range, b64]) => {
    const f = new FontFace(family, `url(data:font/woff2;base64,${b64})`, {weight, unicodeRange: range});
    document.fonts.add(f); return f.load();
  }));
}
function boot(render) {
  window.render = render;
  window.LOOP_SECONDS = T;
  const ready = loadFonts().catch(() => {});
  if (!params.has('record')) {
    ready.then(() => {
      const start = performance.now();
      const tick = () => { render((performance.now() - start) / 1000); requestAnimationFrame(tick); };
      tick();
    });
  } else ready.then(() => { render(0); window.READY = true; });
}
/*SERIES-END*/
</script>
<script>
// 越后汤泽（新潟县汤泽町）—— 冬季：滑雪 + 温泉，川端康成《雪国》的舞台。
// 画面：下雪的夜。山上亮着夜间滑雪的雪道，有人在滑，缆车慢慢上下；山脚是冒着白汽的温泉街和新干线高架；
// 近处一条两边是雪墙的小路，撑伞的人走过，雪墙比人还高；最前面一池露天温泉。
// 节奏：开场（一小时到雪国）→ 雪比人还高 → 小说开头的隧道（屏住呼吸）→ 新干线冲出隧道（全片高潮：一片白，暴风雪扑面）
//      → 余韵里竖排浮现「穿出长长的隧道 / 眼前就是雪国」→ 泡温泉 → 提醒（想人少，3 月去）。
// render(t) 是确定性的：同一个 t 永远画出同一帧；所有动画在 T 秒内首尾相接（雪、云、白汽、缆车、行人都按整数圈循环）。

const T = 20;
const SCENE = {
  skyTop:'#03050d', skyMid:'#0a1330', skyLow:'#1c2a52', cloud:[44, 56, 96],
  ridgeFar:'#1f2b52', ridgeNear:'#141d3a', mountain:'#121a33', trees:'#080d1c',
  run:[118, 138, 182], snow:'#25345a', snowLow:'#182240', wall:'#2e3d66', wallTop:'#7e8fb6',
  town:'#0a0f1d', roof:'#7c8db0', window:[255, 206, 140], viaduct:'#070b16',
  rock:'#0c111c', rockSnow:'#8292b3', water:'#0b1a2b', waterTop:'#132a42', umbrella:'#c0414c',
};
// 远景（山、小镇、高架）用自己的坐标画，整体往上提 LIFT，让山更饱满、近处留出雪墙小路的位置
const LIFT = 120;
const GROUND = 1300, DECK = 1356, PORTAL = 250, FIELD = 1420;   // 远景坐标：小镇地面、高架桥面、隧道口、高架下的雪地
const FIELD_S = FIELD - LIFT;           // 画面坐标：近处雪地的上沿
const LANE = 1380;                      // 雪墙小路的路面
const POOL = 1650;                      // 温泉水面的上沿
const GON = {x0: 470, y0: 1250, x1: 735, y1: 742};       // 缆车：山脚站 → 山顶站

// ---- 雪道（夜间滑雪）：从山顶蜿蜒到山脚 ----
const RUNS = [
  {w: 30, pts: [[712, 742], [668, 830], [722, 920], [640, 1010], [700, 1100], [610, 1190], [640, 1268]]},
  {w: 24, pts: [[728, 748], [800, 840], [750, 930], [858, 1020], [800, 1120], [900, 1200], [878, 1272]]},
  {w: 20, pts: [[330, 880], [290, 960], [360, 1040], [282, 1130], [330, 1210], [300, 1270]]},
  {w: 18, pts: [[668, 790], [590, 870], [570, 960], [500, 1050], [550, 1140], [470, 1230]]},
];
// 山脊：主峰在右，左边一座矮一点的山，中间是鞍部
const ridge = x => Math.min(730 + Math.abs(x - 715) * .52, 868 + Math.abs(x - 320) * .6) + Math.sin(x / 37) * 7 + Math.sin(x / 13) * 2.5;
function smoothPath(c, pts) {          // 经过各点中点的平滑曲线（雪道是弯的，不是折线）
  c.beginPath(); c.moveTo(...pts[0]);
  for (let i = 1; i < pts.length - 1; i++) c.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  c.lineTo(...pts[pts.length - 1]);
}
function pointOnRun(r, u) {             // 沿雪道走到 u（0 山顶 ~ 1 山脚）的位置，和画出来的曲线一致
  const p = r.pts, n = p.length - 1, f = u * (n - 1), i = Math.min(n - 2, Math.floor(f)), k = f - i;
  const a = i === 0 ? p[0] : [(p[i][0] + p[i + 1][0]) / 2, (p[i][1] + p[i + 1][1]) / 2];
  const c = i === n - 2 ? p[n] : [(p[i + 1][0] + p[i + 2][0]) / 2, (p[i + 1][1] + p[i + 2][1]) / 2], m = p[i + 1];
  return [0, 1].map(j => (1 - k) * (1 - k) * a[j] + 2 * (1 - k) * k * m[j] + k * k * c[j]);
}
function distToRun(x, y) {
  let best = 1e9;
  RUNS.forEach(r => {
    for (let i = 0; i < r.pts.length - 1; i++) {
      const [ax, ay] = r.pts[i], [bx, by] = r.pts[i + 1], dx = bx - ax, dy = by - ay;
      const u = clamp(((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy));
      best = Math.min(best, Math.hypot(x - ax - dx * u, y - ay - dy * u) - r.w / 2);
    }

// ---- 静态画面（只画一次）：天空、远景（山、小镇、高架）、近处雪地和雪墙、温泉的岩石和灯笼 ----
const sky = document.createElement('canvas'); sky.width = W; sky.height = H;
const land = document.createElement('canvas'); land.width = W; land.height = H;
const near = document.createElement('canvas'); near.width = W; near.height = H;      // 雪地和雪墙的后墙
const front = document.createElement('canvas'); front.width = W; front.height = H;   // 雪墙的前墙、温泉的岩石和灯笼
const clouds = document.createElement('canvas'); clouds.width = W * 2; clouds.height = 760;
const LANTERN = {x: 905, y: POOL - 6};
(function drawStatic() {
  const main = g;
  // 天空
  let b = g = sky.getContext('2d');
  b.drawImage(verticalSprite('sky', [[0, hex(SCENE.skyTop)], [.55, hex(SCENE.skyMid)], [1, hex(SCENE.skyLow)]]), 0, 0, W, 1000);
  glowAt([90, 110, 170], .35, 540, 1000, 900, 360, 1.2);          // 雪夜的天光：温泉街的灯照在低云上
  glowAt([255, 190, 120], .1, 520, 1110, 600, 200, 1.2);
  // 雪云：一张两倍宽、左右能接上的云图，每帧平移（一个循环正好移过一个画面宽）
  b = g = clouds.getContext('2d');
  for (let i = 0; i < 70; i++) {
    const x = rnd(i, 141) * W, y = 120 + Math.pow(rnd(i, 142), .7) * 560, r = 120 + rnd(i, 143) * 220;
    const warm = clamp((y - 400) / 300), c = SCENE.cloud.map((v, k) => Math.round(v + [26, 14, -6][k] * warm));
    [0, W, -W, 2 * W].forEach(dx => glowAt(c, .16 + rnd(i, 144) * .14, x + dx, y, r * 1.6, r * .55, 1.3));
  }
  // 远景
  b = g = land.getContext('2d');
  b.translate(0, -LIFT);
  [[SCENE.ridgeFar, 860, 60, 140], [SCENE.ridgeNear, 930, 45, 90]].forEach(([c, y0, a, f], k) => {
    b.fillStyle = c; b.beginPath(); b.moveTo(0, H + LIFT);
    for (let x = 0; x <= W; x += 12) b.lineTo(x, y0 - Math.sin(x / f + k * 2) * a - Math.sin(x / 41 + k) * 10);
    b.lineTo(W, H + LIFT); b.fill();
  });

  for (let x = 0; x <= W; x += 6) b.lineTo(x, ridge(x));
  b.lineTo(W, H + LIFT); b.fill();
  b.save(); b.beginPath(); b.moveTo(0, H + LIFT); for (let x = 0; x <= W; x += 6) b.lineTo(x, ridge(x)); b.lineTo(W, H + LIFT); b.clip();
  b.globalAlpha = .55; b.drawImage(verticalSprite('mtsnow', [[0, [70, 88, 130, 255]], [.5, [40, 52, 86, 255]], [1, [18, 24, 44, 255]]]), 0, 650, W, 650);
  b.globalAlpha = 1;
  RUNS.forEach(r => {                                  // 雪道：被灯照亮的雪
    b.lineJoin = b.lineCap = 'round'; b.lineWidth = r.w; b.strokeStyle = `rgba(${SCENE.run},.62)`;
    smoothPath(b, r.pts); b.stroke();
  });
  b.globalCompositeOperation = 'lighter';
  RUNS.forEach(r => {
    for (let i = 0; i < r.pts.length - 1; i++) {
      const [ax, ay] = r.pts[i], [bx, by] = r.pts[i + 1], n = Math.ceil(Math.hypot(bx - ax, by - ay) / 26);
      for (let k = 0; k < n; k++) glowAt([255, 236, 205], .045, ax + (bx - ax) * k / n, ay + (by - ay) * k / n, r.w * 1.5, r.w * 1.2, 1.3);
    }
  });
  b.globalCompositeOperation = 'source-over';
  for (let i = 0; i < 4200; i++) {                     // 杉树林：小小的深色三角，雪道上不长树
    const x = rnd(i, 11) * W, top = ridge(x) + 10, y = top + Math.pow(rnd(i, 12), .8) * (GROUND - top);
    if (distToRun(x, y) < 6) continue;
    const h = 9 + rnd(i, 13) * 12 + (y - 650) * .012;
    b.fillStyle = SCENE.trees; b.beginPath(); b.moveTo(x, y - h); b.lineTo(x + h * .32, y); b.lineTo(x - h * .32, y); b.fill();
    if (rnd(i, 14) > .5) { b.fillStyle = 'rgba(150,170,210,.22)'; b.beginPath(); b.moveTo(x, y - h); b.lineTo(x + h * .14, y - h * .55); b.lineTo(x - h * .14, y - h * .55); b.fill(); }

    const warm = clamp(1 - Math.abs(x - LANTERN.x) / 400) * lamp;
    glowAt([Math.round(205 + 50 * warm), Math.round(214 + 10 * warm), Math.round(232 - 60 * warm)], Math.sin(Math.PI * u) * .15, x, y, r, r * .8, 1.1);
  });
}

// ---- 文字 ----
// 文字配色方案（网址加 ?style=a|b|c|d 切换；不录制时页面下方有按钮）
const STYLES = {
  a: '原版：白字 + 雾蓝',
  b: '冷暖：出隧道前是雪的冰蓝，之后是灯笼的暖色',
  c: '红伞：白字，每句一个关键词用红伞的颜色',
  d: '冷暖 + 标题上落雪',
};
const STYLE = {k: STYLES[params.get('style')] ? params.get('style') : 'd'};
const mixRGBA = (a, b, k) => `rgba(${a.map((v, i) => i < 3 ? Math.round(v + (b[i] - v) * k) : +(v + (b[i] - v) * k).toFixed(3)).join(',')})`;
// 冷暖方案的「温度」：雪夜里是冷的，穿出隧道后慢慢变暖（灯笼、温泉），循环结束前再回到冷色
const warmth = t => t < TRAIN.t ? 0 : t < TRAIN.t + 1.5 ? ease((t - TRAIN.t) / 1.5) : t < 19 ? 1 : t < 19.6 ? 1 - ease((t - 19) / .6) : 0;
const COLD = {head: [232, 244, 255, 1], key: [138, 210, 255, 1], sub: [196, 222, 248, .82], narr: [186, 210, 238, .72], accent: [143, 198, 240, 1]};
const WARM = {head: [255, 242, 224, 1], key: [255, 190, 116, 1], sub: [255, 226, 192, .82], narr: [238, 220, 198, .72], accent: [240, 184, 132, 1]};
function palette(t) {
  const k = STYLE.k;
  if (k === 'b' || k === 'd') {
    const w = warmth(t), P = {};
    Object.keys(COLD).forEach(n => P[n] = mixRGBA(COLD[n], WARM[n], w));
    P.tip = P.key; return P;
  }
  if (k === 'c') return {head: WHITE, key: '#ff7f86', sub: SOFT, narr: NARRATION, accent: TYPE.accent, tip: SOFT};
  return {head: WHITE, key: WHITE, sub: SOFT, narr: NARRATION, accent: TYPE.accent, tip: TYPE.gold};
}
const STORY = [
  [0.25, 4.3, '越后汤泽，川端康成小说《雪国》的舞台。'],
  [4.5, 8.4, '这里一个冬天下的雪，加起来约 10 米。'],
  [8.6, 11.4, '小说的开头，火车穿过一条长长的隧道——'],
  [16.2, 19.5, '滑完雪，泡进露天温泉，看雪落下来。'],
];
const HEADER = {title: '越后汤泽', place: '新潟县汤泽町', story: STORY, sheen: [60, 520, W - 120, 560],
  storyColor: t => palette(t).narr, accent: t => palette(t).accent};
const LINE1 = 1458, LINE2 = 1518;

// ---- 标题上落雪：在字的横笔上沿积一层雪（越平的地方积得越厚，斜笔和笔画两头几乎不积）----
// 从字形的遮罩算一次，之后每帧贴图
function snowCaps(src, maxTh) {
  const w = src.width, h = src.height, a = src.getContext('2d').getImageData(0, 0, w, h).data;
  const on = (x, y) => a[(y * w + x) * 4 + 3] > 127;
  const edge = new Uint8Array(w * h), th = new Float32Array(w * h);
  for (let y = 1; y < h; y++) for (let x = 0; x < w; x++) if (on(x, y) && !on(x, y - 1)) edge[y * w + x] = 1;
  const near = (x, y) => edge[y * w + x] ? y : edge[(y - 1) * w + x] ? y - 1 : edge[(y + 1) * w + x] ? y + 1 : -1;
  // 1) 每个上沿点有多「平」：左右 ±10 像素里有多少点也在同一高度附近
  for (let y = 2; y < h - 1; y++) for (let x = 10; x < w - 10; x++) {
    if (!edge[y * w + x]) continue;
    let n = 0; for (let dx = -10; dx <= 10; dx++) if (near(x + dx, y) >= 0) n++;
    th[y * w + x] = maxTh * clamp((n - 9) / 10);
  }
  // 2) 沿着上沿左右平滑，雪檐两头圆圆地收掉，中间略有起伏
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const o = out.getContext('2d'), img = o.createImageData(w, h), d = img.data;
  for (let y = 2; y < h - 1; y++) for (let x = 10; x < w - 10; x++) {
    if (!edge[y * w + x]) continue;
    let sum = 0, cnt = 0;
    for (let dx = -5; dx <= 5; dx++) { const yy = near(x + dx, y); sum += yy >= 0 ? th[yy * w + x + dx] : 0; cnt++; }
    const t0 = sum / cnt * (.85 + .15 * Math.sin(x * .21) * Math.sin(x * .07));
    if (t0 < .5) continue;
    for (let k = -1; k < Math.ceil(t0); k++) {                  // 往上堆 t0 个像素（多盖住字的上沿一个像素）
      const yy = y - 1 - k; if (yy < 0) break;
      const j = (yy * w + x) * 4, f = clamp(t0 - k), shade = clamp((k + 1) / Math.max(1, t0));
      d[j] = Math.round(196 + 54 * shade); d[j + 1] = Math.round(210 + 42 * shade); d[j + 2] = Math.round(234 + 21 * shade);
      d[j + 3] = Math.max(d[j + 3], Math.round(255 * f));
    }
  }
  o.putImageData(img, 0, 0);
  return out;
}
let titleCaps = null;
function drawTitleSnow() {                                      // 标题「越后汤泽」上的积雪（一直在）
  if (!titleLayers.mask) return;
  if (!titleCaps) titleCaps = snowCaps(titleLayers.mask, 9);
  g.drawImage(titleCaps, 74 - TX, 404 - TB);
}
// 一行大字，整体居中；segs = [[文字, 是否关键词], ...]，关键词用强调色
// 关键词除了换颜色，字也稍粗一点（原版方案不区分）
function rich(segs, y, size, weight, sp, P) {
  const wt = key => key && STYLE.k !== 'a' ? weight + 200 : weight;
  const ws = segs.map(([s, key]) => measure(s, size, wt(key), sp) + sp);
  let x = (W - ws.reduce((p, q) => p + q, 0) + sp) / 2;
  segs.forEach(([s, key], i) => { text(s, x, y, size, key ? P.key : P.head, wt(key), 'left', sp); x += ws[i]; });
}
function headline(s, segs, sub, subColor, P) {
  const S = TS();
  rise(s, () => {
    rich(segs, LINE1, S.name[0], S.name[1], S.name[2], P);
    text(sub, W / 2, LINE2 + 4, S.sub[0], subColor, S.sub[1], 'center', S.sub[2]);
  });
}
// 余韵里的那句话：竖排，像小说的一页，一个字一个字浮现（右边一列先出来）
const VERSE = {from: 12.9, to: 16.0, cols: [[176, '穿出长长的隧道'], [112, '眼前就是雪国']], y: 600, step: 54};
function drawVerse(t, P) {
  if (t < VERSE.from || t > VERSE.to) return;
  const out = clamp((VERSE.to - t) / .6);
  let n = 0;
  VERSE.cols.forEach(([x, s], ci) => [...s].forEach((c, i) => {
    const p = clamp((t - VERSE.from - n++ * .09) / .6);
    if (p <= 0) return;
    g.globalAlpha = ease(p) * out;
    text(c, x, VERSE.y + i * VERSE.step + 10 * (1 - ease(p)), 44, ci === 1 && i >= 4 ? P.key : P.head, 300, 'center');   // 「雪国」用强调色
  }));
  g.globalAlpha = 1;
}
function typoFront(t) {
  const P = palette(t);
  // ① 开场（第 0 秒就在画面上，当封面）
  headline(scene(t, 19.25, 4.4), [['一小时，到', 0], ['雪国', 1]], '从东京坐上越新干线，最快 66 分钟', P.sub, P);
  // ② 雪墙：画面上雪墙小路里有人撑伞走过
  headline(scene(t, 5.0, 8.9), [['雪墙', 0], ['比人还高', 1]], '最深的时候，积雪约 2 米', P.sub, P);
  // ③ 隧道和高潮：不放大字，把画面让给列车；余韵里竖排的一句话
  drawVerse(t, P);
  // ④ 提醒
  headline(scene(t, 15.5, 19.1), [['想人少，', 0], ['3 月', 1], ['去', 0]], '雪还很厚，人比 1、2 月少', P.tip, P);
}

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const a = t - TRAIN.t;
  // 镜头：列车出来前慢慢推近、画面压暗（屏住呼吸），冲出隧道时白光炸开，然后舒展地拉远
  let zoom = 1;
  if (a > -2.6 && a < 3.5) zoom += a < 0 ? .045 * ease(clamp((a + 2.6) / 2.6)) : .045 * (1 - ease(clamp(a / 3.5)));
  const cx = PORTAL + 200, cy = DECK - 40 - LIFT;
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(zoom, 0, 0, zoom, cx * (1 - zoom), cy * (1 - zoom));
  const cam = g.getTransform();
  g.drawImage(sky, 0, 0);
  const ox = -fract(t / T) * W;                                   // 雪云慢慢往左飘，一个循环移过一个画面宽
  g.drawImage(clouds, ox, 0); g.drawImage(clouds, ox + W * 2, 0);
  drawSnow(t, false);
  g.drawImage(land, 0, 0);
  // 远景坐标里画的动态：滑雪的人、缆车、温泉街的白汽、隧道口的光、列车、雪雾
  g.setTransform(cam.translate(0, -LIFT));
  drawSkiers(t);
  drawGondola(t);
  drawTownSteam(t);
  const pre = clamp((a + 1.6) / 1.6) * (a < .3 ? 1 : clamp(1 - (a - .3) / .6));
  g.globalCompositeOperation = 'lighter';
  glowAt([255, 240, 215], .9 * pre * pre, PORTAL + 22, DECK - 36, 70 + pre * 120, 50 + pre * 40, 1.4);
  g.globalCompositeOperation = 'source-over';
  drawTrain(t);
  drawSpray(t);
  g.setTransform(cam);
  // 近处：雪地、雪墙小路和撑伞的人、温泉
  g.drawImage(near, 0, 0);
  drawWalkers(t);
  const lamp = .85 + .15 * Math.sin(TAU * 2 * t / T);            // 灯笼轻轻呼吸
  drawPool(t, lamp);
  g.drawImage(front, 0, 0);
  drawSteam(t, lamp);
  drawSnow(t, true);
  // 屏住呼吸：出隧道前画面压暗；冲出来的一瞬，白光从隧道口炸开，一阵暴风雪横扫过画面
  g.setTransform(1, 0, 0, 1, 0, 0);
  const dim = a > -2.2 && a < 0 ? .38 * ease(clamp((a + 2.2) / 2)) : a >= 0 && a < .2 ? .38 * (1 - a / .2) : 0;
  if (dim > 0) { g.fillStyle = `rgba(2,3,8,${dim})`; g.fillRect(0, 0, W, H); }
  const flash = a >= 0 && a < 2.2 ? Math.pow(1 - a / 2.2, 2.6) * clamp(a / .06) : 0;
  if (flash > 0) {
    const px = PORTAL + 22, py = DECK - 36 - LIFT;
    g.globalCompositeOperation = 'lighter';
    glowAt([255, 252, 245], 1.4 * flash, px, py, 300 + easeOut(a / .5) * 1500, 220 + easeOut(a / .5) * 1300, .9);
    g.globalCompositeOperation = 'source-over';
    g.fillStyle = `rgba(236,243,253,${.6 * flash})`; g.fillRect(0, 0, W, H);
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 90; i++) {                                 // 暴风雪：雪片从隧道口方向横着扫过来
      const sp = .6 + rnd(i, 171) * .8, x = px - 200 + (a * 2600 * sp + rnd(i, 172) * 1400) % 1600;
      const y = py - 700 + rnd(i, 173) * 1500 + (x - px) * (rnd(i, 174) - .3) * .3, len = 30 + sp * 70;
      g.strokeStyle = `rgba(240,246,255,${.55 * Math.min(1, flash * 2.4) * rnd(i, 175)})`; g.lineWidth = 1.5 + rnd(i, 176) * 3;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - len, y - len * .12); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
  }

  // 文字层（不跟镜头动，保证清晰）
  g.globalAlpha = 1 - .85 * flash; scrims(1340, 320, 204, 150); g.globalAlpha = 1;   // 白光炸开时，文字底下的压暗也跟着褪掉
  const light = .25 + 2.2 * flash + .6 * pre;
  drawHeader(t, {light, lc: [255, 236, 210], x: a > 0 && a < 2.4 ? clamp(trainNose(t), 0, W) : W * .62}, HEADER);
  if (STYLE.k === 'd') drawTitleSnow();
  typoFront(t);
}
boot(render);
if (!params.has('record') && !params.has('clean')) {          // 配色方案切换按钮（录制时不显示）
  const b = document.createElement('button'), keys = Object.keys(STYLES);
  b.style.cssText = 'position:fixed;left:50%;bottom:12px;transform:translateX(-50%);font:600 13px/1.2 system-ui,sans-serif;color:#f4f7fb;background:rgba(10,16,40,.8);border:1px solid rgba(157,189,232,.45);border-radius:999px;padding:9px 14px;cursor:pointer;max-width:92vw';
  const label = () => b.textContent = `文字方案 ${STYLE.k.toUpperCase()}：${STYLES[STYLE.k]}（点击切换）`;
  b.onclick = () => { STYLE.k = keys[(keys.indexOf(STYLE.k) + 1) % keys.length]; label(); }; label(); document.body.appendChild(b);
}
</script>
