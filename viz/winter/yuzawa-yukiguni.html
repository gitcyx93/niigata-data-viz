<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(222,230,244,.68)';      // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;

<script>
// 越后汤泽（新潟县汤泽町）—— 冬季：滑雪 + 温泉，川端康成《雪国》的舞台。
// 一张雪国全景（雪山和夜间雪道、温泉街、新干线高架、有路灯的雪墙小路、露天温泉），镜头在里面上下平移、推近拉远，每段只看一样东西：

const ridge = x => Math.min(730 + Math.abs(x - 715) * .52, 868 + Math.abs(x - 320) * .6) + Math.sin(x / 37) * 7 + Math.sin(x / 13) * 2.5;

// ---- 雪道上的主角：一个穿红色雪服的人沿着雪道一路刻滑下来，最后一个急停，扬起一片粉雪 ----
// 刻滑：左右换刃画 S 形；转弯时身体向弯内倾斜，换刃的一瞬间身体立起、膝盖压低，内侧的雪杖点一下雪；
// 每个弯的外侧甩出一道雪浪；雪板在雪面上刻出两道平行的痕。越往下离镜头越近，人也越大。
const HERO = {run: 0, t0: 3.4, t1: 10.3, u0: .06, u1: .72, turns: 6.5, show: [2.6, 15.6]};
function heroAt(t) {
  const k = clamp((t - HERO.t0) / (HERO.t1 - HERO.t0)), u = lerp(HERO.u0, HERO.u1, 1 - Math.pow(1 - k, 1.25));
  const r = RUNS[HERO.run], [x, y] = pointOnRun(r, u), ph = k * HERO.turns * Math.PI;

}
function heroFrame(t) {                                  // 位置、速度方向、倾斜（转弯越急越斜）

function drawSkier(x, y, sc, dirx, diry, lean, flex, jacket, poleOut) {

  g.save(); g.translate(x, y);
  g.strokeStyle = '#05080f'; g.lineCap = 'round'; g.lineWidth = 1.3 * sc;     // 两块雪板，顺着前进方向
  [-1, 1].forEach(o => { g.beginPath(); g.moveTo(-sx * L + o * .9 * sc, -sy * L + o * .4 * sc); g.lineTo(sx * L + o * .9 * sc, sy * L + o * .4 * sc); g.stroke(); });

  g.strokeStyle = '#1b2236'; g.lineWidth = 2.1;                               // 腿：膝盖弯着
  g.beginPath(); g.moveTo(-1.4, 0); g.lineTo(-2.2, -4 * crouch); g.lineTo(-1, -8 * crouch); g.moveTo(1.4, 0); g.lineTo(1.8, -4 * crouch); g.lineTo(1, -8 * crouch); g.stroke();
  g.fillStyle = jacket; g.beginPath(); g.ellipse(0, -10.6 * crouch, 3.1, 3.8, -lean * .3, 0, TAU); g.fill();   // 雪服
  g.fillStyle = 'rgba(255,255,255,.75)'; g.fillRect(-3, -10 * crouch, 6, .8);                                 // 雪服上的白色条纹
  g.strokeStyle = jacket; g.lineWidth = 1.6;                                  // 手臂向前，握着雪杖
  g.beginPath(); g.moveTo(-2.6, -11.5 * crouch); g.lineTo(-4.2, -8.6 * crouch); g.moveTo(2.6, -11.5 * crouch); g.lineTo(4.2, -8.6 * crouch); g.stroke();
  g.strokeStyle = '#0b0f1a'; g.lineWidth = .5;
  g.beginPath(); g.moveTo(-4.2, -8.6 * crouch); g.lineTo(-5.5 - poleOut * 2, -.5); g.moveTo(4.2, -8.6 * crouch); g.lineTo(5.5 + poleOut * 2, -.5); g.stroke();
  g.fillStyle = '#f0f3f8'; g.beginPath(); g.arc(0, -15.4 * crouch, 1.9, 0, TAU); g.fill();                      // 白色头盔
  g.fillStyle = '#ffb347'; g.fillRect(-1.5, -15.5 * crouch, 3, .8);                                              // 雪镜的反光
  g.restore();
}
function drawHero(t) {

  const tt = Math.min(t, HERO.t1), f = heroFrame(tt), stop = clamp((t - HERO.t1 + .45) / .45);
  g.save(); g.globalAlpha = vis;
  // 刻出来的两道雪痕
  [-1, 1].forEach(o => {
    g.beginPath();
    for (let k = 0; k <= 80; k++) { const q = heroAt(lerp(HERO.t0, tt, k / 80)); const xx = q.x + o * .9 * q.sc, yy = q.y + o * .3 * q.sc; k ? g.lineTo(xx, yy) : g.moveTo(xx, yy); }

    g.strokeStyle = 'rgba(230,238,255,.25)'; g.lineWidth = .5; g.stroke();

  drawSkier(f.x, f.y, f.sc, dx, dy, lean, stop > 0 ? .9 : f.flex, '#e0573f', f.flex > .85 ? 1 : 0);
  g.restore();

// ---- 雪墙小路上撑伞的人（雪墙比人还高）----

// ---- 雪：三层，越近越大、越快、越模糊；每片雪在一个循环里正好落完整数遍，所以首尾无缝 ----
const FLAKES = [];
const wrapv = (v, m) => ((v % m) + m) % m;
[[220, 1.0, 1.9, 1, 0, .55], [130, 2.2, 3.6, 2, 1, .8], [26, 7, 14, 3, 2, .5]].forEach(([n, r0, r1, k, m, a], layer) => {
  for (let i = 0; i < n; i++) FLAKES.push({layer, x: rnd(i, 81 + layer) * (W + 200) - 100, y: rnd(i, 84 + layer) * (H + 60), r: r0 + rnd(i, 87 + layer) * (r1 - r0), k, m, a: a * (.6 + rnd(i, 90 + layer) * .4), ph: rnd(i, 93 + layer) * TAU, sw: 1 + Math.floor(rnd(i, 96 + layer) * 3)});
});
function flakePos(f, t) {
  const y = fract(f.y / (H + 60) + f.k * t / T) * (H + 60) - 30;
  const x = ((f.x + f.m * (W + 200) * t / T + Math.sin(TAU * f.sw * t / T + f.ph) * (8 + f.layer * 10)) % (W + 200) + W + 200) % (W + 200) - 100;
  return [x, y];
}
function drawSnow(t, nearLayer, C) {        // 雪画在画面坐标里（不随推近变大），镜头平移时近的雪移得多一点
  FLAKES.forEach(f => {
    if ((f.layer === 2) !== nearLayer) return;
    let [x, y] = flakePos(f, t);
    const par = [.15, .3, .6][f.layer];
    x = wrapv(x + 100 - (C.x - W / 2) * par, W + 200) - 100; y = wrapv(y + 30 - (C.y - H / 2) * par, H + 60) - 30;
    if (f.layer === 2) { glowAt([235, 242, 255], f.a * .5, x, y, f.r, f.r, 1.1); return; }
    // 雪片随风打旋：在下落之外再加一点小小的绕圈
    x += Math.sin(TAU * (2 + f.sw) * t / T + f.ph * 3) * (2 + f.layer * 3); y += Math.cos(TAU * (2 + f.sw) * t / T + f.ph * 3) * (1.5 + f.layer * 2);
    let lit = 0;                                         // 落进路灯光里的雪片被照成暖色（在世界坐标里判断）
    const wx = C.x + (x - W / 2) / C.z, wy = C.y + (y - H / 2) / C.z;
    if (wy > LAMP_Y && wy < LANE) LAMPS.forEach(lx => { const d = Math.abs(wx - lx - 13) / (12 + (wy - LAMP_Y) * .55); lit = Math.max(lit, clamp(1 - d) * clamp((LANE - wy) / 40)); });
    const tw = .75 + .25 * Math.sin(TAU * 5 * t / T + f.ph * 7);                    // 雪片翻转时亮度微微变化
    const rr = f.r * (1 + lit * .4) * 1.9, col = lit > .05 ? hex(mixc('#eef3fb', '#ffd9a0', lit).replace(/rgb\((\d+),(\d+),(\d+)\)/, (m, r, g2, b2) => '#' + [r, g2, b2].map(v => (+v).toString(16).padStart(2, '0')).join(''))).slice(0, 3) : [238, 243, 251];
    glowAt(col, Math.min(1, (f.a + lit * .5) * tw), x, y, rr, rr, 1.6);           // 边缘柔和的雪片（不是硬边的圆点）
  });

}

// ---- 干杯：两个人从水里举起啤酒杯，在头顶碰一下（啤酒被灯笼照得金黄，碰杯时泡沫溅起、闪一下光）----
const CHEERS = {up: 11.7, clink: 12.45, down: 14.2};
function mug(x, y, s, tilt) {
  g.save(); g.translate(x, y); g.rotate(tilt); g.scale(s, s);
  g.fillStyle = 'rgba(255,190,80,.95)'; roundRect(-6, -8, 12, 16, 2); g.fill();          // 啤酒
  g.fillStyle = 'rgba(255,236,190,.55)'; g.fillRect(-4.5, -6, 2, 12);                    // 玻璃的高光
  g.fillStyle = '#fdfaf2'; g.beginPath(); g.ellipse(0, -8.5, 6.6, 3, 0, 0, TAU); g.fill();   // 泡沫
  g.beginPath(); g.arc(-3, -10, 2.4, 0, TAU); g.arc(1.5, -10.6, 2.8, 0, TAU); g.arc(4.5, -9.5, 2, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(255,220,160,.9)'; g.lineWidth = 1.6; g.beginPath(); g.arc(6.5, 0, 4, -Math.PI / 2, Math.PI / 2); g.stroke();   // 把手
  g.restore();
}
function drawCheers(t) {                                // 抽象的干杯：两只啤酒杯从两人身边的水里浮上来，在中间碰一下
  const up = ease(clamp((t - CHEERS.up) / .6)) * (1 - ease(clamp((t - CHEERS.down) / .6)));
  if (up <= 0) return;
  const bump = t > CHEERS.clink ? Math.exp(-(t - CHEERS.clink) * 9) * Math.sin((t - CHEERS.clink) * 40) : 0;
  [[628, 1], [716, -1]].forEach(([x, sd]) => {
    const mx = lerp(x + sd * 30, 672 - sd * (15 - bump * 4), up), my = lerp(POOL + 120, POOL + 78, up);   // 就在两人身旁、头的高度
    g.save(); g.beginPath(); g.rect(0, 0, W, POOL + 104); g.clip();                     // 还在水下的部分看不见
    g.translate(mx, my); if (sd < 0) g.scale(-1, 1);
    mug(0, 0, 1.3, .2 * up);
    g.restore();
    if (up < .95) { g.strokeStyle = `rgba(190,215,240,${.5 * (1 - up)})`; g.lineWidth = 1.2; g.beginPath(); g.ellipse(mx, POOL + 106, 14, 3, 0, 0, TAU); g.stroke(); }   // 出水的涟漪
  });
  if (t > CHEERS.clink && t < CHEERS.clink + 1.2) {                                     // 碰杯：泡沫溅起、闪一下光
    const a = t - CHEERS.clink;
    g.globalCompositeOperation = 'lighter';
    glowAt([255, 230, 170], .8 * Math.exp(-a * 5), 672, POOL + 62, 40, 40, 1.4);
    g.globalCompositeOperation = 'source-over';
    for (let i = 0; i < 14; i++) {
      const ang = -Math.PI / 2 + (rnd(i, 231) - .5) * 2.2, sp = 40 + rnd(i, 232) * 70;
      const x = 672 + Math.cos(ang) * sp * a, y = POOL + 58 + Math.sin(ang) * sp * a + 160 * a * a;
      g.fillStyle = `rgba(255,250,236,${.9 * (1 - a / 1.2)})`; g.beginPath(); g.arc(x, y, 1.6 + rnd(i, 233) * 1.6, 0, TAU); g.fill();
    }
  }
}

// ---- 温泉：水面、倒影、雪落进水里的涟漪、泡汤的人、白汽 ----

  for (let y = 2; y < h - 1; y++) for (let x = 10; x < w - 10; x++) {
    if (!edge[y * w + x]) continue;

  for (let y = 2; y < h - 1; y++) for (let x = 10; x < w - 10; x++) {

    let sum = 0, cnt = 0;
    for (let dx = -5; dx <= 5; dx++) { const yy = near(x + dx, y); sum += yy >= 0 ? th[yy * w + x + dx] : 0; cnt++; }
    const t0 = sum / cnt * (.85 + .15 * Math.sin(x * .21) * Math.sin(x * .07));
    if (t0 < .5) continue;
    for (let k = -1; k < Math.ceil(t0); k++) {                  // 往上堆 t0 个像素（多盖住字的上沿一个像素）
      const yy = y - 1 - k; if (yy < 0) break;

      d[j] = Math.round(196 + 54 * shade); d[j + 1] = Math.round(210 + 42 * shade); d[j + 2] = Math.round(234 + 21 * shade);

}

    g.strokeStyle = '#e0573f'; g.lineWidth = .16; g.beginPath(); g.moveTo(-.28, -1.22 * c); g.lineTo(-.45, -.92 * c); g.moveTo(.28, -1.22 * c); g.lineTo(hx, hy); g.stroke();
    g.strokeStyle = '#0b0f1a'; g.lineWidth = .05; g.beginPath(); g.moveTo(-.45, -.92 * c); g.lineTo(-.65, -.05);
    g.moveTo(hx, hy); g.lineTo(lerp(.65, .62, cheer), lerp(-.05, -2.95, cheer)); g.stroke();
    g.fillStyle = '#f0f3f8'; g.beginPath(); g.arc(0, -1.64 * c, .19, 0, TAU); g.fill();
    g.fillStyle = '#ffb347'; g.fillRect(-.15, -1.65 * c, .3, .08);
    g.restore();
    // 雪浪：由很多细小的雪粒组成（每个弯甩出去一些，急停时扇开一大片），再加几团很淡的粉雪雾；不用叠加发光，免得变成一团实心的白
    for (let i = 0; i < 420; i++) {
      const big = i < 260, life = big ? 1.5 : .8;
      const te = big ? SK.t1 - .25 + rnd(i, 311) * .25 : lerp(SK.t0, SK.t1, (Math.floor(rnd(i, 312) * SK.turns) + .5) / SK.turns) + (rnd(i, 313) - .5) * .2, age = t - te;
      if (age < 0 || age > life) continue;
      const r = at(Math.min(te, SK.t1)), out = big ? 1 : (Math.cos(r.ph) > 0 ? -1 : 1);
      const vx = out * (big ? 2 + rnd(i, 314) * 6 : 1.2 + rnd(i, 315) * 2.4), vy = -(big ? 1.5 + rnd(i, 316) * 3.5 : .8 + rnd(i, 317) * 1.6), vz = big ? -(1 + rnd(i, 318) * 4) : -.8;
      const x = r.x + vx * age, y = r.y + vy * age + 4.9 * age * age, z = r.z + vz * age, k = age / life;
      if (y > slopeY(z) + .05 || !vis(z)) continue;
      const [X, Y, sc] = P(x, y, z), rr = Math.max(.8, (.025 + rnd(i, 319) * .05) * sc);
      g.fillStyle = `rgba(236,242,252,${.85 * (1 - k)})`; g.beginPath(); g.arc(X, Y, rr, 0, TAU); g.fill();
    }
    for (let i = 0; i < 10; i++) {                          // 粉雪雾：慢慢散开、变淡
      const te = SK.t1 - .15 + rnd(i, 331) * .15, age = t - te; if (age < 0 || age > 2.4) continue;
      const r = at(SK.t1), k = age / 2.4;
      glow3([225, 233, 248], .16 * Math.pow(1 - k, 1.5), r.x + (1 + rnd(i, 332) * 3) * (.5 + k), r.y - .4 - k * .8, r.z - rnd(i, 333) * 2, .6 + k * 1.8, .4 + k * 1.1, 1.2);
    }
  }
  function render(t) {
    // 跟拍（像滑雪比赛转播）：镜头在人前方，跟着人一起往下移动；切进来时离得远一点，很快推近
    const p = at(t - .08), back = 12 + 9 * Math.pow(1 - ease(clamp((t - 2.7) / 1.2)), 1);
    cam.z = p.z - back; cam.x = lerp(runX(p.z), p.x, .45); cam.y = slopeY(cam.z) - 3.4 - (back - 12) * .3;
    const main = g; g = cv3.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.drawImage(verticalSprite('sky3', [[0, hex('#03050d')], [.5, hex('#0a1330')], [1, hex('#1d2b55')]]), 0, 0, W, H);
    [[3200, 900, '#1f2b52', 0], [2200, 650, '#172241', 2]].forEach(([z, a, c, kk]) => {
      g.beginPath(); g.moveTo(-10, H + 10);
      for (let x = -5000; x <= 5000; x += 160) { const [X, Y] = P(x, -a * (.6 + .4 * Math.sin(x / 900 + kk)) - Math.sin(x / 300) * a * .12, z); g.lineTo(X, Y); }
      g.lineTo(W + 10, H + 10); g.fillStyle = c; g.fill();
    });
    const zNear = Math.min(30, cam.z + 1.5);                // 雪坡一直铺到镜头脚下（镜头还在远处时下面不会空）
    for (let z = 520; z > zNear; z -= 20) { const z1 = Math.max(zNear, z - 20); poly([[-400, slopeY(z), z], [400, slopeY(z), z], [400, slopeY(z1), z1], [-400, slopeY(z1), z1]], mixc('#a9b7d6', '#4a5a86', clamp((z - cam.z) / 300))); }
    const Lp = [], Rp = []; for (let z = 520; z >= zNear; z -= 5) { Lp.push([runX(z) - RW, slopeY(z), z]); Rp.push([runX(z) + RW, slopeY(z), z]); }
    poly(Lp.concat(Rp.reverse()), 'rgb(200,210,234)');
    // 路灯在雪道上照出一段段暖色的光斑（光斑之间是冷蓝的暗处，远近靠这个出来）
    g.globalCompositeOperation = 'lighter';
    for (let z = 12; z < 500; z += 28) [-1, 1].forEach(sd => glow3([255, 204, 150], .1, runX(z) + sd * RW * .55, slopeY(z), z, 8, 3.2, 1.3));
    g.globalCompositeOperation = 'source-over';
    // 雪面上一个个软软的雪包：朝上的一面亮、背面暗
    for (let i = 0; i < 170; i++) {
      const z = zNear + 2 + Math.pow(rnd(i, 341), 1.6) * 220, x = runX(z) + (rnd(i, 342) - .5) * RW * 1.9, r = .9 + rnd(i, 343) * 1.4;
      glow3([60, 78, 120], .1, x, slopeY(z) + .12, z - .3, r, r * .32, 1.3);
      glow3([232, 238, 252], .18, x, slopeY(z) - .1, z + .3, r * .9, r * .28, 1.3);
    }
    // 雪道两边堆起来的雪堤，厚厚软软的
    for (let z = 300; z >= zNear + 1; z -= 2.2) [-1, 1].forEach(sd => {
      const x = runX(z) + sd * (RW + .6);
      glow3([24, 34, 66], .3, x + sd * .5, slopeY(z) + .05, z, 1.7, .55, 1.3);
      glow3([240, 245, 255], .55, x, slopeY(z) - .4, z, 1.7, .7, 1.4);
    });
    // 树林里的雪：树下一团团鼓起来的雪
    for (let i = 0; i < 160; i++) {
      const z = zNear + 3 + Math.pow(rnd(i, 361), 1.4) * 200, sd = rnd(i, 362) > .5 ? 1 : -1, x = runX(z) + sd * (RW + 3 + rnd(i, 363) * 30), r = 1.4 + rnd(i, 364) * 2;
      glow3([235, 241, 252], .16, x, slopeY(z) - .2, z, r, r * .4, 1.3);
    }
    // 树投在雪上的影子
    TR.forEach(o => { if (o.lamp || o.z > 260 || Math.abs(o.x - runX(o.z)) > RW + 14) return; glow3([6, 10, 26], .28, o.x + Math.sign(runX(o.z) - o.x) * 1.4, slopeY(o.z) + .1, o.z - .5, 2.6, .7, 1.2); });
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 90; i++) {                         // 雪晶一闪一闪
      const z = zNear + 2 + rnd(i, 321) * 120, x = runX(z) + (rnd(i, 322) - .5) * RW * 1.8, tw = Math.pow(Math.max(0, Math.sin(TAU * (3 + i % 4) * t / T + i * 1.7)), 12);
      if (tw > .05) glow3([255, 250, 235], tw, x, slopeY(z) - .05, z, .12, .12, 1.5);
    }
    g.globalCompositeOperation = 'source-over';
    TR.forEach(o => o.lamp ? lamp(o) : tree(o.x, o.z, o.h, o.v));
    drawSkier(t);
    g.globalAlpha = .55; g.drawImage(GRAIN, 0, 0); g.globalAlpha = 1;   // 很细的颗粒，让雪面有一点质感
    g = main;
    return cv3;
  }
  return {render, at, SK};
})();

// ======== 镜头 ========
// [时间, 中心 x, 中心 y, 放大倍数]（世界坐标）；两点之间平滑过渡，放大倍数按比例过渡（推拉的速度感更自然）
const RUN_SPOT = (() => { const [x, y] = pointOnRun(RUNS[0], .42); return [x, y - LIFT]; })();
const heroCam = t => { const p = heroAt(t); return [lerp(p.x, pointOnRun(RUNS[HERO.run], .5)[0], .3), p.y - LIFT + 34]; };   // 镜头对准滑雪的人（人在画面中间偏上；左右只跟一部分，免得镜头跟着 S 形晃）
const KEYS = [
  [0, 380, 1170, 2.1], [2.3, 800, 1110, 1.95],        // ① 跟着车头往右扫，一路掠过温泉街的灯火
  [2.9, ...RUN_SPOT, 3.4], [9.7, ...RUN_SPOT, 3.8],   // ② 往上摇到雪道（这时切进跟拍滑雪的镜头，滑到一半再切回来）
  [11.0, 700, 1690, 2.25], [14.6, 700, 1680, 2.4],    // ③ 露天温泉：灯笼、泡汤的人、热气、干杯
  [16.0, 540, 960, 1], [18.1, 540, 960, 1],           // ④ 全景
  [20, 380, 1170, 2.1],                               // 推回隧道口（和第 0 秒一样）
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  const [t0, x0, y0, z0] = KEYS[i], [t1, x1, y1, z1] = KEYS[i + 1], k = ease(clamp((t - t0) / (t1 - t0)));
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hw = W / 2 / z, hh = H / 2 / z;
  return {x: clamp(lerp(x0, x1, k), hw, W - hw), y: clamp(lerp(y0, y1, k), hh, H + EXT - hh), z};
}

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const a = trainA(t), C = camAt(t);
  // 列车快出来时，地面开始轻轻震动，越来越强，冲出来后很快平息
  const rum = a > -1.4 && a < .8 ? (a < 0 ? ease((a + 1.4) / 1.4) : 1 - easeOut(a / .8)) * 4 : 0;
  const sx = Math.sin(t * 91) * rum, sy = Math.cos(t * 73) * rum * .8;
  const M = new DOMMatrix([C.z, 0, 0, C.z, W / 2 - C.x * C.z + sx, H / 2 - C.y * C.z + sy]);
  const toScreen = (x, y) => [M.a * x + M.e, M.d * y + M.f];
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = SCENE.skyTop; g.fillRect(0, 0, W, H);
  g.setTransform(M);
  g.drawImage(sky, 0, 0);
  const ox = -fract(t / T) * W;                                   // 雪云慢慢往左飘，一个循环移过一个画面宽
  g.drawImage(clouds, ox, 0); g.drawImage(clouds, ox + W * 2, 0);
  g.drawImage(land, 0, 0, W, land.h);
  // 远景坐标里画的动态：滑雪的人、缆车、温泉街的白汽、隧道口的光、列车、雪雾
  g.setTransform(M.translate(0, -LIFT));
  drawSkiers(t);
  drawGlitter(t);
  drawGondola(t);
  drawTownSteam(t);
  const pre = clamp((a + 1.6) / 1.6) * (a < .3 ? 1 : clamp(1 - (a - .3) / .6));
  g.globalCompositeOperation = 'lighter';
  glowAt([255, 240, 215], .9 * pre * pre, PORTAL + 22, DECK - 36, 70 + pre * 120, 50 + pre * 40, 1.4);
  g.globalCompositeOperation = 'source-over';
  drawTrain(t);
  drawSpray(t);
  g.setTransform(M);
  trainOnWall(t);
  // 近处：雪地、雪墙小路和撑伞的人、温泉
  g.drawImage(near, 0, 0, W, near.h);
  drawWalkers(t);
  const lamp = .85 + .15 * Math.sin(TAU * 2 * t / T);            // 灯笼轻轻呼吸
  drawPool(t, lamp);
  g.drawImage(front, 0, 0, W, front.h);
  drawCheers(t);                                                  // 干杯画在岩石前面，不然举起的杯子会被岩石挡住
  drawSteam(t, lamp);
  g.setTransform(1, 0, 0, 1, 0, 0);
  // 温泉那一段整个画面偏暖（灯笼和热水的感觉）
  const hot = clamp((t - 10.2) / .8) * clamp((15.4 - t) / .8);
  if (hot > 0) { g.globalCompositeOperation = 'soft-light'; g.fillStyle = `rgba(255,178,110,${.3 * hot})`; g.fillRect(0, 0, W, H); g.globalCompositeOperation = 'source-over'; }
  // 雪道特写：交叉淡入站在雪坡上往上看的镜头
  const ski = clamp((t - 2.72) / .16) * (1 - clamp((t - 9.62) / .16));   // 很快地切过去：切的那一瞬间被一阵飞雪挡住（见下面）
  if (ski > 0) { const c3 = SKI3D.render(t); g.globalAlpha = ski; g.drawImage(c3, 0, 0); g.globalAlpha = 1; }
  drawSnow(t, false, C);
  drawSnow(t, true, C);
  // 一阵风卷着大雪片斜着扫过镜头，正好盖住切到雪道特写（和切回来）的那一下
  [2.8, 9.7].forEach(tc => {
    const u = (t - tc + .45) / .9;
    if (u <= 0 || u >= 1) return;
    for (let i = 0; i < 46; i++) {
      const k = u * (1.4 + rnd(i, 241) * .6) - rnd(i, 242) * .5, x = lerp(-300, W + 300, k), y = rnd(i, 243) * H * 1.2 - 100 + k * 260;
      const r = 40 + rnd(i, 244) * 120, a = .5 * Math.sin(Math.PI * u) * (.5 + rnd(i, 245) * .5);
      glowAt([236, 243, 252], a, x, y, r, r, 1.05);
    }
  });
  // 屏住呼吸：出隧道前画面压暗；冲出来的一瞬，白光从隧道口炸开，一阵暴风雪横扫过画面
  const dim = a > -2 && a < 0 ? .34 * ease(clamp((a + 2) / 1.8)) : a >= 0 && a < .2 ? .34 * (1 - a / .2) : 0;
  if (dim > 0) { g.fillStyle = `rgba(2,3,8,${dim})`; g.fillRect(0, 0, W, H); }
  const flash = a >= 0 && a < 1.6 ? Math.pow(1 - a / 1.6, 2.6) : 0;
  if (a >= 0 && a < 2.4) {
    const [px, py] = toScreen(PORTAL + 22, DECK - 36 - LIFT);
    g.globalCompositeOperation = 'lighter';
    glowAt([255, 248, 235], .32 * flash, px, py, 150 + easeOut(a / .5) * 320, 110 + easeOut(a / .5) * 240, 1.1);   // 只是洞口一团光，不盖住列车
    g.globalCompositeOperation = 'source-over';
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 50; i++) {                                 // 暴风雪：雪片从隧道口方向横着扫过来
      const sp = .6 + rnd(i, 171) * .8, x = px - 200 + (a * 2600 * sp + rnd(i, 172) * 1400) % 1600;
      const y = py - 700 + rnd(i, 173) * 1500 + (x - px) * (rnd(i, 174) - .3) * .3, len = 30 + sp * 70;
      g.strokeStyle = `rgba(240,246,255,${.3 * Math.min(1, Math.pow(clamp(1 - a / 2.4), 1.5) * 2.4) * rnd(i, 175)})`; g.lineWidth = 1.5 + rnd(i, 176) * 3;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - len, y - len * .12); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
  }

  // 文字层（不跟镜头动，保证清晰）
  // 上面的压暗托住标题，一直在；下面那条只在有大字时出现（跟着文字一起淡入淡出）
  g.drawImage(verticalSprite('topscrim204', [[0, [1, 3, 12, 204]], [1, [1, 3, 12, 0]]]), 0, 0, W, 600);
  g.globalAlpha = textVis(t) * (1 - .6 * flash) * (1 - .65 * ski);   // 白雪上不压深色的带子（字影够了）
  g.drawImage(verticalSprite('band150', [[0, [1, 3, 12, 0]], [.5, [1, 3, 12, 150]], [1, [1, 3, 12, 0]]]), 0, 1340, W, 320);
  g.globalAlpha = 1;
  drawHeader(t, {light: 0, lc: [255, 236, 210], x: W / 2}, HEADER);
  drawTitleSnow();
  typoFront(t);
}
boot(render);
