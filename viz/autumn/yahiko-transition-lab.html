<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>弥彦神社转场试验</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}

body{display:flex;gap:28px;justify-content:center;align-items:flex-start;padding:16px}
canvas{height:calc(100vh - 32px);max-width:100%;aspect-ratio:9/16;background:#000;border-radius:4px}
.panel{width:330px}

.opts{display:flex;flex-direction:column;gap:8px;margin:14px 0}

.row{display:flex;gap:8px;align-items:center}
.row button{padding:8px 14px}

@media(max-width:760px){body{flex-direction:column;align-items:center;padding:0 16px 24px}canvas{height:auto;width:100%}.panel{width:100%}}
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div class="panel">
<h1>神社：从高处俯瞰飞过参道</h1>
<p>从高处俯瞰朱红的一之鸟居，沿着杉林里的表参道往前飞，飞过随神门，在拐弯处降进林子：红叶和杉枝从镜头前扫过，散开后是斜着看到的拜殿。</p>
<div class="row"><button id="play">暂停</button><button id="restart">从头</button><span id="clock"></span></div>
</div>
<script>
/*SHRINE3D-START*/

// 由 viz/autumn/yahiko-shrine3d.js 维护，用 viz/autumn/build-yahiko.py 嵌入页面。

function shade(rgb,n,d){const lam=Math.max(0,n[0]*SUN[0]+n[1]*SUN[1]+n[2]*SUN[2]),k=.58+.5*lam,f=1-Math.exp(-d/48);
  return `rgb(${rgb.map((c,i)=>Math.round(lerp(Math.min(255,c*k),HAZE[i],f))).join(',')})`;}

// ---------- 镜头 ----------
let cam={x:0,y:1.6,z:-5,yaw:0,pitch:0};
function toCam(p){const dx=p[0]-cam.x,dy=p[1]-cam.y,dz=p[2]-cam.z,cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw);
  const x1=dx*cy-dz*sy,z1=dx*sy+dz*cy,cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);return [x1,dy*cp-z1*sp,dy*sp+z1*cp];}

function clipNear(ps){const out=[];for(let i=0;i<ps.length;i++){const a=ps[i],b=ps[(i+1)%ps.length],ia=a[2]>=NEAR,ib=b[2]>=NEAR;
  if(ia)out.push(a);if(ia!==ib){const t=(NEAR-a[2])/(b[2]-a[2]);out.push([lerp(a[0],b[0],t),lerp(a[1],b[1],t),NEAR]);}}return out;}

const faces=[],ground=[],sprites=[];
function face(pts,rgb,n,opt={}){faces.push({pts,rgb,n,...opt});}
function box(x0,x1,y0,y1,z0,z1,rgb,opt){
  face([[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0]],opt?.front||rgb,[0,0,-1],opt);face([[x1,y0,z1],[x0,y0,z1],[x0,y1,z1],[x1,y1,z1]],rgb,[0,0,1],opt);

  face([[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]],opt?.top||rgb,[0,1,0],opt);face([[x0,y0,z1],[x1,y0,z1],[x1,y0,z0],[x0,y0,z0]],rgb,[0,-1,0],opt);}
function prism(cx,cz,r0,r1,y0,y1,n,rgb){for(let i=0;i<n;i++){const a=i/n*TAU,b=(i+1)/n*TAU,m=(a+b)/2;

// 参道：从镜头前直走到 z=30，再往右拐进拜殿前的广场
const PATH=[];for(let i=0;i<=230;i++){const s=i*.6-8;PATH.push(s<118?[0,s]:(()=>{const a=Math.min(1,(s-118)/14)*0.75;return [ (1-Math.cos(a))*18.7*0.9, 118+Math.sin(a)*18.7*0.9 ];})());}

(function build(){

  for(let k=0;k<PATH.length-1;k++){const [x0,z0]=PATH[k],[x1,z1]=PATH[k+1],dx=z1-z0,dz=-(x1-x0),l=Math.hypot(dx,dz),nx=dx/l,nz=dz/l;
    for(let j=0;j<4;j++){const a=-1.6+j*.8+.03,b=a+.74,v=.9+rnd(k*4+j,5)*.2;

  for(let i=0;i<16;i++)face([[arc[i][0],arc[i][1],P0-.06],[arc[i+1][0],arc[i+1][1],P0-.06],[arc[i+1][0],arc[i+1][1]+.28,P0-.06],[arc[i][0],arc[i][1]+.28,P0-.06]],[58,84,76],[0,0,-1],{bias:-.01});
  face([[X-.35,PE+.9,P0-.08],[X+.35,PE+.9,P0-.08],[X+.35,PE+1.4,P0-.08],[X-.35,PE+1.4,P0-.08]],[226,190,90],[0,0,-1],{bias:-.02});
  face([[PL+.4,PE-.25,P0+.05],[PR-.4,PE-.25,P0+.05],[PR-.4,PE,P0+.05],[PL+.4,PE,P0+.05]],[214,186,140],[0,0,-1]);
  for(let i=0;i<5;i++){const x=X-2+i;face([[x-.12,PE-.35,P0-.02],[x+.12,PE-.35,P0-.02],[x+.12,PE-.95,P0-.02],[x-.12,PE-.95,P0-.02]],[245,242,230],[0,0,-1]);}
  face([[PL+.3,PE-.3,P0-.01],[PR-.3,PE-.3,P0-.01],[PR-.3,PE-.42,P0-.01],[PL+.3,PE-.42,P0-.01]],[196,176,120],[0,0,-1]);

    if(Math.abs(x-px)<4.2&&z<122)continue;if(x>1&&x<29&&z>125&&z<151)continue;if(Math.hypot(x-15,z-140)<11)continue;if(Math.hypot(x-2,z-104)<6)continue;{const ax=2,az=112,bx=15,bz=140,u=clamp(((x-ax)*(bx-ax)+(z-az)*(bz-az))/((bx-ax)**2+(bz-az)**2));if(Math.hypot(x-ax-u*(bx-ax),z-az-u*(bz-az))<3.5)continue;}
    sprites.push({kind:'trunk',x,z,r:.32+rnd(i,13)*.35,h:34});}
  for(let i=0;i<520;i++){const x=(rnd(i,71)-.5)*44,z=rnd(i,72)*170-10,[px]=pathAt(clamp(z,-8,120));if(Math.abs(x-px)<2.2&&z<122)continue;if(x>2&&x<28&&z>127&&z<151)continue;sprites.push({kind:'fern',x,y:.45,z,s:1.1+rnd(i,73)*1.2,v:i%3});}

  // 随神门：参道尽头、拐弯前的两层木门，铜绿屋顶
  {const Z=104,WD=[150,112,74],DK=[40,30,24],RF=[66,98,88];

// ---------- 贴图 ----------
const trunkImg=[0,.3,.55,.8].map(f=>mk(48,1024,(b,w,h)=>{const q=b.createLinearGradient(0,0,w,0);[[0,'#2c241c'],[.35,'#6a5640'],[.65,'#4c3e2e'],[1,'#221c16']].forEach(([s,c])=>q.addColorStop(s,c));b.fillStyle=q;b.fillRect(0,0,w,h);

const fernImg=[0,1,2].map(v=>mk(160,90,b=>{for(let i=0;i<26;i++){const a=-Math.PI*(.1+.8*rnd(i,81+v)),L=40+rnd(i,82+v)*40;b.strokeStyle=['#3c5a2c','#4e6a34','#6a7a3a','#7a5a2a'][(i+v)%4];b.lineWidth=2;b.beginPath();b.moveTo(80,88);b.quadraticCurveTo(80+Math.cos(a)*L*.5,88+Math.sin(a)*L*.8,80+Math.cos(a)*L,88+Math.sin(a)*L*.6);b.stroke();
  for(let k=1;k<8;k++){const u=k/8,x=80+Math.cos(a)*L*u,y=88+Math.sin(a)*L*.6*u;b.beginPath();b.moveTo(x,y);b.lineTo(x+4,y-6);b.moveTo(x,y);b.lineTo(x-4,y-5);b.stroke();}}}));
const LEAF=[[0,-1],[.14,-.46],[.3,-.57],[.25,-.2],[.67,-.67],[.55,-.15],[.95,-.26],[.73,.07],[.94,.18],[.47,.31],[.54,.53],[.18,.48],[0,.63],[-.18,.48],[-.54,.53],[-.47,.31],[-.94,.18],[-.73,.07],[-.95,-.26],[-.55,-.15],[-.67,-.67],[-.25,-.2],[-.3,-.57],[-.14,-.46]];
const REDS=['#b8321e','#d4502a','#e8743a','#c23a2a','#f0a040'];
const leafImg=REDS.map(c=>mk(64,64,b=>{b.fillStyle=c;b.beginPath();LEAF.forEach(([x,y],i)=>b[i?'lineTo':'moveTo'](32+x*28,32+y*28));b.closePath();b.fill();}));
const mapleImg=[0,1,2,3].map(v=>mk(400,340,b=>{b.strokeStyle='#2a1d18';b.lineCap='round';
  for(let i=0;i<7;i++){b.lineWidth=10-i;b.beginPath();b.moveTo(200,340);b.quadraticCurveTo(200+(rnd(i,51+v)-.5)*120,230,40+rnd(i,52+v)*320,60+rnd(i,53+v)*150);b.stroke();}
  for(let i=0;i<1300;i++){const a=rnd(i,54+v)*TAU,r=Math.sqrt(rnd(i,55+v)),x=200+Math.cos(a)*r*185,y=150+Math.sin(a)*r*120;const lit=clamp(.5-(y-150)/240+(rnd(i,56)-.5)*.6);
    b.globalAlpha=.85;b.drawImage(leafImg[Math.min(4,Math.floor(lit*5))],x-7,y-7,14,14);}}));

// ---------- 画一帧 ----------
function seams(f){const [a,b,c,d]=f.pts;g.strokeStyle='rgba(20,40,34,.35)';g.lineWidth=1.2;
  for(let k=1;k<7;k++){const u=k/7,p=[a.map((v,i)=>lerp(v,d[i],u)),b.map((v,i)=>lerp(v,c[i],u))].map(toCam);if(p[0][2]<NEAR||p[1][2]<NEAR)continue;const s=p.map(proj);g.beginPath();g.moveTo(...s[0]);g.lineTo(...s[1]);g.stroke();}}
function lattice(f,d){const [a,b,c,dd]=f.pts;g.strokeStyle=shade([170,134,90],[0,0,-1],d);g.lineWidth=Math.max(1,F*.05/d);
  for(let k=1;k<36;k++){const u=k/36,p=[a.map((v,i)=>lerp(v,b[i],u)),dd.map((v,i)=>lerp(v,c[i],u))].map(toCam);if(p[0][2]<NEAR||p[1][2]<NEAR)continue;const s=p.map(proj);g.beginPath();g.moveTo(...s[0]);g.lineTo(...s[1]);g.stroke();}
  for(let k=1;k<6;k++){const u=k/6,p=[a.map((v,i)=>lerp(v,dd[i],u)),b.map((v,i)=>lerp(v,c[i],u))].map(toCam);if(p[0][2]<NEAR||p[1][2]<NEAR)continue;const s=p.map(proj);g.beginPath();g.moveTo(...s[0]);g.lineTo(...s[1]);g.stroke();}}
function drawFace(pts,fill){g.fillStyle=fill;g.beginPath();pts.forEach((p,i)=>g[i?'lineTo':'moveTo'](p[0],p[1]));g.closePath();g.fill();}
function polyScreen(f){const cp=clipNear(f.pts.map(toCam));if(cp.length<3)return null;return {s:cp.map(proj),d:cp.reduce((a,c)=>a+c[2],0)/cp.length};}
function renderScene(t){
  // 背景：杉林深处有雾光
  const hy=H/2-F*Math.tan(cam.pitch);
  const q=g.createLinearGradient(0,hy-1400,0,hy+300);q.addColorStop(0,'#1d3426');q.addColorStop(.55,'#5a7258');q.addColorStop(.8,'#c9d2b4');q.addColorStop(1,'#8a9670');
  g.fillStyle=q;g.fillRect(0,0,W,H);
  // 地面（从远到近）
  for(const layer of [0,1,2]){const gl=[];for(const f of ground){if((f.L||0)!==layer)continue;const r=polyScreen(f);if(r)gl.push([r.d,r.s,f]);}
    gl.sort((a,b)=>b[0]-a[0]).forEach(([d,s,f])=>drawFace(s,shade(f.rgb,f.n,d)));}
  // 立着的东西：按距离排序
  const items=[];
  for(const f of faces){const c=f.pts.reduce((a,p)=>[a[0]+p[0],a[1]+p[1],a[2]+p[2]],[0,0,0]).map(v=>v/f.pts.length);
    if((c[0]-cam.x)*f.n[0]+(c[1]-cam.y)*f.n[1]+(c[2]-cam.z)*f.n[2]>0)continue;const r=polyScreen(f);if(!r)continue;items.push({d:r.d+(f.bias||0),draw:()=>{drawFace(r.s,shade(f.rgb,f.n,r.d));if(f.roof&&f.pts.length===4)seams(f);if(f.lattice)lattice(f,r.d);}});}
  for(const sp of sprites){
    if(sp.kind==='trunk'){let a=toCam([sp.x,0,sp.z]),b=toCam([sp.x,sp.h,sp.z]);if(a[2]<NEAR&&b[2]<NEAR)continue;
      if(a[2]<NEAR){const u=(NEAR-a[2])/(b[2]-a[2]);a=a.map((v,i)=>lerp(v,b[i],u));}if(b[2]<NEAR){const u=(NEAR-b[2])/(a[2]-b[2]);b=b.map((v,i)=>lerp(v,a[i],u));}
      const d=(a[2]+b[2])/2,pa=proj(a),pb=proj(b);if(Math.max(pa[0],pb[0])<-200||Math.min(pa[0],pb[0])>W+200)continue;
      const wa=F*sp.r*2/a[2],wb=F*sp.r*1.4/b[2];
      items.push({d:a[2]*.6+b[2]*.4,draw:()=>{const img=trunkImg[Math.min(3,Math.round(fogOf(a[2])*3.4))];g.save();g.beginPath();g.moveTo(pa[0]-wa/2,pa[1]);g.lineTo(pa[0]+wa/2,pa[1]);g.lineTo(pb[0]+wb/2,pb[1]);g.lineTo(pb[0]-wb/2,pb[1]);g.closePath();g.clip();
        const ang=Math.atan2(pb[0]-pa[0],pa[1]-pb[1]),len=Math.hypot(pb[0]-pa[0],pb[1]-pa[1]);g.translate(pa[0],pa[1]);g.rotate(ang);g.drawImage(img,-Math.max(wa,wb)/2,-len,Math.max(wa,wb),len);g.restore();}});
    }else{const c=toCam([sp.x,sp.y,sp.z]);if(c[2]<.5)continue;const p=proj(c),s=F*sp.s/c[2];if(p[0]+s<0||p[0]-s>W||p[1]+s<0||p[1]-s>H)continue;
      const img=sp.kind==='maple'?mapleImg[sp.v]:sp.kind==='fern'?fernImg[sp.v]:boughImg[sp.v],f=fogOf(c[2]),ar=img.height/img.width;
      items.push({d:c[2],draw:()=>{g.globalAlpha=clamp((c[2]-.5)/.6);g.drawImage(img,p[0]-s/2,p[1]-s*ar/2,s,s*ar);if(f>.1){g.globalAlpha*=f*.85;g.globalCompositeOperation='source-atop';g.globalCompositeOperation='source-over';}g.globalAlpha=1;}});}
  }
  items.sort((a,b)=>b.d-a.d).forEach(it=>it.draw());
  // 落叶（立体的，离镜头近的大）
  for(let i=0;i<260;i++){const x=(rnd(i,61)-.5)*14+(i%3?0:8),z=rnd(i,62)*140-4,y=((7-((t*.55+rnd(i,63)*7)%7))+.2),xx=x+Math.sin(t*.8+i)*.4;
    const c=toCam([xx,y,z]);if(c[2]<.3)continue;const p=proj(c),s=F*.09/c[2];if(p[0]<-s||p[0]>W+s||p[1]<-s||p[1]>H+s)continue;
    g.save();g.globalAlpha=clamp(1-fogOf(c[2])*.8)*clamp((c[2]-.3)/.6);g.translate(p[0],p[1]);g.rotate(t*1.4+i);g.scale(.35+.65*Math.abs(Math.cos(t*.9+i)),1);g.drawImage(leafImg[i%5],-s/2,-s/2,s,s);g.restore();}
  // 斜照进林子的光
  g.save();g.globalCompositeOperation='lighter';for(let i=0;i<6;i++){const x=200+i*160+Math.sin(i*2.1)*60-cam.yaw*500,qq=g.createLinearGradient(x,0,x-600,H);qq.addColorStop(0,'rgba(255,232,180,.09)');qq.addColorStop(1,'rgba(255,232,180,0)');g.fillStyle=qq;g.beginPath();g.moveTo(x,0);g.lineTo(x+70,0);g.lineTo(x-530,H);g.lineTo(x-640,H);g.closePath();g.fill();}g.restore();
}

function camAt(keys,t){
  const ks=keys,n=ks.length;t=clamp(t,0,ks[n-1][0]);let i=0;while(i<n-2&&t>ks[i+1][0])i++;
  const u=(t-ks[i][0])/(ks[i+1][0]-ks[i][0]),P=j=>ks[clamp(j,0,n-1)];
  const cr=(k)=>{const p0=P(i-1)[k],p1=P(i)[k],p2=P(i+1)[k],p3=P(i+2)[k],u2=u*u,u3=u2*u;return .5*(2*p1+(-p0+p2)*u+(2*p0-5*p1+4*p2-p3)*u2+(-p0+3*p1-3*p2+p3)*u3);};
  return {x:cr(1),y:cr(2),z:cr(3),yaw:cr(4),pitch:cr(5)};
}
const KEYS=[[0,0,17,-6,0,-.78],[1.9,0,15.2,8,0,-1.02],[3.5,0,14,48,0,-.62],[5.4,.4,13,100,.1,-.55],[6.3,1.6,8,109,.3,-.3],[7,3.2,4.2,114.5,.42,-.08],[8.4,5.5,2.5,121,.48,.02]],DUR=KEYS.at(-1)[0];
const tmp=mk(W,H,()=>{}),tg=tmp.getContext('2d');
function render(t){
  const tt=clamp(t,0,DUR),c0=camAt(KEYS,tt),c1=camAt(KEYS,Math.min(DUR,tt+1/30));cam=c0;
  const speed=Math.hypot(c1.x-c0.x,c1.y-c0.y,c1.z-c0.z)*30;
  renderScene(t);
  if(speed>9){tg.clearRect(0,0,W,H);tg.drawImage(cv,0,0);const sz=clamp((speed-9)*.004,0,.07);   // 飞得快时从中心往外拉的速度模糊
    for(let i=1;i<=6;i++){g.globalAlpha=1/(i+1);const z=1+sz*i/6;g.drawImage(tmp,W/2-W/2*z,H/2-H/2*z,W*z,H*z);}g.globalAlpha=1;}
  return cv;
}
return {render,DUR};
})();
/*SHRINE3D-END*/
const out=document.getElementById('c'),og=out.getContext('2d');
let playing=true,time=0,last=0;const LOOP=SHRINE3D.DUR+1.2;
const play=document.getElementById('play'),clock=document.getElementById('clock');
play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放';};
document.getElementById('restart').onclick=()=>{time=0;playing=true;play.textContent='暂停';};
out.onclick=()=>play.click();
function frame(t){og.drawImage(SHRINE3D.render(t),0,0);}
window.render=frame;window.LOOP_SECONDS=LOOP;
function tick(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(playing)time=(time+dt)%LOOP;frame(time);clock.textContent=time.toFixed(1)+' / '+LOOP.toFixed(1)+' 秒';requestAnimationFrame(tick);}
if(!new URLSearchParams(location.search).has('record'))requestAnimationFrame(tick);
window.READY=true;
</script>
