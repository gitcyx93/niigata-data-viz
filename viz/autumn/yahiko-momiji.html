// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）

<script>// 弥彦（秋）：一张竖长的夜景，从上到下是弥彦山、山脚的彌彦神社、弥彦公园的红叶谷和池子（实际位置也是这样由远到近）。

  b.strokeStyle = '#7c8a84'; b.lineWidth = 2; b.beginPath(); b.moveTo(x - 140, y - 54); b.quadraticCurveTo(x, y - 140, x + 140, y - 54); b.stroke();
  glowB(b, [255, 150, 90], .25, x, y - 20, 160, 80);
}
function drawShrineArea(b) {
  // 山脚的杉林：后排高、暗；前排靠近神社的被灯照到一点
  for (let i = 0; i < 30; i++) cedar(b, -20 + i * 38 + R(i, 3) * 26, 1480 - R(i, 4) * 60, 220 + R(i, 5) * 160, 30 + R(i, 6) * 14, i, 0);
  for (let i = 0; i < 16; i++) { const x = 20 + i * 70 + R(i, 7) * 30; if (Math.abs(x - 540) < 230) continue; cedar(b, x, 1600 + R(i, 8) * 30, 260 + R(i, 9) * 140, 36 + R(i, 10) * 14, 50 + i, .5); }
  b.save(); b.translate(SHRINE.x, SHRINE.base); b.scale(SHRINE.s, SHRINE.s); b.translate(-SHRINE.x, -SHRINE.base); drawHaiden(b); b.restore();
  // 参道：碎石，从鸟居往台阶收窄
  const pathTop = SHRINE.base + 66 * SHRINE.s;
  b.drawImage(verticalSprite('sground2', [[0, [36, 32, 32, 255]], [1, [20, 18, 20, 255]]]), 0, pathTop, W, TORII.foot + 60 - pathTop);
  b.fillStyle = '#5e5852'; b.beginPath();
  b.moveTo(SHRINE.x - 110, pathTop); b.lineTo(SHRINE.x + 110, pathTop); b.lineTo(SHRINE.x + 300, TORII.foot + 40); b.lineTo(SHRINE.x - 300, TORII.foot + 40); b.closePath(); b.fill();
  for (let i = 0; i < 1400; i++) {
    const u = R(i, 41), yy = pathTop + u * (TORII.foot + 40 - pathTop), half = 110 + 190 * u, xx = SHRINE.x + (R(i, 42) * 2 - 1) * half;
    b.fillStyle = `rgba(${150 + R(i, 43) * 60},${140 + R(i, 43) * 55},${130 + R(i, 43) * 50},.5)`; b.fillRect(xx, yy, 1.5 + u * 1.5, 1 + u);
  }
  b.globalCompositeOperation = 'lighter'; glowB(b, [255, 190, 120], .25, SHRINE.x, SHRINE.base + 140, 300, 140); b.globalCompositeOperation = 'source-over';
  stoneLantern(b, 400, SHRINE.base + 120, .55); stoneLantern(b, 680, SHRINE.base + 120, .55); stoneLantern(b, 300, SHRINE.base + 330, .8); stoneLantern(b, 780, SHRINE.base + 330, .8);
  drawTamanohashi(b);
  drawTorii(b);
}
function drawBetween(b) {                                      // 神社和红叶谷之间：一片暗暗的树林，往下渐渐出现红叶
  b.fillStyle = '#0e0c12'; b.fillRect(0, TORII.foot + 40, W, 600);
  for (let i = 0; i < 18; i++) cedar(b, -10 + i * 64 + R(i, 30) * 30, 2480 + R(i, 31) * 60, 260 + R(i, 32) * 90, 34 + R(i, 33) * 14, 80 + i, 0);
}

// ======== 预先画好的静态画面：分成上下两张（每张都不太大，手机和 Safari 才显示得出来）========
const SPLIT = 2280;
const midA = hiCanvas(W, SPLIT - 900), midB = hiCanvas(W, WH - SPLIT);     // A：900–2280（神社），B：2280–3600（红叶谷和池子）
function paintAll(b) {
  drawShrineArea(b);
  drawBetween(b);
  b.save(); b.translate(-1080, DY);
  b.fillStyle = '#0a0d1a'; b.fillRect(1080, VW, 1080, WH - WATER + 10);
  drawValley(b);
  b.restore();
}
[[midA, 900], [midB, SPLIT]].forEach(([c, y0]) => {
  const b = hiCtx(c); b.translate(0, -y0);
  if (y0 === 900) { b.save(); b.beginPath(); b.rect(0, 900, W, SPLIT - 900); b.clip(); paintAll(b); b.restore(); }
  else {
    paintAll(b);
    // 池面倒影：把池面以上翻下来，压暗、偏蓝
    const hh = WH - WATER, tmp = hiCanvas(W, hh);
    tmp.getContext('2d').drawImage(c, 0, (WATER - hh - y0) * SS, W * SS, hh * SS, 0, 0, tmp.width, tmp.height);
    b.save(); b.beginPath(); b.rect(0, WATER + 10, W, hh); b.clip();
    b.translate(0, WATER * 2 + 14); b.scale(1, -1); b.globalAlpha = .62; b.drawImage(tmp, 0, WATER - hh, W, hh); b.restore();
    b.drawImage(verticalSprite('wdark', [[0, [8, 12, 30, 90]], [1, [6, 8, 20, 220]]]), 0, WATER + 8, W, hh);
    for (let i = 0; i < 26; i++) { b.fillStyle = `rgb(${30 + R(i, 15) * 20},${26 + R(i, 15) * 16},${28 + R(i, 15) * 18})`; b.beginPath(); b.ellipse(10 + i * 42, WATER + 4 + R(i, 16) * 8, 26 + R(i, 17) * 20, 10 + R(i, 18) * 6, 0, 0, TAU); b.fill(); }
  }
});

// ======== 云和月亮 ========
// 云在镜头离开山顶时悄悄盖上月亮，高潮时散开；池里的月亮倒影跟着一起
const cover = t => t < 3 ? 0 : t < 4.5 ? ease((t - 3) / 1.5) : t < 12.7 ? 1 : t < 14.8 ? 1 - ease((t - 12.7) / 2.1) : 0;
const CLOUDS = [[-150, -30, 260, 46], [40, 20, 300, 40], [-60, 70, 240, 34], [140, -70, 200, 30]];
function drawMoon(t) {
  const c = cover(t), vis = 1 - c * .85;
  g.globalCompositeOperation = 'lighter';
  glowAt([150, 170, 230], .55 * vis, MOON.x, MOON.y, 520, 520, 1.6);
  glowAt([255, 240, 210], .5 * vis, MOON.x, MOON.y, 150, 150, 1.8);
  g.globalCompositeOperation = 'source-over';
  g.fillStyle = '#fffbec'; g.beginPath(); g.arc(MOON.x, MOON.y, MOON.r, 0, TAU); g.fill();
  g.fillStyle = 'rgba(214,204,180,.22)';
  [[-12, -8, 12], [10, 6, 9], [-4, 16, 7], [16, -14, 6]].forEach(([dx, dy, r]) => { g.beginPath(); g.arc(MOON.x + dx, MOON.y + dy, r, 0, TAU); g.fill(); });
  CLOUDS.forEach(([dx, dy, w, h], i) => {
    const off = (1 - c) * (i % 2 ? 1 : -1) * (380 + i * 60), a = .25 + .75 * c;
    const x = MOON.x + dx + off, y = MOON.y + dy;
    g.globalAlpha = a * .95; g.drawImage(radialSprite([34, 36, 66], 1.1), x - w, y - h, w * 2, h * 2);
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = a * .25 * vis;
    g.drawImage(radialSprite([180, 190, 230], 2), x - w * .9, y - h * 1.2, w * 1.8, h * 1.2);
    g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1;
  });
}

// ======== 动的东西：落叶、风、水面 ========
const FALL = Array.from({length: 80}, (_, i) => ({x: R(i, 60) * W, y0: 2350 + R(i, 61) * 300, span: 700 + R(i, 62) * 200, ph: R(i, 63), k: 1 + (i % 2), sw: 20 + R(i, 64) * 40, s: 5 + R(i, 65) * 5, c: MAPLE[2 + Math.floor(R(i, 66) * 5)]}));
function drawFalling(t) {                                       // 红叶谷里慢慢飘落的叶子（循环里转整数圈，首尾接得上）
  FALL.forEach(f => {
    const u = fract(f.ph + f.k * t / T), y = f.y0 + u * f.span, x = f.x + Math.sin(TAU * (u * 2 + f.ph)) * f.sw;
    if (y > WATER + 20) return;
    g.globalAlpha = Math.min(1, u * 8, (1 - u) * 8) * .9;
    leaf(g, x, y, f.s, TAU * (u * 3 + f.ph), f.c);
  });
  g.globalAlpha = 1;
}
const GUST = {t0: 13.0, t1: 15.5};
const GLEAF = Array.from({length: 150}, (_, i) => ({d: R(i, 70) * .9, y: 700 + R(i, 71) * 1200, v: 520 + R(i, 72) * 520, lift: 160 + R(i, 73) * 320, s: 7 + R(i, 74) * 8, c: MAPLE[2 + Math.floor(R(i, 75) * 5)], sp: R(i, 76) * 8}));
function drawGust(t) {                                         // 高潮：一阵风从左下方卷起一大片红叶，往右上方飞过山前
  if (t < GUST.t0 || t > GUST.t1) return;
  const a = t - GUST.t0, dur = GUST.t1 - GUST.t0;
  GLEAF.forEach(l => {
    const age = a - l.d * 1.2; if (age < 0) return;
    const x = -40 + age * l.v, y = l.y - Math.sin(clamp(age / 1.6) * Math.PI * .7) * l.lift + age * age * 30;
    if (x > W + 40) return;
    g.globalAlpha = Math.min(1, age * 4) * clamp((dur - a) / .5); leaf(g, x, y, l.s, age * l.sp, l.c);
  });
  g.globalAlpha = 1;
}
function drawWater(t) {                                         // 池面：倒影分成很多横条，轻轻左右晃；月亮的倒影跟着云
  const top = WATER + 12;
  for (let y = top; y < WH; y += 8) {
    const off = Math.sin(TAU * 2 * t / T + y * .045) * (1.5 + (y - top) * .006) + Math.sin(TAU * 3 * t / T - y * .02) * 1.2;
    g.drawImage(midB, 0, (y - SPLIT) * SS, W * SS, 8 * SS, off, y, W, 8);
  }
  const vis = 1 - cover(t) * .92, my = WATER + 190;
  g.globalCompositeOperation = 'lighter';
  glowAt([200, 210, 255], .35 * vis, MOON.x, my, 200, 120, 1.6);
  for (let i = 0; i < 12; i++) {                                 // 水里的月亮：被波纹切成几条
    const y = my - 30 + i * 5, w = Math.sqrt(1 - ((i - 5.5) / 6) ** 2) * 56 + Math.sin(TAU * 3 * t / T + i) * 6;
    g.fillStyle = `rgba(255,248,225,${.4 * vis})`; g.fillRect(MOON.x - w / 2 + Math.sin(TAU * 2 * t / T + i * .8) * 5, y, w, 3);
  }
  for (let i = 0; i < 14; i++) {                                 // 往下拖出的一道月光
    const y = my + 40 + i * 16, w = 30 + Math.sin(TAU * 3 * t / T + i * 1.7) * 12;
    g.fillStyle = `rgba(230,225,200,${.18 * vis * (1 - i / 16)})`; g.fillRect(MOON.x - w / 2 + Math.sin(TAU * 2 * t / T + i) * 6, y, w, 2);
  }
  g.globalCompositeOperation = 'source-over';
}

// ======== 镜头 ========
// [时间, 中心 y, 放大倍数]（世界坐标，水平方向居中）
const COVER = [2850, 1.3];
const KEYS = [
  [0, ...COVER], [3, 2820, 1.32],          // ① 红叶谷，轻轻推
  [6.5, 1660, 1.0],                         // ② 往上移，经过树林到一の鳥居（拜殿在鸟居里面）
  [9.8, 1500, 2.5],                         // ③ 推到拜殿前的人
  [12.5, 960, 1.0],                         // ④ 往后拉、往上移，看到整座弥彦山
  [15.5, 900, 1.04],                        // ⑤ 云散开、月亮出来（高潮）
  [15.5, 2870, 1.42], [20, ...COVER],      // ⑥ 直切回红叶谷，慢慢推回第 0 秒
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t >= KEYS[i + 1][0]) i++;
  const [t0, y0, z0] = KEYS[i], [t1, y1, z1] = KEYS[i + 1];
  const k = t1 > t0 ? ease(clamp((t - t0) / (t1 - t0))) : 1;
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hh = H / 2 / z;
  const hw = W / 2 / z;
  return {x: clamp(W / 2 + (z > 1.3 ? (PERSON.x - W / 2) * clamp((z - 1.3) / .6) : 0), hw, W - hw), y: clamp(lerp(y0, y1, k), hh, WH - hh), z};
}

// ======== 参拜的人 ========
const CLAP = {hands: 7.6, claps: [7.95, 8.35, 8.75, 9.15], bow: 9.45};
function drawPerson(t) {                                       // 背影：深色外套，手在身前（被身体挡住），只看得到手肘一开一合
  const {x, y} = PERSON, s = 1;
  let bow = 0;
  if (t > CLAP.bow && t < CLAP.bow + .9) bow = Math.sin(Math.PI * (t - CLAP.bow) / .9);
  const up = clamp((t - CLAP.hands) / .3) * (1 - clamp((t - CLAP.bow + .1) / .25));
  let open = 0; CLAP.claps.forEach(c => { const d = t - c; if (d > -.2 && d < 0) open = Math.max(open, 1 + d / .2); if (d >= 0 && d < .2) open = Math.max(open, 1 - d / .2); });
  g.save(); g.translate(x, y); g.scale(SHRINE.s, SHRINE.s);
  g.fillStyle = '#141018';
  g.fillRect(-13, -44, 10, 44); g.fillRect(3, -44, 10, 44);           // 腿
  g.translate(0, -44); g.rotate(-bow * .6);                       // 鞠躬：上身往前（远离镜头）倾，背影看起来变短
  g.scale(1, 1 - bow * .3);
  g.fillStyle = '#231a24'; g.beginPath(); g.moveTo(-20, 0); g.lineTo(-22, -46); g.quadraticCurveTo(0, -56, 22, -46); g.lineTo(20, 0); g.closePath(); g.fill();
  const elbow = 8 + up * 10 + open * 6;                          // 手肘
  g.beginPath(); g.ellipse(-20 - elbow * .5, -26 + up * -4, 7, 13, .3, 0, TAU); g.fill();
  g.beginPath(); g.ellipse(20 + elbow * .5, -26 + up * -4, 7, 13, -.3, 0, TAU); g.fill();
  g.fillStyle = '#16121a'; g.beginPath(); g.arc(0, -62, 13, 0, TAU); g.fill();
  g.restore();
  g.fillStyle = 'rgba(255,200,130,.18)'; g.fillRect(x - 13, y - 57, 1.5, 29); g.fillRect(x + 12, y - 57, 1.5, 29);   // 背影的轮廓被拜殿的光勾出来
  // 拍手的声音：从手的位置扩散出一圈淡淡的金色波纹
  g.globalCompositeOperation = 'lighter';
  CLAP.claps.forEach(c => {
    const d = t - c; if (d < 0 || d > .7) return;
    const r = 7 + easeOut(d / .7) * 28;
    g.strokeStyle = `rgba(255,214,150,${.6 * (1 - d / .7)})`; g.lineWidth = 1.6;
    [-1, 1].forEach(s => { g.beginPath(); g.arc(x + s * 15, y - 45, r, s > 0 ? -.7 : Math.PI - .7, s > 0 ? .7 : Math.PI + .7); g.stroke(); });
  });
  g.globalCompositeOperation = 'source-over';
}

// ======== 文字 ========
const P = {head: '#fff6ec', key: '#ffa260', sub: 'rgba(255,232,214,.84)', narr: 'rgba(240,228,216,.74)', accent: '#f0a878'};
const STORY = [
  [0.2, 2.9, '秋天的晚上，弥彦公园的红叶谷会亮灯。'],
  [7.0, 9.7, '弥彦神社是越后一宫，当地人叫它「おやひこさま」。'],
  [10.2, 12.4, '神社背后就是弥彦山，坐缆车约 5 分钟到山顶。'],
  [16.2, 19.6, '红叶谷里约 400 棵枫树，被认定为日本夜景遗产。'],
];
const HEADER = {title: '弥彦', place: '新潟县弥彦村', story: STORY, storyShadow: 'rgba(6,6,16,.85)', sheen: [560, 240, 480, 420], storyColor: P.narr, accent: P.accent};
const LINE1 = 1458, LINE2 = 1518;
function rich(segs, y, size, weight, sp) {
  const ws = segs.map(([s]) => measure(s, size, weight, sp) + sp);
  let x = (W - ws.reduce((p, q) => p + q, 0) + sp) / 2;
  segs.forEach(([s, key], i) => { text(s, x, y, size, key ? P.key : P.head, weight, 'left', sp); x += ws[i]; });
}
function headline(s, segs, sub) {
  rise(s, () => {
    g.shadowColor = 'rgba(8,4,10,.8)'; g.shadowBlur = 26; g.shadowOffsetY = 2;
    rich(segs, LINE1, 74, 400, 4);
    if (sub) { g.shadowColor = 'rgba(8,4,10,.9)'; g.shadowBlur = 14; g.shadowOffsetY = 0; text(sub, W / 2, LINE2 + 6, 30, P.sub, 400, 'center', 1); text(sub, W / 2, LINE2 + 6, 30, P.sub, 400, 'center', 1); }
  });
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
}
const TEXT_WINDOWS = [[16.0, 2.9], [7.0, 9.7]];
const HEADLINES = [
  [[['这座桥 是用来', 0], ['赏月', 1], ['的', 0]], '弥彦公园 观月桥'],      // 第 0 秒就在画面上（封面）
  [[['这里拜神 要拍', 0], ['四下', 1], ['手', 0]], '别的神社都拍两下'],
];
const textVis = t => Math.max(...TEXT_WINDOWS.map(([a, b]) => { const s = scene(t, a, b); return s ? s.p * s.out : 0; }));

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const C = camAt(t);
  const M = new DOMMatrix([C.z, 0, 0, C.z, W / 2 - C.x * C.z, H / 2 - C.y * C.z]);
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.fillStyle = '#07091a'; g.fillRect(0, 0, W, H);
  g.setTransform(M);
  const top = C.y - H / 2 / C.z;
  if (top < SKY_H) { g.drawImage(sky, 0, 0, W, SKY_H); drawMoon(t); }
  if (top < SPLIT && C.y + H / 2 / C.z > 900) g.drawImage(midA, 0, 900, W, SPLIT - 900);
  if (C.y + H / 2 / C.z > SPLIT) { g.drawImage(midB, 0, SPLIT, W, WH - SPLIT); drawWater(t); }
  const flick = .9 + .1 * Math.sin(TAU * 7 * t / T) * Math.sin(TAU * 3 * t / T);   // 灯笼的火轻轻闪
  g.globalCompositeOperation = 'lighter';
  glowAt([255, 190, 110], .12 * flick, SHRINE.x, SHRINE.base - 100, 320, 160);
  g.globalCompositeOperation = 'source-over';
  if (t > 6 && t < 12.6) drawPerson(t);
  drawFalling(t);
  drawGust(t);
  const moon = 1 - cover(t);                                      // 云散开后，整个画面多一层淡淡的月光
  if (moon > 0) { g.globalCompositeOperation = 'soft-light'; g.globalAlpha = .16 * moon; g.fillStyle = '#9fb4ff'; g.fillRect(0, 0, W, WH); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  // 文字层（不跟镜头动）
  g.drawImage(verticalSprite('topscrim130', [[0, [4, 4, 14, 130]], [1, [4, 4, 14, 0]]]), 0, 0, W, 600);
  g.globalAlpha = textVis(t);
  g.drawImage(verticalSprite('band140', [[0, [4, 3, 10, 0]], [.5, [4, 3, 10, 140]], [1, [4, 3, 10, 0]]]), 0, 1340, W, 320);
  g.globalAlpha = 1;
  const mx = M.a * MOON.x + M.e, my = M.d * MOON.y + M.f, onScreen = my > -200 && my < H;
  drawHeader(t, {light: onScreen ? .55 * moon : .15, lc: onScreen ? [255, 240, 210] : [255, 200, 140], x: onScreen ? mx : W / 2}, HEADER);
  TEXT_WINDOWS.forEach(([a, b], i) => headline(scene(t, a, b), ...HEADLINES[i]));
}
boot(render);
</script>
