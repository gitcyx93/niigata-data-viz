<script>
/*SERIES-START 系列公共代码，由 viz/tools/embed-font.py 从 viz/common/series.js 嵌入，不要在这里改*/
// 新潟系列的公共部分：四季每一集都用同一套文字层、标题、旁白和导出接口，保证系列视觉统一。
// 页面的写法（照着 viz/summer/nagaoka-hanabi-a.html）：
//   canvas#c（1080×1920）→ 字体占位的 script → 引入这个文件的 script → 页面自己的场景 script（最后调用 boot(render)）。
// 跑 viz/tools/embed-font.py 时，这个文件的内容会被直接嵌进页面，页面就能单独打开。
// 页面需要定义：T（循环秒数）。画面上的中文都写在页面里（字体按页面里的字裁剪，繁体版也只转换页面）。
// 改了这里的样式，四集一起变；改完把每一集都重新检查、重新导出。

// ======== 文字配色（全系列统一，换方案只改这里）========
// 雾蓝和白为主；金色只标数字，珊瑚色只用于提醒
const TYPE = { text:'#f4f7fb', soft:'rgba(232,239,249,.78)', accent:'#9dbde8', bar:'#6f97d2', gold:'#f3c776', coral:'#ff8f7a' };
const NARRATION = 'rgba(222,230,244,.68)';      // 左上角讲故事的小字
const WHITE = TYPE.text, SOFT = 'rgba(232,239,249,.74)';

const W = 1080, H = 1920;
const cv = document.getElementById('c');
let g = cv.getContext('2d');          // 当前画在哪张画布上（画倒影等时可以临时换成别的画布）
const params = new URLSearchParams(location.search);
const TAU = Math.PI * 2;
const fract = x => x - Math.floor(x);
const rnd = (a, b = 0) => fract(Math.sin(a * 127.1 + b * 311.7) * 43758.5453);
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => x * x * (3 - 2 * x);
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const since = (t, t0) => fract((t - t0) / T) * T;      // 距离 t0 过去了多久（跨循环首尾）
const lerp = (a, b, k) => a + (b - a) * k;
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)).concat(255);

// ======== 光斑和渐变 ========
// 大面积的「光」都不用浏览器的渐变来画：浏览器画渐变时会用细小的方格做抖动，几十层叠在一起就成了看得见的正方形格子。
// 改成先用像素逐点算好一张平滑的光斑图（没有抖动），用的时候缩放贴上去。
const sprites = {};
function radialSprite(rgb, falloff = 1.6) {          // 圆形光斑：中心不透明，往外平滑变透明
  const key = rgb.join(',') + '|' + falloff;

  g.fillStyle = '#16121a'; g.beginPath(); g.arc(0, -62, 13, 0, TAU); g.fill();
  g.restore();
  g.fillStyle = 'rgba(255,200,130,.18)'; g.fillRect(x - 21, y - 92, 2, 46); g.fillRect(x + 19, y - 92, 2, 46);   // 背影的轮廓被拜殿的光勾出来
  // 拍手的声音：从手的位置扩散出一圈淡淡的金色波纹
  g.globalCompositeOperation = 'lighter';
  CLAP.claps.forEach(c => {
    const d = t - c; if (d < 0 || d > .7) return;
    const r = 10 + easeOut(d / .7) * 44;
    g.strokeStyle = `rgba(255,214,150,${.6 * (1 - d / .7)})`; g.lineWidth = 1.6;
    [-1, 1].forEach(s => { g.beginPath(); g.arc(x + s * 24, y - 72, r, s > 0 ? -.7 : Math.PI - .7, s > 0 ? .7 : Math.PI + .7); g.stroke(); });
  });
  g.globalCompositeOperation = 'source-over';
}
const FALL = Array.from({length: 70}, (_, i) => ({x: 1100 + R(i, 60) * 1060, y0: 560 + R(i, 61) * 400, span: 700 + R(i, 62) * 300, ph: R(i, 63), k: 1 + (i % 2), sw: 20 + R(i, 64) * 40, s: 5 + R(i, 65) * 5, c: MAPLE[2 + Math.floor(R(i, 66) * 5)]}));
function drawFalling(t) {                                       // 平时慢慢飘落的红叶（循环里转整数圈，首尾接得上）
  FALL.forEach((f, i) => {
    const u = fract(f.ph + f.k * t / T), y = f.y0 + u * f.span, x = f.x + Math.sin(TAU * (u * 2 + f.ph)) * f.sw;
    if (y > WATER + 20) return;
    g.globalAlpha = Math.min(1, u * 8, (1 - u) * 8) * .9;
    leaf(g, x, y, f.s, TAU * (u * 3 + f.ph), f.c);
  });
  g.globalAlpha = 1;
}
const GUST = {t0: 12.9, t1: 15.9};
const GLEAF = Array.from({length: 140}, (_, i) => ({d: R(i, 70) * .9, y: 500 + R(i, 71) * 1000, v: 520 + R(i, 72) * 520, lift: 120 + R(i, 73) * 260, s: 6 + R(i, 74) * 7, c: MAPLE[2 + Math.floor(R(i, 75) * 5)], sp: R(i, 76) * 8}));
function drawGust(t) {                                         // 高潮：一阵风从左边卷起一大片红叶，斜着往右上方飞过桥
  if (t < GUST.t0 || t > GUST.t1) return;
  const a = t - GUST.t0, dur = GUST.t1 - GUST.t0;
  GLEAF.forEach(l => {
    const age = a - l.d * 1.4; if (age < 0) return;
    const x = 1060 + age * l.v, y = l.y - Math.sin(clamp(age / 1.6) * Math.PI * .7) * l.lift + age * age * 30;
    const fade = Math.min(1, age * 4) * clamp((dur - a) / .5);
    if (x > WW + 40) return;
    g.globalAlpha = fade; leaf(g, x, y, l.s, age * l.sp, l.c);
  });
  g.globalAlpha = 1;
}
function drawWater(t, C) {                                      // 池面：倒影分成很多横条，轻轻左右晃
  const top = WATER + 12;
  for (let y = top; y < H; y += 8) {
    const off = Math.sin(TAU * 2 * t / T + y * .045) * (1.5 + (y - top) * .006) + Math.sin(TAU * 3 * t / T - y * .02) * 1.2;
    g.drawImage(mid, 1080 * SS, y * SS, (WW - 1080) * SS, 8 * SS, 1080 + off, y, WW - 1080, 8);
  }
  const vis = 1 - cover(t) * .9;                                // 月光在水面上的一道亮纹
  g.globalCompositeOperation = 'lighter';
  for (let i = 0; i < 26; i++) {
    const y = top + 20 + i * 17, w = 30 + Math.sin(TAU * 3 * t / T + i * 1.7) * 14 + i * 2;
    g.fillStyle = `rgba(230,225,200,${.22 * vis * (1 - i / 30)})`; g.fillRect(MOON.x - w / 2 + Math.sin(TAU * 2 * t / T + i) * 6, y, w, 2);
  }
  g.globalCompositeOperation = 'source-over';
}

// ======== 菊花节：用小菊拼成的风景花坛（单独画的特写，直切进来）========
const KIKU = (() => {
  const KW = 1240, KH = 2040, ks = 1.3, c = hiCanvas(KW, KH, ks), b = hiCtx(c);
  b.fillStyle = '#0a0b12'; b.fillRect(0, 0, KW, KH);
  for (let i = 0; i < 9; i++) {                                 // 后面的杉树干
    const x = 40 + i * 140 + R(i, 80) * 50, w = 34 + R(i, 81) * 26;
    b.fillStyle = '#1a1210'; b.fillRect(x, 0, w, 900);
    b.drawImage(verticalSprite('ktrunk', [[0, [120, 70, 40, 0]], [1, [120, 70, 40, 120]]]), x, 500, w, 400);
  }
  b.globalCompositeOperation = 'lighter';
  [[300, 300], [900, 260]].forEach(([x, y]) => glowB(b, [255, 200, 140], .22, x, y + 400, 420, 600));   // 上面打下来的照明
  b.globalCompositeOperation = 'source-over';
  // 花坛的底：深色的土台
  b.fillStyle = '#16120e'; b.beginPath(); b.moveTo(0, 820); b.lineTo(KW, 800); b.lineTo(KW, 1450); b.lineTo(0, 1450); b.closePath(); b.fill();
  // 一层一层的山，用小菊的花点铺出来：后面白山、中间黄山、前面紫和粉的丘
  const MUM = {white: ['#f4f0e6', '#e8e4d8', '#fffaf0'], yellow: ['#f6c83a', '#f0b020', '#ffd860'], orange: ['#f08a2a', '#e8742a'], pink: ['#f08cb0', '#e66a98', '#f6a8c4'], purple: ['#9a5cc0', '#b878d8', '#7e48a8'], red: ['#d8343a', '#c02430']};
  const hill = (f, y0, y1, colors, n, seed, sz) => {
    for (let i = 0; i < n; i++) {
      const x = R(i, seed) * KW, top = f(x), y = top + R(i, seed + 1) * (y1 - top);
      if (y > y1 || y < top) continue;
      const col = colors[Math.floor(R(i, seed + 2) * colors.length)], r = sz * (.7 + R(i, seed + 3) * .5) * (.75 + (y - y0) / 1600);
      b.fillStyle = col; b.beginPath(); b.arc(x, y, r, 0, TAU); b.fill();
      b.fillStyle = 'rgba(120,80,20,.5)'; b.beginPath(); b.arc(x, y, r * .3, 0, TAU); b.fill();
    }
  };
  hill(x => 700 - Math.max(0, 260 - Math.abs(x - 760) * .9) - Math.max(0, 140 - Math.abs(x - 300) * .7), 440, 1000, MUM.white, 16000, 90, 7);
  hill(x => 860 - Math.max(0, 170 - Math.abs(x - 980) * .6) - Math.max(0, 120 - Math.abs(x - 260) * .5) + Math.sin(x / 90) * 10, 690, 1120, MUM.yellow, 14000, 95, 7);
  // 白色小菊铺成的一条河，弯弯地从后往前流
  const river = y => 600 + Math.sin((y - 900) / 120) * 160 + (y - 900) * .5;
  for (let i = 0; i < 5000; i++) {
    const y = 900 + R(i, 100) * 560, w = 30 + (y - 900) * .22, x = river(y) + (R(i, 101) * 2 - 1) * w;
    b.fillStyle = ['#f6f6f2', '#e6eef6', '#ffffff'][i % 3]; b.beginPath(); b.arc(x, y, 5 + (y - 900) / 200, 0, TAU); b.fill();
  }
  hill(x => 1040 - Math.max(0, 110 - Math.abs(x - 220) * .6) + Math.sin(x / 70) * 14, 980, 1450, MUM.purple.concat(MUM.pink), 7000, 105, 7);
  hill(x => 1060 - Math.max(0, 110 - Math.abs(x - 1080) * .6) + Math.sin(x / 60) * 12, 980, 1450, MUM.orange.concat(MUM.red), 6000, 110, 7);
  for (let i = 0; i < 4000; i++) {                               // 河从两片丘之间穿过，最后再补一遍河面
    const y = 1040 + R(i, 120) * 420, w = 30 + (y - 900) * .22, x = river(y) + (R(i, 121) * 2 - 1) * w * .85;
    b.fillStyle = ['#f6f6f2', '#e6eef6', '#ffffff'][i % 3]; b.beginPath(); b.arc(x, y, 6 + (y - 900) / 200, 0, TAU); b.fill();
  }
  // 河上一座小红桥，山间几棵小松树
  const by = 1180, bx = river(by);
  b.strokeStyle = '#d0382a'; b.lineWidth = 9; b.beginPath(); b.moveTo(bx - 120, by + 10); b.quadraticCurveTo(bx, by - 50, bx + 120, by + 10); b.stroke();
  b.lineWidth = 3; for (let k = -4; k <= 4; k++) { const xx = bx + k * 26, yy = by + 10 - (1 - (k / 4.6) ** 2) * 30; b.beginPath(); b.moveTo(xx, yy); b.lineTo(xx, yy - 18); b.stroke(); }
  b.beginPath(); b.moveTo(bx - 116, by - 8); b.quadraticCurveTo(bx, by - 68, bx + 116, by - 8); b.stroke();
  [[360, 820], [470, 860], [1010, 760], [1120, 900], [140, 990]].forEach(([x, y], i) => {
    b.fillStyle = '#1e3a24'; for (let k = 0; k < 3; k++) { b.beginPath(); b.ellipse(x + (k - 1) * 14, y - k * 18, 30 - k * 7, 10, 0, 0, TAU); b.fill(); }
    b.fillStyle = '#2a1a10'; b.fillRect(x - 3, y, 6, 20);
  });
  // 花坛前的地面（下方大字放在这里，保持暗）和前排的大菊盆栽
  b.fillStyle = '#0c0b0e'; b.fillRect(0, 1450, KW, KH - 1450);
  b.fillStyle = '#3a2a1c'; b.fillRect(0, 1450, KW, 10);
  for (let i = 0; i < 7; i++) {
    const x = 70 + i * 180, y = 1760 + (i % 2) * 30, col = [['#f6d040', '#e8a820'], ['#faf6ea', '#e0d8c4'], ['#f4a0c0', '#d86a90']][i % 3];
    b.fillStyle = '#5a3a20'; b.fillRect(x - 40, y + 110, 80, 70);
    b.strokeStyle = '#1e3a1e'; b.lineWidth = 5; b.beginPath(); b.moveTo(x, y + 110); b.lineTo(x, y + 40); b.stroke();
    b.fillStyle = '#244a26'; [[-30, 80], [28, 64], [-22, 50]].forEach(([dx, dy]) => { b.beginPath(); b.ellipse(x + dx, y + dy, 24, 12, dx > 0 ? -.4 : .4, 0, TAU); b.fill(); });
    for (let k = 0; k < 90; k++) {                                // 大朵的菊花：很多细花瓣从中心往外
      const a = R(k, i + 140) * TAU, r = 18 + R(k, i + 141) * 40;
      b.strokeStyle = k % 3 ? col[0] : col[1]; b.lineWidth = 4;
      b.beginPath(); b.moveTo(x + Math.cos(a) * 6, y + Math.sin(a) * 5); b.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r * .8); b.stroke();
    }
    b.fillStyle = col[1]; b.beginPath(); b.arc(x, y, 14, 0, TAU); b.fill();
    b.fillStyle = '#f4efe2'; b.fillRect(x + 30, y + 120, 16, 40);   // 白色的名牌
  }
  b.drawImage(verticalSprite('kfade', [[0, [10, 11, 18, 0]], [1, [10, 11, 18, 255]]]), 0, 1700, KW, 340);
  const K = {t0: 8.4, t1: 12.2};
  return {t0: K.t0, t1: K.t1, render(t) {                       // 慢慢往右平移、轻轻推近
    const k = ease(clamp((t - K.t0) / (K.t1 - K.t0))), z = lerp(1.0, 1.08, k), cx = lerp(560, 680, k), cy = 1000;
    g.setTransform(z, 0, 0, z, W / 2 - cx * z, H / 2 - cy * z);
    g.drawImage(c, 0, 0, KW, KH);
    g.setTransform(1, 0, 0, 1, 0, 0);
  }};
})();

// ======== 镜头 ========
// [时间, 中心 x, 中心 y, 放大倍数]（世界坐标）
const COVER = [1640, 1010, 1.12];
const KEYS = [
  [0, ...COVER], [2.8, 1600, 1000, 1.16],              // ① 红叶谷和月亮，轻轻推近
  [5.2, 540, 1030, 1.0],                               // ② 往左平移到一の鳥居
  [8.4, 548, 1262, 2.25],                              // ③ 穿过鸟居推到拜殿前的人
  [12.2, 1640, 1260, 1.5],                             // ④（这段被菊花特写盖住）回到红叶谷，低处看桥和水
  [15.6, 1640, 1000, 1.06],                            // ⑤ 云散开时镜头往上抬，看到月亮
  [20, ...COVER],                                      // ⑥ 慢慢推回第 0 秒
];
function camAt(t) {
  let i = 0; while (i < KEYS.length - 2 && t > KEYS[i + 1][0]) i++;
  if (t >= 8.4 && t < 12.2) i = 3;
  const [t0, x0, y0, z0] = KEYS[i], [t1, x1, y1, z1] = KEYS[i + 1];
  const k = i === 3 ? 0 : ease(clamp((t - t0) / (t1 - t0)));     // 菊花特写之后直切回红叶谷（镜头从 ④ 开始）
  const z = Math.exp(lerp(Math.log(z0), Math.log(z1), k)), hw = W / 2 / z, hh = H / 2 / z;
  return {x: clamp(lerp(x0, x1, k), hw, WW - hw), y: clamp(lerp(y0, y1, k), hh, H - hh), z};
}

// ======== 文字 ========
const P = {head: '#fff6ec', key: '#ffa260', sub: 'rgba(255,232,214,.84)', narr: 'rgba(240,228,216,.74)', accent: '#f0a878'};
const STORY = [
  [0.2, 2.9, '秋天的晚上，弥彦公园的红叶谷会亮灯。'],
  [5.4, 8.3, '弥彦神社是越后一宫，当地人叫它「おやひこさま」。'],
  [8.8, 12.0, '菊花节在神社里办，花坛的主题每年都换。'],
  [16.0, 19.6, '红叶谷里约 400 棵枫树，被认定为日本夜景遗产。'],
];
const HEADER = {title: '弥彦', place: '新潟县弥彦村', story: STORY, storyShadow: 'rgba(6,6,16,.85)', sheen: [560, 240, 480, 420], storyColor: P.narr, accent: P.accent};
const LINE1 = 1458, LINE2 = 1518;
function rich(segs, y, size, weight, sp) {
  const ws = segs.map(([s]) => measure(s, size, weight, sp) + sp);
  let x = (W - ws.reduce((p, q) => p + q, 0) + sp) / 2;
  segs.forEach(([s, key], i) => { text(s, x, y, size, key ? P.key : P.head, weight, 'left', sp); x += ws[i]; });
}
function headline(s, segs, sub) {
  rise(s, () => {
    g.shadowColor = 'rgba(8,4,10,.8)'; g.shadowBlur = 26; g.shadowOffsetY = 2;
    rich(segs, LINE1, 74, 400, 4);
    if (sub) { g.shadowColor = 'rgba(8,4,10,.9)'; g.shadowBlur = 14; g.shadowOffsetY = 0; text(sub, W / 2, LINE2 + 6, 30, P.sub, 400, 'center', 1); text(sub, W / 2, LINE2 + 6, 30, P.sub, 400, 'center', 1); }
  });
  g.shadowColor = 'transparent'; g.shadowBlur = 0; g.shadowOffsetY = 0;
}
const TEXT_WINDOWS = [[16.0, 2.9], [5.5, 8.3], [8.9, 12.0]];
const HEADLINES = [
  [[['这座桥 是用来', 0], ['赏月', 1], ['的', 0]], '弥彦公园 观月桥'],      // 第 0 秒就在画面上（封面）
  [[['这里拜神 要拍', 0], ['四下', 1], ['手', 0]], '别的神社都拍两下'],
  [[['三万株小菊 拼成', 0], ['一片风景', 1]], '弥彦菊花节'],
];
const textVis = t => Math.max(...TEXT_WINDOWS.map(([a, b]) => { const s = scene(t, a, b); return s ? s.p * s.out : 0; }));

// ======== 渲染 ========
function render(t) {
  t = fract(t / T) * T;
  const C = camAt(t), kiku = t >= KIKU.t0 && t < KIKU.t1;
  const M = new DOMMatrix([C.z, 0, 0, C.z, W / 2 - C.x * C.z, H / 2 - C.y * C.z]);
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (kiku) KIKU.render(t);
  else {
    g.setTransform(M);
    g.drawImage(sky, 0, 0, WW, H);
    drawMoon(t);
    g.drawImage(mid, 0, 0, WW, H);
    drawWater(t, C);
    const flick = .9 + .1 * Math.sin(TAU * 7 * t / T) * Math.sin(TAU * 3 * t / T);   // 灯笼的火轻轻闪
    g.globalCompositeOperation = 'lighter';
    glowAt([255, 190, 110], .12 * flick, SHRINE.x, SHRINE.base - 120, 300, 160);
    g.globalCompositeOperation = 'source-over';
    if (t > 4 && t < 8.6) drawPerson(t);
    drawFalling(t);
    drawGust(t);
    // 月光：云散开后，整个红叶谷多一层淡淡的冷光
    const moon = 1 - cover(t);
    if (moon > 0) { g.globalCompositeOperation = 'soft-light'; g.globalAlpha = .18 * moon; g.fillStyle = '#9fb4ff'; g.fillRect(0, 0, WW, H); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
  }
  g.setTransform(1, 0, 0, 1, 0, 0);
  // 文字层（不跟镜头动）
  g.drawImage(verticalSprite('topscrim130', [[0, [4, 4, 14, 130]], [1, [4, 4, 14, 0]]]), 0, 0, W, 600);
  g.globalAlpha = textVis(t);
  g.drawImage(verticalSprite('band140', [[0, [4, 3, 10, 0]], [.5, [4, 3, 10, 140]], [1, [4, 3, 10, 0]]]), 0, 1340, W, 320);
  g.globalAlpha = 1;
  const [mx] = [M.a * MOON.x + M.e];
  drawHeader(t, {light: kiku ? .3 : .55 * (1 - cover(t)), lc: kiku ? [255, 210, 150] : [255, 240, 210], x: kiku ? W / 2 : mx}, HEADER);
  TEXT_WINDOWS.forEach(([a, b], i) => headline(scene(t, a, b), ...HEADLINES[i]));
}
boot(render);
</script>
