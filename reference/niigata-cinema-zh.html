window.handlePresentationKey=function(e){

 const target=e.target;

 const moves={ArrowRight:current+1,PageDown:current+1,ArrowLeft:current-1,PageUp:current-1,Home:0,End:12};

  if(target?.closest?.('button,a,summary')&&target.id!=='play')return false;
  e.preventDefault();if(!e.repeat){keyboard=true;document.body.classList.add('keyboard');togglePlayback();focusPresentation();}return true;
 }

};

let resizeTimer;new ResizeObserver(()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{document.querySelectorAll('.plot').forEach(e=>plot(+e.dataset.i,e))},60)}).observe($('#main'));render();if(STYLE==='cinema'){document.fonts.ready.then(()=>{document.querySelectorAll('.plot').forEach(e=>plot(+e.dataset.i,e))});focusPresentation();}
</script></body></html>
